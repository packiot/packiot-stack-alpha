apiVersion: 1

providers:
  # v1 "Packiot" provider RETIRED (2026-07): v2 was blessed. The v1 set was a
  # full duplicate of v2 that still carried dead primary-api/back4-api/hasura
  # panels + 3-flow/bake artifacts. Boards live in the "Packiot v2" folder now.
  - name: packiot
    folder: Packiot
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
