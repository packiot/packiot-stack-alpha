apiVersion: 1

providers:
  # Persona-driven layout (2026-09): dashboards are grouped by AUDIENCE, not by
  # component. `foldersFromFilesStructure: true` maps each subdirectory of the
  # mounted dashboards path to a Grafana folder:
  #   grafana/dashboards/audience/  → folder "audience"  (CS / SRE / Data + Overview)
  #   grafana/dashboards/library/   → folder "library"   (the deep component boards)
  # A CS engineer lives in `audience/`; an on-call engineer drills into `library/`.
  # Boards keep their stable uids across the move, so all /d/<uid> links still work.
  - name: packiot
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
