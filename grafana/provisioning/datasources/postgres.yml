apiVersion: 1

# The DB lives on a separate EC2 (10.10.10.89), not in the Docker network.
# Hostname + password come from env_file: [.env] on the grafana service
# (POSTGRES_HOST / POSTGRES_PASSWORD set by Terraform in app_init.sh).
# Grafana 7+ natively interpolates $VAR in provisioning YAML.

datasources:
  - name: Packiot PostgreSQL
    type: postgres
    uid: packiot-postgres
    url: $POSTGRES_HOST:$POSTGRES_PORT
    user: $POSTGRES_USER
    secureJsonData:
      password: $POSTGRES_PASSWORD
    jsonData:
      # packiot_analytics, not $POSTGRES_DB: on staging that is the retired F1 `packiot` DB, where the
      # dashboards' gold tables (equipment_oee_shift, area_oee_shift) do not exist (2026-10-15)
      database: packiot_analytics
      sslmode: disable
      maxOpenConns: 25
      maxIdleConns: 10
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: true
      queryTimeout: "60"
    isDefault: true
    editable: false
