apiVersion: 1

# F3 — the refactored database (packiot_analytics on the same DB host).
# Becomes THE database at the ADR-0016 §6 flip.
datasources:
  - name: Packiot Analytics (F3)
    type: postgres
    uid: packiot-postgres-shadow # uid left unchanged on purpose — 18 dashboards-v2/*.json panels reference it; see rename PR notes
    url: $POSTGRES_HOST:$POSTGRES_PORT
    user: $POSTGRES_USER
    secureJsonData:
      password: $POSTGRES_PASSWORD
    jsonData:
      database: packiot_analytics
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: true
      queryTimeout: "60"
    isDefault: false
    editable: false
