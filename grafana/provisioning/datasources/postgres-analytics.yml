apiVersion: 1

# F3 — the refactored database (packiot_analytics on the same DB host).
# Becomes THE database at the ADR-0016 §6 flip.
# The datasource was renamed "Packiot Shadow (F3)" -> "Packiot Analytics (F3)" with the SAME uid. Provisioning matches by
# name, so a Grafana DB that still holds the old name fails at boot ("data source with the same uid already exists",
# prod 2026-10-16 go-live: crash loop). Deletes run before inserts; a no-op where the old name is gone.
deleteDatasources:
  - name: Packiot Shadow (F3)
    orgId: 1

datasources:
  - name: Packiot Analytics (F3)
    type: postgres
    uid: packiot-postgres-shadow # uid left unchanged on purpose — many grafana/dashboards/**/*.json panels reference it; see rename PR notes
    url: $POSTGRES_HOST:$POSTGRES_PORT
    user: $POSTGRES_USER
    secureJsonData:
      password: $POSTGRES_PASSWORD
    jsonData:
      database: packiot_analytics
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: true
      queryTimeout: "60"
    isDefault: false
    editable: false
