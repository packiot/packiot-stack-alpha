# compose.production.yml — Single-EC2 production service stack (us-east-1)
#
# ┌─ ANCHOR: greenfield production is born SINGLE-FLOW F3-NATIVE ─────────────────┐
# │ See docs/adr/reference/production-buildout-roadmap.md (§3.1) and             │
# │ docs/adr/0032-collapse-to-single-flow-f3.md.                                 │
# │                                                                             │
# │ Prod is a NEW environment with no legacy customer, so it skips staging's    │
# │ painful F1→F3 migration entirely and is born at the end-state:              │
# │   • ONE database. Its `public` schema IS the F3 schema — there is no         │
# │     `packiot_analytics` DB/pool, no `shadow_go_port` schema.                    │
# │   • NO triple-emit (SHADOW_EMIT_PRODUCTION/"go" legs), NO comparator,        │
# │     NO shadow-mirror, NO mirror-worker-go, NO plc-sim.                       │
# │   • edge-transformer emits `refactored` ONLY; oeecloud-worker runs the       │
# │     refactored lane only and (with POSTGRES_ANALYTICS_DB_NAME unset) writes      │
# │     `refactored` envelopes straight to the main pool / `public` = F3         │
# │     (oeecloud-worker routeForSource nil-shadow fallback).                    │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# Adapted from compose.staging.yml, stripped of ALL migration scaffolding and
# re-pointed at prod config (packiot/production/* secrets, prod DB, single flow).
#
# Differences vs staging:
#   - DB is EXTERNAL (roadmap W6/W1-rewire): the stack talks to the dedicated
#     r7g TimescaleDB EC2 (aws_instance.db, private subnet, ${POSTGRES_HOST_UPSTREAM}
#     = 10.20.10.89) — there is NO local `postgres` container. pgbouncer is the
#     pooler in front of it; DDL/migration/authentik/adminer connect to the r7g
#     directly (advisory locks + prepared statements break under transaction
#     pooling). This mirrors staging's external-DB-EC2 topology. Earlier dry-run
#     phases ran a local on-box TimescaleDB container; W6 split it onto the
#     memory-family r7g before real load (staging swap-died on the app-box class).
#   - EXCLUDES staging-only / migration-only services:
#       plc-sim · simulator · sparkplug-agent-cpack · s7-softplc · s7-reader
#       (all synthetic / CPACK-specific ingest) ; mirror-worker-go (prod IS the
#       source, nothing to mirror) ; shadow-mirror (no F1→F3 cross-DB bridge in a
#       single-flow DB — edge-api writes F3 directly, roadmap §5) ; edge-nodered
#       (per-factory, ADR-0005) ; barcode-service / tempo / alertmanager /
#       *-exporter / cadvisor / blackbox (nice-to-have, port after the data path).
#   - INCLUDES the migrated data/read/PO plane (roadmap §1.1 blockers):
#       mosquitto · edge-transformer · ingest-shim · oeecloud-worker ·
#       refdata-api · app-redis · operator-adapter.
#
# Deploy chain (unchanged): push `production` → self-hosted arm64 runner on the
# prod EC2 → `docker compose -f compose.production.yml up -d --remove-orphans`.
# `.env` is symlinked from /opt/packiot/.env (written by app_init.sh from
# Secrets Manager). services/* build contexts are in-repo (NOT submodules);
# only edge-api + operator are submodules.
#
# W1 exit posture: all services boot healthy against a FRESH F3-schema DB;
# oeecloud-worker + edge-transformer idle-but-ready (no client tee live yet).
# Several values are "# FILL AT DEPLOY" — the container boots + serves /healthz
# but rejects real traffic until the deploy fills them (same pattern as staging).

# Top-level `name:` pins the Compose project name regardless of working
# directory or `-p` flag. Without it, app_init.sh (runs from /opt/packiot/stack)
# infers `stack` while the deploy-production.yml workflow (runs from the repo
# root /_work/.../packiot-stack-alpha) infers `packiot-stack-alpha`, creating
# TWO separate sets of containers/networks that fight for the same subnet
# ("Pool overlaps with other one on this address space"). Pinning `stack` makes
# the project name environment-independent — the deploy workflow drops `-p` and
# app_init.sh's directory-inferred name already matches.
name: stack

networks:
  packiot-net:
    driver: bridge
    ipam:
      config:
        # Confine dynamic/hand-run container IPs to .128–.191, clear of the static
        # ipv4_address assignments (.2–.35), so a hand-run container can never grab a
        # static slot whose service is momentarily down and block it from recreating
        # with "Address already in use" (cf. the staging hasura-init exit-128 incident
        # / #75). Explicit statics may still be anywhere in the subnet.
        - subnet: 172.18.0.0/24
          ip_range: 172.18.0.128/26

volumes:
  # NOTE: no `pg-data` volume — the DB lives on the dedicated r7g EC2
  # (aws_instance.db, data dir /opt/packiot/pgdata on that box), NOT on the app box.
  grafana-data:
  loki-data:
  prom-data:
  rabbitmq-data:
  mosquitto-data:            # ADR-0011 P0-2: retained NBIRTHs survive broker restart
  edge_transformer_outbox:   # ADR-0011 P2: SQLite outbox survives container restart
  hist_gateway_data:         # D3: pg_duckdb gateway state (fdw defs + hist cutover cache)

# ── IP allocation ──────────────────────────────────────────────────────────────
# .2  hasura          .3  edge-api          .5  rabbitmq
# .7  grafana         .8  loki              .9  promtail
# .10 pgbouncer       .12 authentik-server  .13 authentik-worker  .14 authentik-redis
# .15 hasura-init     .16 db-migrate        .17 adminer
# .19 operator        .20 oeecloud-worker   .22 prometheus
# .23 edge-transformer  .24 mosquitto       .26 refdata-api        .27 hist-gateway
# .29 ingest-shim     .30 db-init-bootstrap .31 operator-adapter   .35 app-redis
#
# DELIBERATELY ABSENT vs staging (see header):
# .4  edge-nodered · .11 simulator/plc-sim · .21 mirror-worker-go · .25 shadow-mirror
# The DB is EXTERNAL (r7g @ ${POSTGRES_HOST_UPSTREAM}) — no in-net `postgres` (.30 freed).

services:
  # ── DATABASE: EXTERNAL dedicated r7g TimescaleDB EC2 (W6 / W1 rewire) ──────────
  # There is NO local `postgres` service. The DB runs on aws_instance.db
  # (terraform/production/database.tf) — an r7g memory-family EC2 in the private
  # subnet at ${POSTGRES_HOST_UPSTREAM} (= 10.20.10.89, from .env via app_init.sh).
  # Its own user_data starts an EMPTY `timescale/timescaledb:2.25.2-pg16` with the
  # managed superuser password; the F3 schema is assembled INTO it by the boot
  # chain below (db-init-bootstrap → db-schema-f3 → db-knex-baseline → db-migrate).
  #
  # ⚠ ROADMAP W1.4 (highest-care) — the F3 schema is NOT what edge-api's knex
  # migrations produce (those build the legacy F1 `public` shape). Prod's DB
  # `public` MUST be the F3 schema staging's `packiot_analytics` carries, or the
  # compute chain silently produces wrong OEE. `db-schema-f3` assembles it BEFORE
  # knex/edge-api boot; the parity gate (scripts/prod-f3-schema-parity-check.sh)
  # proves it == packiot_analytics. The AUTHORITATIVE source is a curated schema-only
  # snapshot of live packiot_analytics → db/init-f3/snapshot/ (gated, README §4) —
  # a raw concatenation of edge-node-red/db fragments does NOT reach parity
  # (measured F3_MISSING=344 + EXTRA=377).

  # ── DB bootstrap (one-shot): extensions + authentik role/DB ───────────────────
  # The removed local `postgres` container auto-ran db/docker-entrypoint-initdb.d/
  # on first boot to create the timescaledb/pg_cron extensions and the `authentik`
  # role + database. The external r7g's user_data does NOT run those scripts, so
  # this one-shot re-establishes that setup against the r7g (direct superuser
  # connection). WITHOUT it, authentik-server crashes with `FATAL: role
  # "authentik" does not exist`. Idempotent — safe to re-run on every deploy
  # (IF NOT EXISTS + pg_database guard), unlike the raw initdb .sh scripts which
  # assume a fresh empty PGDATA. Runs FIRST so extensions exist before the F3
  # schema load and the authentik DB exists before authentik boots.
  db-init-bootstrap:
    image: postgres:16-alpine
    env_file: [.env]
    environment:
      PGHOST: ${POSTGRES_HOST_UPSTREAM}   # DIRECT to the r7g (superuser DDL)
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "== extensions in ${POSTGRES_DB} (timescaledb auto-created by image; pg_cron best-effort) =="
        psql -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS timescaledb CASCADE;"
        # pg_cron requires shared_preload_libraries — tolerate absence so a missing
        # preload never fails the deploy (F3 single-flow does rollups in Go).
        psql -c "CREATE EXTENSION IF NOT EXISTS pg_cron;" \
          && psql -c "GRANT USAGE ON SCHEMA cron TO \"$$PGUSER\";" \
          || echo "pg_cron unavailable (no preload) — skipping (OK for F3-native prod)";
        echo "== authentik role + database (idempotent) =="
        if [ -z "$${AUTHENTIK_DB_PASSWORD:-}" ]; then
          echo "AUTHENTIK_DB_PASSWORD unset — authentik-server WILL fail; set it in .env"; exit 1;
        fi
        # Shell guards instead of DO/dollar-quoting — CREATE ROLE/DATABASE are not
        # IF NOT EXISTS, and $$-quoting collides with Compose interpolation.
        if [ "$$(psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='authentik'")" != "1" ]; then
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE authentik WITH LOGIN PASSWORD '$$AUTHENTIK_DB_PASSWORD';";
        fi
        if [ "$$(psql -tAc "SELECT 1 FROM pg_database WHERE datname='authentik'")" != "1" ]; then
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE authentik WITH OWNER = authentik;";
        fi
        psql -v ON_ERROR_STOP=1 -d authentik -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
        echo "db-init-bootstrap complete."
    depends_on:
      pgbouncer:
        condition: service_healthy
    networks:
      packiot-net:
        ipv4_address: 172.18.0.30
    restart: "no"
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── PgBouncer (PostgreSQL connection pooler → external r7g) ────────────────────
  # SINGLE pool → the `packiot` DB (public = F3) on the r7g. No `packiot_analytics`
  # pool: staging's sed-injected second pool is dual-flow scaffolding that does
  # not exist in a single-flow prod. Upstream = ${POSTGRES_HOST_UPSTREAM} (the r7g
  # private IP from .env), NOT a local container.
  # ⚠ Hasura, DDL/migrations, authentik, and adminer do NOT use PgBouncer —
  # prepared statements + session advisory locks + SET search_path all break
  # under transaction pooling; those connect to the r7g directly.
  # The healthcheck probes the r7g so dependents can gate on "external DB
  # reachable" (`condition: service_healthy`) now that the local postgres — whose
  # healthcheck used to be that gate — is gone.
  pgbouncer:
    image: edoburu/pgbouncer:1.22.1-p0
    restart: unless-stopped
    environment:
      DB_HOST: ${POSTGRES_HOST_UPSTREAM}
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: "20"
      MAX_CLIENT_CONN: "200"
      AUTH_TYPE: scram-sha-256
      SERVER_RESET_QUERY: "ROLLBACK"
      SERVER_RESET_QUERY_ALWAYS: "1"
      QUERY_TIMEOUT: "60"
      SERVER_IDLE_TIMEOUT: "120"
    networks:
      packiot-net:
        ipv4_address: 172.18.0.10
    healthcheck:
      # pg_isready straight at the r7g upstream — proves the external DB is
      # reachable/accepting connections (pgbouncer itself answers pg_isready even
      # when the upstream is down, so we probe the upstream host directly).
      test: ["CMD-SHELL", "pg_isready -h ${POSTGRES_HOST_UPSTREAM} -p 5432 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── RabbitMQ (message bus) ─────────────────────────────────────────────────────
  # oeecloud-worker consumes the `oee` exchange; edge-transformer + ingest-shim
  # publish to it. Management UI (15672) is loopback-only — no external
  # mq.prod.packiot.app vhost (see terraform/production/dns.tf).
  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # PROMOTION 2026-10 (B1) — same as staging: rabbitmq_prometheus plugin +
      # load_definitions, which re-creates the least-priv users (stream-engine,
      # sparkplug-decoder; permission regexes in
      # monitoring/rabbitmq/definitions.template.json) on EVERY boot. The file is
      # rendered before `up` by scripts/render-rabbitmq-definitions.sh (deploy
      # workflow + app_init.sh) from Secrets Manager; it holds secrets, lives
      # outside the repo and is mounted read-only. With definitions loaded,
      # RABBITMQ_DEFAULT_USER/PASS are ignored — the admin user is in the file.
      - ./monitoring/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./monitoring/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - /opt/packiot/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    networks:
      packiot-net:
        ipv4_address: 172.18.0.5
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}

  # ── Mosquitto (internal MQTT broker) ───────────────────────────────────────────
  # The SparkPlug-B ingest broker for the AGENT front-door: a per-client edge
  # agent (ADR-0042, deployed separately) publishes decoded tags here →
  # edge-transformer subscribes → Go Calc → `oee` → oeecloud-worker → F3.
  # init:true reaps the docker-exec healthcheck children (incident 2026-07-09:
  # 4578 zombie PIDs blocked deploys). Loopback-only host bind; factory edges
  # reach us via the ingest front-door (roadmap W2), not this port.
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:1883:1883"
      # WAN mTLS SparkPlug uplink (ADR-0042 §6). Bound on all interfaces but the
      # prod SG admits ONLY var.client_ingest_egress_cidrs (the client /32) on
      # :8883 (terraform/production/security_groups.tf). require_certificate makes
      # it useless without a CA-signed client cert even inside that /32.
      - "8883:8883"
    volumes:
      # PROD variant of the broker config — adds the :8883 mTLS listener. The
      # shared base mosquitto.conf is NOT used here (see mosquitto.prod.conf header).
      - ./configs/mosquitto/mosquitto.prod.conf:/mosquitto/config/mosquitto.conf:ro
      # mTLS material — server cert/key + client CA. Deploy-provisioned out of
      # band (Secrets Manager → this host path); see edge-deployment provisioning
      # runbook. Read-only.
      - /opt/packiot/mosquitto/certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data
    networks:
      packiot-net:
        ipv4_address: 172.18.0.24
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 mosquitto_pub -h 127.0.0.1 -t 'healthcheck/ping' -m 'ok' -q 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}

  # ── Hasura GraphQL ─────────────────────────────────────────────────────────────
  hasura:
    image: hasura/graphql-engine:v2.44.0
    restart: unless-stopped
    env_file: [.env]
    environment:
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "false"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup,http-log,webhook-log,websocket-log
      HASURA_GRAPHQL_PG_CONNECTIONS: "5"
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      # Gate on the external DB being reachable (pgbouncer healthcheck probes the
      # r7g). NOTE: HASURA_GRAPHQL_DATABASE_URL (.env) connects DIRECTLY to the
      # r7g (POSTGRES_URL_DIRECT), NOT via pgbouncer — Hasura's prepared
      # statements collide under pgbouncer transaction-pooling (42P05). The
      # pgbouncer healthcheck is still a valid readiness proxy: pgbouncer healthy
      # ⇒ the r7g is reachable. HASURA_GRAPHQL_PG_CONNECTIONS=5 caps the pool.
      pgbouncer:
        condition: service_healthy
    networks:
      packiot-net:
        ipv4_address: 172.18.0.2
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  hasura-init:
    image: curlimages/curl:latest
    networks:
      packiot-net:
        ipv4_address: 172.18.0.15
    env_file: [.env]
    depends_on:
      hasura:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    # No-op for the boot/dry-run phase. ⚠ ROADMAP W1.4: Hasura metadata must be
    # made to track the F3 objects (not the legacy F1 shape) — done when the F3
    # schema assembly lands. New/refactored read consumers use refdata-api, not
    # Hasura, so this staying minimal is acceptable.
    entrypoint:
      - sh
      - -c
      - |
        echo "Hasura init: boot phase — no metadata applied (see comment + roadmap W1.4)"
        exit 0
    restart: "no"

  # ── F3 schema assembly (one-shot) — ROADMAP W1.4 ──────────────────────────────
  # Assembles the F3 (refactored single-flow) schema as `public` on the fresh DB,
  # BEFORE knex/edge-api touch it. This is what makes greenfield prod "born F3".
  #
  # It applies db/init-f3/snapshot/*.sql (alphabetical) — the AUTHORITATIVE curated
  # schema-only dump of staging's packiot_analytics (populated via the gated
  # `capture-f3-snapshot` step, db/init-f3/README.md §4). Data-free, DDL only.
  # Runs once against an empty DB; a re-run against a populated DB is a no-op guard
  # (each file is CREATE ... IF NOT EXISTS / idempotent per the dump curation).
  #
  # ⚠ Until db/init-f3/snapshot/ is populated (gated: needs the staging DB read +
  # USER sign-off), this service exits 0 with a LOUD warning and the schema is NOT
  # built — the parity gate (scripts/prod-f3-schema-parity-check.sh) then FAILS,
  # which is the intended safe state (no client data flows until parity is clean).
  # db/init-f3/assemble.sh is the reviewable fragment-scaffold (does NOT reach
  # parity by itself — see README) used to author/verify the snapshot, not run here.
  db-schema-f3:
    image: postgres:16-alpine
    env_file: [.env]
    environment:
      # DIRECT to the r7g — the F3 schema assembly is DDL (hypertables, caggs,
      # functions) that must NOT go through pgbouncer transaction pooling.
      PGHOST: ${POSTGRES_HOST_UPSTREAM}
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # IDEMPOTENCY GUARD: the strict 05+/10+ layer (CREATE continuous aggregate,
        # no IF NOT EXISTS) is NOT re-runnable — on a re-deploy against an already
        # assembled r7g it errors "continuous aggregate already exists" (exit 3),
        # blocking db-migrate → stranding edge-api/oeecloud. Skip if F3 is present.
        # PROMOTION 2026-10: after the database transplant (docs/adr/reference/
        # production-promotion-transplant-runbook.md) the cagg lives in `silver`
        # (medallion, t231/t261) and `public.agg_equipment_values_1min` no longer
        # exists — so the guard must accept EITHER location, or this one-shot would
        # replay the 09-07 F3 snapshot over the transplanted schema.
        if [ "$$(psql -tAc "SELECT to_regclass('public.agg_equipment_values_1min') IS NOT NULL OR to_regclass('silver.agg_equipment_values_1min') IS NOT NULL" 2>/dev/null)" = "t" ]; then
          echo "F3 schema already assembled (agg_equipment_values_1min exists in public or silver) — skipping (idempotent).";
          exit 0;
        fi
        if ! ls /f3/snapshot/*.sql >/dev/null 2>&1; then
          echo "⚠⚠ db/init-f3/snapshot/ is EMPTY — F3 schema NOT assembled.";
          echo "   Populate it (README §4) then redeploy. Parity gate will FAIL until then.";
          exit 0;
        fi
        # 00-* = the curated pg_dump base (tables/functions/views): applied
        # BEST-EFFORT — a plain restore benignly fails on the cagg VIEW blocks
        # (dumped over _timescaledb_internal) + a couple debris index/type refs;
        # the REAL caggs/hypertables come from the strict 05-*/10-* timescale
        # layer next. 05+/10+ = the timescale-aware recreation: applied STRICT.
        # The parity gate (scripts/prod-f3-schema-parity-check.sh) is the real
        # guarantee — proven F3_MISSING=0 for this exact sequence.
        for f in $$(ls /f3/snapshot/00-*.sql 2>/dev/null | sort); do
          echo "== applying (best-effort) $$f =="; psql -f "$$f" || true;
        done
        for f in $$(ls /f3/snapshot/*.sql | grep -v '/00-' | sort); do
          echo "== applying (strict) $$f =="; psql -v ON_ERROR_STOP=1 -f "$$f";
        done
        echo "F3 schema assembled. Prove it: scripts/prod-f3-schema-parity-check.sh gate"
    volumes:
      - ./db/init-f3:/f3:ro
    depends_on:
      # pgbouncer healthy = r7g reachable; db-init-bootstrap = extensions present.
      pgbouncer:
        condition: service_healthy
      db-init-bootstrap:
        condition: service_completed_successfully
    networks:
      packiot-net:
        ipv4_address: 172.18.0.18
    restart: "no"
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── knex ↔ F3 reconciliation (one-shot) — ROADMAP W1.5 ────────────────────────
  # Fake-baselines edge-api's knex migrations against the F3 schema so `db-migrate`
  # does NOT rebuild the legacy F1 shape over F3. edge-api's early migrations are
  # plain `CREATE TABLE x` (no guard) authored to build F1 from an empty DB — run
  # against the F3-shaped `public` with an empty knex_migrations, knex tries them
  # all and dies on the first (`equipment_values already exists`), aborting the
  # boot; with an EMPTY F3 schema it would instead silently build F1 → WRONG OEE.
  #
  # db/init-f3/knex-baseline.sql seeds knex_migrations with every migration whose
  # object F3 already provides (or deliberately omits — the update_prev event
  # trigger, the FK/EXCLUDE constraints, shadow_go_port). `db-migrate` then applies
  # ONLY the genuinely edge-api-specific migrations F3 lacks (labels, sample_boxes,
  # scanned_boxes, idempotency_keys, mirror_replay_dlq + the additive id_label /
  # operator_pw_hash columns edge-api reads/writes at runtime).
  #
  # PROVEN on a throwaway timescaledb:2.25.2-pg16 (db-schema-f3 → THIS → db-migrate):
  # CLOBBER=0 (no F3 column dropped/type-changed; equipment_values stays a
  # hypertable), all edge-api tables present — see
  # docs/adr/reference/production-knex-f3-reconciliation.md +
  # scripts/prod-knex-f3-reconcile-check.sh.
  db-knex-baseline:
    image: postgres:16-alpine
    env_file: [.env]
    environment:
      # DIRECT to the r7g — same DDL/advisory-lock rationale as db-schema-f3.
      PGHOST: ${POSTGRES_HOST_UPSTREAM}
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "== fake-baselining knex against F3 (db/init-f3/knex-baseline.sql) =="
        psql -v ON_ERROR_STOP=1 -f /f3/knex-baseline.sql
        echo "knex baseline seeded. db-migrate will now apply only edge-api-only migrations."
    volumes:
      - ./db/init-f3:/f3:ro
    depends_on:
      pgbouncer:
        condition: service_healthy
      db-schema-f3:
        condition: service_completed_successfully
    networks:
      packiot-net:
        ipv4_address: 172.18.0.21
    restart: "no"
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── DB Migrations (one-shot) ──────────────────────────────────────────────────
  # Runs edge-api's knex `migrate:latest` AFTER db-schema-f3 + db-knex-baseline.
  # ROADMAP W1.5 (reconciliation RESOLVED — see db-knex-baseline above): because
  # the F3-overlapping migrations are fake-baselined, knex applies only the 16
  # edge-api-specific migrations F3 lacks and leaves every F3 table untouched.
  # Verify before any client data flows:
  #   1. scripts/prod-f3-schema-parity-check.sh   (after db-schema-f3: F3_MISSING=0)
  #   2. scripts/prod-knex-f3-reconcile-check.sh   (after db-migrate: CLOBBER=0)
  db-migrate:
    build:
      context: ./edge-api
      target: migrate
    env_file: [.env]
    environment:
      POSTGRES_PORT: "5432"
      # DIRECT to the r7g — knex `migrate:latest` takes a session-level advisory
      # lock, which transaction pooling (pgbouncer) does not preserve.
      POSTGRES_HOST: ${POSTGRES_HOST_UPSTREAM}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      pgbouncer:
        condition: service_healthy
      db-schema-f3:
        condition: service_completed_successfully
      db-knex-baseline:
        condition: service_completed_successfully
    networks:
      packiot-net:
        ipv4_address: 172.18.0.16
    restart: "no"
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── Edge API (NestJS) ──────────────────────────────────────────────────────────
  # In single-flow prod, edge-api writes operator actions (PO lifecycle,
  # downtimes) DIRECTLY to the single F3 DB via pgbouncer — ADR-0032's
  # "Phase 2 edge-api-direct" end-state, reached for free (no shadow-mirror
  # bridge needed, roadmap §5/W4).
  edge-api:
    build:
      context: ./edge-api
      target: production
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      NEW_RELIC_ENABLED: "false"
      NEW_RELIC_NO_CONFIG_FILE: "true"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: pgbouncer
      # Operator super-admin cross-tenant WRITE escalation (RS256/JWKS verifier,
      # #188). Enabled per prod decision (2026-09-07). Gated by construction: an
      # exclusive single super_user + email allowlist. NOTE: only takes effect once
      # the dev super-admin user is PROVISIONED in prod (a seed step, cutover-gated).
      OPERATOR_SUPERADMIN_CROSS_TENANT_ENABLED: "true"
      # ── PROMOTION 2026-10 — staging behaviour parity (reconciliation doc §8) ──
      # CS-Admin / operator Cognito auth + onboarding. These were meant for
      # edge-api (#20 durability, 66f501b3) but sat in the refdata/read-api block,
      # so edge-api only had them via the box .env (app_init.sh). Moved here.
      AWS_REGION: us-east-1
      AUTH_BEARER_ENABLED: "true"
      COGNITO_ISSUER: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_0T9t1sTwt
      COGNITO_CLIENT_ID: 2ckuoa0ov598rdpdn3uv039h6e
      COGNITO_USER_POOL_ID: us-east-1_0T9t1sTwt
      COGNITO_CS_ADMIN_GROUP: cs-admin
      EDGE_API_COGNITO_AUTH_ENABLED: "true"
      EDGE_API_ONBOARDING_ENABLED: "true"
      # Teardown (destructive client removal) is ON on staging; kept OFF on prod
      # until the user decides — a deliberate divergence (doc §8).
      EDGE_API_TEARDOWN_ENABLED: "false"
      ONBOARD_GENERATE_URL: http://sparkplug-decoder:9105/v1/onboard/generate
      ONBOARD_API_KEY: ${ONBOARD_API_KEY}
      # Stale-PO gate — CPACK only (staging: 3,4).
      PO_STALENESS_GATE_ENABLED: "true"
      PO_STALENESS_GATE_ENTERPRISES: "3"
      REDIS_URL: ${REDIS_URL:-redis://app-redis:6379/0}
      # Not carried (no such service on prod — decision B6): EDGE_SESSION_BROKER_*,
      # SSM_* (ADR-0057 box access), OTEL_* (no tempo). POSTGRES_ANALYTICS_URL is
      # left unset: single-DB prod, the adapter binds the primary DB (identical).
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      packiot-net:
        ipv4_address: 172.18.0.3
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  # ── Grafana ────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.5.0
    restart: unless-stopped
    env_file: [.env]
    labels:
      - "provisioning_rev=2026-08-20-drop-dead-v1-dashboard-mount"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Was /var/lib/grafana/dashboards/01-oee-pipeline.json, a v1-board path.
      # v1 (grafana/dashboards/) was deleted from the repo when v2 was blessed
      # (2026-07) — see compose.staging.yml for the same fix + the dashboards-v2
      # mount this environment was ALSO missing (below), meaning production
      # Grafana was provisioning ZERO of the 18 v2 boards until this fix.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/audience/00-overview.json
      GF_USERS_DEFAULT_THEME: dark
      GF_FEATURE_TOGGLES_ENABLE: publicDashboards
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      packiot-net:
        ipv4_address: 172.18.0.7
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # v1's ./grafana/dashboards mount removed (dead: source dir deleted from
      # repo in July) — replaced with the v2 mount, which this environment
      # never had (compose.staging.yml got it 2026-07-15; production didn't).
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}

  # ── Loki ───────────────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki/loki-local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      packiot-net:
        ipv4_address: 172.18.0.8
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── Promtail ───────────────────────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:3.4.2
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - ./monitoring/promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      packiot-net:
        ipv4_address: 172.18.0.9
    depends_on:
      loki:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── Prometheus ────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    restart: unless-stopped
    labels:
      - "config_rev=2026-07-27-production-f3native"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      packiot-net:
        ipv4_address: 172.18.0.22
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── oauth2-proxy (ADR-0034 §C — Cognito forward-auth, replaces Authentik) ─────
  # Nginx `auth_request` gate for the internal admin UIs (grafana/hasura/adminer/
  # rabbitmq/api-root) and operator. OIDC authorization-code flow against the
  # shared Cognito pool (hosted UI packiot-auth.auth.us-east-1.amazoncognito.com).
  # Session cookie scoped to .prod.packiot.app so one login covers every admin
  # subdomain. Admin UIs pass ?allowed_groups=cs-admin (staff); operator passes
  # none (any authenticated pool user — client logins created via CS Admin).
  # Config via OAUTH2_PROXY_* env; secrets (${OAUTH2_PROXY_CLIENT_SECRET} for the
  # oauth2-proxy-prod app client + ${OAUTH2_PROXY_COOKIE_SECRET}, literal 32 bytes)
  # from .env. Bound 127.0.0.1:4180 — only host nginx reaches it.
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: oauth2-proxy
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_0T9t1sTwt
      OAUTH2_PROXY_CLIENT_ID: 25i5je849qsd1hetcinrbm2t2c
      OAUTH2_PROXY_REDIRECT_URL: https://auth.prod.packiot.app/oauth2/callback
      OAUTH2_PROXY_OIDC_GROUPS_CLAIM: "cognito:groups"
      OAUTH2_PROXY_SCOPE: openid email profile
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      # Cookie + redirect scope BROADENED from .prod.packiot.app to .packiot.app
      # (2026-08) so the oauth2 gate can cover dash.packiot.app + wiki.packiot.app,
      # which live on the packiot.app APEX (siblings of prod.packiot.app), not under
      # *.prod.packiot.app. A cookie scoped to .prod.packiot.app is NOT sent by the
      # browser to dash/wiki, and .prod-only whitelist rejects the post-login rd=
      # → the nginx auth_request gate on those hosts would infinite-loop. Setting a
      # single broadest domain .packiot.app makes the callback (on auth.prod.…) set
      # Domain=.packiot.app, readable by every packiot.app subdomain (existing *.prod
      # admin SSO still works — they are subdomains of packiot.app too). MUST land
      # together with the dash/wiki nginx vhost gates (nginx_setup.sh).
      OAUTH2_PROXY_COOKIE_DOMAINS: .packiot.app
      OAUTH2_PROXY_WHITELIST_DOMAINS: .packiot.app
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      # PROMOTION 2026-10 parity: server-side sessions in app-redis (db 1), like
      # staging. Cookie-store sessions (split + a host-scoped copy) grew past the
      # 8 KB CloudFront WAF SizeRestrictions_Cookie_HEADER cap on staging and got
      # every admin UI 403'd at the edge; prod's .packiot.app scope (dash/wiki +
      # *.prod) is the same exposure. The cookie then holds only a small ticket.
      OAUTH2_PROXY_SESSION_STORE_TYPE: redis
      OAUTH2_PROXY_REDIS_CONNECTION_URL: redis://app-redis:6379/1
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "false"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: static://202
    depends_on:
      app-redis:
        condition: service_healthy   # session store (as staging)
    ports:
      - "127.0.0.1:4180:4180"
    networks:
      packiot-net:
        ipv4_address: 172.18.0.39
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # ── Adminer (PostgreSQL web UI) ───────────────────────────────────────────────
  # Connects to the r7g directly (bypasses pgbouncer — transaction pooling breaks
  # Adminer's SET search_path). Behind Authentik SSO at adminer.prod.packiot.app.
  # The default-server field is pre-filled with the r7g upstream IP.
  adminer:
    build: ./adminer
    container_name: adminer
    restart: unless-stopped
    env_file: [.env]
    environment:
      ADMINER_DEFAULT_SERVER: ${POSTGRES_HOST_UPSTREAM}
    ports:
      - "127.0.0.1:8082:8080"
    networks:
      packiot-net:
        ipv4_address: 172.18.0.17
    depends_on:
      pgbouncer:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── app-redis (ADR-0035 — refdata cache-aside) ────────────────────────────────
  # Dedicated APPLICATION cache — SEPARATE from authentik-redis (.14). Backs
  # refdata-api's cache-aside layer (fail-open: refdata serves from the DB if
  # this is down). CACHE, not a store: bounded 256mb + allkeys-lru, no persist.
  #
  # ⚠ DECISION (roadmap "ready-vs-needs-decision"): ADR-0035 says prod should
  # use managed ElastiCache (provisioned in api-terraform) rather than this
  # container — point refdata's REDIS_URL at the ElastiCache endpoint and drop
  # this service once ElastiCache exists. Shipped here as the boot-phase bridge
  # so the read plane is complete on-box today.
  app-redis:
    image: redis:7-alpine
    container_name: app-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly no
      --save ""
    networks:
      packiot-net:
        ipv4_address: 172.18.0.35
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    mem_limit: 320m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── oeecloud Worker (Go) — SINGLE-FLOW F3-NATIVE ──────────────────────────────
  # AMQP consumer for OEE events. Idle-but-ready until a client tee is live
  # (roadmap W1 exit). All F1/F2/comparator/report-job/tenant-specific env is
  # STRIPPED — this runs the refactored lane only, writing to the main pool /
  # `public` (= F3) because POSTGRES_ANALYTICS_DB_NAME is unset (routeForSource
  # nil-shadow fallback → main pool, public).
  #
  # Secrets: PG via packiot/production/db; AMQP via
  # packiot/production/rabbitmq-oeecloud-creds (least-privilege consumer).
  stream-engine:
    build: ./services/stream-engine
    container_name: stream-engine
    restart: unless-stopped
    env_file: [.env]
    environment:
      LOG_LEVEL: info
      AWS_REGION: us-east-1
      PG_SECRET_ID: packiot/production/db
      # MANUAL PRE-REQ (rename S1+S2, oeecloud-worker -> stream-engine): this
      # secret does not exist yet under the new name. A human must create
      # packiot/production/rabbitmq-stream-engine-creds (username
      # "stream-engine", SAME password as the current
      # packiot/production/rabbitmq-oeecloud-creds) in Secrets Manager BEFORE
      # this deploys, else the worker can't auth. terraform/production/secrets.tf
      # still declares the OLD secret resource (rabbitmq_oeecloud_creds) —
      # deliberately NOT touched here (renaming its `name` attribute forces
      # AWS to replace the resource; out of scope, and instructions say not to
      # create/modify AWS secrets from this PR).
      RABBITMQ_SECRET_ID: packiot/production/rabbitmq-stream-engine-creds
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      SOURCE_EXCHANGE: oee
      WORKER_QUEUE: stream-engine-q
      RETRY_EXCHANGE: oee-retry
      RETRY_QUEUE: stream-engine-q-retry-30s
      FAILED_EXCHANGE: oee-failed
      FAILED_QUEUE: stream-engine-q-failed
      RETRY_TTL_MS: "30000"
      MAX_RETRIES: "5"
      PREFETCH: "50"
      # Single flow → no F1/F2/F3 triple to spread; keep lanes small. 2 keeps
      # po-control strictly ordered (read-modify-write) while data processes
      # concurrently. Bump only if a real client's volume needs it.
      CONSUME_LANES: "4"   # PROMOTION 2026-10 parity: staging runs 4 (was 2)
      # Byte-identical statement-count optimization (fold shift-fill into the
      # equipment_values UPSERT). Keep on.
      SHIFT_FILL_FOLDED: "true"
      HEALTH_PORT: "9101"
      # NO POSTGRES_ANALYTICS_DB_NAME → shadow pool nil → `refactored` envelopes
      # write to (main pool, public) = F3. This IS the single-flow topology.
      # G3 (#747): single-flow prod has no `shadow_go_port` schema. Default flows
      # target it → background rollups error 42P01 AND never write OEE Gold to
      # public. false REDIRECTS the main-pool dest to `public`, so the rollups
      # (equipment_runtime_shift/1hour/…) actually compute on the live schema.
      # Go shift resolver fills id_shift/id_shift_hour on writes (F3 has no
      # PL/pgSQL trigger — this is the sole shift-resolution path in prod).
      SHIFT_RESOLVER_ENABLED: "true"
      # Core F3 compute chain (availability events, PO lifecycle, UNS, rollups):
      EVENTS_DERIVER_ENABLED: "true"
      PO_CONTROL_ENABLED: "true"
      UNS_REFRESH_ENABLED: "true"
      UNS_CURRENT_METRICS_ENABLED: "true"
      PO_RECALC_ENABLED: "true"
      RUNTIME_PROVISION_ENABLED: "true"
      RUNTIME_ROLLUP_ENABLED: "true"
      # Consume the shim-path `sparkplug.data` raw ingest (ingest-shim) as well
      # as edge-transformer's `refactored` envelopes. Both land on `oee`.
      LEGACY_INGEST_ENABLED: "true"
      # ADR-0037 Silver invariant — reject physically-impossible count deltas
      # (double-source / reordered-sample phantoms) before the UPSERT. Defends
      # ALL equipment; good prod default.
      INCREMENT_SANITY_CLAMP_ENABLED: "true"
      # OMITTED (default OFF in code) — existing-customer / staging-only:
      #   SHADOW_EMIT_* (edge-transformer's concern) · POSTGRES_ANALYTICS_DB_NAME ·
      #   BAKE_COMPARATOR_ENABLED/BAKE_ENTERPRISE_IDS (no comparator) ·
      #   SPEED33/SHIFT06/SAP13/BOXES13/SYNC06/BOXES_BRIDGE report jobs
      #   (customers 33/6/neopac) · EVENTS_WIDEROW_STATE_ENTERPRISES (ent4) ·
      #   COUNTERS_ONLY_AVAILABILITY_* (ent3 L6). Enable per-client at onboarding.
      # Counter-only LINE-METERED OEE (CPACK ent 3). Each tp=3 line has no own
      # counter stream; it derives its entire runtime from its lead_machine's
      # cagg (gross/net + idle-timeout availability). Supersedes the counters-avail
      # fallback for lines (mutually exclusive per client — do NOT also enable
      # COUNTERS_ONLY_AVAILABILITY for a line-metered tenant, or lines double-write).
      COUNTERS_ONLY_LINE_LEAD_ENABLED: "true"
      # Greenfield: tenant list stays minimal — each line-metered client is added
      # to this list at ITS onboarding (staging pattern). Do NOT pre-bake staging's
      # tenants (e.g. ent 5).
      COUNTERS_ONLY_LINE_LEAD_ENTERPRISES: "3"
      COUNTERS_ONLY_IDLE_TIMEOUT_SECONDS: "300"
      # PROMOTION 2026-10 parity: staging runs the counters-only availability pass
      # for the CPACK L6 members (counters-only Modbus line, SPEED:NO). Ids 68-72 =
      # L6 BREYER/TEXA/POLYTYPE/RMH/PTH on staging; the new-stack prod carries the
      # SAME CPACK ids (readiness §2b: 90 ISIMAT / 107 SLEEVE1 match). VERIFY on the
      # transplanted DB before the go (reconciliation doc §8, check C1). The
      # OEE_AVAIL_FLOOR pass below engages ONLY for this list.
      COUNTERS_ONLY_AVAILABILITY_ENABLED: "true"
      COUNTERS_ONLY_AVAILABILITY_EQUIPMENTS: "68,69,70,71,72"
      # Client-agnostic hardening (forward-port): the oldest-first backfill drain
      # that recomputes stranded recalc_needed hour rows (stream-engine
      # internal/rollup/backfill.go, dedicated advisory key). Safe on all tenants.
      ROLLUP_BACKFILL_ENABLED: "true"
      ROLLUP_BACKFILL_INTERVAL_SECONDS: "7"
      # ── Strategy D — shared worker pool + dynamic tenant discovery ─────────
      # Onboard a new client (packml_register active=true) with NO worker
      # restart — the worker picks it up within this interval. 0 = boot-only.
      TENANT_DISCOVERY_INTERVAL_SECONDS: "60"
      # x-single-active-consumer on per-tenant MAIN queues so a pool of
      # replicas is order-safe. DEFAULT false → byte-identical single instance.
      # Enabling it is a one-time queue migration (queue args are immutable):
      # services/oeecloud-worker/scripts/migrate-tenant-queues-sac.sh. Flip on
      # ONLY with OEECLOUD_WORKER_REPLICAS>1. Docs: strategy-d-shared-pool-sac.md.
      WORKER_POOL_SAC_ENABLED: "false"
      # ── PROMOTION 2026-10 — staging behaviour parity (reconciliation doc §8) ──
      # Reference = compose.staging.yml + staging's live .env-only flags, scoped to
      # prod's tenants (CPACK = ent 3; ent 1 has no line/stop config). Staging-only
      # tenant ids (4 Incoplast, 5 Bispharma, 2000003 sandbox) are dropped.
      #
      # Single-DB prod after the transplant: `packiot` IS the medallion
      # (staging-packiot_analytics-shaped) DB. Without POSTGRES_ANALYTICS_DB_NAME
      # the handler routes source_type=refactored to (main pool, `public`) — the
      # pre-medallion names t252 dropped — so this is REQUIRED, not cosmetic.
      # Staging points BOTH pools at packiot_analytics (CREDS_SOURCE=env,
      # DB_NAME=packiot_analytics); prod points both at ${POSTGRES_DB} (SM creds).
      POSTGRES_ANALYTICS_DB_NAME: ${POSTGRES_DB}
      POSTGRES_MAX_CONNS: "5"
      POSTGRES_ANALYTICS_MAX_CONNS: "15"
      # ADR-0048/0049 OEE correctness (staging since 2026-08-22).
      OEE_AVAIL_FLOOR_ENABLED: "true"
      OEE_CANONICAL_APQ_ENABLED: "true"
      # FU#8 PO-grain availability (available_time/planned_downtime on PO runtime).
      PO_AVAILABILITY_ENABLED: "true"
      # Stale-open stop closer — CPACK only (staging: 3,4,5,2000003).
      EVENTS_CLOSE_STALE_ENABLED: "true"
      EVENTS_CLOSE_STALE_ENTERPRISES: "3"
      # ADR-0010 §10.4 CPAC (status_type=0) stop deriver. NOTE: for ent 3 this
      # writes the SHADOW comparison table (CPAC_EVENT_TARGET_TABLE default
      # equipment_events_cpac_shadow), exactly like staging — it does NOT mint
      # live CPACK downtimes. CPAC_EVENT_LIVE_ENTERPRISES stays EMPTY: CPACK must
      # not get a second live writer (the #456 double-write class). See doc §8.
      CPAC_EVENT_DERIVATION_ENABLED: "true"
      CPAC_EVENT_ENTERPRISES: "3"
      CPAC_STOP_THRESHOLD_DEFAULT_SEC: "600"
      # ADR-0036 B1 medallion Bronze dual-write (now reached: refactored route).
      BRONZE_RAW_APPEND: "true"
      # Descriptor-driven box→production bridge (inert without box descriptors).
      BOXES_BRIDGE_ENABLED: "true"
      # Legacy customer-report ports for ents 6/13 (Neopac): NO such tenant on the
      # new-stack prod, and shift06 is delete-and-reload — kept OFF on purpose
      # (staging runs them as port proofs). Intervals/flags pinned for parity.
      SHIFT06_REPORT_ENABLED: "false"
      SHIFT06_INTERVAL_MINUTES: "15"
      SAP13_REPORT_ENABLED: "false"
      SAP13_INTERVAL_MINUTES: "15"
      SAP13_REASONS_FROM_DIM: "false"
      SYNC06_REPORT_ENABLED: "false"
      BOXES13_REPORT_ENABLED: "false"
      # Rollup batch caps (staging-tuned: fair live-shift progress, #1467).
      ROLLUP_SHIFT_LIMIT: "75"
      ROLLUP_BACKFILL_LIMIT: "50"
      INCREMENT_SANITY_CLAMP_SPIKE_FRACTION: "0.5"
      # Tenant allowlist: EMPTY = passthrough (all discovered tenants). Prod's only
      # known Sparkplug tenant is `cpack`; ent 1's group is unverified, so no list.
      WORKER_TENANT_ALLOWLIST: ""
    # Horizontal scale: default 1 (byte-identical). To run a pool of N, set
    # OEECLOUD_WORKER_REPLICAS=N + WORKER_POOL_SAC_ENABLED=true (post-migration)
    # and COMMENT OUT container_name (line ~753) + the static ipv4_address below
    # — both require uniqueness under N>1. No host port is published, so no
    # host-port collision. See docs/strategy-d-shared-pool-sac.md.
    deploy:
      replicas: ${OEECLOUD_WORKER_REPLICAS:-1}
    networks:
      packiot-net:
        ipv4_address: 172.18.0.20
        aliases: ["oeecloud-worker"]  # S2 flip: old name kept resolvable during rollout (prod had no S0 alias — added here)
    depends_on:
      rabbitmq:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/stream-engine", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # ── edge-transformer (SparkPlug decode + Go Calc → F3) ────────────────────────
  # Consumes SparkPlug from mosquitto (agent front-door), runs the Go Calc, and
  # emits `refactored` envelopes to `oee` → oeecloud-worker → F3. Single-flow:
  # emit `refactored` ONLY (no SHADOW_EMIT_PRODUCTION "" leg, no "go" leg).
  #
  # Secrets: AMQP via packiot/production/rabbitmq-sparkplug-decoder-creds
  # (publish-perm on `oee`). Idle until a client agent publishes to mosquitto.
  sparkplug-decoder:
    build: ./services/sparkplug-decoder
    container_name: sparkplug-decoder
    profiles: ["client-ingest"]  # GATED: needs a tenant client.yaml (tenant_id) — starts only when a client is onboarded (--profile client-ingest)
    restart: unless-stopped
    env_file: [.env]
    environment:
      LOG_LEVEL: info
      EDGE_TRANSFORMER_MODE: factory
      AWS_REGION: us-east-1
      RABBITMQ_SECRET_ID: packiot/production/rabbitmq-sparkplug-decoder-creds
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      SOURCE_EXCHANGE: edge.plc-normalized
      WORKER_QUEUE: edge-transformer-q
      # ── PROMOTION 2026-10 — staging behaviour parity (reconciliation doc §8) ──
      # ADR-0061: resolve device_key → id_equipment through read-api's
      # /internal/resolve-device (core.device_bindings) instead of the hand map.
      # REFDATA_INTERNAL_KEY must equal read-api's INTERNAL_API_KEY (same .env
      # key); unset ⇒ read-api 401s and nothing binds (fail-closed, never wrong).
      # As on staging, the binder itself is gated by BIRTH_BOUND_ROUTING (default
      # off, not set on staging either) — this wires the resolver, it does not
      # switch writes (stream-engine BIRTHBOUND_SWITCHED_ENTERPRISES does that).
      BIRTH_BOUND_RESOLVER: refdata
      REFDATA_URL: http://read-api:9104
      REFDATA_INTERNAL_KEY: ${INTERNAL_API_KEY:-}
      # Per-tenant routing keys sparkplug.data.<tenant> → stream-engine-q-<tenant>
      # (Strategy D queues; staging .env).
      F3_PER_TENANT_ROUTING: "true"
      # Ask an edge node for a rebirth when its birth state is unknown (staging .env).
      ET_REQUEST_REBIRTH_ENABLED: "true"
      # OEE settings (ideal speeds, line roles) from the DB, not compose maps.
      OEE_PROFILE_FROM_DB: "true"
      # Phase-9 line aggregation (line scrap one emission/s, #1650).
      PHASE9_LINE_AGG_ENABLED: "true"
      # CPACK L6/L5-TEXA counters-only lines emit no MachSpeed: swap Calc's
      # 3·machSpeed glitch guard for 3·configured-rate (staging since ADR-0037).
      # Rates come from the DB (COUNTERS_ONLY_FROM_DB above, kept from prod); this
      # map is the opt-in allowlist + guard bound, keyed by the CPACK unit topic
      # (tenant-independent), identical to staging. 147 = L6/L5 production_speed.
      CALC_NO_SPEED_GUARD_FALLBACK: "true"
      COUNTERS_ONLY_IDEAL_RATES: '{"CPACK/SC/LINHAS/L6/Admin":147,"CPACK/SC/LINHAS/L6/BREYER":147,"CPACK/SC/LINHAS/L6/TEXA":147,"CPACK/SC/LINHAS/L6/POLYTYPE":147,"CPACK/SC/LINHAS/L6/RMH":147,"CPACK/SC/LINHAS/L6/PTH":147,"CPACK/SC/LINHAS/L5/TEXA":147}'
      CALC_COUNTER_SPIKE_MARGIN: "0"
      RETRY_EXCHANGE: edge.plc-normalized-retry
      RETRY_QUEUE: edge-transformer-q-retry-30s
      FAILED_EXCHANGE: dlx.edge.plc-normalized
      FAILED_QUEUE: edge-transformer-q-failed
      RETRY_TTL_MS: "30000"
      MAX_RETRIES: "5"
      PREFETCH: "50"
      HEALTH_PORT: "9102"
      CLIENT_YAML_PATH: /etc/packiot/client.yaml
      MQTT_ENABLED: "true"
      # MQTT is THE ingest; no AMQP nodered-wrap source in prod.
      AMQP_SOURCE_ENABLED: "false"
      MQTT_BROKER_URL: "tcp://mosquitto:1883"
      MQTT_CLIENT_ID: "edge-transformer-production"
      MQTT_USERNAME: ""
      MQTT_PASSWORD: ""
      # -1 disables idle-degradation for the boot/dry-run phase (no client tee
      # yet → MQTT silence is expected, not a failure). ⚠ FLIP TO 60 (the real
      # factory default) once the client tee is live so /healthz surfaces a
      # genuine data-stall.
      MQTT_STALE_THRESHOLD_SECONDS: "-1"
      # ── Single-flow F3-native emit ──
      USE_GO_PORT: "true"                 # Go Calc port authoritative
      # Onboard-generate server (POST /v1/onboard/generate :9105). Fails closed w/o key.
      ONBOARD_API_ENABLED: "true"
      ONBOARD_API_PORT: "9105"
      ONBOARD_API_KEY: ${ONBOARD_API_KEY}
      SHADOW_EMIT_PRODUCTION: "false"     # no F1 legacy leg
      SHADOW_EMIT_REFACTORED: "true"      # emit `refactored` → F3
      SHADOW_EMIT_GO: "false"             # single-flow prod: NO `go`/shadow_go_port
                                          # comparator leg (that schema doesn't exist
                                          # here; the always-on leg was nacking every
                                          # message and aborting the refactored→public
                                          # write — G1). Default true = staging compare.
      # #276 Calc CUTOVER: emit the Calc delta+cumulative shape (Value=delta,
      # Counter=cumulative) so the cagg does not SUM cumulative counters into
      # billions on direct-line-emit lines. REQUIRED for correct F3 OEE.
      CALC_CUTOVER_REFACTORED: "true"
      # ADR-0011 P2 outbox — store-and-forward between MQTT decode + RMQ publish.
      OUTBOX_ENABLED: "true"
      OUTBOX_PATH: "/var/lib/edge-transformer/outbox.db"
      OUTBOX_CAP: "100000"
      # ADR-0019 C1 machine-write path — ships INERT (fail-safe). Flip only after
      # an edge-api producer endpoint lands + review against the live client.
      EDGE_COMMANDS_ENABLED: "false"
      EDGE_COMMANDS_ALLOWED: "po_setup,param_write"
      # CPACK/ent-3 counters-only-OEE (ADR-0042 P1 / ADR-0037): CPACK is a
      # Modbus/S7 counter-only edge with NO MachSpeed sensor, so Calc's Phase-8
      # glitch guard (prodSpeed < 3*machSpeed) collapses to `prodSpeed < 0` and
      # drops EVERY counter (G4). Enabling counters-only swaps the guard to
      # `prodSpeed < 3*IdealRate` using the configured rated speed per unit topic.
      # CONFIG-AS-DATA (#750): rates are now loaded from the DB at boot — for every
      # tenant whose descriptor has `counters_only_oee=true`, keyed by unit topic
      # from equipments.production_speed. Retires the hand-built static map (which
      # only covered 18 of 42 machines → G5). CS-Admin speed edits now flow through.
      COUNTERS_ONLY_OEE_ENABLED: "true"
      COUNTERS_ONLY_FROM_DB: "true"
    volumes:
      # ⚠ FILL AT DEPLOY: replace with the real per-client client.yaml
      # (docs/clients/<client>.yaml, ADR-0004). The example is mounted so the
      # container boots during the dry-run phase.
      # ADR-0004: real per-client client.yaml (tenant_id: cpack) — CPACK onboarded
      # to new-prod (topology seeded ent-3). Was cpack.example.yaml (no tenant_id,
      # dry-run placeholder) → edge-transformer rejected it. Now the live tenant config.
      - ./docs/clients/cpack.yaml:/etc/packiot/client.yaml:ro
      - edge_transformer_outbox:/var/lib/edge-transformer
    networks:
      packiot-net:
        ipv4_address: 172.18.0.23
        aliases: ["edge-transformer"]  # S2 flip: old name kept resolvable during rollout (prod had no S0 alias — added here)
    depends_on:
      rabbitmq:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/sparkplug-decoder", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # ── ingest-shim (HTTPS→RabbitMQ ingress) — SHIM front-door ────────────────────
  # The alternate to the agent path: a client Node-RED node POSTs SparkPlug-JSON
  # over HTTPS (X-Ingest-Key) → this shim republishes VERBATIM onto `oee` with
  # routing key `sparkplug.data.<client>` → oeecloud-worker → F3. RabbitMQ stays
  # internal; only the shim is exposed, and it never hands broker creds to the
  # client. Install ONE front-door per client (agent OR shim) — roadmap W2.
  #
  # Secrets: AMQP via packiot/production/rabbitmq-sparkplug-decoder-creds
  # (publish-perm on `oee`). INGEST_API_KEY + TLS cert/key are deploy-filled.
  ingest-shim:
    build: ./services/ingest-shim
    container_name: ingest-shim
    profiles: ["client-ingest"]  # GATED: needs a tenant + mTLS ingest certs — starts only when a client is onboarded (--profile client-ingest)
    restart: unless-stopped
    env_file: [.env]
    environment:
      LOG_LEVEL: info
      AWS_REGION: us-east-1
      RABBITMQ_SECRET_ID: packiot/production/rabbitmq-sparkplug-decoder-creds
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      EXCHANGE: oee
      # Per-client routing key → per-tenant worker queue. FILL AT DEPLOY with the
      # client's key (e.g. sparkplug.data.bispharma); defaults to the generic key.
      ROUTING_KEY: ${INGEST_ROUTING_KEY:-sparkplug.data}
      # Scope guard: only payloads whose topic/group first segment matches (case-
      # insensitive) are admitted; everything else → 403. FILL AT DEPLOY with the
      # client's topic prefix (e.g. BISPHARMA).
      SCOPE_GROUP: ${INGEST_SCOPE_GROUP:-}
      HTTP_ADDR: ":8444"
      METRICS_ADDR: ":9105"
      # REQUIRED — the shim refuses real traffic unset (hand it to the client's
      # Node-RED node as the X-Ingest-Key header). # FILL AT DEPLOY
      INGEST_API_KEY: ${INGEST_API_KEY:-}
      # TLS is mandatory — no plaintext public listener. # FILL AT DEPLOY (mount below)
      TLS_CERT_FILE: /certs/server.crt
      TLS_KEY_FILE: /certs/server.key
    volumes:
      # ⚠ FILL AT DEPLOY: host path holds the TLS server cert + key for :8444.
      - /opt/packiot/ingest-shim/certs:/certs:ro
    ports:
      # Public HTTPS ingress — Nginx/SG gate external access (SG `/32` from the
      # client egress only; port stays closed until the client tee is scheduled).
      - "8444:8444"
    networks:
      packiot-net:
        ipv4_address: 172.18.0.29
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/ingest-shim", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # ── refdata-api (F3 read plane) ───────────────────────────────────────────────
  # The reference-read API front4 + operator read through (replaces Hasura for
  # the refactored stack). Internal-only — no public route; the operator SPA and
  # front4 reach it via nginx which injects the per-tenant read key.
  #
  # SINGLE-FLOW NOTE: staging's f1/f3 switch selects between two DATABASES
  # (packiot vs packiot_analytics). Greenfield prod has ONE DB (packiot, public=F3),
  # so we run REFDATA_FLOW=f3 to pick the F3 dataset SQL variants but point
  # DB_NAME_F3 at the single `packiot` pool — there is no separate packiot_analytics
  # DB/pool. Every dataset's SQL is object-name-identical between the flows, so
  # this reads the F3 `public` objects correctly. ⚠ Verify against the assembled
  # F3 schema at W1.4 (any R5-dimension datasets with a divergent sqlF3 must have
  # their backing objects present in prod `public`).
  read-api:
    build: ./services/read-api
    container_name: read-api
    restart: unless-stopped
    env_file: [.env]
    environment:
      DB_HOST: pgbouncer
      DB_PORT: "5432"
      # PROMOTION 2026-10 parity: read as the least-privilege `readapi_ro`
      # (t276: NOBYPASSRLS — tenant RLS is enforced in the DB, not only in code),
      # like staging. pgbouncer resolves it via auth_user=postgres + auth_query.
      # The role is created by the transplant (NOLOGIN placeholder) and needs a
      # password at deploy (runbook §6.4); READAPI_RO_PASSWORD is REQUIRED — an
      # unset value fails `compose up` before anything is replaced.
      DB_USER: ${READAPI_RO_USER:-readapi_ro}
      DB_PASSWORD: ${READAPI_RO_PASSWORD:?READAPI_RO_PASSWORD must be set in /opt/packiot/.env (packiot/production/internal-keys)}
      DB_NAME: ${POSTGRES_DB}
      REFDATA_FLOW: f3
      # Single DB: F3 target IS the main `packiot` pool (no packiot_analytics).
      DB_NAME_F3: ${POSTGRES_DB}
      HEALTH_PORT: "9104"
      # Per-tenant read keys → customer(enterprise) id, resolved SERVER-SIDE
      # (never client-supplied). # FILL AT DEPLOY from packiot/production/refdata-query-keys
      # (e.g. "prod-<client>-key:<enterprise_id>").
      QUERY_API_KEYS: ${REFDATA_QUERY_API_KEYS:-}
      # #159: Firebase IdP RETIRED on the new-stack plane — refdata-api trusts
      # ONLY the Cognito issuer now. FIREBASE_PROJECT_ID is removed (the binary no
      # longer reads it nor constructs a Firebase verifier — see main.go). front4
      # authenticates the /v1 read plane with a Cognito ID token; a stale Firebase
      # token matches no verifier and is rejected (401). Mirrors staging (#1130).
      # COGNITO_AUTH_ENABLED is now inert for refdata (Cognito is unconditional);
      # kept for parity with other services that still read it.
      COGNITO_AUTH_ENABLED: ${COGNITO_AUTH_ENABLED:-true}
      COGNITO_ISSUER: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_0T9t1sTwt
      COGNITO_CLIENT_ID: 2ckuoa0ov598rdpdn3uv039h6e
      # #20 durability: hardcode CS-Admin auth + onboarding config (was ${..:-}
      # from .env, which isn't in Secrets Manager → a fresh instance would lack it
      # and csadmin.prod auth would break). Dual-accept: no Bearer → api-key
      # path unchanged (safe for other consumers).
      # (edge-api's CS-Admin/onboarding keys that used to sit here moved to the
      # edge-api service — read-api never read them.)
      # Internal device resolver for the decoder (ADR-0061); shared with the
      # decoder's REFDATA_INTERNAL_KEY. Unset ⇒ endpoint inert (401), fail-closed.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      # Operator super-admin cross-tenant READ escalation — matches edge-api's
      # WRITE flag (prod decision 2026-09-07) and staging.
      OPERATOR_SUPERADMIN_CROSS_TENANT_ENABLED: "true"
      # HIST_GW_* not set: no historian-gateway runs on prod (profile off, B9).
      # ADR-0035 cache-aside over app-redis (fail-open). Point REDIS_URL at
      # managed ElastiCache instead once provisioned (see app-redis note).
      REDIS_CACHE_ENABLED: "true"
      REDIS_URL: ${REDIS_URL:-redis://app-redis:6379/0}
    networks:
      packiot-net:
        ipv4_address: 172.18.0.26
        aliases: ["refdata-api"]  # S2 flip: old name kept resolvable during rollout (prod had no S0 alias — added here)
    depends_on:
      # Soft dependency: refdata fails open, so only wait for the container to
      # start — a slow cache must never block the read plane from booting.
      app-redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "/usr/local/bin/read-api", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # ── operator-gateway (was operator-adapter; bespoke-operator-UI PO tee) ───────
  # Operator twin of the ingest-shim: a client whose bespoke operator UI
  # justifies downtimes / starts POs WITHOUT calling edge-api tees each action
  # here over HTTPS; the adapter maps it to the matching edge-api call (which
  # writes the single F3 DB). ⚠ ONLY needed if the prod client uses a bespoke
  # operator UI (roadmap W4.2) — if they use the operator PWA, its durable
  # write-queue is the path and this can be dropped. Included for parity; boots
  # to /healthz, filled per-client at onboarding.
  #
  # Secrets: PG resolver via packiot/production/db; OPERATOR_API_KEY +
  # OPERATOR_EDGE_API_KEY (the client enterprise api_key) + TLS are deploy-filled.
  # CS-Admin SPA (Vite + nginx). Vhost csadmin.prod.packiot.app is generated from
  # var.services (terraform) behind the wildcard cert + Authentik. nginx here
  # reverse-proxies /api -> edge-api:8080, /v1 -> refdata-api:9104.
  csadmin:
    build:
      context: ./csadmin
      dockerfile: Dockerfile.staging
      args:
        VITE_API_BASE_URL: ""
        VITE_FIREBASE_API_KEY: ${CSADMIN_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${CSADMIN_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${CSADMIN_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${CSADMIN_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${CSADMIN_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${CSADMIN_FIREBASE_APP_ID:-}
    container_name: csadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:80"
    networks:
      packiot-net:
        ipv4_address: 172.18.0.40
    depends_on:
      edge-api:
        condition: service_started
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  operator-gateway:
    build: ./services/operator-gateway
    container_name: operator-gateway
    profiles: ["client-ingest"]  # GATED: needs OPERATOR_API_KEY + a bespoke-operator client — starts only when a client is onboarded (--profile client-ingest)
    restart: unless-stopped
    env_file: [.env]
    environment:
      PORT: "8443"
      EDGE_API_URL: http://edge-api:8080
      AWS_REGION: us-east-1
      PG_SECRET_ID: packiot/production/db
      # The prod client's enterprise id + topic prefix (code env keys are the
      # legacy INCOPLAST_* names; values are the prod client's). # FILL AT DEPLOY
      INCOPLAST_ENTERPRISE_ID: ${OPERATOR_ADAPTER_ENTERPRISE_ID:-}
      INCOPLAST_TOPIC_PREFIX: ${OPERATOR_ADAPTER_TOPIC_PREFIX:-}
      # Shared secret the client tee presents (X-Ingest-Key), and the client
      # enterprise api_key edge-api authenticates. # FILL AT DEPLOY
      OPERATOR_API_KEY: ${OPERATOR_API_KEY:-}
      EDGE_API_KEY: ${OPERATOR_EDGE_API_KEY:-}
      # TLS — refuses plaintext. # FILL AT DEPLOY (mount below)
      TLS_CERT_FILE: /opt/packiot/operator-adapter/certs/tls.crt
      TLS_KEY_FILE: /opt/packiot/operator-adapter/certs/tls.key
    volumes:
      # ⚠ FILL AT DEPLOY: place tls.crt + tls.key on the host here.
      - /opt/packiot/operator-adapter/certs:/opt/packiot/operator-adapter/certs:ro
    ports:
      - "8445:8443"
    networks:
      packiot-net:
        ipv4_address: 172.18.0.31
        aliases: ["operator-adapter"]  # S2 flip: old name kept resolvable during rollout (prod had no S0 alias — added here)
    depends_on:
      edge-api:
        condition: service_started
      pgbouncer:
        condition: service_started
    healthcheck:
      test: ["CMD", "/usr/local/bin/operator-gateway", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  # ── Operator SPA ────────────────────────────────────────────────────────────
  # CPACK PO-control cutover (docs/clients/cpack-po-cutover-runbook.md, gap B1).
  # The operator PWA served at operator.prod.packiot.app. Host nginx operator.conf
  # already proxies operator.prod → 127.0.0.1:8083 (behind the oauth2/Cognito
  # outer gate — runbook B4, a separate USER decision); this service is what
  # finally listens there.
  #
  # ⚠ WHY Dockerfile.edge (NOT Dockerfile.staging): the staging image bakes
  # nginx.staging.conf.template, whose legacy `location` block hard-proxies
  # /machines,/set-event,/downtime-reasons,… to `http://edge-nodered:1880`.
  # edge-nodered does NOT run in the cloud stack (per-factory only, ADR-0005), so
  # nginx resolves that literal upstream at startup and emerg-fails
  # ("host not found in upstream edge-nodered") → crash-loop. That is exactly why
  # this service was removed on the first dry-run boot. Dockerfile.edge bakes
  # nginx.edge.conf.template — the clean post-ADR-0018 surface with NO edge-nodered
  # proxy: writes+/session → edge-api:8080, reads → refdata-api:9104 (both exist
  # here), upstreams envsubst-configurable, so nginx starts cleanly. PO control
  # (the cutover's scope) rides /api/production-orders/* → edge-api and the PO
  # list/current-production reads ride /v1/operator-* → refdata — both resolve on
  # new-prod. (Residual legacy-only SPA features — machine list, manual-event
  # justify, language packs — 404 to the SPA catch-all until those routes migrate
  # off edge-nodered; harmless while no kiosk/operator is pointed here yet — B3.)
  #
  # Secrets (deploy-filled into /opt/packiot/.env; NEVER committed):
  #   EDGE_API_KEY    = OPERATOR_EDGE_API_KEY    = CPACK (ent 3) enterprises.api_key (B2)
  #   REFDATA_API_KEY = OPERATOR_REFDATA_API_KEY = CPACK refdata read key, also in
  #                     refdata's QUERY_API_KEYS map → ent 3 (B5)
  # nginx injects both server-side (envsubst) on /api|/v1 — the browser NEVER
  # holds a key. Reuses the .19 address freed when the old comment-only entry was
  # removed. Kiosk repoint + operator provisioning stay OUT of this change.
  operator:
    build:
      context: ./operator
      dockerfile: Dockerfile.edge
    container_name: operator
    restart: unless-stopped
    environment:
      # CPACK ent-3 enterprises.api_key — nginx injects it as x-api-key on /api/*.
      EDGE_API_KEY: ${OPERATOR_EDGE_API_KEY:-}
      # CPACK refdata read key — nginx injects it as x-api-key on /v1/*; refdata
      # resolves customer_id (=3) from it server-side (ADR-0027 Surface-1).
      REFDATA_API_KEY: ${OPERATOR_REFDATA_API_KEY:-}
      # Clean-surface upstreams (defaults baked in Dockerfile.edge; pinned here
      # for clarity — both are live services in this compose network).
      EDGE_API_UPSTREAM: http://edge-api:8080
      REFDATA_UPSTREAM: http://read-api:9104   # renamed from refdata-api (alias still resolves)
    ports:
      - "127.0.0.1:8083:80"
    networks:
      packiot-net:
        ipv4_address: 172.18.0.19
    depends_on:
      # Ordering only — nginx needs the upstream NAMES to resolve at startup,
      # which requires the containers to exist on the network. Neither gates on
      # health (nginx tolerates a briefly-unready upstream at request time).
      edge-api:
        condition: service_started
      read-api:            # renamed from refdata-api (alias kept on read-api)
        condition: service_started
    healthcheck:
      # nginx serves the SPA index on :80; busybox wget ships in nginx:alpine.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── legacy-replicator (PROMOTION 2026-10, B11 — CPACK operator actions + events) ─
  # Same binary and config as staging's `legacy-replicator`: replays CPACK operator
  # actions (PO lifecycle, downtime create/justify/split/edit) from the LEGACY prod
  # DB (packiot40, enterprise 1 "C-PACK", SELECT-only user awslambda) into prod's
  # CPACK tenant (ent 3), plus the PO reconciler/enricher and the manual-event
  # reconciler. WHY on prod: the factory tee carries telemetry only (and only some
  # lines since 2026-08-13); CPACK's downtimes/justifications live in the legacy
  # control plane — prod's last CPACK equipment_events row is 2026-08-12. Staging's
  # twin gets them exactly this way. Equipment maps by packml BASE topic, POs by
  # (id_enterprise, id_order); every write is an idempotent natural-key upsert and
  # never clobbers a tee-produced row. ent 3's CPAC deriver stays SHADOW-only
  # (stream-engine CPAC_EVENT_LIVE_ENTERPRISES empty) → this is the single live
  # writer of replayed CPACK events (no double writers).
  #
  # PROFILED (`legacy-replicator`): NOT started by the promotion deploy. The runbook
  # (§5b) starts it after the transplant + deploy + smoke tests, then adds the
  # profile to COMPOSE_PROFILES in /opt/packiot/.env so later deploys keep it.
  # Cold start (no ops.mirror_replay_cursor row for CURSOR_SOURCE) seeds the cursor
  # just below the first legacy user_logs row at BACKFILL_SINCE and replays forward
  # — that IS the 2026-08-12 → now backfill. An existing cursor is always respected.
  #
  # Secrets: LEGACY_DB_PASSWORD ← top-level SM secret `databaseCredentials`
  # (key DB_PASSWORD), written to .env by app_init.sh (the app role gets read on
  # that secret in ec2.tf). Empty default so compose never fails interpolation
  # while the profile is off. Network: the legacy DB must accept the prod app
  # box's egress IP (staging's is allowlisted) — runbook §5b pre-req.
  legacy-replicator:
    build:
      context: ./services/analytics-sync
      dockerfile: Dockerfile.replicator
    container_name: legacy-replicator
    profiles: ["legacy-replicator"]
    restart: unless-stopped
    env_file: [.env]
    environment:
      LOG_LEVEL: info
      REPLICATE_ENABLED: "true"
      # SOURCE — legacy prod DB (SELECT-only; never written). Same as staging.
      LEGACY_DB_HOST: 18.220.223.110
      LEGACY_DB_PORT: "5432"
      LEGACY_DB_USER: awslambda
      LEGACY_DB_PASSWORD: ${LEGACY_DB_PASSWORD:-}
      LEGACY_DB_NAME: packiot40
      # DEST — prod's (transplanted, medallion) DB, DIRECT to the r7g like the
      # other DDL/long-session one-shots (the replicator creates ops.mirror_replay_*
      # IF NOT EXISTS and holds a cursor transaction per batch).
      DEST_DB_HOST: ${POSTGRES_HOST_UPSTREAM}
      DEST_DB_PORT: "5432"
      DEST_DB_USER: ${POSTGRES_USER}
      DEST_DB_PASSWORD: ${POSTGRES_PASSWORD}
      DEST_DB_NAME: ${POSTGRES_DB}
      # Enterprise id-map — CPACK legacy 1 -> new-stack 3 (same as staging).
      SRC_ENTERPRISE: "1"
      DST_ENTERPRISE: "3"
      # Cold-start backfill = prod's event gap (last CPACK event 2026-08-12).
      # Takes precedence over BACKFILL_SINCE_DAYS; ignored once the cursor exists.
      BACKFILL_SINCE: "2026-08-12"
      REPLICATE_BASE_EVENTS: "true"
      # Same cursor key as staging's instance — different DB, so no collision.
      CURSOR_SOURCE: legacy-cpack
      POLL_INTERVAL_MS: "3000"
      BATCH_SIZE: "200"
      HEALTH_PORT: "9104"
      HEALTHCHECK_MAX_AGE_SEC: "600"
      RECONCILE_PO_ENABLED: "true"
      RECONCILE_PO_INTERVAL_SEC: "300"
      RECONCILE_PO_WINDOW_DAYS: "14"
      RECONCILE_PO_ENRICH_ENABLED: "true"
      RECONCILE_PO_ENRICH_WINDOW_DAYS: "120"
      RECONCILE_MANUAL_EVENTS_ENABLED: "true"
      RECONCILE_MANUAL_EVENTS_INTERVAL_SEC: "300"
      # 60 (staging: 35) so the first passes cover the whole 2026-08-12 gap; drop to
      # 35 once the backfill is verified (runbook §5b step 6).
      RECONCILE_MANUAL_EVENTS_LOOKBACK_DAYS: "60"
      RECONCILE_MANUAL_EVENTS_MAX_DELETES: "50"
      RECONCILE_MANUAL_EVENTS_REFRESH_SERVING: "true"
    networks:
      packiot-net:
    depends_on:
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/legacy-replicator", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # ── historian-gateway (D3 — transparent hot+cold query layer) ─────────────────
  # Exposes `ev_all`: live timescaledb (HOT, postgres_fdw to the r7g) UNION S3
  # Parquet historian (COLD, pg_duckdb). Consumers (read-api, Superset, tools)
  # query plain Postgres SQL; old timestamps resolve to S3 and prune to the
  # relevant partition file. Cold-store infra = terraform/production/historian.tf
  # (S3 + Athena + partition-projection, Approach B3). Proven on staging (CPACK):
  # one query spans 2021→today; old-timestamp lookups scan 1/181 files.
  # NOT a dependency of read-api (loose coupling, like staging) — read-api
  # tolerates the gateway being unready so it never gates on the 20m first boot.
  # First boot on a fresh hist_gateway_data volume runs refresh_hist_cutover() (a
  # full one-pass parquet scan — minutes on the 336M-row CPACK partition) inside
  # initdb before Postgres accepts TCP; start_period 20m suppresses false
  # "unhealthy" during that window. Only the first boot on a fresh volume pays it.
  historian-gateway:
    image: pgduckdb/pgduckdb:16-main
    container_name: hist-gateway
    restart: unless-stopped
    # OPT-IN: the gateway serves COLD (S3 parquet) history — a greenfield first
    # cutover has none, so it does NOT auto-start. Enable once the historian is
    # configured (SM secrets present + bucket populated) with:
    #   docker compose -f compose.production.yml --profile historian up -d historian-gateway
    # (or COMPOSE_PROFILES=historian). Being profiled keeps it OUT of the default
    # `up -d --remove-orphans` deploy AND safe from orphan-removal.
    profiles: ["historian"]
    environment:
      # gateway-ONLY vars use safe defaults (NOT :?): an unconfigured historian
      # must never fail compose interpolation and block the whole 25-service deploy
      # (compose evaluates :? even for inactive profiles). Override in .env when live.
      POSTGRES_PASSWORD: ${HIST_GW_PASSWORD:-hist_gw_local_changeme}   # gateway's own PG (packiot-net only, no host port)
      # live timescaledb (HOT) — the same external r7g every other service uses
      # (bare, like the rest of compose: app_init.sh always sets POSTGRES_HOST_UPSTREAM)
      FDW_HOST: ${POSTGRES_HOST_UPSTREAM}
      FDW_PORT: "5432"
      FDW_DB: ${POSTGRES_DB}
      FDW_USER: ${POSTGRES_USER:-postgres}
      FDW_PASS: ${POSTGRES_PASSWORD}
      # S3 historian (COLD) — scoped read-only key (svc-historian-gateway).
      # Empty defaults so the stack never blocks; the gateway simply has no cold
      # store until these are set (then re-create it on a fresh hist_gateway_data vol).
      HISTORIAN_BUCKET: ${HISTORIAN_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      HIST_AWS_KEY: ${HIST_AWS_KEY:-}
      HIST_AWS_SECRET: ${HIST_AWS_SECRET:-}
    networks:
      packiot-net:
        ipv4_address: 172.18.0.27
    volumes:
      - ./services/historian-gateway/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
      - hist_gateway_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20m
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
