# pgBackRest — packiot staging DB EC2 (i-064bb36d1c454d861)
# ═══════════════════════════════════════════════════════════════════════════
# GROUNDWORK ONLY (PR feat/pgbackrest-groundwork). Nothing reads this file
# until flip day: activation (archive_mode=on + the ONE postgres restart,
# stanza-create, first full backup) rides the flip deploy. See:
#   docs/adr/reference/migrations/0017-pgbackrest-sidecar.md   (activation)
#   docs/guides/backup-restore-runbook.md                      (design memo)
#
# Deploy target: /etc/pgbackrest/pgbackrest.conf on the DB EC2 host, then
# bind-mounted read-only into BOTH the timescaledb container (archive-push
# runs inside it via archive_command) and the pgbackrest sidecar container
# (scheduled full/diff backups + verify).
#
# ── Credentials ─────────────────────────────────────────────────────────────
# NO static keys here. repo1-s3-key-type=auto makes pgBackRest fetch
# temporary credentials from the EC2 instance role via IMDSv2 (the DB EC2
# already has HttpPutResponseHopLimit=2, so bridge-networked containers can
# reach 169.254.169.254). The instance role `packiot-staging-db` will need
# this policy added at flip (do NOT attach in the groundwork PR):
#
#   on arn:aws:s3:::packiot-db-backups-639178078294      (bucket-level):
#     s3:ListBucket
#   on arn:aws:s3:::packiot-db-backups-639178078294/*    (object-level):
#     s3:GetObject
#     s3:PutObject
#     s3:DeleteObject           (retention expiry: `pgbackrest expire`)
#     s3:AbortMultipartUpload   (cleanup of interrupted multipart uploads)
# ═══════════════════════════════════════════════════════════════════════════

[global]
# ── Repository: S3, same region as the instance ─────────────────────────────
repo1-type=s3
# Bucket created 2026-07-08: versioned, SSE-S3 default encryption,
# INTELLIGENT_TIERING after 30d, all public access blocked.
repo1-s3-bucket=packiot-db-backups-639178078294
repo1-s3-region=us-east-1
repo1-s3-endpoint=s3.us-east-1.amazonaws.com
# auto = IAM instance role via IMDS — see credentials note above.
repo1-s3-key-type=auto
# All repo objects live under this key prefix inside the bucket, leaving
# room for a future prod stanza (e.g. /pgbackrest/prod) in a sibling prefix.
repo1-path=/pgbackrest/staging

# ── Retention (runbook §3) ───────────────────────────────────────────────────
# Keep 2 weekly fulls (≈14 days of PITR range) and 7 daily differentials.
# WAL needed by a retained backup is kept automatically; expiry runs after
# every backup — no separate lifecycle cron needed for repo pruning.
repo1-retention-full=2
repo1-retention-diff=7

# Bundle many small files into larger repo objects. TimescaleDB hypertables
# mean thousands of small chunk relations — bundling cuts S3 PUT count and
# cost dramatically. Safe default since pgBackRest 2.37.
repo1-bundle=y

# ── Process / logging ────────────────────────────────────────────────────────
# 2 parallel compress/transfer processes: the DB EC2 is small; leave the
# other cores for postgres. Raise only if backup wall-clock becomes a problem.
process-max=2
# Sidecar logs go to stdout → `docker logs pgbackrest` / journald. No file
# log so nothing accumulates on the 42%-used root volume.
log-level-console=info
log-level-file=off

# Force an immediate checkpoint at backup start instead of waiting for the
# spread checkpoint (up to checkpoint_timeout). Standard for scheduled
# backups — predictable start time matters more than checkpoint smoothing.
start-fast=y

# ── Stanza: the consolidated staging DB ──────────────────────────────────────
[packiot]
# Path AS SEEN INSIDE the containers. The host bind mount is
# /var/lib/postgresql/data → /var/lib/postgresql/data (identical path in the
# timescaledb container and the sidecar — pgBackRest requires pg1-path to
# match the data_directory reported by the server).
pg1-path=/var/lib/postgresql/data
# Local libpq connection over the shared unix-socket directory
# (host /var/run/packiot-pg bind-mounted at /var/run/postgresql in both
# containers — added to the timescaledb container at flip; pgBackRest does
# not support TCP for the local control connection).
pg1-socket-path=/var/run/postgresql
pg1-port=5432
pg1-user=postgres
pg1-database=packiot
