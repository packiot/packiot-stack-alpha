# bi historian union — ev_all (hot live + cold S3 historian), VIRTUAL dataset.
# Backed by the historian-gateway `ev_all` view (services/historian-gateway/
# docker-entrypoint-initdb.d/10-historian-gateway.sh). One row per equipment_values
# reading across ALL time: live for ts > per-enterprise cutover, historian for
# ts <= cutover (legacy-priority — no double-count; hardproven staging ent3).
#
# ── WHY A VIRTUAL (sql:) DATASET, NOT table_name: ev_all ──────────────────────
# The cold side is hive-partitioned enterprise=/year=/month=; DuckDB prunes ONLY on
# those partition columns, NOT on ts_value (hardproof EXPLAIN: ts_value-only = 59
# files/171s; year+month = 1 file/0.57s). A plain `table_name: ev_all` dataset lets
# Superset add ONLY its ts_value time filter -> no prune -> full historian scan.
# This virtual dataset uses Jinja to inject the YEAR/MONTH RANGE derived from the
# dashboard time filter ({{ from_dttm }}/{{ to_dttm }}) INSIDE the query, so the
# cold DuckDBScan prunes to the spanning partitions. The RLS `id_enterprise = <id>`
# literal (below) prunes further to that tenant's enterprise= partition.
#
# ── TENANT RLS (T4) ───────────────────────────────────────────────────────────
# ev_all exposes id_enterprise; Superset native RLS is the SOLE tenant enforcer on
# this gateway (no Postgres GUC co-enforcer — see the database asset).
#   * EMBED/GUEST path: edge-api mints a guest token with rls:[{clause:
#     "id_enterprise = <n>"}] (superset-embed.service.ts) — NO dataset scope, so it
#     applies to EVERY dataset in the dashboard that has an id_enterprise column,
#     including this one, AUTOMATICALLY. Add ev_all charts to the embedded OEE
#     dashboard and the existing guest token isolates them — no new wiring.
#   * AUTHORING path (Cognito OIDC users): create a Superset base Row-Level-Security
#     rule (Settings -> Row Level Security), Regular type, scoped to THIS dataset,
#     one of:
#       - Strategy A (per-tenant role): rule per tenant, roles=[tenant_<id>],
#         clause `id_enterprise = <id>` — matches db/superset/02-tenant-rls.sql (a).
#       - Strategy B (single Jinja rule): roles=[Gamma_BI], clause
#         `id_enterprise IN (SELECT id_enterprise FROM bi.user_tenant
#          WHERE username = '{{ current_username() }}')` — BUT bi.user_tenant lives
#         on packiot_analytics, not the gateway, so Strategy A is the clean fit here.
#   * SUPER-ADMIN: the bi.* all-tenant sentinel (app.tenant_id=-1) does NOT apply
#     here (no Postgres RLS). For an internal Admin to see all tenants on ev_all,
#     give the Admin role NO base-RLS rule on this dataset (Superset applies base
#     rules only to roles named in the rule) — Admin then sees every tenant; guests
#     still carry their token clause. Keep ev_all OUT of any public/anon dashboard.
table_name: ev_all
main_dttm_col: ts_value
description: Hot+cold equipment production union (live FDW + S3 historian), legacy-priority, partition-pruned. Tenant-isolated by id_enterprise RLS.
default_endpoint: null
offset: 0
cache_timeout: 300
catalog: null
schema: public
sql: |
  SELECT
    ts_value,
    id_enterprise,
    year,
    month,
    id_equipment,
    gross_production_incr,
    net_production_incr
  FROM ev_all
  WHERE 1=1
  {% if from_dttm is not none %}
    AND ts_value >= '{{ from_dttm }}'
    AND ( year > {{ from_dttm.year }}
       OR (year = {{ from_dttm.year }} AND month >= {{ from_dttm.month }}) )
  {% endif %}
  {% if to_dttm is not none %}
    AND ts_value < '{{ to_dttm }}'
    AND ( year < {{ to_dttm.year }}
       OR (year = {{ to_dttm.year }} AND month <= {{ to_dttm.month }}) )
  {% endif %}
params: null
template_params: null
filter_select_enabled: true
fetch_values_predicate: null
extra: null
normalize_columns: false
always_filter_main_dttm: false
uuid: 3f9c1d55-2a48-4b6e-9d10-7c2e6a4b8f31
metrics:
- metric_name: count
  verbose_name: Readings
  metric_type: count
  expression: COUNT(*)
  d3format: null
  extra: null
- metric_name: sum_gross
  verbose_name: Gross production
  expression: SUM(gross_production_incr)
  d3format: .3~s
  extra: null
- metric_name: sum_net
  verbose_name: Net production
  expression: SUM(net_production_incr)
  d3format: .3~s
  extra: null
columns:
- column_name: id_enterprise
  type: INTEGER
  is_dttm: false
  is_active: true
  groupby: true
  filterable: true
  description: Tenant key (RLS). Never charted; used by the RLS filter + prunes the enterprise= partition.
- column_name: ts_value
  type: TIMESTAMP
  is_dttm: true
  is_active: true
  groupby: false
  filterable: true
  python_date_format: null
- column_name: year
  type: INTEGER
  is_dttm: false
  is_active: true
  groupby: true
  filterable: true
  description: Hive partition column (cold) / EXTRACT (hot). Drives cold-side partition pruning; injected by the dataset Jinja from the time filter.
- column_name: month
  type: INTEGER
  is_dttm: false
  is_active: true
  groupby: true
  filterable: true
  description: Hive partition column (cold) / EXTRACT (hot). Drives cold-side partition pruning.
- column_name: id_equipment
  type: INTEGER
  is_dttm: false
  is_active: true
  groupby: true
  filterable: true
- column_name: gross_production_incr
  type: DOUBLE PRECISION
  is_dttm: false
  is_active: true
- column_name: net_production_incr
  type: DOUBLE PRECISION
  is_dttm: false
  is_active: true
