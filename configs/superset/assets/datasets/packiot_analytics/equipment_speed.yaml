  filterable: true
- column_name: state
  type: INTEGER
  is_dttm: false
  is_active: true
  groupby: true
  filterable: true
- column_name: mode
  type: INTEGER
  is_dttm: false
  is_active: true
  groupby: true
  filterable: true
- column_name: equipment_label
  type: VARCHAR
  is_dttm: false
  is_active: true
  groupby: true
  filterable: true
  description: nm_equipment + (line)/(machine)/(sector) — disambiguates line/machine name-pairs.
