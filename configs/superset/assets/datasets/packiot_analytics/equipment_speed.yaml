# bi.equipment_speed — per-equipment machine speed over time (source: equipment_values
# ⋈ equipments). DATA-READY on CPACK (equipment_values is the raw stream, populated).
# Tenant key id_enterprise comes from the equipments join (equipment_values is a
# compressed hypertable; isolation is transitive — see db/superset/01/02).
table_name: equipment_speed
main_dttm_col: ts_value
description: Machine speed time series per equipment. front4 "Machine Speed" / PowerBI Speed.
default_endpoint: null
offset: 0
cache_timeout: null
catalog: null
schema: bi
sql: null
params: null
template_params: null
filter_select_enabled: true
fetch_values_predicate: null
extra: null
normalize_columns: false
always_filter_main_dttm: false
uuid: 1c9dab1f-bf7f-4106-a0f4-d52302d256c7
metrics:
- metric_name: avg_speed
  verbose_name: Avg speed
  metric_type: null
  expression: AVG(speed)
  description: Mean instantaneous machine speed.
  d3format: .3~s
  currency: null
  warning_text: null
  extra: null
- metric_name: max_speed
  verbose_name: Peak speed
  expression: MAX(speed)
  d3format: .3~s
  extra: null
- metric_name: avg_ideal_speed
  verbose_name: Ideal speed
  expression: AVG(ideal_production_speed)
  d3format: .3~s
  description: Rated/ideal production speed (reference line for performance).
  extra: null
columns:
- column_name: id_enterprise
  type: INTEGER
  is_dttm: false
  is_active: true
  groupby: true
  filterable: true
  description: Tenant key (RLS). Never charted; used by the RLS filter.
- column_name: id_equipment
  type: INTEGER
  is_dttm: false
  is_active: true
  groupby: true
  filterable: true
- column_name: nm_equipment
  type: VARCHAR
  is_dttm: false
  is_active: true
  groupby: true
  filterable: true
- column_name: ts_value
  type: TIMESTAMP WITH TIME ZONE
  is_dttm: true
  is_active: true
  groupby: false
  filterable: true
  python_date_format: null
- column_name: speed
  type: DOUBLE PRECISION
  is_dttm: false
  is_active: true
  description: Effective current speed (units/min) — PLC MachSpeed tag, else inferred from counter throughput.
- column_name: plc_speed
  type: DOUBLE PRECISION
  is_dttm: false
  is_active: true
  description: Raw PLC MachSpeed tag (NULL/0 for machines without a speed sensor).
- column_name: ideal_production_speed
  type: INTEGER
  is_dttm: false
  is_active: true
  description: CSAdmin rated/target speed (equipments.production_speed) — the reference line.
- column_name: id_shift
  type: INTEGER
  is_dttm: false
  is_active: true
  groupby: true
  filterable: true
- column_name: id_production_order
  type: INTEGER
  is_dttm: false
  is_active: true
