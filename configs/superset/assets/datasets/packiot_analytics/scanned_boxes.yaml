  filterable: true
- column_name: scan_type
  type: VARCHAR
  is_dttm: false
  is_active: true
  groupby: true
  filterable: true
- column_name: label_seq
  type: INTEGER
  is_dttm: false
  is_active: true
- column_name: qty
