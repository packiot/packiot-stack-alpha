# bi.oee_hourly — curated hourly-grain OEE (source: equipment_runtime_1hour ⋈ equipments).
# The workhorse for trend charts. Buckets on ts_value (NOT `bucket`). gross/net, oee_a/p/q.
table_name: oee_hourly
main_dttm_col: ts_value
description: Hourly OEE + production. Trend workhorse (front4 productionChart / OEE trend).
default_endpoint: null
offset: 0
cache_timeout: null
catalog: null
schema: bi
sql: null
params: null
template_params: null
filter_select_enabled: true
fetch_values_predicate: null
extra: null
normalize_columns: false
always_filter_main_dttm: false
uuid: 8b1d0810-a0d1-4012-86a9-45c64c2e9154
metrics:
- metric_name: avg_oee
  verbose_name: OEE
  expression: AVG(oee)
  d3format: .1%
  extra: null
- metric_name: avg_oee_a
  verbose_name: Availability
  expression: AVG(oee_a)
  d3format: .1%
  extra: null
- metric_name: avg_oee_p
  verbose_name: Performance
  expression: AVG(oee_p)
  d3format: .1%
  extra: null
- metric_name: avg_oee_q
  verbose_name: Quality
  expression: AVG(oee_q)
  d3format: .1%
  extra: null
- metric_name: sum_net
  verbose_name: Net production
  expression: SUM(net)
  d3format: .3~s
  extra: null
- metric_name: sum_gross
  verbose_name: Gross production
  expression: SUM(gross)
  d3format: .3~s
  extra: null
- metric_name: sum_scrap
  verbose_name: Scrap
  expression: SUM(gross - net)
  d3format: .3~s
  extra: null
