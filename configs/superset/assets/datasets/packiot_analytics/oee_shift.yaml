# bi.oee_shift — curated shift-grain OEE (source: equipment_runtime_shift ⋈ equipments).
# Columns reconciled to the live F3 schema (PR #780 / fix/superset-golive-blockers):
#   oee_a/oee_p/oee_q (NOT oee_availability/…), gross/net (NO `count`),
#   ts_value/ts_end (NOT begin_time/end_time). Every row carries id_enterprise (RLS key).
table_name: oee_shift
main_dttm_col: ts_value
description: Shift-grain OEE, one row per equipment x shift. Headline self-service aggregate.
default_endpoint: null
offset: 0
cache_timeout: null
catalog: null
schema: bi
sql: null
params: null
template_params: null
filter_select_enabled: true
fetch_values_predicate: null
extra: null
normalize_columns: false
always_filter_main_dttm: false
uuid: 1546df03-4e11-40b8-94d7-aa149b12c58a
metrics:
- metric_name: avg_oee
  verbose_name: OEE
  metric_type: null
  expression: AVG(oee)
  description: Mean overall OEE (0-1 fraction; front4 shiftOee total).
  d3format: .1%
  currency: null
  warning_text: null
  extra: null
- metric_name: avg_oee_a
  verbose_name: Availability
  expression: AVG(oee_a)
  d3format: .1%
  description: front4 shiftOee Availability leg.
  extra: null
- metric_name: avg_oee_p
  verbose_name: Performance
  expression: AVG(oee_p)
  d3format: .1%
  description: front4 shiftOee Performance leg.
  extra: null
- metric_name: avg_oee_q
  verbose_name: Quality
  expression: AVG(oee_q)
  d3format: .1%
  description: front4 shiftOee Quality leg.
  extra: null
- metric_name: sum_net
  verbose_name: Net production
  expression: SUM(net)
  d3format: .3~s
  description: Good production (front4 shiftKpi net_production).
  extra: null
- metric_name: sum_gross
  verbose_name: Gross production
  expression: SUM(gross)
  d3format: .3~s
  description: Total production (front4 gross_production).
  extra: null
- metric_name: sum_scrap
  verbose_name: Scrap
  expression: SUM(gross - net)
  d3format: .3~s
  description: Derived scrap = gross - net (no native scrap column on the rollup).
  extra: null
- metric_name: sum_running_time
  verbose_name: Running time
  expression: SUM(running_time)
  d3format: .3~s
  extra: null
