metrics:
- metric_name: count
  verbose_name: Machines
  metric_type: count
  expression: COUNT(*)
  d3format: null
  extra: null
- metric_name: avg_speed
  verbose_name: Avg live speed
  expression: AVG(speed)
  d3format: .3~s
  extra: null
- metric_name: avg_ideal_speed
  verbose_name: Avg ideal speed
  expression: AVG(ideal_production_speed)
  d3format: .3~s
  extra: null
- metric_name: sum_net
  verbose_name: Net (last counter)
  expression: SUM(net_production_val)
  d3format: .3~s
  extra: null
