# bi.live_status — latest reading per equipment (source: DISTINCT ON equipment_values
# ⋈ equipments, last 6h). DATA-READY on CPACK. Replaces PowerBI RealTimeData /
# 13_OBD_MOBILE_direct_query live-status cards. One row per equipment.
table_name: live_status
main_dttm_col: last_update
description: Live machine status — latest speed/state/counts per equipment. PowerBI RealTimeData.
default_endpoint: null
offset: 0
cache_timeout: 30
catalog: null
schema: bi
sql: null
params: null
template_params: null
filter_select_enabled: true
fetch_values_predicate: null
extra: null
normalize_columns: false
always_filter_main_dttm: false
