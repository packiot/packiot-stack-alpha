# OEE Overview — the curated, embeddable replica of front4's Overview dashboards
# over the bi.* views. This is the dashboard edge-api mints a guest token FOR
# (SUPERSET_OEE_DASHBOARD_UUID / the language-specific *_EN uuid). Tenant isolation
# is NOT in this file: the id_enterprise filter is applied at view/author time by
# Superset RLS (guest-token clause for embed, role-bound filter for authoring).
#
# LAYOUT: a native "Time range" filter defaults the whole dashboard to the last
# 24 hours (was: no filter → charts aggregated all-time → nonsensical graphs), and
# the 12 tiles are split across TABS (OEE / Production / Downtimes / Orders) so each
# tab fits one screen instead of one long scroll. chartId integers are placeholders —
# charts bind by meta.uuid. The Portuguese sibling (oee_overview_pt.yaml) mirrors
# this structure with pt-BR labels; edge-api picks the variant per tenant language.
dashboard_title: OEE Overview
description: Curated OEE view replicating front4 Overview tiles over the bi.* curated views.
css: ''
slug: oee-overview
certified_by: null
certification_details: null
published: true
uuid: 6c4fa4a1-ddd2-4b4e-b5cb-4eb56bb30937
version: 1.0.0
metadata:
  color_scheme: supersetColors
  refresh_frequency: 60
  expanded_slices: {}
  label_colors: {}
  shared_label_colors: {}
  cross_filters_enabled: true
  default_filters: '{}'
  filter_scopes: {}
  chart_configuration: {}
  global_chart_configuration: {}
  # Dashboard-wide time fence. Default = "Last 24 hours" so every tile opens on a
  # rolling day (matches the legacy PowerBI _24h reports) instead of all-time.
  native_filter_configuration:
  - id: NATIVE_FILTER-time-range
    name: Time range
    filterType: filter_time
    type: NATIVE_FILTER
    targets:
    - {}
    controlValues: {}
    defaultDataMask:
      filterState:
        value: Last 24 hours
      extraFormData:
        time_range: Last 24 hours
    cascadeParentIds: []
    scope:
      rootPath:
      - ROOT_ID
      excluded: []
    requiredFirst: false
    tabsInScope: []
    chartsInScope: []
    description: ''
position:
  DASHBOARD_VERSION_KEY: v2
  ROOT_ID:
    type: ROOT
    id: ROOT_ID
    children:
    - GRID_ID
  GRID_ID:
