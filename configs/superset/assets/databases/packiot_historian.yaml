# Superset "database" = the read-only Athena connection to the raw-history
# HISTORIAN (S3 + Parquet, terraform/production/historian.tf). Superset/BI uses
# this for HISTORICAL dashboards over legacy `equipment_values` (2020→2026),
# which is too big/cold to live in the operational F3 DB.
#
# AUTH: NO static keys. The Superset EC2's instance role carries
# `packiot-production-superset-historian-reader` (historian.tf), so PyAthena
# authenticates via the standard AWS credential chain (instance profile). The
# sqlalchemy_uri therefore has an EMPTY user:pass — do NOT put keys here.
#
# DRIVER: requires `PyAthena[sqlalchemy]` in the Superset image
# (docker/superset — add to the image requirements on the superset branch; it is
# not on this branch yet, same cross-branch posture as superset.tf follow-ups).
#
# URI shape (awsathena+rest):
#   awsathena+rest://@athena.<region>.amazonaws.com:443/<glue_db>
#     ?s3_staging_dir=s3://<bucket>/athena-results/
#     &work_group=packiot_historian
#
# The glue db is `packiot_historian`; the workgroup enforces the result location
# and the 10 GB per-query scan guard, so s3_staging_dir is belt-and-suspenders.
database_name: packiot_historian
sqlalchemy_uri: awsathena+rest://@athena.us-east-1.amazonaws.com:443/packiot_historian?s3_staging_dir=s3%3A%2F%2Fpackiot-production-historian-639178078294%2Fathena-results%2F&work_group=packiot_historian
cache_timeout: null
expose_in_sqllab: true
allow_run_async: true
allow_ctas: false
allow_cvas: false
allow_dml: false
allow_file_upload: false
impersonate_user: false
extra: |
  {
    "allows_virtual_table_explore": true,
    "metadata_params": {},
    "engine_params": {"connect_args": {"work_group": "packiot_historian"}},
    "schemas_allowed_for_file_upload": [],
    "cost_estimate_enabled": true
  }
