# Superset "database" = the historian-gateway (pg_duckdb) connection.
# This is the HOT+COLD union gateway (services/historian-gateway/), SEPARATE from
# the packiot_analytics bi.* connection. Consumers query the single relation
# `ev_all` (live timescaledb via postgres_fdw UNION S3 Parquet historian) with
# plain SQL; old timestamps transparently resolve to S3 and prune to the relevant
# partition file.
#
# ── LIVE-FILL REQUIRED (password) ─────────────────────────────────────────────
# sqlalchemy_uri password is a PLACEHOLDER (YYYYYYYYYYYY — DISTINCT from the
# packiot_analytics XXXXXXXXXXXX so the two never collide). import_bundle.py must
# inject HIST_GW_PASSWORD here at import time (see the companion edit noted in the
# handoff: add a second (asset, env, placeholder) injection to import_bundle.py).
# The real value is HIST_GW_PASSWORD from Secrets Manager / .env — NEVER commit it.
#
# HOST: in-stack service name `hist-gateway` (compose.historian-gateway.yml,
# container_name: hist-gateway, on stack_packiot-net). Superset shares that network.
# dbname `postgres` (the gateway's default DB where ev_all / hist / hist_cutover live).
#
# ── RLS IS THE SOLE ENFORCER HERE (read this) ─────────────────────────────────
# Unlike packiot_analytics, this gateway has NO Postgres RLS co-enforcer: pg_duckdb
# ships the WHERE predicate into DuckDB, which has NO PG session context, so a
# current_setting('app.tenant_id') / GUC policy CANNOT bite on the cold path. The
# tenant filter MUST be a LITERAL. Superset native RLS (the guest-token clause
# `id_enterprise = <id>`, and any authoring base-RLS rule) injects that literal —
# and it is the ONLY thing isolating tenants on ev_all. Therefore:
#   * expose_in_sqllab MUST stay false — a SQL-Lab SELECT off ev_all would bypass
#     the dataset-scoped RLS entirely (there is no DB-layer net to catch it).
#   * allow_dml / allow_ctas / allow_cvas false — read-only gateway.
#   * every chart on ev_all MUST be reached via a guest token (auto: id_enterprise
#     clause, no dataset scope, applies to ev_all's id_enterprise column) or an
#     authoring role carrying the per-tenant base-RLS rule (see the dataset asset).
database_name: historian_union
sqlalchemy_uri: postgresql+psycopg2://postgres:YYYYYYYYYYYY@hist-gateway:5432/postgres
cache_timeout: null
expose_in_sqllab: false
allow_run_async: true
allow_ctas: false
allow_cvas: false
allow_dml: false
allow_file_upload: false
extra:
  allows_virtual_table_explore: true
  metadata_params: {}
  engine_params: {}
  schemas_allowed_for_file_upload: []
