# mosquitto.prod.conf — PRODUCTION-ONLY mosquitto config.
#
# WHY A SEPARATE FILE (not the shared configs/mosquitto/mosquitto.conf):
# the base conf is mounted by staging AND dev too, and neither has the mTLS
# certs on disk. A `listener 8883` with certfile/keyfile in the SHARED file would
# make mosquitto fail to start in those envs. So prod mounts THIS file instead
# (compose.production.yml), and staging/dev keep the base conf untouched.
# Keep the two listeners' shared knobs (persistence, packet size, logging) in
# sync with mosquitto.conf when either changes.
#
# TWO LISTENERS (ADR-0042 §6):
#   :1883  internal, plaintext, anonymous — the edge-transformer + oeecloud-worker
#          read here (127.0.0.1-bound in compose). Never crosses the WAN.
#   :8883  WAN mTLS — the factory-edge sparkplug-agent dials ssl://…:8883 and
#          presents a client cert (CN=<tenant>); mosquitto verifies it against the
#          client CA. Published spBv1.0/<tenant>/# lands in the SAME broker the
#          edge-transformer already subscribes to on :1883, so no bridge is needed.
#
# NOTE on mosquitto's POSITIONAL parsing: per-listener options must appear AFTER
# their `listener` line and before the next one. Globals are set first, below.

# ── Globals (apply to the whole broker) ──────────────────────────────────────
# Persistence (ADR-0011 P0-2): retained NBIRTHs survive a broker restart so a
# reconnecting consumer recovers its alias table instantly instead of waiting
# for the next NBIRTH (silent under-reporting during the gap).
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
persistent_client_expiration 1h

log_dest stdout
log_type warning
log_type error
log_type notice
log_type information

# ── Listener 1 — internal plaintext (the current behaviour) ──────────────────
listener 1883
allow_anonymous true
max_keepalive 3600
max_packet_size 65536

# ── Listener 2 — WAN mTLS SparkPlug uplink (ADR-0042 §6) ──────────────────────
# require_certificate forces the client to present a cert; cafile is the CA that
# must have signed it. allow_anonymous is explicitly off here so a caller with no
# (or an unsigned) cert is refused — cert auth is not optional on the WAN edge.
listener 8883
allow_anonymous false
require_certificate true
cafile /mosquitto/certs/client-ca.pem
certfile /mosquitto/certs/server-cert.pem
keyfile /mosquitto/certs/server-key.pem
# The verified client-cert CN becomes the MQTT username — the hook a future
# per-tenant ACL uses to scope spBv1.0/<CN>/# (not enforced yet; single-tenant +
# a /32 SG gate today). Documented as the next hardening step.
use_identity_as_username true
tls_version tlsv1.2
max_keepalive 3600
max_packet_size 65536
