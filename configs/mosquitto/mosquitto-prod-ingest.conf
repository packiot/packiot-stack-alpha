# mosquitto-prod-ingest.conf — the NEW-PRODUCTION mTLS SparkPlug ingest broker.
#
# This is the cloud LANDING ZONE for the client-edge sparkplug-agent uplink
# (client-edge bundle #624, ADR-0042 §6). It runs TWO listeners:
#
#   1883  internal (plaintext, docker edge-net only)  — edge-transformer consumes
#   8883  public mTLS (WAN crossing, per-tenant certs) — client agents publish
#
# Mount into the prod `mosquitto` service (compose.production.yml — W1 adds the
# service; this config + the ACL + the certs are its inputs). The App EC2 SG
# opens 8883 to the client egress /32 only (terraform/production/security_groups.tf);
# DNS ingest.prod.packiot.app → App EIP (dns.tf).
#
# ── The isolation invariant (ADR-0042 §6) ────────────────────────────────────
# "The client never spells its tenant on the wire; the mTLS CN does, and the
# broker ACL enforces it." A tenant that could name itself could impersonate
# another. Here: require_certificate forces a client cert on 8883,
# use_identity_as_username makes the cert CN the mosquitto username, and the ACL
# `pattern` scopes each username to spBv1.0/<CN>/# only.

# ── Internal listener (Tier-2 consume hop) ────────────────────────────────────
# Plaintext, bound to the docker network only (never published to the host WAN
# in compose). edge-transformer subscribes here. Anonymous — see the ACL note.
listener 1883
allow_anonymous true

# ── Public mTLS listener (the WAN crossing) ───────────────────────────────────
listener 8883

# Server identity presented to the client (so the agent can verify the broker).
# Default design: a single private "prod-ingest CA" signs BOTH this server cert
# and every per-tenant client cert (self-consistent with the agent's explicit
# uplink_ca ref). ALTERNATIVE: use the existing public wildcard *.prod.packiot.app
# cert here for the server leg (public trust) and keep `cafile` below as the
# private client-signing CA — see docs/ingestion/prod-ingest-cert-provisioning.md.
certfile /mosquitto/certs/server-cert.pem
keyfile  /mosquitto/certs/server-key.pem

# CA that signs CLIENT certs — mosquitto verifies presented client certs against
# this. This is the per-tenant client-cert-signing CA (the private "prod-ingest CA").
cafile /mosquitto/certs/ingest-ca.pem

# mTLS: demand a client cert and make the cert CN the username the ACL keys on.
require_certificate true
use_identity_as_username true

# Floor the TLS version — no legacy downgrade on a WAN-facing listener.
tls_version tlsv1.2

# ── ACL (CN-keyed tenant isolation) ───────────────────────────────────────────
acl_file /mosquitto/config/prod-ingest.acl

# ── Persistence (ADR-0011 P0-2) ───────────────────────────────────────────────
# Retained NBIRTHs survive a broker restart so reconnecting consumers recover
# their alias tables instantly instead of under-reporting during the gap.
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
persistent_client_expiration 1h

max_keepalive  3600
max_packet_size 65536

# ── Logging ───────────────────────────────────────────────────────────────────
log_dest stdout
log_type warning
log_type error
log_type notice
log_type information
