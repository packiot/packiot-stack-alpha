# Mosquitto broker configuration for the Packiot edge — factory-side MQTT.
#
# ADR-0011 rule 1 + P0-2: persistence is enabled so retained NBIRTHs survive
# broker restart. Without this, every consumer that reconnects after a
# Mosquitto restart has to wait for the next NBIRTH (up to several minutes)
# before its alias table is complete, silently under-reporting metrics
# during the gap.
#
# References:
#   - Sparkplug B spec (retained NBIRTH is the state-recovery mechanism)
#   - Mosquitto docs: https://mosquitto.org/man/mosquitto-conf-5.html
#
# Deploy locations:
#   - compose.staging.yml    (staging RabbitMQ-adjacent broker)
#   - compose.production.yml (per-factory broker, or cloud stand-in)
#   - compose.development.yml (local dev)

# ── Listener ─────────────────────────────────────────────────────────────────
# Standard MQTT 3.1.1/5.0 port. TLS (8883) is a follow-up P1 item — deployed
# staging is behind the AWS VPC so the WAN is already TLS-terminated at ALB
# ingress. Factory deployments will need TLS when Mosquitto is exposed to
# the OT network.
listener 1883

# ── Persistence (ADR-0011 P0-2 — the whole point of this config) ─────────────
# In-memory + on-disk state. Retained messages + queued messages for offline
# durable clients survive broker restart. Sparkplug uses clean-session=true
# so we don't get durable-queue benefit, but retained NBIRTHs still recover
# instantly, which is the load-bearing use case.
persistence true
persistence_location /mosquitto/data/

# Flush retained/queued messages every 30s. Trade-off: shorter = less
# data loss on unclean shutdown, but higher disk write pressure. 30s is
# the eclipse-mosquitto default and matches Sparkplug's typical NBIRTH cadence.
autosave_interval 30

# Discard state for clients that haven't connected in an hour. Prevents
# unbounded state growth on factory floors where PLCs come and go.
persistent_client_expiration 1h

# ── Auth ─────────────────────────────────────────────────────────────────────
# ADR-0011 P0-2 scope is persistence, NOT auth hardening. For dev + initial
# staging, anonymous access is allowed. Auth (username/password + ACL) is a
# follow-up item, tracked as ADR-0011 P0-2b in the phased rollout.
#
# TODO: switch to password file + ACL for staging/prod once we settle the
# credential-management approach (AWS Secrets Manager per-tenant vs shared).
allow_anonymous true

# ── Connection tuning ────────────────────────────────────────────────────────
# Sparkplug spec recommends KeepAlive 30s; the paho client in edge-transformer
# uses that default. Match it here — clients requesting higher get their
# request honored; lower is silently capped.
max_keepalive 3600

# Sparkplug DATA messages are typically 100-2000 bytes. Occasional NBIRTHs
# with N metrics can reach ~10 KB per publisher. Bound this to catch runaway
# metric-map bloat early.
#
# Mosquitto 2.x renamed `message_size_limit` → `max_packet_size`. We use the
# new name; the old one is silently deprecated but still accepted for now.
max_packet_size 65536

# ── Logging ──────────────────────────────────────────────────────────────────
# stdout so Docker/promtail can capture. Set to notice by default —
# information logs during PLC connect/disconnect are useful for operators.
log_dest stdout
log_type warning
log_type error
log_type notice
log_type information
