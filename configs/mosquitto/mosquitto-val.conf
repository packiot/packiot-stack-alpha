# Mosquitto config for the VALIDATION harness broker (ADR-0022 V1).
#
# This broker is the ingress for REAL Incoplast (enterprise 4) SparkPlug B
# data. An operator inserts an `mqtt out` tee node in the live Incoplast
# Node-RED (after PackML2SparkPlug / prepare_Sparkplug & DBIRTH / SparkPlug
# DDATA) that republishes DBIRTH + DDATA to this broker. edge-transformer-val
# subscribes and drives the standard pipeline into packiot_validation.
#
# TWO listeners, per_listener_settings so each has its own auth posture:
#
#   8883  TLS + password-file, PUBLISHED to the host (reachable from the
#         Incoplast factory over the internet). This is the ONLY externally
#         reachable listener. Never expose it without both TLS and auth.
#   1883  plain, INTERNAL ONLY — bound to packiot-val-net, NOT published to
#         the host. edge-transformer-val subscribes here. A message that
#         arrives on 8883 is delivered to subscribers on 1883 (same broker,
#         shared topic tree), so the internal consumer needs no TLS.
#
# ADR-0011 rule 1 + P0-2: persistence on so retained NBIRTH/DBIRTH survive a
# broker restart — the transformer needs the DBIRTH aliases before it can
# decode DDATA, and a retained DBIRTH recovers that instantly on reconnect.
#
# ── SECURITY / FILL AT DEPLOY ────────────────────────────────────────────────
# The passwd file and TLS material are secrets and are NOT in git. Provision
# them on the app EC2 host before `docker compose -f compose.validation.yml
# up -d` and bind-mount them (see compose.validation.yml mosquitto-val):
#   /opt/packiot/mosquitto-val/passwd            (mosquitto_passwd -c ... incoplast)
#   /opt/packiot/mosquitto-val/certs/ca.crt      # FILL AT DEPLOY
#   /opt/packiot/mosquitto-val/certs/server.crt  # FILL AT DEPLOY
#   /opt/packiot/mosquitto-val/certs/server.key  # FILL AT DEPLOY
# See docs/adr/reference/0022-validation-harness-runbook.md §"Operator tee".

per_listener_settings true

# ── Internal listener (1883) — packiot-val-net only, NOT host-published ──────
listener 1883
allow_anonymous true

# ── External TLS listener (8883) — the Incoplast tee ingress ─────────────────
listener 8883
allow_anonymous false
password_file /mosquitto/config/passwd
# TLS — mutual not required; server-auth + password is the V1 posture.
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
tls_version tlsv1.2

# ── Persistence (ADR-0011 P0-2) ──────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
persistent_client_expiration 1h

# ── Connection tuning (matches configs/mosquitto/mosquitto.conf) ─────────────
max_keepalive 3600
max_packet_size 65536

# ── Logging ──────────────────────────────────────────────────────────────────
log_dest stdout
log_type warning
log_type error
log_type notice
log_type information
