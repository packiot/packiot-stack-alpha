# dev/seed/manifest.yml — ADR-0060 D4/D5. EVERY base table in packiot_analytics must be listed (validate.py
# fails on an unlisted table: fail-closed at table level). Modes:
#   rows        COPY (SELECT … WHERE <where>) — then column classification (classification.yml) applies
#   full        all rows (global reference data, no tenant) — classification still applies
#   replace     rows generated synthetically at load (never extracted)
#   schema_only table created from the schema dump, no rows
# Parameters bound at extract time: :tenant (enterprise id), :since (snapshot_end - 7 days).
# Views, matviews and continuous aggregates come from the schema dump; caggs are refreshed after load.
tenant: 3
window_days: 7
tables:
  bronze.box_scans: {mode: rows, where: "id_enterprise = :tenant AND ts_value >= :since"}
  bronze.equipment_events_raw: {mode: rows, where: "id_enterprise = :tenant AND (ts_event >= :since OR ts_end IS NULL OR ts_end >= :since)"}
  bronze.equipment_values_raw: {mode: rows, where: "id_enterprise = :tenant AND ts_value >= :since"}
  bronze.sample_boxes: {mode: rows, where: "id_enterprise = :tenant AND ts_value >= :since"}
