# ── csadmin (Tier 4) — ADR-0060 P4 ───────────────────────────────────────────
# contract (contracts/ui-services.md §csadmin):
#   inputs:   edge-api /api/* (Bearer = Cognito ID token, forwarded unchanged by the image's nginx);
#             read-api /v1/* via the network alias refdata-api:9104
#   outputs:  SPA + same-origin proxy on http://127.0.0.1:8084
#   external: dev Cognito pool (Amplify login in the browser, internet). The dev pool has no `cs-admin` group yet
#             (contracts.md F12): a dev user logs in as a tenant-3 user; CS-Admin routes are refused.
# Mirrors compose.staging.yml `csadmin`: same Dockerfile.staging + nginx template; only the baked Cognito ids differ
# (VITE_* are compile-time — change them and rebuild: `docker compose … up -d --build csadmin`).
# Static build, no hot reload: for UI work run `npm run dev` in csadmin/ against this slice's edge-api.
services:
  csadmin:
    build:
      context: ../../csadmin
      dockerfile: Dockerfile.staging
      args:
        VITE_AUTH_COGNITO_ENABLED: "true"
        VITE_COGNITO_USER_POOL_ID: ${DEV_COGNITO_USER_POOL_ID:?set in dev/.env.dev}
        VITE_COGNITO_CLIENT_ID: ${DEV_COGNITO_CLIENT_ID:?set in dev/.env.dev}
    depends_on:
      edge-api:
        condition: service_healthy
      read-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DEV_CSADMIN_PORT:-8084}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "4", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 10s
