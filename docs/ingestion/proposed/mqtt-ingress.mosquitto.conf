# PROPOSAL — edge-facing Mosquitto broker ("mqtt-ingress") for ADR-0032 Path B.
# NOT wired into any compose file. NOT applied. Design reference only.
# See docs/ingestion/mqtt-ingress-design.md §2 (topology) + §3 (security).
#
# This broker owns the ONLY public MQTT listener. It authenticates each tenant
# via mTLS, ACL-scopes them to their own SparkPlug group, and one-way-bridges
# inbound DATA topics into the internal broker that edge-transformer consumes.

# ── Public TLS listener (mTLS) ────────────────────────────────────────────────
listener 8883
protocol mqtt

# Server identity + client-cert trust (self-managed CA — see design §3.2).
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key

tls_version tlsv1.2

# mTLS: every client MUST present a cert signed by our CA. The cert CN becomes
# the username, which the ACL keys on — identity + transport + ACL key in one
# artifact, nothing bearer-shaped on the wire (design §3.3, A4).
require_certificate true
use_identity_as_username true

# No anonymous access on a public listener (design §3.1 A1).
allow_anonymous false

# ── ACL — per-tenant topic scoping (design §3.1 A2/A3) ────────────────────────
acl_file /mosquitto/config/mqtt-ingress.acl

# ── Resource limits (design §3.1 A5/A6) ───────────────────────────────────────
max_connections 50
max_inflight_messages 20
max_queued_messages 1000
max_keepalive 3600
max_packet_size 65536

# ── One-way bridge into the internal broker (design §2b) ──────────────────────
# Forwards inbound DATA topics ONLY, edge → internal. `in` = we only pull FROM
# nothing; clients PUBLISH to us and we push those DATA topics into internal.
# NOTE: `topic <pat> in` on a bridge means "subscribe on the remote and
# republish locally". For an ingress broker we instead publish edge→internal;
# express as `out` from the edge broker's perspective, DATA topics only. Command
# topics (DCMD/NCMD) are deliberately NOT bridged (design §3.1 A3).
connection bridge-to-internal
address mosquitto:1883
bridge_protocol_version mqttv311
cleansession true
notifications false
start_type automatic
restart_timeout 5

# DATA message types only — one topic line per type keeps DCMD/NCMD off the bridge.
topic spBv1.0/+/NBIRTH/#  out 0
topic spBv1.0/+/NDATA/#   out 0
topic spBv1.0/+/NDEATH/#  out 0
topic spBv1.0/+/DBIRTH/#  out 0
topic spBv1.0/+/DDATA/#   out 0
topic spBv1.0/+/DDEATH/#  out 0
# (DCMD / NCMD intentionally absent — never forward a machine-command topic.)

# ── Persistence (retained NBIRTH survival — matches internal broker) ──────────
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
persistent_client_expiration 1h

# ── Logging ───────────────────────────────────────────────────────────────────
log_dest stdout
log_type warning
log_type error
log_type notice
log_type information
