# ── agent wiring (→ client.yaml, the agentcfg descriptor) ─────────────────────
agent:
  edge_node_id: cpack-tee              # DISTINCT from plc-sim's edge node
  internal_broker: tcp://mosquitto:1883
  raw_topic: edge/raw/cpack/#
  uplink_broker: ssl://ingest.prod.packiot.app:8883
  mtls:                                # Mode-B mTLS CN=<tenant>; secret refs, never values
    cert_ref: ""
    key_ref: ""
    ca_ref: ""

# ── Node-RED tee snippet parameters (→ cpack-tee-node.json) ───────────────────
tee:
  ingest_url: "https://ec2-100-28-20-195.compute-1.amazonaws.com:8446/ingest/sparkplug"
  ingest_key_env: CPACK_INGEST_KEY     # tee reads the key from env, never hardcoded
  gateway: cpack-edge
  tls_insecure: true                   # staging self-signed
