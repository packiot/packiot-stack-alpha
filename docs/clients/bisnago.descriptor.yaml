# ── agent wiring (→ bisnago-agent.yaml) ───────────────────────────────────────
# NEEDS-DECISION (edge shape): the legacy flow ran on a Raspberry Pi reading 7 S7
# PLCs → PubSub. On the new stack bisnago becomes EITHER a rebuilt tee OR our
# client-edge container reading the same 7 S7 endpoints. Either way the raw
# envelope carries {counter_id, value} and the STACK synthesizes canonical topics.
# Broker/topic below are the staging loopback defaults; mTLS refs empty on staging.
agent:
  edge_node_id: bisnago-tee            # DISTINCT from bispharma-tee + plc-sim + every other tenant
  internal_broker: tcp://mosquitto:1883
  raw_topic: edge/raw/bisnago/#
  uplink_broker: tcp://mosquitto:1883
  mtls:
    cert_ref: ""
    key_ref: ""
    ca_ref: ""

# ── Node-RED tee / client-edge forwarder parameters (→ bisnago-tee-node.json) ──
# The tee is a DUMB forwarder of counterData[{id,value}] — the stack-side
# translation layer (internal/agent/numeric, POST /v1/counters) does the id →
# canonical-topic mapping. ingest_url is the staging front-door TBD (tenant-prep).
tee:
  ingest_url: "https://TODO-staging-ingest-front-door:9104/v1/counters"  # TODO(tenant-prep)
  ingest_key_env: BISNAGO_INGEST_KEY
  gateway: bisnago-edge
  tls_insecure: true                   # staging self-signed
