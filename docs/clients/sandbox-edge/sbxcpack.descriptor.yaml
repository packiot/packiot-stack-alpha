# sbxcpack.descriptor.yaml — SANDBOX-CPACK edge descriptor (SBXCPACK, ent 2000003).
#
# WHAT THIS IS
# ------------
# The onboard-gen SSoT for a SEVERED replica of the real CPACK edge box. It is a
# transform of docs/clients/cpack.descriptor.yaml (the real CPACK worked example)
# with the SparkPlug identity + data path deliberately CUT so the replica can be
# run on the staging sandbox VM (mi-0114b66366e2d6613) and PROVABLY cannot write
# to real CPACK. Generate the bundle the SAME way as any client:
#
#   go run ./services/edge-transformer/cmd/onboard-gen \
#       --descriptor docs/clients/sandbox-edge/sbxcpack.descriptor.yaml --out <dir>/
#
# SEVERANCE BAKED INTO THIS DESCRIPTOR (see scripts/provision-cpack-replica-sandbox.sh
# and docs/clients/sandbox-edge/compose.replica.yml for the network + cert cuts):
#   • tenant SBXCPACK (group_id) + prefix SBXCPACK/SC — a DISTINCT topic namespace
#     that matches NO row in the real CPACK packml_register, so even a leaked
#     payload resolves to nothing on the cloud side.
#   • enterprise_id 2000003 — the sandbox tenant, never ent 1 (prod) or 3 (staging CPACK).
#   • uplink_broker = internal loopback (Mode-A), tee ingest_url = a .invalid blackhole.
#   • the cert CN is sbxcpack (minted by the provision script from a THROWAWAY
#     sandbox CA — never the real Packiot Edge Uplink CA), so the real broker ACL
#     would reject it even if the network sever failed.
#
tenant: SBXCPACK
enterprise_id: 2000003                       # staging CPACK (prod=1); register cross-tenant guard

canonical:
  prefix: SBXCPACK/SC                     # tenant_prefix — the canonical (post-fixup) head

# ── raw → canonical mapping (the per-client quirks, normalized STACK-SIDE in the
#    agent profile per ADR-0045 §2.3 Option B) ─────────────────────────────────
mapping:
  count_index_default_mode: equipment_id   # fallback for any un-captured member
  prefix_fixups:
    - {from: "C-PACK/", to: "SBXCPACK/"}                        # real PLC head → canonical
  metric_aliases:
    - {from: "Status/CurMachSpeed", to: "Status/MachSpeed"} # real prod leaf (#590) → Calc input
  parameter_aliases:
    - {from: "Status/Parameter", to: "Status/Parameter30700", applies_to: line}
  # parameter_decomposition: (ADR-0044) — the id-driven path for tenants whose
  # bare Status/Parameter carries MANY params over time. CPACK's hand profile
  # uses the single parameter_aliases rename above; decomposition is the
  # forward direction (#602). Left empty here to match the equivalence target.

# ── line-vs-member canonical metric templates (superset allowlist) ────────────
metric_templates:
  line:
    - {leaf: "/Admin/ProdConsumedCount", type: double}
    - {leaf: "/Admin/ProdProcessedCount", type: double}
    - {leaf: "/Admin/ProdDefectiveCount", type: double}
    - {leaf: "/Status/MachSpeed", type: double}
    - {leaf: "/Status/StateCurrent", type: long}
    - {leaf: "/Status/Parameter30700", type: string}
  member:
    - {leaf: "/Admin/ProdConsumedCount/{idx}/Unit", type: double}
    - {leaf: "/Admin/ProdProcessedCount/{idx}/Unit", type: double}
    - {leaf: "/Admin/ProdDefectiveCount/{idx}/Unit", type: double}
    - {leaf: "/Status/MachSpeed", type: double}
    - {leaf: "/Status/StateCurrent", type: long}

