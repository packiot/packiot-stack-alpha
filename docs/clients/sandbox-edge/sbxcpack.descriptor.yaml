# ── agent wiring (→ client.yaml, the agentcfg descriptor) ─────────────────────
agent:
  edge_node_id: sbxcpack-tee              # DISTINCT from plc-sim's edge node
  internal_broker: tcp://mosquitto:1883
  raw_topic: edge/raw/sbxcpack/#
  # SEVERANCE L2 (data OUT): uplink stays on the INTERNAL loopback broker
  # (Mode-A), so the SparkPlug session terminates INSIDE the box and never
  # crosses the WAN. Never set this to ssl://ingest.prod.* on the sandbox.
  uplink_broker: tcp://mosquitto:1883
  mtls:                                # Mode-B mTLS CN=<tenant>; secret refs, never values
    cert_ref: ""
    key_ref: ""
    ca_ref: ""

# ── Node-RED tee snippet parameters (→ sbxcpack-tee-node.json) ────────────────
# SEVERANCE L2 (data OUT): the tee target is a BLACKHOLE, never the real ingest.
# `.invalid` is reserved by RFC 6761 and can NEVER resolve, so even if this file
# were used verbatim the tee could not POST anywhere real.
tee:
  ingest_url: "https://sbx-blackhole.invalid:8446/ingest/sparkplug"
  ingest_key_env: SBXCPACK_INGEST_KEY   # tee reads the key from env, never hardcoded
  gateway: sbxcpack-edge
  tls_insecure: true                    # sandbox self-signed
