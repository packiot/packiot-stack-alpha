# Sandbox edge stack for CPACK-Sandbox (enterprise 2000003).
# A safe, self-contained mock of a client factory box so CS engineers can
# exercise Box Ops (health · logs · restart · deploy · connect) end-to-end
# without touching a real client. All public images; runs in the dind sandbox
# box. Box Ops "Deploy" re-runs `docker compose -f compose.edge.yml up -d` here.
name: sandbox-edge
services:
  edge-nodered:
    image: nodered/node-red:4.0
    container_name: edge-nodered
    restart: unless-stopped
    ports:
      - "1880:1880"   # the Connect / port-forward target (like a real edge)

  plc-reader:
    image: alpine:3.20
    container_name: plc-reader
    restart: unless-stopped
    command:
      - sh
      - -c
      - 'i=0; while true; do i=$$((i+1)); echo "$$(date -u +%FT%TZ) [plc-reader] line=L1 machine=CER400 counter=$$i status=running"; sleep 5; done'

  edge-cache:
    image: redis:7-alpine
    container_name: edge-cache
    restart: unless-stopped
