# mosquitto.conf — INTERNAL loopback bus for the Mode-B edge (ADR-0042 §2.3).
#
# This broker carries ONLY the Tier-1 → Tier-2 raw-tag hop, on the edge-net
# bridge network. It never faces the WAN and never carries spBv1.0/* (the agent
# publishes SparkPlug over mTLS straight to the cloud, not through here). So it
# is deliberately unauthenticated + plaintext: there is no cross-tenant traffic
# and no untrusted client on this network. mTLS + ACLs live at the WAN crossing.

listener 1883
allow_anonymous true

# Persistence so retained messages survive a broker restart (ADR-0011 P0-2).
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Keep the container log terse; docker captures stdout.
log_dest stdout
log_type warning
log_type error
connection_messages false
