  # ── modbus_tag_map (LINHAS/L6 — Modbus TCP source, endpoint PLC_L6) ───────────
  # Traced from the legacy flow: two modbus-read nodes on modbus-client "PLC_L6"
  # (unit 1, :502) — "L6 Read Counters" (HoldingRegister, adr 0, qty 80) and
  # "L6 Input Registers" (InputRegister, adr 0, qty 110) — BOTH wire into ONE
  # function "Prepare L6", which decodes 32-bit counters as reg[n+1]<<16 | reg[n]
  # (first register = LOW word ⇒ CDAB ⇒ word_swap: true; type uint32 totalizer).
  # The generic counter tags are then bound to canonical topics by the downstream
  # "PackML device config" function's tag→topic table. Register offset → member:
  #   counter  regs 60,61  → L6/BREYER   ProdConsumedCount/91
  #   counter3 regs 10,11  → L6/POLYTYPE ProdConsumedCount/93
  #   counter6 regs 100,101→ L6/PTH      ProdConsumedCount/95   (offset >79 ⇒ INPUT block; holding qty 80 can't serve it)
  #   counter4 regs 50,51  → L6/PTH      ProdProcessedCount/95  AND  L6/RMH ProdConsumedCount/94  (one register feeds two metrics — faithful to the flow's fan-out)
  #   counter2 regs 0,1    → L6/RMH ProdProcessedCount/94  AND  L6/TEXA ProdConsumedCount/92  AND  L6/TEXA ProdProcessedCount/92
  #
  # KIND (holding vs input) — the ONE residual: "Prepare L6" is source-agnostic
  # (it reads msg.payload[n] regardless of which read fired), so for offsets ≤79 the
  # value could come from EITHER block. Assigned holding for 0..61 (the node is
  # literally named "L6 Read Counters" = HoldingRegister, and qty 80 covers them)
  # and input for 100,101 (forced — beyond the 80-register holding block). If a live
  # tee shows the low-offset counters actually track the Input block, flip their kind.
  modbus_tag_map:
    - endpoint: PLC_L6
      packml_topic: CPACK/SC/LINHAS/L6/BREYER
      id_equipment: 68
      tags:
        - metric: /Admin/ProdConsumedCount/91/Unit    # counter  regs 60,61
          counter_derive: outfeed_only
          kind: holding
          address: 60
          type: uint32
          word_swap: true
    - endpoint: PLC_L6
      packml_topic: CPACK/SC/LINHAS/L6/POLYTYPE
      id_equipment: 70
      tags:
        - metric: /Admin/ProdConsumedCount/93/Unit    # counter3 regs 10,11
          counter_derive: outfeed_only
          kind: holding
          address: 10
          type: uint32
          word_swap: true
    - endpoint: PLC_L6
      packml_topic: CPACK/SC/LINHAS/L6/PTH
      id_equipment: 72
      tags:
        - metric: /Admin/ProdConsumedCount/95/Unit    # counter6 regs 100,101 (INPUT)
          kind: input
          address: 100
          type: uint32
          word_swap: true
        - metric: /Admin/ProdProcessedCount/95/Unit   # counter4 regs 50,51
          counter_derive: scrap_derived
          kind: holding
          address: 50
          type: uint32
          word_swap: true
    - endpoint: PLC_L6
      packml_topic: CPACK/SC/LINHAS/L6/RMH
      id_equipment: 71
      tags:
        - metric: /Admin/ProdConsumedCount/94/Unit    # counter4 regs 50,51 (same register as PTH ProdProcessed — flow fan-out)
          kind: holding
          address: 50
          type: uint32
          word_swap: true
        - metric: /Admin/ProdProcessedCount/94/Unit   # counter2 regs 0,1
          counter_derive: scrap_derived
          kind: holding
          address: 0
          type: uint32
          word_swap: true
    - endpoint: PLC_L6
      packml_topic: CPACK/SC/LINHAS/L6/TEXA
      id_equipment: 69
      tags:
        - metric: /Admin/ProdConsumedCount/92/Unit    # counter2 regs 0,1 (same register as RMH ProdProcessed + TEXA ProdProcessed)
          kind: holding
          address: 0
          type: uint32
          word_swap: true
        - metric: /Admin/ProdProcessedCount/92/Unit   # counter2 regs 0,1 (gross==net on same register — flow oddity, faithful)
          counter_derive: scrap_derived
          kind: holding
          address: 0
          type: uint32
          word_swap: true

