# ── PLC addressing (→ client.yaml, the Go s7/modbus/opcua readers' config) ──────
# Lifted MECHANICALLY from the legacy CPACK Node-RED flow by cmd/onboard-import
# (ADR-0045 P2). Hosts are secret:// refs (real IPs live in Secrets Manager, never
# committed). 23 S7 tags across 6 endpoints resolved from canonical vartable names;
# the S7 115/116/L5 bare-number count-indices + the L6 Modbus block reads remain
# TODO skeletons (need the count-index capture + the L6 function-node register map).
plc:
  endpoints:
    - name: PLC_L6
      protocol: modbus_tcp
      host_ref: secret://packiot/staging/cpack/plc-l6-host
      unit_id: 1
    - name: S7 115
      protocol: s7
      host_ref: secret://packiot/staging/cpack/s7-115-host
      rack: 0
      slot: 2
    - name: S7 116
      protocol: s7
      host_ref: secret://packiot/staging/cpack/s7-116-host
      rack: 0
      slot: 2
    - name: S7 L5
      protocol: s7
      host_ref: secret://packiot/staging/cpack/s7-l5-host
      rack: 0
      slot: 2
    - name: S7 S8
      protocol: s7
      host_ref: secret://packiot/staging/cpack/s7-s8-host
      rack: 0
      slot: 2
    - name: PLC Flexo
      protocol: s7
      host_ref: secret://packiot/staging/cpack/plc-flexo-host
      rack: 0
      slot: 2
    - name: S7 L10
      protocol: s7
      host_ref: secret://packiot/staging/cpack/s7-l10-host
      rack: 0
      slot: 1
    - name: PLC L4
      protocol: s7
      host_ref: secret://packiot/staging/cpack/plc-l4-host
      rack: 1
      slot: 2
    - name: PLC L3
      protocol: s7
      host_ref: secret://packiot/staging/cpack/plc-l3-host
      rack: 0
      slot: 2
    - name: SLEEVES
      protocol: s7
      host_ref: secret://packiot/staging/cpack/sleeves-host
      rack: 0
      slot: 2
    # OPC-UA endpoint for CELULA9/FLEXO (L9). The legacy flow's OpcUa-Endpoint node
    # (opc.tcp://…:4840) sets secpol/secmode=None and login=false — NO credentials —
    # so there is no username/password to carry (the endpoint auth is anonymous). URL
    # is a secret:// ref; real value lives in Secrets Manager, never committed.
    - name: OPC UA L9 FLEXO
      protocol: opcua
      endpoint_url_ref: secret://packiot/staging/cpack/opcua-l9-flexo-url
      security_policy: None
      security_mode: None
  s7_tag_map:
    - endpoint: PLC Flexo
      packml_topic: CPACK/SC/CELULA9/FLEXO/FLEXO
      id_equipment: 104
      tags:
        - { metric: /Status/MachSpeed, db: 1, offset: 50, type: int }
    - endpoint: PLC L3
      packml_topic: CPACK/SC/LINHAS/L3/BREYER
      id_equipment: 58
      tags:
        - { metric: /Admin/ProdProcessedCount/76/Unit, db: 1, offset: 0, type: dint, counter_derive: infeed_only }   # 2026-08-26 REVERT of #909 flip: DB1,DINT0 is BREYER's ProdProcessedCount per the legacy/oracle reader (:1881). #909 relabelled it ProdConsumedCount/76 = the L3 line INFEED meter → the live-climbing register phantomed the line gross (~44k on a day the oracle L3 was idle). L3 line gross remains a KNOWN faithful gap (BREYER's real gross register is not mapped by the generated reader) — do NOT re-flip. See cpack-legacy-oracle-line-meters.md §L3 phantom.
    - endpoint: PLC L3
      packml_topic: CPACK/SC/LINHAS/L3/POLYTYPE
      id_equipment: 62
      tags:
        - { metric: /Admin/ProdConsumedCount/82/Unit, db: 1, offset: 20, type: dint, counter_derive: outfeed_only }
    - endpoint: PLC L3
      packml_topic: CPACK/SC/LINHAS/L3/PTH
      id_equipment: 61
      tags:
        - { metric: /Admin/ProdConsumedCount/81/Unit, db: 1, offset: 4, type: dint }
        - { metric: /Admin/ProdProcessedCount/81/Unit, db: 1, offset: 32, type: int, counter_derive: scrap_derived }
    - endpoint: PLC L3
      packml_topic: CPACK/SC/LINHAS/L3/RMH
      id_equipment: 59
      tags:
        - { metric: /Admin/ProdConsumedCount/79/Unit, db: 1, offset: 24, type: dint, counter_derive: outfeed_only }
    - endpoint: PLC L3
      packml_topic: CPACK/SC/LINHAS/L3/TEXA
      id_equipment: 60
      tags:
        - { metric: /Admin/ProdConsumedCount/80/Unit, db: 1, offset: 28, type: dint, counter_derive: outfeed_only }   # 2026-08-26 REVERT of #909 flip: DB1,DINT28 is TEXA's ProdConsumedCount per the legacy/oracle reader (:1881). Restores the pre-#909 mapping that matched the oracle (no L3 phantom).
    - endpoint: PLC L4
      packml_topic: CPACK/SC/LINHAS/L4/BREYER
      id_equipment: 66
      tags:
        - { metric: /Admin/ProdConsumedCount/6/Unit, db: 1, offset: 0, type: dint, counter_derive: outfeed_only }
