# cpack.descriptor.yaml — CPACK CLIENT DESCRIPTOR (ADR-0045 P1, the SSoT).
#
# WHAT THIS IS
# ------------
# The ONE artifact a Customer Success engineer authors to onboard CPACK. From
# this single descriptor the onboard generator (cmd/onboard-gen) emits all four
# downstream artifacts — hand-editing none of them (ADR-0045 §2.2 "generate,
# never hand-edit"):
#
#   1. tenant conversion profile   → docs/clients/cpack-full-profile.yaml
#      (the #593/ADR-0043 tenantprofile schema: prefix/alias/param/count-index)
#   2. packml_register INSERT SQL  → topic ↔ id_equipment rows (62 equipment)
#   3. agent client.yaml           → the agentcfg descriptor (sparkplug identity,
#      brokers, mTLS CN, register-derived raw_tag_map)
#   4. Node-RED tee snippet        → the Tier-1 raw forwarder (ADR-0042 §2.3)
#
# It is the CPACK worked example that ADR-0045 §2.5 maps to the onboarding flow:
# describe (this file) → generate → capture → validate → cut over. It is proven
# EQUIVALENT to the hand-built cpack-full-profile.yaml by the generator's golden
# test (clientdescriptor_test.go) — the ADR-0045 P1 acceptance gate.
#
# THE CONFIRMED-vs-INFERRED DISCIPLINE (ADR-0045 §2.4b, the load-bearing rule)
# ---------------------------------------------------------------------------
# A member's count index (…/ProdProcessedCount/<IDX>/Unit) is an ARBITRARY PLC
# channel number, NOT derivable from any table (#601: BREYER1→26 while its id is
# 340; L4 uses a 6/7/8/9 series). It is captured from a live tee, member by
# member, and tagged confidence: confirmed | inferred. The generator REFUSES to
# emit a cutover-ready config while any inferred index remains (--cutover) — no
# tenant cuts over on inferred data. CPACK currently carries 20 inferred members
# (L8/L10/SLEEVE + most CELULA), so cutover generation fails until the CAPTURE
# step (P3) confirms them. Draft/observe generation (default) emits everything.

tenant: CPACK
enterprise_id: 3                       # staging CPACK (prod=1); register cross-tenant guard

canonical:
  prefix: CPACK/SC                     # tenant_prefix — the canonical (post-fixup) head

# ── raw → canonical mapping (the per-client quirks, normalized STACK-SIDE in the
#    agent profile per ADR-0045 §2.3 Option B) ─────────────────────────────────
mapping:
  count_index_default_mode: equipment_id   # fallback for any un-captured member
  prefix_fixups:
    - {from: "C-PACK/", to: "CPACK/"}                        # real PLC head → canonical
  metric_aliases:
    - {from: "Status/CurMachSpeed", to: "Status/MachSpeed"} # real prod leaf (#590) → Calc input
  parameter_aliases:
    - {from: "Status/Parameter", to: "Status/Parameter30700", applies_to: line}
  # parameter_decomposition: (ADR-0044) — the id-driven path for tenants whose
  # bare Status/Parameter carries MANY params over time. CPACK's hand profile
  # uses the single parameter_aliases rename above; decomposition is the
  # forward direction (#602). Left empty here to match the equivalence target.

# ── line-vs-member canonical metric templates (superset allowlist) ────────────
metric_templates:
  line:
    - {leaf: "/Admin/ProdConsumedCount", type: double}
    - {leaf: "/Admin/ProdProcessedCount", type: double}
    - {leaf: "/Admin/ProdDefectiveCount", type: double}
    - {leaf: "/Status/MachSpeed", type: double}
    - {leaf: "/Status/StateCurrent", type: long}
    - {leaf: "/Status/Parameter30700", type: string}
  member:
    - {leaf: "/Admin/ProdConsumedCount/{idx}/Unit", type: double}
    - {leaf: "/Admin/ProdProcessedCount/{idx}/Unit", type: double}
    - {leaf: "/Admin/ProdDefectiveCount/{idx}/Unit", type: double}
    - {leaf: "/Status/MachSpeed", type: double}
    - {leaf: "/Status/StateCurrent", type: long}

