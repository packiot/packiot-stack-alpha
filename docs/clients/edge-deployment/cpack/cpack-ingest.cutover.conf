
server {
    listen 8447 ssl;
    server_name cpack-ingest.staging.packiot.app;
    ssl_certificate     /etc/letsencrypt/live/staging.packiot.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.packiot.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    location = /v1/tags { return 444; }
    location = /v2/tags {
        mirror /_sbx_tags_mirror;
        mirror_request_body on;
        proxy_pass       http://172.18.0.38:9104/v1/tags;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
    # Fire-and-forget copy of the real PLC stream to the SANDBOX agent (SBXCPACK
    # tenant, same ingest key). Failures never affect the primary CPACK ingest.
    location = /_sbx_tags_mirror {
        internal;
        proxy_pass       http://172.18.0.4:9104/v1/tags;
        proxy_set_header X-Ingest-Key $http_x_ingest_key;
        proxy_set_header Content-Type application/json;
        proxy_read_timeout 10s;
    }
}



