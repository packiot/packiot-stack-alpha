# cpack-agent.twin.yaml — CLOUD TWIN variant of the #907 factory agent map.
# IDENTICAL raw_tag_map (330 entries: correct L4 count-indices 6/7/8/9/10,
# full /LINHAS + CELULA/SLEEVE/FLEXO coverage) but the sparkplug UPLINK is
# repointed from the factory prod mTLS (ssl://ingest.prod:8883) to the cloud
# staging INTERNAL mosquitto (tcp://mosquitto:1883) so the cloud decoder writes
# F3 ent-3. Deploy as sparkplug-agent-cpack /etc/packiot/agent.yaml for the
# Phase-2 twin re-point. See cpack-twin-repoint-phase2-execution.md.

sparkplug:
    group_id: CPACK
    edge_node_id: cpack-tee
    packml_topic: CPACK/SC
    internal_broker: tcp://mosquitto:1883
    raw_topic: edge/raw/cpack/#
    # Mode-B WAN uplink (ADR-0042 §6): real SparkPlug B over mTLS to the new-prod
    # mosquitto :8883 listener. ssl:// + the AGENT_UPLINK_TLS_* env files (mounted
    # from CERTS_DIR by compose.edge.yml) trigger mTLS. The dialed host is the
    # stable, IP-decoupled ingest name (terraform var.ingest_subdomain →
    # ingest.prod.packiot.app → app EIP); the server cert SAN matches it.
    uplink_broker: tcp://mosquitto:1883
    # secret:// REFERENCES only (agentcfg rejects inline PEM). Resolved out of band
    # into the CERTS_DIR files at deploy; the agent reads the FILES via env, not these.
    uplink_tls_cert_ref: ""
    uplink_tls_key_ref: ""
    uplink_ca_ref: ""
