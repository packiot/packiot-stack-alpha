# _normalized-payload-schema.yaml — Contract for the RabbitMQ exchange
# `plc.normalized.<tenant>` between Node-RED and `edge-transformer` (Go).
#
# This file is the SINGLE SOURCE OF TRUTH for what Node-RED publishes and
# what the Go transformer consumes. Schema changes are coordinated via the
# versioning policy at the bottom.
#
# Companion artifacts:
#   - docs/clients/_schema.yaml             — per-customer client.yaml schema
#   - docs/adr/0009-edge-transformer-*.md   — architectural rationale
#   - docs/edge-nodered-customization-shapes.md — why this schema looks like this
#
# Status: Proposed (v1.0). Reviewed alongside ADR-0009.
#
# ⚠ PARTIALLY SUPERSEDED BY ADR-0010 (2026-07-07 note): the ingest
# TOPOLOGY described here (Node-RED publishes → edge-transformer
# consumes `edge.plc-normalized.<tenant>`) is the superseded ADR-0009
# Phase-2 shape. Post-ADR-0010 (10.9 cutover), edge-transformer
# subscribes to MQTT/SparkPlug DIRECTLY and Node-RED consumes from
# RabbitMQ downstream; the `edge.plc-normalized` exchange exists but
# its consumer is disabled (AMQP_SOURCE_ENABLED=false). Treat the
# ENVELOPE/FIELD definitions below as the still-valid message contract
# and the routing/topology prose as historical. See ADR-0010 §Decision.

schema_version: "1.0"

# ── Envelope (every message has this) ─────────────────────────────────────────
# The envelope is RFC-style metadata — every message carries it, regardless of
# payload type. Fields here are the ONLY thing the Go service touches before
# dispatching to a type-specific handler.
envelope:
  schema_version:
    type: string
    required: true
    example: "1.0"
    description: |
      Semver of THIS schema file. Consumer MUST reject messages with a
      major version it doesn't understand. Minor/patch additions are
      backward-compatible (consumer ignores unknown fields).

  tenant:
    type: string
    required: true
    example: "cpack"
    description: |
      Customer slug. MUST match client.yaml's `client.id`. Used for:
        - Prometheus metric labels (per-tenant visibility — see PR #56
          silent-coverage-gap lesson)
        - DLQ routing (per-tenant DLQs)
        - Multi-tenant isolation in the Go service

  source:
    type: object
    required: true
    fields:
      type:        { type: string, enum: [nodered, simulator, replay], required: true }
      instance:    { type: string, required: true, example: "cpack-montreal-01",
                     description: "Hostname or stable identifier of the Node-RED instance" }
      tab:         { type: string, required: false, example: "Client",
                     description: "Which Node-RED tab emitted this — useful for debugging" }

  message_id:
    type: string
    format: ulid                    # 26-char Crockford base32; sortable + unique
    required: true
    example: "01HG7P3K8MJN9V8X9XYZ1ABCDE"
    description: |
      Globally unique message identifier. Generated at the Node-RED publisher.
      Used as the idempotency key by the Go transformer (dedup window: 24h).
      ULID chosen over UUID for natural sort order (helps debugging).

  trace_id:
    type: string
    format: ulid
    required: false                  # may be auto-generated by Go if missing
    description: |
      End-to-end trace ID. If a single PLC reading triggers downstream
      effects (event, scan, cloud write), they all share trace_id.
      Carried through to outbound HTTP via the `X-Trace-Id` header.

  ordering_key:
    type: string
    required: true
    example: "equipment_84"
    description: |
      Stable key that identifies the ordering domain — messages with the
      same key MUST be processed in publish order. Format: `equipment_<id>`,
      `client_<id>`, `unscoped` (rare).
      Today's broker routing uses topic patterns (see `routing:` section)
      not consistent-hash; ordering_key is preserved for future routing
      changes AND for debugging (helps trace "what equipment did this msg
      belong to?" without parsing the payload).

  ingested_at:
    type: string
    format: rfc3339-nano             # 2026-06-30T15:32:18.123456789Z
    required: true
    description: |
      When Node-RED published. NOT when the PLC sampled. Use this for
      lag/latency metrics; use source_timestamp for time-series writes.

  source_timestamp:
    type: string
    format: rfc3339-nano
    required: true
    description: |
      When the upstream event occurred (PLC sample time, operator click
      time, scanner trigger time). This is the time used for downstream
      time-series storage. If the source can't provide it, Node-RED MUST
      set it to ingested_at and emit a warning metric.

# ── Type discriminator + payload variants ─────────────────────────────────────
# Every message has a `type` field that selects which payload sub-schema
# applies. Adding new types is a MAJOR schema-version bump (consumers must
# explicitly opt-in to handle them).

type:
  type: string
  required: true
  enum: [plc.value, plc.event, operator.action, box.scan, sample.measurement]
  description: |
    Discriminator. Consumer dispatches by this field via a registered handler
    map (same pattern as oeecloud-worker's handlers/dispatcher.go).

# ── payload type 1: plc.value ────────────────────────────────────────────────
# A single equipment-parameter reading. The most common message type; expect
# millions per day per factory.
"payload.plc.value":
  description: "Single parameter reading from a PLC tag (OPC-UA, SparkPlug, S7, etc.)"
  fields:
    equipment_id:
      type: int
      required: true
      example: 84
      description: "packml_register.id_equipment — the canonical equipment identifier"

    parameter:
      type: string
      required: true
      example: "counter_consumed"
      description: |
        Canonical parameter NAME (not PackML ID). The Node-RED layer resolved
        the PLC tag → equipment + parameter via client.yaml's
        equipment_mapping table.

    value:
      type: union[bool, int, float, string]
      required: true
      example: 12345
      description: |
        The actual value. Typed per the equipment_mapping's `datatype` field.
        Strings are allowed for state names ("RUNNING", "IDLE") that haven't
        been encoded to ints.

    datatype:
      type: string
      required: true
      enum: [bool, int32, int64, float32, float64, string, json]
      description: "Indicates how `value` should be interpreted"

    quality:
      type: string
      required: false
      enum: [good, uncertain, bad, stale]
      default: good
      description: "OPC-UA quality flag, normalized. Sparkplug bdSeq violations → bad."

    raw:
      type: object
      required: false
      description: |
        Original protocol-level data, preserved for debugging. NOT used by
        downstream business logic — they consume the normalized fields.
      fields:
        protocol:    { type: string, example: "opcua" }
        node_id:     { type: string, example: "ns=6;s=::bci_ini:stBci.Statistics.ProdConsumedCount" }
        raw_value:   { type: any, description: "Value pre-typing + pre-scaling" }

  example: |
    {
      "schema_version": "1.0",
      "envelope": {
        "tenant": "cpack",
        "source": {"type": "nodered", "instance": "cpack-montreal-01", "tab": "Client"},
        "message_id": "01HG7P3K8MJN9V8X9XYZ1ABCDE",
        "trace_id":   "01HG7P3K8MJN9V8X9XYZ1ABCDE",
        "ordering_key": "equipment_84",
        "ingested_at":      "2026-06-30T15:32:18.123456789Z",
        "source_timestamp": "2026-06-30T15:32:18.100000000Z"
      },
      "type": "plc.value",
      "payload": {
        "equipment_id": 84,
        "parameter":    "counter_consumed",
        "value":        12345,
        "datatype":     "int64",
        "quality":      "good",
        "raw": {
          "protocol":  "opcua",
          "node_id":   "ns=6;s=::bci_ini:stBci.Statistics.ProdConsumedCount",
          "raw_value": "12345"
        }
      }
    }

# ── payload type 2: plc.event ─────────────────────────────────────────────────
# Emitted when the PLC reports a discrete event (state change, alarm, fault).
# In SparkPlug terms: status changes. In OPC-UA: state-machine transitions.
"payload.plc.event":
  description: "Discrete event from the PLC layer (state transition, alarm, fault)"
  fields:
    equipment_id:    { type: int,    required: true }
    event_type:      { type: string, required: true, enum: [state_change, alarm, fault, warning, info] }
    from_state:      { type: string, required: false, example: "RUNNING",
                       description: "Previous state, if known (state_change events)" }
    to_state:        { type: string, required: false, example: "IDLE",
                       description: "New state (state_change events)" }
    code:            { type: string, required: false, example: "109",
                       description: "Vendor-specific error/alarm code; mapped to category via data_tables.error_codes" }
    category:        { type: string, required: false, example: "WEBTRS",
                       description: "Resolved category from error_codes table (Node-RED looks it up)" }
    subcategory:     { type: string, required: false }
    severity:        { type: string, required: false, enum: [info, warning, error, critical] }
    raw:             { type: object, required: false, description: "See plc.value.raw" }

# ── payload type 3: operator.action ──────────────────────────────────────────
# An operator-initiated event that needs a backend write (justify event,
# start PO, etc.). These are CRITICAL writes in ADR-0007's vocabulary.
"payload.operator.action":
  description: "Operator click that requires a backend mutation"
  fields:
    equipment_id:    { type: int,    required: true }
    action:          { type: string, required: true,
                       enum: [justify, start_po, stop_po, change_status, change_time,
                              create_event, edit_event, delete_event, split_event,
                              create_sample, edit_sample, delete_sample,
                              scan_box, add_manual_event] }
    parameters:      { type: object, required: true,
                       description: "Action-specific fields; schema varies by action.
                                     Validated against per-action sub-schemas in the Go layer." }
    operator_id:     { type: string, required: true,
                       description: "Authenticated operator identity (user_logs.user_email or token sub)" }
    idempotency_key: { type: string, required: true,
                       description: "Client-generated UUID per ADR-0007's outbox contract.
                                     Reused on retries; dedup window 24h." }

# ── payload type 4: box.scan ──────────────────────────────────────────────────
# Production-count scan event. Distinct from plc.value because scans are
# discrete operator events, not continuous PLC readings.
"payload.box.scan":
  description: "Box/unit scan event for production counting"
  fields:
    equipment_id:    { type: int,    required: true }
    box_id:          { type: string, required: true,
                       description: "Customer's box identifier (barcode, RFID, etc.)" }
    box_order_number: { type: int,   required: false,
                       description: "PO number from the scan; 0 means scan-without-PO context" }
    count:           { type: int,    required: true, minimum: 1,
                       description: "Units in this scan (usually 1; sometimes batch)" }
    scanner_id:      { type: string, required: false }
    scanned_at:      { type: string, format: rfc3339-nano, required: true,
                       description: "When the scanner triggered (NOT when Node-RED published)" }

# ── payload type 5: sample.measurement ───────────────────────────────────────
# Quality sample data. Less frequent than plc.value but structured similarly.
"payload.sample.measurement":
  description: "Quality sample measurement from the floor"
  fields:
    equipment_id:    { type: int,    required: true }
    sample_type:     { type: string, required: true, example: "weight",
                       description: "Customer-defined sample dimension (weight, thickness, etc.)" }
    values:          { type: array,  items: {type: float}, required: true,
                       description: "One or more measurements; some equipment yields multi-value samples" }
    units:           { type: string, required: false, example: "grams" }
    sampled_by:      { type: string, required: false, description: "Operator who took the sample" }
    sampled_at:      { type: string, format: rfc3339-nano, required: true }

# ── Extension mechanism ───────────────────────────────────────────────────────
# Customers can attach per-customer extra fields under `payload.extensions`
# WITHOUT modifying this schema. The Go transformer treats extensions as
# opaque (round-trips them to downstream destinations); customer-side
# customization tabs can read/write them freely.
#
# Customers CANNOT invent new top-level types — that's a platform decision
# (would require a schema major bump + Go handler).
extensions:
  location: "payload.extensions"
  type: map[string, any]
  example:
    payload:
      equipment_id: 84
      # ... standard fields ...
      extensions:
        cpack_internal_batch_id: "BATCH-2026-06-30-A"
        cpack_machine_code: "L25-MST-PR-5"

# ── RabbitMQ routing ──────────────────────────────────────────────────────────
# How messages flow physically through the broker.
# Aligned with ADR-0009 architectural-shape diagram: single global exchange
# with topic-based routing, NOT per-tenant exchanges. Multi-tenancy expressed
# via the routing key pattern.
routing:
  # ── ERRATA 2026-06-30 (after Phase 2 live verification) ──────────────────
  # Phase 2 end-to-end test surfaced a mismatch between this schema's documented
  # routing-key pattern and the actual Go scaffold's binding behavior. The
  # Go scaffold (services/edge-transformer/) won the runtime contract; this
  # schema is updated below to reflect what's actually live.
  #
  # CURRENT RUNTIME (Phase 2 shipped, verified):
  #   - Routing key:  edge.plc-normalized.<tenant>             ← LITERAL, no wildcards
  #   - Queue:        edge-transformer-q-<tenant>              ← per-tenant
  #   - Binding:      key=edge.plc-normalized.<tenant>          ← literal-match
  #   - Granularity:  per-tenant only (NOT per-equipment)
  #
  # DEFERRED (was originally documented; Phase 3+ work to add):
  #   - Per-equipment routing key (plc.normalized.<tenant>.equipment.<id>)
  #   - Per-equipment binding patterns + consumer queues
  #   - Equipment-level sequential processing guarantees
  #
  # Why defer per-equipment granularity: not required for shadow mode +
  # Phase 3 (Calc Production Counters port). Per-equipment ordering becomes
  # load-bearing if/when the Go port reads cumulative-counter state per
  # equipment — at that point, change the Go binding to topic-pattern
  # `edge.plc-normalized.<tenant>.equipment.*` and publishers add the
  # equipment-id suffix. Backward-compat MINOR schema bump; consumers
  # tolerate unknown extra dot-segments.

  exchange:
    name: "edge.plc-normalized"
    type: topic
    durable: true
    description: |
      Single exchange at each factory's RabbitMQ. Publishers (Node-RED tabs)
      write here; consumers (edge-transformer per-tenant queues) bind to
      literal routing keys today.

  routing_key_format:
    pattern: "edge.plc-normalized.<tenant>"        # was: "plc.normalized.<tenant>.equipment.<equipment_id>"
    example: "edge.plc-normalized.cpack"           # was: "plc.normalized.cpack.equipment.84"
    description: |
      Literal per-tenant routing key. The Go scaffold's binding is exact-
      match (no wildcards). Publishers MUST emit with this exact key for
      the message to reach the per-tenant queue.

      Equipment-id granularity (originally documented as load-bearing) is
      DEFERRED to a Phase 3+ minor-version bump when the Go consumer
      actually needs per-equipment sequential processing. Today's shadow
      handler doesn't care about per-equipment ordering.

  consumer_queue_naming:
    name: "edge-transformer-q-<tenant>"            # was: "edge-transformer.<tenant>"
    durable: true
    binding_key: "edge.plc-normalized.<tenant>"    # was: "plc.normalized.<tenant>.#"
    arguments:
      x-dead-letter-exchange: "edge.plc-normalized-retry"
      x-dead-letter-routing-key: "edge.plc-normalized.<tenant>"
      x-message-ttl: 86400000       # 24h — outbox pattern dedup window
    description: |
      One queue per tenant for the edge-transformer to consume. Per-tenant
      isolation: a tenant whose messages can't be processed doesn't block
      other tenants. Reuses oeecloud-worker's per-tenant Channel pattern
      (Strategy C Phase 2a).

      The Go scaffold also creates fallback queues `edge-transformer-q`,
      `edge-transformer-q-retry-30s`, `edge-transformer-q-failed` for
      messages without a tenant-specific binding. These should stay empty
      in normal operation; their non-zero depth is a routing-bug signal.

  dlx:
    name: "dlx.edge.plc-normalized"
    type: topic
    purpose: |
      Failed-after-retry messages. DLQ-per-tenant (`dlq.<tenant>` routing
      key). Inspected via the same Grafana per-tenant pattern as
      mirror-worker-go's DLQ panel.

# ── Versioning policy ─────────────────────────────────────────────────────────
versioning:
  policy: |
    Semver. The `schema_version` field in every message is the authoritative
    version this message conforms to.

  backward_compatible_changes:    # MINOR or PATCH bump
    - Adding a new OPTIONAL field to envelope or payload
    - Adding a new enum value to a non-discriminator field
    - Adding a new payload type that consumers can opt-in to handle
      (but emitters MUST gate behind a feature flag until consumers updated)
    - Tightening field documentation
    - Adding a new extension key

  breaking_changes:                # MAJOR bump
    - Removing or renaming any field
    - Adding a REQUIRED field
    - Changing a field's type
    - Adding a new value to the top-level `type` discriminator (forces consumers
      to handle it; safer as a major bump)
    - Changing the envelope structure

  rollout_for_major_bump:
    - Stand up a parallel exchange `plc.normalized.<tenant>.v2` alongside v1
    - Node-RED dual-publishes for the transition window (v1 + v2)
    - Consumers migrate one tenant at a time
    - When all consumers + emitters on v2, remove v1 exchange
    - Reference: oeecloud-worker's Strategy C Phase 2b cutover (June 2026) is
      the operational template

# ── Validation ────────────────────────────────────────────────────────────────
# Both sides validate, with different goals:
#   - Node-RED publisher: rejects own outbound message if it doesn't conform
#     (loud failure at the source is much better than silent acceptance with
#     downstream corruption)
#   - Go consumer: rejects incoming message → routes to DLX with reason header
#     `x-validation-error: <field> <error>` for triage
validation:
  publisher_side:
    enforced_by: "Node-RED function node `validate-normalized-payload` (Phase 1 deliverable)"
    behavior: "Throw on invalid; never publish"

  consumer_side:
    enforced_by: "edge-transformer's internal/payload validator"
    behavior: "Reject to DLX with x-validation-error header; emit Prom metric"

# ── Examples for all 5 types ──────────────────────────────────────────────────
# See the `example:` field in each type's section above. The full test fixture
# library lives at `services/edge-transformer/internal/payload/testdata/` once
# the Go service exists.
