  - protocol: modbus_tcp
    name: PLC_L6
    endpoint: "10.135.1.128:502"
    unit: 1
    # L6 register→topic+TRIG map RECOVERED from the legacy :1881 reader
    # ("Prepare L6" + "PackML device config", 2026-08-18). Holding registers read
    # as 32-bit pairs LOW-WORD-FIRST (legacy: value = reg[n+1]<<16 | reg[n]).
    # Serial flow: PTH(in reg100)→RMH(in reg50)→TEXA(out reg0); scrap between
    # stages is captured by ***TRIG_CS (defective = consumed − processed). The
    # generated reader previously had NO tags here → defaulted to register 0 with
    # no TRIG → net=gross → Quality inflated to ~1.0 (see cpack-legacy-oracle-line-meters.md).
    # kind: holding (legacy read HoldingRegister block adr0 qty80); each count is a
    # 32-bit pair (word_swap=true, low-word-first). Shared registers encode the serial
    # flow (reg50 = PTH-out = RMH-in; reg0 = RMH-out = TEXA-in/out).
    tags:
      - { name: "C-PACK/SC/LINHAS/L6/BREYER/Admin/ProdConsumedCount/91/Unit***TRIG_C=O",  address: 60,  kind: holding, type: int32, word_swap: true }
      - { name: "C-PACK/SC/LINHAS/L6/POLYTYPE/Admin/ProdConsumedCount/93/Unit***TRIG_C=O", address: 10,  kind: holding, type: int32, word_swap: true }
      - { name: "C-PACK/SC/LINHAS/L6/PTH/Admin/ProdConsumedCount/95/Unit",                 address: 100, kind: holding, type: int32, word_swap: true }
      - { name: "C-PACK/SC/LINHAS/L6/PTH/Admin/ProdProcessedCount/95/Unit***TRIG_CS",      address: 50,  kind: holding, type: int32, word_swap: true }
      - { name: "C-PACK/SC/LINHAS/L6/RMH/Admin/ProdConsumedCount/94/Unit",                 address: 50,  kind: holding, type: int32, word_swap: true }
      - { name: "C-PACK/SC/LINHAS/L6/RMH/Admin/ProdProcessedCount/94/Unit***TRIG_CS",      address: 0,   kind: holding, type: int32, word_swap: true }
      - { name: "C-PACK/SC/LINHAS/L6/TEXA/Admin/ProdConsumedCount/92/Unit",                address: 0,   kind: holding, type: int32, word_swap: true }
      - { name: "C-PACK/SC/LINHAS/L6/TEXA/Admin/ProdProcessedCount/92/Unit***TRIG_CS",     address: 0,   kind: holding, type: int32, word_swap: true }
