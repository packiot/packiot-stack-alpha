      - { name: 19S, address: "DB1,X1024.7" }
      - { name: 609, address: "DB1,DINT16" }
  - protocol: s7
    name: "S7 S8"
    endpoint: 10.135.16.26
    rack: 0
    slot: 2
    poll_ms: 30000
    tags:
      # COUNTER-ROLE FIX (2026-08-25): DXL is the L8 INFEED → must emit ProdConsumedCount
      # (→ line gross). Was ProdProcessedCount (net) which killed L8 line gross. Oracle
      # packiot40: L8 gross = DXL(219), net = TEXA(222). See cpack-legacy-oracle-line-meters.md.
      - { name: "C-PACK/SC/LINHAS/L8/DXL/Admin/ProdConsumedCount/219/Unit***TRIG_C=O", address: "DB1,DINT0" }
      - { name: PTH_COUNT_OK, address: "DB1,DINT4" }
      - { name: PTH_COUNT_A, address: "DB1,DINT8" }
      - { name: PTH_COUNT_B, address: "DB1,DINT12" }
      - { name: "C-PACK/SC/LINHAS/L8/PTH/Admin/ProdConsumedCount/220/Unit***TRIG_C=O", address: "DB1,INT32" }
      - { name: "C-PACK/SC/LINHAS/L8/TCX/Admin/ProdProcessedCount/221/Unit***TRIG_C=I", address: "DB1,DINT16" }
      - { name: "C-PACK/SC/LINHAS/L8/TEXA/Admin/ProdProcessedCount/222/Unit***TRIG_C=I", address: "DB1,DINT20" }
