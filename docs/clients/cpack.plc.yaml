# cpack.plc.yaml — CPACK PLC connection block (config-as-data, ADR-0045).
# EXTRACTED read-only from the live CPACK Node-RED (localhost:1882, GET /admin/flows)
# 2026-08-04. SSoT the CS-Admin onboarding 'generate' step consumes to emit the edge
# bundle's OWN reader (S7/OPC-UA/Modbus -> raw tags -> tee -> agent :9104).
# Var NAME = canonical topic (post C-PACK->CPACK fixup); ***TRIG_C=O/I = gross(out)/net(in).
# Factory-LAN endpoints (10.135.x) -- the reader runs on the VPN/factory box.
#
# COUNTER-ROLE FIX (2026-08-25): 5 line-meter machines emitted the WRONG SparkPlug
# counter type, so the decoder's hardcoded ProdConsumedCount->gross / ProdProcessedCount->net
# mapping (+ Phase-9 line-aggregation keyed on infeed/outfeed count-index) produced dead/
# inverted line OEE. The model: each line's INFEED machine must emit ProdConsumedCount
# (-> line gross), the OUTFEED TEXA must emit ProdProcessedCount (-> line net). Fixed here:
#   L3/BREYER Processed->Consumed, L3/TEXA Consumed->Processed (roles were inverted);
#   L4/TEXA Consumed->Processed; L8/DXL Processed->Consumed; L10/DXL Processed->Consumed.
# Verified live vs oracle packiot40: L4 line net now computes (Q=1.108, exact oracle match);
# L8/L10 line gross now compute (=DXL, oracle match); L3 latent-correct (idle now); L5/L6
# untouched + still oracle-matched. Deployed as a surgical hand-patch to the live :1880
# reader flow (metric-name swap only — the live vars carry NO ***TRIG, unlike this file).
#
# WARNING: THIS FILE IS STALE vs the deployed :1880 reader and would NOT regenerate it
# faithfully. Known divergences: L4/L5 count-indices (this file 84/86/88/89 & raw numeric
# 17/18/... ; live uses 6/7/8/9/10 & full topics), empty modbus PLC_L3/L4/L5 blocks, and
# the live reader drops the ***TRIG suffixes. Full reconciliation of this SSoT to the live
# reader is a separate task.
#
# L8/L10 LINE NET = 0 — ROOT CAUSE + FIX (task #59, 2026-08-25→26). TWO PRs:
#
# PR#910 (register hypothesis): the :1880 reader reads L8/L10 TEXA at DB1,DINT20, matching the
# legacy :1881 REFERENCE reader's vartable — so a naive "guess a different S7 register" was
# rightly refused. BUT that reference is itself STALE. Deeper probing (live tcpdump of the
# reader payload at the cloud agent + oracle differential) DISPROVED "DINT20 is correct":
#
#   Our reader's DB1,DINT20 read  →  L8/TEXA = 626329 (an unrelated counter), L10/TEXA = 0 (empty).
#   Oracle TEXA totalizer         →  L8 = 217796,  L10 = 254927.   ⇒ DINT20 ≠ the TEXA value.
#   Oracle TEXA(222/567) ≡ oracle TCX(221/566) BYTE-FOR-BYTE over 24h (max val diff = 0; identical
#     increment sums 19384 / 146732) — TEXA and TCX are the SAME physical outfeed count.
#   Our reader's TCX read @ DB1,DINT16  →  L8 = 217502 ≈ oracle 217796,  L10 = 254543 ≈ oracle 254927,
#     AND TCX (count-index 221/566, id 75/79) ALREADY flows to F3 matching the oracle line net.
#
#   ⇒ The TRUE L8/L10 outfeed/net count lives at DB1,DINT16 (what the reader already reads as TCX).
#     DB1,DINT20 is STALE on the current PLC (PLC-program drift since the Jul-23 vartable) — it
#     reads junk on L8 and an empty register on L10. NBIRTH/agent/decoder are all fine: the reader
#     EMITS TEXA@DINT20, the agent births+publishes it, the decoder decodes it — the VALUE is just
#     wrong (626329 / 0), so it contributes nothing. NOT an alias/birth bug.
#
# FIX (applied live, verified): repoint the L8/L10 LINE outfeed counter in packml_register from
# TEXA(222/567) → TCX(221/566) — the machine whose register (DB1,DINT16) actually holds the
# outfeed count and already matches the oracle. Phase-9 reseeds Parameter30700 from the LINE row
# every 5 min, so line net populated within one cycle: L8 line net 0→917 vs oracle 910 (~1%),
# L10 line net 0→1098 vs oracle 1191 (poll-cadence skew, same on gross → not a metering error).
# See seed docs/clients/cpack-l8l10-outfeed-counter-fix.sql + cpack-legacy-oracle-line-meters.md.
#
# The reader's TEXA@DB1,DINT20 below stays a stale mapping (reads junk/0); the TEXA machine
# (76/80) remains dark — cosmetic, the LINE now meters via TCX. Optional follow-up: repoint the
# reader TEXA read to DB1,DINT16 (would duplicate TCX). Do NOT guess any other S7 register.

tenant: CPACK
