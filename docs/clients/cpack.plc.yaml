      - { name: 18, address: "DB1,DINT4" }
      - { name: 19A, address: "DB1,DINT8" }
      - { name: 19B, address: "DB1,DINT12" }
      - { name: 20, address: "DB1,DINT20" }
      - { name: 21, address: "DB1,DINT24" }
