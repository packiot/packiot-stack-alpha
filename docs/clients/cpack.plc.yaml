      - { name: "C-PACK/SC/LINHAS/L8/TCX/Admin/ProdProcessedCount/221/Unit***TRIG_C=I", address: "DB1,DINT16" }
      - { name: "C-PACK/SC/LINHAS/L8/TEXA/Admin/ProdProcessedCount/222/Unit***TRIG_C=I", address: "DB1,DINT20" }
