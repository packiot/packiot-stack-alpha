# cpack.plc.yaml — CPACK PLC connection block (human-readable REFERENCE).
# COUNTER-ROLE FIX (2026-08-25, #909): infeed machine must emit ProdConsumedCount (line gross),
# outfeed TEXA must emit ProdProcessedCount (line net). Flipped L4/TEXA, L8/DXL, L10/DXL — these
# three are oracle-verified correct (L4/L8/L10 line gross+net byte-match packiot40 live).
# L3/BREYER + L3/TEXA were ALSO flipped by #909 but that flip PHANTOMED the L3 line gross
# (see below) and was REVERTED 2026-08-26 back to the legacy/oracle mapping.
#
# 2026-08-26 L3 REVERT: #909 relabelled L3/BREYER DB1,DINT0 as ProdConsumedCount/76 (= the
# L3 line INFEED meter). That register is live-climbing, so it fabricated ~44k line gross on
# a day the oracle L3 was fully idle (proven: oracle line 75 + all members 0 gross/0 net,
# same UTC window, same PLCs). The legacy/oracle reader (:1881) maps DB1,DINT0 → BREYER
# ProdProcessedCount/76 (net) and DB1,DINT28 → TEXA ProdConsumedCount/80 (gross); reverted to
# match. L3 line gross is a KNOWN faithful gap (BREYER's real gross register is not mapped by
# the generated reader) — do NOT re-flip to close it (that re-creates the phantom).
# Verified vs oracle packiot40 (L4 Q=1.108 exact for the L4/L8/L10 flips that were kept).
#
# ⚠ NOT the generator input. The machine SSoT the onboard generator (cmd/onboard-gen)
# consumes is docs/clients/edge-deployment/cpack/cpack.descriptor.yaml (its `plc:`
# block, in the DescriptorPLC schema: endpoints + s7/modbus/opcua_tag_map). This file
# is a flat, address-first mirror for humans; keep it consistent with the descriptor.
#
# The S7 115 / S7 116 / S7 L5 tag NAMES below were CANONICALISED from the descriptor's
# s7_tag_map (matched by DB1,<TYPE><offset> address) — the stale numeric names
# (514/17/19A/…) the agent's suffix-matcher could not map are now the canonical topics.
# A handful of addresses still carry a numeric name flagged UNRESOLVED: the descriptor
# has no s7_tag_map entry for them (need a live count-index capture to bind).

