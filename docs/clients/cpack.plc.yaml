      - { name: "C-PACK/SC/CELULA9/FLEXO/FLEXO/Status/CurMachSpeed", address: "DB1,INT50" }
      - { name: FLEXO_PLC_STATUS, address: "DB1,INT50" }
  - protocol: s7
    name: "S7 L10"
    endpoint: 10.135.16.124
    rack: 0
    slot: 1
    poll_ms: 30000
    tags:
      # COUNTER-ROLE FIX (2026-08-25): DXL is the L10 INFEED → ProdConsumedCount (line gross).
      # Was ProdProcessedCount (net) → L10 line was fully dead. Oracle: L10 gross=DXL(564),
      # net=TEXA(567). L10/TEXA ProcessedCount below reads DB1,DINT20 — the CORRECT register,
      # proven identical to the legacy :1881 oracle reader (task #59). Line net still 0 is NOT
      # an address bug but the 2026-08-13 SparkPlug alias/birth regression (see header note).
      - { name: "C-PACK/SC/LINHAS/L10/DXL/Admin/ProdConsumedCount/564/Unit***TRIG_C=O", address: "DB1,DINT0" }
      - { name: PTH_COUNT_OK, address: "DB1,DINT4" }
      - { name: PTH_COUNT_A, address: "DB1,DINT8" }
      - { name: PTH_COUNT_B, address: "DB1,DINT12" }
      - { name: "C-PACK/SC/LINHAS/L10/PTH/Admin/ProdConsumedCount/565/Unit***TRIG_C=O", address: "DB1,INT32" }
      - { name: "C-PACK/SC/LINHAS/L10/TCX/Admin/ProdProcessedCount/566/Unit***TRIG_C=I", address: "DB1,DINT16" }
      - { name: "C-PACK/SC/LINHAS/L10/TEXA/Admin/ProdProcessedCount/567/Unit***TRIG_C=I", address: "DB1,DINT20" }
      - { name: VERSION, address: "DB1,INT48" }
      - { name: TEST, address: "DB1,WORD1118" }
  - protocol: s7
    name: "PLC L4 10.135.1.126"
    endpoint: 10.135.1.126
    rack: 1
    slot: 2
    poll_ms: 30000
    tags:
      - { name: "C-PACK/SC/LINHAS/L4/BREYER/Admin/ProdConsumedCount/88/Unit***TRIG_C=O", address: "DB1,DINT0" }
      - { name: "C-PACK/SC/LINHAS/L4/PTH/Admin/ProdConsumedCount/86/Unit", address: "DB1,DINT4" }
      - { name: PTH_COUNT_SUM, address: "DB1,DINT8" }
      - { name: PTH_COUNT_A, address: "DB1,DINT12" }
      - { name: PTH_COUNT_B, address: "DB1,DINT16" }
      - { name: "C-PACK/SC/LINHAS/L4/PTH/Admin/ProdProcessedCount/86/Unit***TRIG_CS", address: "DB1,INT32" }
      - { name: "C-PACK/SC/LINHAS/L4/POLYTYPE/Admin/ProdConsumedCount/89/Unit***TRIG_C=O", address: "DB1,DINT20" }
      - { name: "C-PACK/SC/LINHAS/L4/RMH/Admin/ProdConsumedCount/87/Unit***TRIG_C=O", address: "DB1,DINT24" }
      # COUNTER-ROLE FIX (2026-08-25): TEXA is the L4 OUTFEED → must emit ProdProcessedCount
      # (→ line net). Was ProdConsumedCount (gross) → L4 line net was dead. Oracle: L4 net=TEXA.
      # NB: live reader uses count-index 10 for L4/TEXA (this file's /84 is STALE — reconcile).
      - { name: "C-PACK/SC/LINHAS/L4/TEXA/Admin/ProdProcessedCount/84/Unit***TRIG_C=I", address: "DB1,DINT28" }
      - { name: VERSION, address: "DB1,INT48" }
      - { name: I0, address: "DB1,X1024.0" }
      - { name: I1, address: "DB1,X1024.1" }
      - { name: I2, address: "DB1,X1024.2" }
      - { name: I3, address: "DB1,X1024.3" }
      - { name: I4, address: "DB1,X1024.4" }
      - { name: AM1, address: "DB1,WORD1118" }
      - { name: AM2, address: "DB1,WORD1120" }
  - protocol: s7
    name: "PLC L3 10.135.16.127"
    endpoint: 10.135.16.127
    rack: 0
    slot: 2
    poll_ms: 30000
    tags:
      # COUNTER-ROLE FIX (2026-08-25): L3 roles were INVERTED. BREYER is the L3 INFEED →
      # ProdConsumedCount (line gross); TEXA is the OUTFEED → ProdProcessedCount (line net).
      # Was BREYER=Processed + TEXA=Consumed → Phase-9 could not fire → L3 line went dark.
      # Oracle: L3 gross=BREYER(76) 165136, net=TEXA(80) 145963, Q=0.884.
      - { name: "C-PACK/SC/LINHAS/L3/BREYER/Admin/ProdConsumedCount/76/Unit***TRIG_C=O", address: "DB1,DINT0" }
      - { name: "C-PACK/SC/LINHAS/L3/PTH/Admin/ProdConsumedCount/81/Unit", address: "DB1,DINT4" }
      - { name: PTH_COUNT_SUM, address: "DB1,DINT8" }
      - { name: PTH_COUNT_A, address: "DB1,DINT12" }
      - { name: PTH_COUNT_B, address: "DB1,DINT16" }
      - { name: "C-PACK/SC/LINHAS/L3/PTH/Admin/ProdProcessedCount/81/Unit***TRIG_CS", address: "DB1,INT32" }
      - { name: "C-PACK/SC/LINHAS/L3/POLYTYPE/Admin/ProdConsumedCount/82/Unit***TRIG_C=O", address: "DB1,DINT20" }
