      - { name: "C-PACK/SC/LINHAS/L10/TCX/Admin/ProdProcessedCount/566/Unit***TRIG_C=I", address: "DB1,DINT16" }
      - { name: "C-PACK/SC/LINHAS/L10/TEXA/Admin/ProdProcessedCount/567/Unit***TRIG_C=I", address: "DB1,DINT20" }
      - { name: VERSION, address: "DB1,INT48" }
