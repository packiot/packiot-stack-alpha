# cpack.plc.yaml — CPACK PLC connection block (human-readable REFERENCE).
# COUNTER-ROLE FIX (2026-08-25): infeed machine must emit ProdConsumedCount (line gross),
# outfeed TEXA must emit ProdProcessedCount (line net). Flipped L3/BREYER, L3/TEXA, L4/TEXA,
# L8/DXL, L10/DXL (were inverted/dead). Verified vs oracle packiot40 (L4 Q=1.108 exact).
# Also flip cpack.descriptor.yaml (generator SSoT) + cpack-reader-flow.json (seed) — done here.
#
# ⚠ NOT the generator input. The machine SSoT the onboard generator (cmd/onboard-gen)
# consumes is docs/clients/edge-deployment/cpack/cpack.descriptor.yaml (its `plc:`
# block, in the DescriptorPLC schema: endpoints + s7/modbus/opcua_tag_map). This file
# is a flat, address-first mirror for humans; keep it consistent with the descriptor.
#
# The S7 115 / S7 116 / S7 L5 tag NAMES below were CANONICALISED from the descriptor's
# s7_tag_map (matched by DB1,<TYPE><offset> address) — the stale numeric names
# (514/17/19A/…) the agent's suffix-matcher could not map are now the canonical topics.
# A handful of addresses still carry a numeric name flagged UNRESOLVED: the descriptor
# has no s7_tag_map entry for them (need a live count-index capture to bind).

