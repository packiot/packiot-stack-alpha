      - { name: 609, address: "DB1,DINT16" }
  - protocol: s7
    name: "S7 S8"
    endpoint: 10.135.16.26
    rack: 0
    slot: 2
    poll_ms: 30000
    tags:
      # COUNTER-ROLE FIX (2026-08-25): DXL is the L8 INFEED → must emit ProdConsumedCount
      # (→ line gross). Was ProdProcessedCount (net) which killed L8 line gross. Oracle
      # packiot40: L8 gross = DXL(219), net = TEXA(222). See cpack-legacy-oracle-line-meters.md.
      - { name: "C-PACK/SC/LINHAS/L8/DXL/Admin/ProdConsumedCount/219/Unit***TRIG_C=O", address: "DB1,DINT0" }
