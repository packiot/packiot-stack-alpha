# BISPHARMA — PLC TYPE PROFILE example (ADR-0050).
#
# What this proves
# ----------------
# bispharma's site is 16 production lines, EVERY line driven by an IDENTICAL
# Siemens S7 program: the same DB1 layout, the same rack/slot. Before ADR-0050 the
# descriptor's plc.s7_tag_map had to be ~80 hand-copied entries (one 6-line layout
# × 16), and the onboarding UI had no create-path for them — so a UI-authored
# tenant produced an IDLE reader (empty tag map ⇒ nothing to poll).
#
# Here the layout is declared ONCE as plc.types.bispharma_s7 and every endpoint
# just references it (`type: bispharma_s7`). The generator EXPANDS type × each
# line's members into the s7_tag_map:
#
#   - the PHYSICAL half (db / offset / word) comes from the type: a member's
#     SENSOR key (S1, S3, …, the leading S<n> of its topic's last segment) selects
#     the register offset from sensor_offsets;
#   - the CANONICAL half (the metric name) comes from the SAME member + count_index
#     the agent raw_tag_map is synthesized from — /Admin/ProdProcessedCount/<idx>/Unit
#     with idx = id_equipment (equipment_id mode).
#
# Because both the reader s7_tag_map AND the agent raw_tag_map derive that leaf from
# the same members, the ADR-0045 §C consistency invariant holds BY CONSTRUCTION —
# there is no hand-authored physical/canonical pair left to drift. Run through the
# onboard generator this descriptor validates + emits a valid client.yaml.
#
# NOTE: bispharma's scrap is a cross-register derivation (infeed − output, i.e.
# DW0 − DW4) — declared in the type's `derive:` block (ADR-0050 §4). As of
# ADR-0058 P1.4 the generator EMITS it: a derived ProdDefectiveCount on the LINE,
# computed by the agent's sandboxed expr stage from the two members' NET counts.
# Each member still owns ONE count sensor → its NET production leaf; the scrap is
# a line-level derivation over them (member−member, no extra reader tag).
#
# ids / prefix are illustrative for the staging onboarding; nothing here is secret.

tenant: BISPHARMA
enterprise_id: 5
canonical:
  prefix: BISPHARMA/SP
mapping:
  # equipment_id: a member's count index IS its register id_equipment (no per-member
  # capture needed — bispharma's channels are the surrogate ids).
  count_index_default_mode: equipment_id
metric_templates:
  member:
    - {leaf: "/Admin/ProdProcessedCount/{idx}/Unit", type: double}
    - {leaf: "/Status/MachSpeed", type: double}
  line:
    - {leaf: "/Status/StateCurrent", type: long}
agent:
  edge_node_id: bispharma-edge
  internal_broker: tcp://mosquitto:1883
  raw_topic: bispharma/raw
  uplink_broker: ssl://ingest.example.invalid:8883
  mtls:
    cert_ref: secret://packiot/staging/bispharma/uplink-cert
    key_ref: secret://packiot/staging/bispharma/uplink-key
    ca_ref: secret://packiot/staging/bispharma/uplink-ca
tee:
  ingest_url: https://localhost:8444/v1/tags
  tls_insecure: true
plc:
  # ── ONE reusable PLC type — the whole point of ADR-0050 ──
  types:
    bispharma_s7:
      protocol: s7
      rack: 0
      slot: 2
      port: 102
      db: 1
      word: dint
      # sensor key → DB1 byte offset. A member's key (S1, S3, …) picks its offset.
      sensor_offsets: {S1: 0, S2: 4, S3: 8, S4: 12, S5: 16, S6: 20}
      # ADR-0050 §4 / ADR-0058 P1.4: scrap = infeed − output = S1 − S6 (units in
      # minus good units out). Both S1 (S1INFEED) and S6 (S6OUTPUT) are MEMBERS, so
      # each binds to its published NET count — the generator now emits a derived
      # ProdDefectiveCount on the LINE from this. Illustrative direction; confirm the
      # exact per-client counters against a live tee capture before a real fire.
      derive: {scrap: "S1 - S6"}
  # ── 16 endpoints, each ONE line, each just references the type ──
  endpoints:
    - {name: L01, protocol: s7, type: bispharma_s7, host_ref: 192.168.5.1}
    - {name: L02, protocol: s7, type: bispharma_s7, host_ref: 192.168.5.2}
    - {name: L03, protocol: s7, type: bispharma_s7, host_ref: 192.168.5.3}
    - {name: L04, protocol: s7, type: bispharma_s7, host_ref: 192.168.5.4}
    - {name: L05, protocol: s7, type: bispharma_s7, host_ref: 192.168.5.5}
    - {name: L06, protocol: s7, type: bispharma_s7, host_ref: 192.168.5.6}
    - {name: L07, protocol: s7, type: bispharma_s7, host_ref: 192.168.5.7}
    - {name: L08, protocol: s7, type: bispharma_s7, host_ref: 192.168.5.8}
    - {name: L09, protocol: s7, type: bispharma_s7, host_ref: 192.168.5.9}
    - {name: L10, protocol: s7, type: bispharma_s7, host_ref: 192.168.5.10}
    - {name: L11, protocol: s7, type: bispharma_s7, host_ref: 192.168.5.11}
    - {name: L12, protocol: s7, type: bispharma_s7, host_ref: 192.168.5.12}
    - {name: L13, protocol: s7, type: bispharma_s7, host_ref: 192.168.5.13}
    - {name: L14, protocol: s7, type: bispharma_s7, host_ref: 192.168.5.14}
    - {name: L15, protocol: s7, type: bispharma_s7, host_ref: 192.168.5.15}
    - {name: L16, protocol: s7, type: bispharma_s7, host_ref: 192.168.5.16}
