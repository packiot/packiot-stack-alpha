# cpack-agent.yaml — sparkplug-agent descriptor for CPACK (ADR-0042 P1, Mode-A).
#
# This is the agentcfg schema (services/edge-transformer/internal/agent/agentcfg),
# NOT the edge-transformer client.yaml. It drives ONE sparkplug-agent process
# that turns CPACK's raw PLC tags (POSTed by the real CPACK Node-RED tee over
# the HTTP front-door) into SparkPlug B, publishing to the INTERNAL mosquitto
# that edge-transformer already subscribes to → the full prod Calc → F3.
#
# ══ REBUILT FROM REAL PROD TOPOLOGY (2026-07-23) ═════════════════════════════
# The previous revision of this file was derived from
# services/edge-transformer/cmd/plc-sim/main.go — and the sim was NOT faithful
# to CPACK's real SparkPlug naming. The live-tee validation surfaced the drift:
#   • real speed metric is  Status/CurMachSpeed   (sim/old-map: Status/MachSpeed)
#   • real param  metric is  Status/Parameter     (sim/old-map: Status/Parameter30700)
#   • real LINE counts have NO /idx/Unit suffix    (old-map: /<line-id>/Unit)
#   • real MEMBER counts carry the PLC's own count index (NOT a fabricated id)
# This revision is rebuilt from a SELECT-only read of BOTH packml_registers.
#
# ── Topology provenance ──────────────────────────────────────────────────────
# PROD packml_register (ent 1, instance i-06c9547a2c7091ab7, BEGIN READ ONLY,
# 2026-07-23): SELECT id_equipment,id_unit,packml_topic WHERE packml_topic LIKE
# 'C-PACK/SC/LINHAS/%' AND active.  STAGING packml_register (ent 3, instance
# i-064bb36d1c454d861 / timescaledb `packiot`, same date): same query on the
# CPACK/… (hyphen-normalized) prefix.
#
# The tee normalizes the enterprise prefix C-PACK → CPACK before POSTing, so the
# agent's packml_topic is "CPACK/SC/LINHAS" and edge-transformer + the
# oeecloud-worker resolver match against STAGING ent-3 (the F3 refdata plane).
#
# LINE (tp=3) and MEMBER (tp=1) id reconciliation — prod id → staging id:
#
#   Line   prod  stg     Members (name: prod→stg, PLC count-index)
#   L3      75    48     BREYER 76→58 (idx76) · POLYTYPE 82→62 (idx82)
#                        PTH 81→61 (idx81) · RMH 79→59 (idx79) · TEXA 80→60 (idx80)
#   L4      83    49     BREYER 88→66 (idx6) · POLYTYPE 89→67 (idx7)
#                        PTH 86→64 (idx8) · RMH 87→65 (idx9) · TEXA 84→63 (idx ?)
#   L5      60    47     BREYER 61→53 (idx61) · POLYTYPE 62→54 (idx62)
#                        PTH 63→55 (idx63) · RMH 64→56 (idx64) · TEXA 65→57 (idx65)
#   L6      90    50     BREYER 91→68 · TEXA 92→69 · POLYTYPE 93→70
#                        RMH 94→71 · PTH 95→72   (count-index = prod id, live-tee obs)
#   L8     218    51     DXL 219→73 · PTH 220→74 · TCX 221→75 · TEXA 222→76
#   L10    563    52     (follow-up — not fed yet)
#
# ⚠️ COUNT-INDEX PROVENANCE. The oeecloud-worker resolver (parse.go
# TopicForRegister) strips everything from segment 4/5 onward and matches
# packml_topic EXACTLY on the 5-seg unit topic (4-seg for lines) with active=
# true, so the count index in a name does NOT affect id_equipment resolution —
# it only has to match what the tee actually sends (the agent raw_tag_map is a
# STRICT ALLOWLIST: session.Resolver returns ok=false for any suffix not listed
# and the tag is silently dropped). Indices marked "(idx N)" above are
# CONFIRMED — packml_register registers that exact count-metric topic. L4/TEXA
# and every L6/L8 member count topic are NOT registered in either DB; their
# indices below are INFERRED (L6 from the live-tee report = prod id) and MUST be
# confirmed against a real tee payload before cutover, or those counts drop.
#
# ── Scope of THIS revision ───────────────────────────────────────────────────
# Fixes the naming of the previously-mapped set (L3/L4/L5/L8 lines + members
# L5/BREYER, L5/TEXA, L3/PTH, L4/TEXA) and ADDS L6 (line + 5 members). The
# remaining members of L3/L4/L5 (POLYTYPE/RMH/…), all L8 members (DXL/PTH/TCX/
# TEXA) and L10 are catalogued in the table above and are a documented follow-up
# — the map is a curated subset, not yet the full ~30-equipment topology.
#
# ── Calc name-recognition (CRITICAL — see PR body) ───────────────────────────
# The edge-transformer Calc keys its non-counter state seeds by EXACT suffix
# (cmd/edge-transformer/main.go seedFromMetric + calc.go):
#     glitch guard / speed  →  HasSuffix(name, "/Status/MachSpeed")
#     line-machines CSV      →  HasSuffix(name, "/Status/Parameter30700")
#     threshold/mode/flags   →  /Status/Parameter*30750*, Parameter30758, *30761*, *30710*
# Real CPACK sends "/Status/CurMachSpeed" and a bare "/Status/Parameter", NEITHER
# of which those HasSuffix checks match. Counts are matched by SUBSTRING
# (ProdProcessedCount/ProdConsumedCount/ProdDefectiveCount) so they are
# recognized as-is. The Phase-8 glitch guard is `prodSpeed < 3*machSpeed`; with
# machSpeed unseeded (=0) and prodSpeed always ≥0, EVERY counter is rejected —
# so counts ALONE do NOT produce OEE without a speed seed.
#
# Normalization is therefore REQUIRED, and the cleanest seam is HERE, at agent
# ingest: TagMapEntry has an optional `name:` that FullName() returns verbatim
# instead of prefix+suffix. So each entry keys the allowlist on the REAL tee
# suffix (metric_suffix) but publishes the CANONICAL SparkPlug name the Calc
# recognizes (name). CurMachSpeed → MachSpeed is done this way below.
#   NB: CurMachSpeed is the INSTANTANEOUS speed; the Calc's machSpeed is a
#   NOMINAL ceiling. Feeding instantaneous-as-nominal makes the glitch guard a
#   near-passthrough (prodSpeed < 3·~prodSpeed) — enough to let production flow,
#   but it is a SEMANTIC substitution that needs owner sign-off, and the true
#   nominal source (does CPACK emit a separate MachSpeed / Parameter30701 ideal
#   speed?) must be confirmed. The bare Parameter cannot be canonicalized here:
#   one metric cannot stand in for Parameter30700(CSV)/30750/30758/30761/30710 —
#   its decomposition is an OPEN follow-up (see PR body). Until resolved, Phase-9
#   line aggregation (needs Parameter30700) will NOT fire; lines rely on their
#   OWN bare-topic count stream instead.

sparkplug:
  group_id: CPACK
  # DISTINCT from plc-sim's edge node ("plc-sim"). Two SparkPlug edge nodes
  # under the SAME group publishing the SAME metric names would double-source
  # ent3 at edge-transformer — which is why the cutover STOPS plc-sim before
  # the agent goes live (see compose service comment + PR description).
  edge_node_id: cpack-tee
  packml_topic: CPACK/SC

  # Mode-A: the agent both subscribes raw tags from AND publishes SparkPlug to
  # the internal mosquitto. In Mode-A direct-to-ingest the raw-tag MQTT
  # subscriber sits idle (tags arrive via the HTTP front-door instead); the
  # uplink publishes spBv1.0/CPACK/... which edge-transformer decodes.
  internal_broker: tcp://mosquitto:1883
  raw_topic: edge/raw/cpack/#
  uplink_broker: tcp://mosquitto:1883

  # Mode-B mTLS material (secret refs, never values). Empty on the staging
  # loopback — no WAN crossing to authenticate here.
  uplink_tls_cert_ref: ""
  uplink_tls_key_ref: ""
  uplink_ca_ref: ""

# ── raw_tag_map ──────────────────────────────────────────────────────────────
# metric_suffix : the EXACT suffix the tee sends (full name = packml_topic +
#                 suffix). This is the strict allowlist key.
# name (opt.)   : the full canonical SparkPlug name to PUBLISH instead of
#                 packml_topic+suffix — the normalization seam (agentcfg
#                 FullName). Used to remap CurMachSpeed → MachSpeed.
# type          : SparkPlug datatype. counts/speed = double, StateCurrent = long,
#                 Parameter = string.
# ── raw_tag_map (REGENERATED from ent-3 packml_register, ADR-0045) ────────────
# packml_topic is now CPACK/SC (was CPACK/SC/LINHAS). metric_suffix is the FULL
# section-qualified path the CPACK tee actually sends (/LINHAS/…, /CELULA*/…,
# /SLEEVE/…); FullName = CPACK/SC + suffix EQUALS the register packml_topic, so
# the decoder routes each to its id_equipment. Generated, not hand-authored.
