agent:
  edge_node_id: bispharma-tee          # DISTINCT from plc-sim + every other tenant
  internal_broker: tcp://mosquitto:1883
  raw_topic: edge/raw/bispharma/#
  uplink_broker: tcp://mosquitto:1883
  mtls:                                # Mode-B mTLS CN=<tenant>; secret REFS only. Empty on staging loopback.
    cert_ref: ""
    key_ref: ""
    ca_ref: ""

# ── Node-RED tee snippet parameters (→ bispharma-tee-node.json) ───────────────
# Bispharma ALREADY runs Node-RED on-site (flow: pack-queue at /home/pi/.node-red,
# pm2, Raspberry Pi) → the tee path (their-NodeRED + tee), NOT our client-edge
# container. BUT their tee is NOT a dumb forwarder like CPACK's: their flow emits
# count-index JSON, so the tee needs a transform that maps each counterData{id,value}
# to a SparkPlug metric  name=<TOPIC>/Admin/ProdProcessedCount/<id>/Unit  before POSTing.
# See profile.md "Recommended edge approach". ingest_url is the staging front-door TBD.
tee:
  ingest_url: "https://TODO-staging-ingest-front-door:8446/ingest/sparkplug"  # TODO(tenant-prep)
  ingest_key_env: BISPHARMA_INGEST_KEY
  gateway: bispharma-edge
  tls_insecure: true                   # staging self-signed
