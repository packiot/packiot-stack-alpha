# bispharma.descriptor.yaml — BISPHARMA CLIENT DESCRIPTOR (ADR-0045 P1).
#
# FILLED FROM THE CLIENT'S LEGACY NODE-RED FLOW (bispharma.json — 16 S7 endpoints,
# 16 s7-in, 19 function nodes, 1 GCP PubSub out). Unlike the intake doc's original
# "greenfield, zero PLC facts" assumption, the legacy flow IS the client's ground
# truth and resolves intake §1/§2/§4/§5 outright. See docs/clients/bispharma-profile.md
# for the full extraction, node-by-node provenance, and the CONFIRMED-vs-NEEDS-CLIENT
# ledger. Every equipment row below cites the flow node it came from.
#
# ⚠️  DRAFT / OBSERVE-MODE descriptor. It VALIDATES and onboard-gen emits all four
#     artifacts from it, but it is NOT cutover-ready — three classes of value are
#     PROVISIONAL and must be confirmed before a real cutover (see profile.md §Gaps):
#       1. enterprise_id + all id_equipment  → synthetic staging block; reassign in tenant-prep
#       2. site/area/machine NAMES           → only L18's machines are named by the flow;
#          "SP", "LINHAS", and S1..S6 station labels are placeholders (COSMETIC / NEEDS-CLIENT)
#       3. rated speeds                       → NONE in the flow (counters-only); NEEDS-CLIENT
#     count_index values, by contrast, are CONFIRMED-FROM-FLOW (the flow emits `id:<N>`
#     verbatim) — the inverse of CPACK, whose indices were inferred pending a live tee.
#
# HOW BISPHARMA DIFFERS FROM CPACK (do NOT assume CPACK conventions — see profile.md):
#   • NO topic strings in the flow at all — routing is by numeric count-index id
#     (124..685). The canonical topics below are SYNTHESIZED by us to fit the
#     stack's topic-keyed model; the count_index is the real legacy routing key.
#   • Counters-ONLY: no MachSpeed, no StateCurrent, no PackML Parameter tags.
#     → Performance needs rated speeds (NEEDS-CLIENT); Availability inferred from activity.
#   • Absolute totalizers (S7 DINTs) — BUT the edge flow already computes per-cycle
#     deltas (`increment`) in Node-RED context with a reset-guard. Both value+increment
#     are published. See profile.md for the delta-ownership implication.
#   • Pure telemetry — ZERO back4-api / http-request / customization nodes (2nd axis empty).

tenant: BISPHARMA

enterprise_id: 4                 # PROVISIONAL — legacy prod bispharma enterprise = 4 (a
                                 # ~65-user shell with zero topology). Staging will likely
                                 # assign its own surrogate in tenant-prep (CPACK: prod 1 →
                                 # staging 3). MUST be > 0 for the register cross-tenant guard.

canonical:
  prefix: BISPHARMA/SP           # PROVISIONAL site code "SP". The flow carries NO topic
                                 # strings, so this whole prefix is our synthesis. Confirm the
                                 # real site short-code with the client (intake §7).

# ── raw → canonical mapping ───────────────────────────────────────────────────
# The flow emits count-index JSON, NOT topic strings, so there are no raw-topic
# quirks to fix up here (no C-PACK/→CPACK/ analogue). The raw→canonical bridge for
# bispharma is the count-index → synthesized-topic map, expressed per-member below
# as count_index overrides. Left empty; see profile.md "edge approach" for the
# count-index→SparkPlug transform the tee must add.
mapping:
  count_index_default_mode: equipment_id   # fallback only; every member pins an explicit
                                           # confirmed count_index override below.
  prefix_fixups: []
  metric_aliases: []
  parameter_aliases: []

# ── metric templates — COUNTERS-ONLY (no speed, no state, no Parameter) ────────
# Each bispharma count-index is a SINGLE S7 DINT totalizer, so a member carries
# exactly one indexed count leaf. MachSpeed/StateCurrent are DROPPED (absent on the
# PLC) → the counters-only OEE path: Performance from rated speed (NEEDS-CLIENT),
# Availability inferred from count activity. NOTE (profile.md §semantics): the count
# leaf is labelled ProdProcessedCount for every channel, but a channel's TRUE role
# (infeed / station / final-output / scrap) is set by its station position — the
# SCRAP members (…/SCRAP) are really ProdDefectiveCount (DW0−DW4). Assign OEE roles
# per line once the client confirms which station is the line's good-output counter.
metric_templates:
  line:
  - {leaf: "/Admin/ProdProcessedCount", type: double}
  - {leaf: "/Admin/ProdConsumedCount", type: double}
  - {leaf: "/Admin/ProdDefectiveCount", type: double}
  member:
  - {leaf: "/Admin/ProdProcessedCount/{idx}/Unit", type: double}

# ── equipment inventory (16 lines tp=3 + 91 members tp=1) ─────────────────────
# ONE tp=3 line per S7 PLC (flow: 16 'counters LXX' nodes). ONE tp=1 member per
# emitted count-index (the flow's counterData[].id). id_equipment = SYNTHETIC staging
# block 40001+ (lines) / 40101+ (members) — reassign from a free staging block in
# tenant-prep; NOT the count index (#601). count_index.value = the flow's literal id
# (CONFIRMED-from-flow). Member names: L18's are the flow's real station labels
# (Prensa/Torno/Acumulador/Impressao/Tampadeira); all other Sn labels are positional
# placeholders by DW offset (DW0=S1_INFEED, DW8=S3, DW12=S4, DW16=S5, DW20=S6_OUTPUT,
# DW0−DW4=SCRAP) — COSMETIC, rename on client confirmation. L18's 3 'livre' (spare,
# unwired) channels 545/547/550 are intentionally NOT registered.
