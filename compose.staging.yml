# compose.staging.yml — App EC2 service stack (staging, us-east-1)
#
# Service map:
#   rabbitmq          :5672/:15672 — AMQP message bus; management UI at rabbitmq.staging.packiot.com
#   hasura            :8081        — Hasura GraphQL → hasura.staging.packiot.com
#   edge-api          :8080        — NestJS REST/admin API → api.staging.packiot.com
#   edge-nodered      :1880        — Edge Node-RED → nodered.staging.packiot.com
#   oeecloud          (internal)  — Cloud OEE Node-RED (no public vhost needed)
#   grafana           :3000        — Grafana dashboards → grafana.staging.packiot.com
#   loki              (internal)  — Log aggregation (Grafana datasource)
#   promtail          (internal)  — Docker log collector → Loki
#
# Differences from compose.development.yml:
#   - No postgres: DB runs on a separate private-subnet EC2
#   - No tests (dev-only)
#   - All ports bound to 127.0.0.1 — Nginx terminates TLS externally
#   - DISABLE_EDITOR=true on Node-RED instances (production mode)
#   - Secrets loaded from /opt/packiot/.env (symlinked to .env by app_init.sh)
#
# Deploy: docker compose -f compose.staging.yml up -d --build

networks:
  packiot-net:
    driver: bridge
    ipam:
      config:
        # Static ipv4_address assignments (below) occupy .2–.38 + .200. Without an
        # ip_range, Docker auto-assigns dynamic/hand-run containers from the WHOLE
        # subnet — so a hand-run container (e.g. an onboarding sim/agent) can grab a
        # static slot whose service is momentarily down, and that service then fails
        # to (re)create with "Address already in use" (the hasura-init exit-128 /
        # gate-red incident; cf. #75). Confine dynamic allocation to .128–.191, well
        # clear of every static, so explicit statics and dynamic containers never race.
        - subnet: 172.18.0.0/24
          ip_range: 172.18.0.128/26

volumes:
  nr-edge-data:
  grafana-data:
  loki-data:
  prom-data:
  tempo-data:   # Tempo trace blocks + WAL (48h retention)
  alertmanager-data:   # Alertmanager silences + notification state
  rabbitmq-data:
  mosquitto-data:   # ADR-0011 P0-2: retained NBIRTHs survive broker restart
  edge_transformer_outbox:  # ADR-0011 P2: SQLite outbox survives container restart
  edge_transformer_agent_outbox:  # ADR-0042 P1: sparkplug-agent-cpack store-and-forward outbox

# ── IP allocation ──────────────────────────────────────────────────────────────
# .2  hasura       .3  edge-api      .4  edge-nodered   .5  rabbitmq
# .7  grafana      .8  loki          .9  promtail
# .10 pgbouncer    .11 simulator     .12 authentik-server  .13 authentik-worker  .14 authentik-redis
# .15 hasura-init  .16 db-migrate    .17 adminer
# .20 oeecloud-worker  .21 mirror-worker-go  .22 prometheus
# .23 edge-transformer (ADR-0009 Phase 2; reserved, NOT yet wired — see commented service block below)
# .24 mosquitto (ADR-0010 Phase 2 MQTT broker; ADR-0011 P0-2 durability config)
# .29 ingest-shim (HTTPS→RabbitMQ ingress for Incoplast SparkPlug; publishes :8444, metrics :9105)
# .35 app-redis (ADR-0035 application cache for refdata-api cache-aside; SEPARATE from authentik-redis .14)
# .37 redis-exporter (white-box Redis metrics on :9121; scrapes authentik-redis today, ADR-0035 app-redis later)
# .6 (oeecloud Node-RED, decommissioned 2026-06-23) and .18 (mirror-worker TS, decommissioned 2026-06-24) reserved — do not reuse without confirming consumers are gone
# (one-shot; static IP prevents IPAM race with .3)

services:
  # ── PgBouncer (PostgreSQL connection pooler) ───────────────────────────────────
  # Sits between app services and the external TimescaleDB EC2.
  # Pool mode: transaction — each query borrows a server connection and releases it
  # immediately. Multiplexes up to MAX_CLIENT_CONN=100 app connections onto
  # DEFAULT_POOL_SIZE=5 real PostgreSQL connections.
  #
  # ⚠ Hasura does NOT use PgBouncer: it relies on prepared statements that are
  # incompatible with transaction-mode pooling. Cap its pool directly instead
  # via HASURA_GRAPHQL_PG_CONNECTIONS.
  #
  # Services routed here: edge-api, oeecloud, simulator.
  # Services kept direct: hasura (prepared stmts), db-migrate (DDL/advisory locks).
  pgbouncer:
    image: edoburu/pgbouncer:1.22.1-p0
    restart: unless-stopped
    environment:
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: "20"
      MAX_CLIENT_CONN: "200"
      AUTH_TYPE: scram-sha-256
      # Clean up open transactions when server connections are returned.
      # Prevents idle-in-transaction buildup that exhausts the server pool.
      SERVER_RESET_QUERY: "ROLLBACK"
      SERVER_RESET_QUERY_ALWAYS: "1"
      # Cancel queries waiting >60s in PgBouncer (prevents oeecloud pool exhaustion).
      QUERY_TIMEOUT: "60"
      # Reclaim idle server connections after 120s (default 600s).
      SERVER_IDLE_TIMEOUT: "120"
    # ── ADR-0032 Step 1: ADDITIVE packiot_shadow (F3) pool ─────────────────────
    # The edoburu entrypoint (/entrypoint.sh) generates userlist.txt + a
    # pgbouncer.ini from the env vars above, then `exec "$@"` (this command).
    # We let that generation run UNTOUCHED — the `packiot` (F1) pool line and
    # every [pgbouncer] setting stay byte-identical to today (zero regression) —
    # and only INSERT one extra [databases] line for the F3 shadow DB before
    # launching pgbouncer. Same host/port/user; only dbname differs. The
    # existing userlist entry covers this pool (same DB user).
    #   Reversible: delete this `command:` block → back to the packiot-only pool.
    #   $$VAR (double-$) escapes Compose interpolation so the container shell
    #   expands DB_HOST/DB_PORT/DB_USER from the env: block above at runtime.
    #   Default-F1 posture: this only ADDS a route; no consumer points at it
    #   until refdata REFDATA_FLOW flips to f3 (below) or a Grafana board is
    #   switched to the packiot-postgres-shadow datasource.
    command:
      - /bin/sh
      - -c
      - 'sed -i "s|^\[databases\]|[databases]\npackiot_shadow = host=$$DB_HOST port=$$DB_PORT dbname=packiot_shadow auth_user=$$DB_USER|" /etc/pgbouncer/pgbouncer.ini && exec /usr/bin/pgbouncer /etc/pgbouncer/pgbouncer.ini'
    networks:
      packiot-net:
        ipv4_address: 172.18.0.10
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── RabbitMQ (message bus) ─────────────────────────────────────────────────────
  # AMQP 0.9.1 broker: edge-nodered publishes to the `oee` exchange,
  # oeecloud subscribes via the `oeecloud-q` durable queue.
  # Management UI at rabbitmq.staging.packiot.com (port 15672 via Nginx).
  # Internal AMQP port 5672 is available to services on packiot-net.
  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # Enable the built-in rabbitmq_prometheus plugin (exposes :15692/metrics —
      # queue depth, message rates, connections, memory) alongside the
      # management UI. Overrides the image default, so management is listed too.
      - ./monitoring/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      # load_definitions re-applies the least-priv users on every boot (survives
      # a broker recreate — the 2026-07-10 trap). definitions.json is generated
      # at deploy from the template + Secrets Manager (gitignored — has secrets).
      - ./monitoring/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./monitoring/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    networks:
      packiot-net:
        ipv4_address: 172.18.0.5
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}

  # ── plc-sim (10.9-staging: THE ingest source — Sparkplug B over MQTT) ──
  plc-sim:
    # OPT-IN — profile `plc-sim`. Historically plc-sim was a DEFAULT service (no
    # profiles key), so every `docker compose up -d` (the deploy step recreates
    # the stack) unconditionally (re)started it. That made a CPACK cutover
    # non-durable: `stop plc-sim` + `--profile cpack-tee up sparkplug-agent-cpack`
    # holds until the next deploy, whose `up -d` resurrects plc-sim while the
    # profiled agent (already running, not an orphan) survives untouched → BOTH
    # sources publish the SAME CPACK/SC/LINHAS namespace under two edge nodes
    # (plc-sim + cpack-tee) → ent3 is DOUBLE-SOURCED at edge-transformer. Gating
    # plc-sim behind its own profile makes the deploy honor the intended
    # end-state: `COMPOSE_PROFILES` (GH Actions env / EC2 /opt/packiot/.env)
    # selects exactly one source — `plc-sim` (sim-on/agent-off, the historical
    # default) OR `cpack-tee` (agent-on/sim-off, the real-tee cutover). Setting
    # BOTH is the double-source trap above — the two scopes are IDENTICAL (the
    # same 8 equipment {47,48,49,51,53,57,61,63}), so they must NEVER both run.
    profiles: ["plc-sim"]
    build:
      context: ./services/edge-transformer
    entrypoint: ["/usr/local/bin/plc-sim"]
    environment:
      MQTT_BROKER_URL: "tcp://mosquitto:1883"
      PLC_SIM_TICK_SEC: "5"
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    networks:
      # Pin a static IP outside the low sequential dynamic-allocation range.
      # plc-sim has no static IP historically — during a partial redeploy where
      # edge-nodered (static 172.18.0.4) was removed first, Docker IPAM handed
      # plc-sim edge-nodered's freed .4, so edge-nodered then failed to attach
      # ("Address already in use", 2026-07-09). Pinning plc-sim removes it from
      # the dynamic pool so it can never squat a reserved slot again.
      packiot-net:
        ipv4_address: 172.18.0.200
    mem_limit: 64m

  # ── sparkplug-agent-cpack (ADR-0042 P1 — Mode-A CPACK validation) ─────────────
  # The Tier-2 transmission plane fed by a TEE of CPACK's real Node-RED raw
  # tags. The tee POSTs the rawtag JSON envelope to this agent's HTTP
  # front-door (:9104, /v1/tags); the agent runs a full SparkPlug B session and
  # publishes spBv1.0/CPACK/... to the INTERNAL mosquitto — which edge-transformer
  # already subscribes to (USE_GO_PORT + CALC_CUTOVER_REFACTORED on) → full prod
  # Calc → F3. This closes the standing "CPACK real data bypasses the Calc" gap
  # (today ent3 is plc-sim synthetic).
  #
  # OPT-IN — profile `cpack-tee`, so it does NOT start on a default bring-up.
  # Staging keeps running on plc-sim until the tee is ready. The agent uses a
  # DISTINCT edge_node_id (cpack-tee ≠ plc-sim's node), so if BOTH ran they would
  # DOUBLE-SOURCE ent3 (two edge nodes, same CPACK metric names → double-count).
  #
  #   ── CUTOVER (real tee goes live) ──────────────────────────────────────────
  #     docker compose -f compose.staging.yml stop plc-sim
  #     docker compose -f compose.staging.yml --profile cpack-tee up -d sparkplug-agent-cpack
  #   ── ROLLBACK (back to sim) ────────────────────────────────────────────────
  #     docker compose -f compose.staging.yml stop sparkplug-agent-cpack
  #     docker compose -f compose.staging.yml start plc-sim
  #
  # The HTTP front-door is INTERNAL-ONLY here (no host port published). The
  # public HTTPS front-door (nginx + cert + SG rule scoped to CPACK's egress IP)
  # is spec'd in docs/adr/0042-cpack-tee-frontdoor.md — the SG open is
  # USER-gated (terraform), NOT applied by this compose.
  sparkplug-agent-cpack:
    profiles: ["cpack-tee"]
    build:
      context: ./services/edge-transformer
    container_name: sparkplug-agent-cpack
    entrypoint: ["/usr/local/bin/sparkplug-agent", "--config", "/etc/packiot/agent.yaml"]
    restart: unless-stopped
    env_file: [.env]
    environment:
      LOG_LEVEL: info
      AGENT_CONFIG: /etc/packiot/agent.yaml
      HEALTH_PORT: "9103"
      # Loopback with no live raw-tag MQTT publisher (tags arrive via HTTP) is
      # idle by design — disable the idle-degradation check so /healthz tracks
      # broker connectivity only. A permanently-red probe trains ops to ignore red.
      MQTT_STALE_THRESHOLD_SECONDS: "-1"
      OUTBOX_PATH: /var/lib/edge-transformer/agent-outbox.db
      # ── HTTP raw-tag front-door (Mode-A direct-to-ingest) ─────────────────
      AGENT_HTTP_INGEST_ENABLED: "true"
      AGENT_INGEST_PORT: "9104"
      # Ingest API key — REQUIRED, no default (agent refuses to serve ingest
      # unset). Value lives in /opt/packiot/.env; hand it to the CPACK Node-RED
      # tee as the X-Ingest-Key header. # FILL AT DEPLOY
      AGENT_INGEST_API_KEY: ${AGENT_INGEST_API_KEY:-}
    volumes:
      # agentcfg descriptor (topic prefix + raw_tag_map) — read-only.
      - ./docs/clients/cpack-agent.yaml:/etc/packiot/agent.yaml:ro
      - edge_transformer_agent_outbox:/var/lib/edge-transformer
    networks:
      packiot-net:
        ipv4_address: 172.18.0.38   # next free in the /24 ledger (2–37, .200 taken)
    depends_on:
      mosquitto:
        condition: service_healthy
    # Distroless → binary self-probes /healthz via the --healthcheck subcommand.
    healthcheck:
      test: ["CMD", "/usr/local/bin/sparkplug-agent", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # ── S7 end-to-end (profile: s7) — S1/#32 PR3 ──────────────────────────────────
  # Opt-in scaffolding to run the REAL S7 read path live in staging, where there
  # is no physical PLC. Neither service starts in the default bring-up; enable
  # with `--profile s7` (or COMPOSE_PROFILES=s7). Flow:
  #
  #   s7-softplc  --(S7comm / ISO-on-TCP :102)-->  s7-reader
  #     (pure-Go in-memory PLC, counters climb)      (gos7 client → SparkPlug B)
  #                                                       │ NBIRTH/NDATA over MQTT
  #                                                       ▼
  #                                              mosquitto → edge-transformer → F1/F3
  #
  # This proves the gos7 wire path + tag→PackML mapping end-to-end against a real
  # S7 endpoint, with no Snap7/C library and no CGo (the soft-PLC is pure Go; the
  # same server type backs the internal/s7/softplc wire-level unit test).
  s7-softplc:
    profiles: ["s7"]
    build:
      context: ./services/edge-transformer
    entrypoint: ["/usr/local/bin/s7-softplc"]
    environment:
      LISTEN_ADDR: ":102"      # S7 ISO-on-TCP port
      S7_DB: "100"             # data block the demo tags read
      SOFTPLC_TICK_SEC: "5"    # counters advance every 5s so OEE sees production
    restart: unless-stopped
    # Static IP (like every other service on packiot-net): an unpinned service
    # draws a DYNAMIC IP from the same /24 and can squat another service's
    # declared static address while that service is momentarily down during a
    # recreate — causing "Address already in use" on the static owner's next
    # start (the 2026-07-17 simulator→hasura .2 collision that blocked staging
    # deploys). Profile-gated, but pinned so `--profile s7` can't re-trigger it.
    networks:
      packiot-net:
        ipv4_address: 172.18.0.33   # reachable as s7-softplc:102 on the compose net
    mem_limit: 32m

  s7-reader:
    profiles: ["s7"]
    build:
      context: ./services/edge-transformer
    entrypoint: ["/usr/local/bin/s7-reader"]
    environment:
      MQTT_BROKER_URL: "tcp://mosquitto:1883"
      S7_HOST: "s7-softplc:102"   # the soft-PLC (a real S7 line sets this to the PLC)
      S7_RACK: "0"
      S7_SLOT: "2"
      S7_GROUP: "INCOPLAST"       # SparkPlug group_id / tenant (first topic segment)
      S7_EDGE_NODE: "s7-reader"
      S7_TICK_SEC: "5"
      # Demo tag set (no CLIENT_CONFIG): DB100 → the four NOVOFLEX_15 tags in
      # cmd/s7-reader. For a landed F1/F3 row the topic must exist active in
      # packml_register for the tenant; the mechanism here is PLC → SparkPlug.
    depends_on:
      mosquitto:
        condition: service_healthy
      s7-softplc:
        condition: service_started
    restart: unless-stopped
    # Static IP — see the s7-softplc note above (unpinned services can squat a
    # static address during a recreate → "Address already in use").
    networks:
      packiot-net:
        ipv4_address: 172.18.0.34
    mem_limit: 64m

  # ── Mosquitto (MQTT broker for Sparkplug B, ADR-0010) ──────────────────────────
  # Factory-side MQTT broker. PLCs publish Sparkplug B here; edge-transformer
  # subscribes to `spBv1.0/+/+/+/+` and bridges the decoded data into RabbitMQ.
  #
  # ADR-0011 rule 1 + P0-2: persistence is enabled in the config file so
  # retained NBIRTHs survive broker restart. Without this, every subscriber
  # that reconnects after Mosquitto restarts silently under-reports metrics
  # until the next NBIRTH — up to several minutes of blind spot per publisher.
  #
  # Anonymous auth for MVP staging; ADR-0011 P0-2b follow-up moves to
  # password-file + ACL keyed to AWS Secrets Manager.
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    # tini as PID 1 reaps zombies. eclipse-mosquitto runs mosquitto as PID 1,
    # which does NOT reap the docker-exec'd healthcheck children — over days
    # they leak into the container's pids cgroup until it hits pids.max and
    # fork() returns EAGAIN, failing the healthcheck and blocking every deploy
    # (incident 2026-07-09: 4578 zombie PIDs). init:true prevents recurrence.
    init: true
    ports:
      # AMQP-adjacent: bind only to loopback on the host. Intra-stack traffic
      # goes via packiot-net; external factory PLCs reach us via nginx/ALB.
      - "127.0.0.1:1883:1883"
    volumes:
      - ./configs/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data       # persistence — ADR-0011 P0-2
    networks:
      packiot-net:
        ipv4_address: 172.18.0.24
    healthcheck:
      # Publish a heartbeat via mosquitto_pub — the exit code tells us the
      # broker is accepting client connections. `-W` was mosquitto 1.x-only
      # and got removed in 2.x. Timeout is enforced via the CMD-SHELL wrapper.
      test: ["CMD-SHELL", "timeout 5 mosquitto_pub -h 127.0.0.1 -t 'healthcheck/ping' -m 'ok' -q 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}

  # ── Hasura GraphQL ─────────────────────────────────────────────────────────────
  hasura:
    image: hasura/graphql-engine:v2.44.0
    restart: unless-stopped
    env_file: [.env]
    environment:
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "false"
      # query-log added 2026-07-02 (task #86 / docs/audits/hasura-review-2026.md):
      # logs every GraphQL operation so a 30-day window can confirm the
      # 7-named-query enumeration before any retirement decision. Logs
      # ship to Loki via promtail; enumerate with
      #   {container="stack-hasura-1"} |= "query-log"
      # NOTE: this covers STAGING only — prod is Hasura Cloud
      # (strong-cicada-30); enable query logging there via the cloud
      # console to observe the endpoint customers actually hit.
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup,http-log,webhook-log,websocket-log,query-log
      # Cap pool: Hasura defaults to 50 connections which alone saturates
      # TimescaleDB's max_connections=50. Keep Hasura direct (no PgBouncer)
      # because it uses prepared statements incompatible with transaction pooling.
      HASURA_GRAPHQL_PG_CONNECTIONS: "5"
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      packiot-net:
        ipv4_address: 172.18.0.2
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  hasura-init:
    image: curlimages/curl:latest
    networks:
      packiot-net:
        ipv4_address: 172.18.0.15
    env_file: [.env]
    depends_on:
      hasura:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    volumes:
      - ./edge-node-red/hasura/metadata.json:/metadata.json:ro
    entrypoint:
      - sh
      - -c
      - |
        METADATA=$$(sed '1s/{/{\"allow_inconsistent_metadata\":true,/' /metadata.json)
        printf '%s' "{\"type\":\"replace_metadata\",\"version\":2,\"args\":$${METADATA}}" > /tmp/payload.json
        for i in 1 2 3 4 5; do
          curl -sf -X POST http://hasura:8080/v1/metadata \
            -H 'Content-Type: application/json' \
            -H "X-Hasura-Admin-Secret: $${HASURA_GRAPHQL_ADMIN_SECRET}" \
            -d @/tmp/payload.json && echo "Hasura metadata applied" && \
          curl -sf -X POST http://hasura:8080/v1/metadata \
            -H 'Content-Type: application/json' \
            -H "X-Hasura-Admin-Secret: $${HASURA_GRAPHQL_ADMIN_SECRET}" \
            -d '{"type":"reload_metadata","args":{}}' && echo "Hasura metadata reloaded" && exit 0
          echo "Attempt $$i failed — retrying in 3s..."
          sleep 3
        done
        echo "Hasura metadata apply FAILED after 5 attempts" && exit 1
    restart: "no"

  # ── DB Migrations (one-shot) ──────────────────────────────────────────────────
  # Applies all pending Knex migrations against the external Postgres DB.
  # Uses the development Docker target so knex + ts-node (devDeps) are available.
  # edge-api and hasura-init both wait for this to succeed before starting.
  db-migrate:
    build:
      context: ./edge-api
      target: migrate
    env_file: [.env]
    environment:
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      packiot-net:
        ipv4_address: 172.18.0.16
    restart: "no"
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── Edge API (NestJS) ──────────────────────────────────────────────────────────
  edge-api:
    build:
      context: ./edge-api
      target: production
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      NEW_RELIC_ENABLED: "false"
      NEW_RELIC_NO_CONFIG_FILE: "true"
      # PO staleness/conflict gate (task #32). Master on + per-enterprise
      # allowlist (CSV of surrogate id_enterprise). "3,4" = CPACK-Staging(3) +
      # Incoplast-Staging(4) — both synthetic on staging, so global-ish signal
      # with zero customer risk. Gate is fail-safe (degrade-to-allow on drift;
      # rejects only STALE_HEAD/RANGE_CONFLICT/BEYOND_HORIZON → HTTP 409).
      # Watch board v2-po-staleness-gate: 409-rate MUST stay 0 (alarm),
      # liveness non-zero, degrade-by-reason trends down as #34 backfill cleans.
      # Rollback: set ENABLED "false" (or drop these two) → redeploy → inert.
      PO_STALENESS_GATE_ENABLED: "true"
      PO_STALENESS_GATE_ENTERPRISES: "3,4"
      # Distributed tracing → Tempo (OTLP/gRPC). Present = tracing on (src/
      # tracing.ts starts the NodeSDK). Completes the operator → operator-adapter
      # → edge-api → DB trace: the adapter's outbound traceparent continues into
      # edge-api's http span, and pg (pg-promise's driver) adds the DAO spans.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      OTEL_SERVICE_NAME: edge-api
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: pgbouncer
      # ── ADR-0035: app-redis reachability (PLUMBED, NOT YET CONSUMED) ──────────
      # edge-api does NOT cache anything today. This just makes the shared app
      # cache reachable so a future enhancement can land without a compose change:
      # (a) write-through cache INVALIDATION (edge-api write → publish an invalidate
      #     so refdata's short TTL isn't the only self-heal), and/or
      # (b) moving the count engine's in-process per-tenant memState to shared
      #     Redis (fixes the single-writer-per-tenant gap). See the ADR.
      # No edge-api code reads REDIS_URL yet — present only for documentation +
      # future wiring; removing it changes nothing today.
      REDIS_URL: redis://app-redis:6379/0
      # ── ADR-0033 d3: Bearer-JWT dual-accept write-auth (PR #158) ──────────────
      # AuthMiddleware accepts a Cognito OR Firebase USER JWT (RS256, verified
      # against the issuer JWKS) IN ADDITION to the existing x-api-key/?token=
      # api-key path — both resolve the SAME res.locals.callerEnterpriseId the
      # TenantFence fences on, so a JWT write is tenant-fenced identically to an
      # api-key write. This unblocks front4 dropping the browser-stored api-key.
      # All PUBLIC identifiers (pool id / app-client id / issuer) — NOT secrets:
      # no signing key, no client secret. Consumed by src/shared/auth/
      # bearer-jwt.config.ts (resolveBearerJwtConfig). JWKS URIs are derived
      # (COGNITO_JWKS_URI defaults to <issuer>/.well-known/jwks.json; FIREBASE_
      # JWKS_URI defaults to the Google securetoken JWK endpoint) — override only
      # for a non-standard endpoint. Reversible kill switch: AUTH_BEARER_ENABLED=
      # "false" → Bearer path inert, api-key path unchanged (instant rollback).
      AUTH_BEARER_ENABLED: "true"
      COGNITO_ISSUER: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_0T9t1sTwt
      COGNITO_CLIENT_ID: 2ckuoa0ov598rdpdn3uv039h6e
      # CS-Admin auth + onboarding for csadmin.staging (the staging test tier).
      # Hardcoded here (not .env) so a deploy that regenerates .env can't wipe
      # them — that broke csadmin.staging auth (403) until they were restored.
      # Dual-accept: no Bearer → api-key path unchanged (safe for other consumers).
      COGNITO_USER_POOL_ID: us-east-1_0T9t1sTwt
      COGNITO_CS_ADMIN_GROUP: cs-admin
      EDGE_API_COGNITO_AUTH_ENABLED: "true"
      EDGE_API_ONBOARDING_ENABLED: "true"
      # Onboarding generate path: edge-api proxies the stored descriptor to
      # edge-transformer's onboard server (POST /v1/onboard/generate). Config here,
      # the shared key from .env/Secrets.
      ONBOARD_GENERATE_URL: http://edge-transformer:9105/v1/onboard/generate
      ONBOARD_API_KEY: ${ONBOARD_API_KEY}
      FIREBASE_ISSUER: https://securetoken.google.com/fbpackiot
      FIREBASE_AUDIENCE: fbpackiot
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      packiot-net:
        ipv4_address: 172.18.0.3
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  # ── Edge Node-RED ──────────────────────────────────────────────────────────────
  edge-nodered:
    # RETIRED (2026-08-16): dead legacy Node-RED. oeecloud-nodered is already gone;
    # the new stack ingests via edge-transformer and serves the operator via
    # edge-api (/session, /api/*) + refdata-api (/v1/*). The deployed operator SPA
    # makes ZERO calls here (the operator nginx regex to :1880 is vestigial). Its
    # only remaining consumer was the (also-gated) `simulator`. csadmin generates
    # the per-client EDGE Node-RED (ADR-0045) — that is unrelated to this cloud
    # container. Gated behind the `legacy-sim` profile so it no longer starts by
    # default; enable with COMPOSE_PROFILES=legacy-sim if ever needed.
    profiles: ["legacy-sim"]
    build:
      context: ./edge-node-red
    restart: unless-stopped
    env_file: [.env]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      ID_PUBSUB_NODE: staging-app-ec2
      LOG_LEVEL: info
      # GraphQL polling flows query production views that don't exist in staging
      # (v_operator_po_list_setup_4 etc.) — each failed call takes 2-5s.
      # Now that the editor is enabled, disable those flows directly in Node-RED
      # UI to stop the CPU burn without hiding HASURA_URL from the container.
      HASURA_URL: http://hasura:8080/v1/graphql
      HASURA_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET}
      API_KEY: ${EDGE_API_KEY}
      FIREBASE_API_KEY: bypassed-by-hasura-admin-secret
      EDGE_API_BASE_URL: http://edge-api:8080
      # Scope edge-nodered's GraphQL entities query (GraphQL.json:240) to
      # CPACK-Staging (id_enterprise=3). Otherwise the unscoped query
      # `v_operator_entities_2[0]` lands on whichever enterprise is first
      # in the view's natural ordering — on staging that's SimCorp,
      # making /machines/:lineId etc. return SimCorp data even for the
      # CPACK-permission user. Hardcoded because edge-nodered's design is
      # one-enterprise-per-edge; this overrides for the multi-tenant
      # staging shape.
      ID_ENTERPRISE: "3"
    # Bypass Docker's embedded DNS (intermittent EAI_AGAIN under load) by
    # resolving all intra-stack hostnames via /etc/hosts instead.
    extra_hosts:
      - "hasura:172.18.0.2"
      - "rabbitmq:172.18.0.5"
      - "edge-api:172.18.0.3"
      - "pgbouncer:172.18.0.10"
    ports:
      - "127.0.0.1:1880:1880"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:1880/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      rabbitmq:
        condition: service_healthy
      hasura-init:
        condition: service_completed_successfully
    networks:
      packiot-net:
        ipv4_address: 172.18.0.4
    volumes:
      - nr-edge-data:/data
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  # ── OEECloud Node-RED — DECOMMISSIONED 2026-06-23 ─────────────────────────────
  # Replaced by `oeecloud-worker` (Go) below. Removal flow:
  #   1. 24h parity-check passed (parity-check.sql sections A-E all green)
  #   2. 5-min isolation test: stopped this service, worker carried 100% of
  #      delivered messages (6074 acked, 0 nacks/failures) with no drop in
  #      equipment_values throughput (~570 rows/min, freshness <1.9s)
  #   3. AMQP queue oeecloud-q deleted (rabbitmqctl delete_queue)
  #   4. Docker volume stack_nr-oeecloud-data removed (~9 GB SQLite buffer reclaim)
  # See [[project_oeecloud_worker_migration]] for the full timeline.

  # ── Grafana ────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.5.0
    restart: unless-stopped
    env_file: [.env]
    # Bump `provisioning_rev` whenever grafana/provisioning/ files change.
    # Compose only recreates a service when its spec changes — provisioning
    # files are read at container boot, so without this marker Grafana would
    # silently ignore new datasources/dashboards on `docker compose up -d`.
    labels:
      - "provisioning_rev=2026-07-15-mount-dashboards-v2"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/01-oee-pipeline.json
      GF_USERS_DEFAULT_THEME: dark
      GF_FEATURE_TOGGLES_ENABLE: publicDashboards
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      packiot-net:
        ipv4_address: 172.18.0.7
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      # v2 boards — the provisioning `packiot-v2` provider points here, but the
      # mount was missing → Grafana logged "dashboards-v2: no such file or
      # directory" every 10s and NONE of the 16 v2 boards (00-15, incl. the PO
      # gate + database boards) were visible. Mount the dir so the v2 suite loads.
      - ./grafana/dashboards-v2:/var/lib/grafana/dashboards-v2:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}

  # ── Loki ───────────────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki/loki-local-config.yaml:/etc/loki/local-config.yaml:ro
      - ./monitoring/loki/rules:/etc/loki/rules:ro
      - loki-data:/loki
    networks:
      packiot-net:
        ipv4_address: 172.18.0.8
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── Promtail ───────────────────────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:3.4.2
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - ./monitoring/promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      packiot-net:
        ipv4_address: 172.18.0.9
    depends_on:
      loki:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── Prometheus ────────────────────────────────────────────────────────────────
  # Pull-based metrics collector for in-cluster services. Scrapes /metrics
  # endpoints listed in monitoring/prometheus/prometheus.yml. Retention is
  # capped both by time (15d) and size (2GB) — staging disk is finite; size
  # cap wins if cardinality ever spikes. Grafana datasource UID is
  # `packiot-prometheus` (see grafana/provisioning/datasources/prometheus.yml).
  #
  # Why pull over push: if a target dies, Prometheus notices the absent
  # scrape — no need to wait for a push to never arrive. Same observability
  # primitive as systemd-journald: the collector drives cadence and treats
  # silence as a signal.
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    restart: unless-stopped
    # Config + rules are a DIRECTORY bind mount (see volumes below), NOT two
    # single-FILE mounts. A single-file bind pins the source INODE at
    # container-create; git rewrites the file with a NEW inode on checkout
    # (atomic rename), so the running container kept reading the OLD inode —
    # prometheus.yml/rules.yml edits never reached it without a force-recreate
    # (task #39). A directory mount resolves each lookup through the dir, so
    # replaced files inside it become visible live. Content still needs a
    # config RELOAD (SIGHUP / POST /-/reload — --web.enable-lifecycle is set
    # below); the deploy-staging workflow issues that reload after `up -d`.
    # `config_rev` remains as a manual force-recreate escape hatch: bump it
    # only when a change needs a full container recreate (e.g. a command/flag
    # change), NOT for routine config/rule edits — those are reload-only now.
    # config_rev bumped for the exemplar-storage flag below — a --enable-feature
    # change is a command change, so it needs a force-recreate (a plain reload
    # won't pick up a new CLI flag), per the note above.
    labels:
      - "config_rev=2026-07-22-exemplars"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
      # Exemplar storage: lets Prometheus retain per-sample exemplars (a
      # trace_id label carried alongside a histogram observation). Grafana's
      # Prometheus datasource then renders them as clickable dots on latency
      # panels → jump straight to the Tempo trace (exemplarTraceIdDestinations
      # in grafana/provisioning/datasources/prometheus.yml). NOTE: this only
      # *stores* exemplars — services must still ATTACH trace_id exemplars to
      # their http_request_duration_seconds observations for dots to appear.
      # That is per-service code = a separate PR (see PR body TODO).
      - --enable-feature=exemplar-storage
    # TODO(traces, follow-up PR — NOT this PR, per-service code):
    #   1. Attach the active trace_id as a Prometheus EXEMPLAR on each service's
    #      http_request_duration_seconds histogram observations so the latency
    #      panels (boards 11/12) render clickable dots → Tempo. Without this,
    #      exemplar-storage above stores nothing and the dots never appear.
    #      - Go   (refdata-api / oeecloud-worker / operator-adapter): use the
    #        client_golang exemplar API (ObserveWithExemplar) pulling trace_id
    #        from the span context.
    #      - Node (edge-api): prom-client observe with an exemplar label.
    #   2. First-class table TraceQL: add otelpgx.WithIncludeQueryParameters and
    #      a db.sql.table span attribute (table extracted from the statement) so
    #      "find slow queries by table" becomes { span.db.sql.table = "..." }
    #      instead of the db.statement regex used on board 18 today.
    #   NOTE: mirror-worker-go + shadow-mirror are the two UNTRACED workers — do
    #      NOT instrument them; they are retiring.
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      packiot-net:
        ipv4_address: 172.18.0.22
    volumes:
      # Directory mount (task #39): follows inode replacement of prometheus.yml
      # / rules.yml on git checkout, unlike the previous two single-file mounts.
      # Read-only: prometheus only READS config here; tsdb is the separate
      # prom-data volume below, so :ro cannot block writes.
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prom-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── Exporters (2026-07-07: close the "bus+DB+host have zero white-box
  # telemetry" gap from the full-stack audit; G-track/ADR-0017 §3) ──────────────
  # postgres-exporter: white-box DB metrics (connections, locks, per-DB stats,
  # replication/WAL). Points at the DB EC2 directly (same host the workers'
  # shadow pool uses); auto-discovers packiot + packiot_shadow so the flip
  # needs no exporter change. Unblocks the CAgg-invalidation/disk alert
  # backlog named in monitoring/README.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/postgres?sslmode=disable"
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
      PG_EXPORTER_EXCLUDE_DATABASES: "template0,template1,authentik"
      # Deep DB metrics beyond the built-ins — connections-by-state, cache hit,
      # locks, longest query, tuple/deadlock/temp rates, table + hypertable
      # sizes. Cluster-wide queries are master:true so auto-discover doesn't
      # duplicate them per-DB. Consumed by the "Database" v2 Grafana board.
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/pgexporter/queries.yaml
    volumes:
      - ./monitoring/postgres-exporter/queries.yaml:/etc/pgexporter/queries.yaml:ro
    networks:
      packiot-net:
        ipv4_address: 172.18.0.28
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # node-exporter: app-EC2 host metrics (CPU, mem, DISK — the 2026-06-22
  # incident class). Read-only host mounts; scraped via the compose network.
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|var/lib/docker)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      packiot-net:
        ipv4_address: 172.18.0.27
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # redis-exporter: white-box Redis metrics (memory, keyspace, hit/miss,
  # connected clients, evictions, blocked clients, ops/sec). Redis was a total
  # telemetry blind spot — authentik-redis backs the whole auth flow yet emitted
  # ZERO metrics. REDIS_ADDR points at app-redis (authentik retired, ADR-0034 §C).
  # When ADR-0035's app-redis (.35) lands as the refdata-api cache-aside store,
  # add it via the exporter's multi-target mode (a second scrape target with a
  # ?target= relabel, same shape as blackbox) — no new exporter needed.
  redis-exporter:
    # NOTE: use the non-alpine tag — it is the only multi-arch manifest list
    # (linux/amd64 + linux/arm64/v8). The `-alpine` tag ships a single amd64
    # manifest, so on this arm64 staging host it crashlooped with
    # `exec /redis_exporter: exec format error` (1774+ restarts, reddening the
    # deploy service-state gate). platform pins the arm64 variant explicitly.
    image: oliver006/redis_exporter:v1.62.0
    platform: linux/arm64
    container_name: redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://app-redis:6379
    networks:
      packiot-net:
        ipv4_address: 172.18.0.37
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # tempo: distributed-tracing backend (the third pillar — metrics/logs/traces).
  # Single-binary mode, local block storage, 48h retention. Receives spans over
  # OTLP (gRPC :4317 / HTTP :4318) from the services' OpenTelemetry exporters;
  # Grafana queries it on :3200 (grafana/provisioning/datasources/tempo.yml).
  tempo:
    image: grafana/tempo:2.6.1
    container_name: tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./monitoring/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      packiot-net:
        ipv4_address: 172.18.0.31
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
    mem_limit: 512m

  # alertmanager: routes the Prometheus alert rules to Slack (they fired into the
  # void before). Slack webhook URL is a secret read from a mounted file
  # (monitoring/alertmanager/slack_api_url — gitignored, provided at deploy).
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    # PARKED until the Slack webhook is provisioned. alertmanager needs the
    # mounted `slack_api_url` secret (deferred); without it the container can't
    # start and reddens the whole deploy. `profiles` gates it out of a plain
    # `docker compose up` — re-enable by creating the secret file and running
    # with `--profile alerting` (or delete this line). Prometheus keeps its
    # alerting→alertmanager:9093 wiring; it simply no-ops while this is parked.
    profiles: ["alerting"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      # Task #41 (same class as #39/#40, now on the NOTIFICATION path). Config +
      # secret are a DIRECTORY bind mount, NOT two single-FILE mounts. A single-
      # file bind pins the source INODE at container-create; a deploy git-checkout
      # rewrites alertmanager.yml with a NEW inode (atomic rename), so the running
      # container kept reading the OLD inode — config edits never reached it, i.e.
      # SILENTLY BROKEN ALERTING (a stale route/receiver = pages that never fire),
      # exactly when you can least afford it. A directory mount resolves each
      # lookup through the dir, so files replaced inside it become visible live.
      # Both /etc/alertmanager/alertmanager.yml AND the gitignored, deploy-mounted
      # /etc/alertmanager/slack_api_url secret (referenced by slack_api_url_file
      # in alertmanager.yml) now come in via the one dir mount; slack_api_url.example
      # tags along harmlessly. Visibility ≠ reload: new content is on disk but
      # alertmanager only re-reads on SIGHUP / POST /-/reload — the deploy-staging
      # workflow issues that reload after `up -d` (mirrors the prometheus step).
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    networks:
      packiot-net:
        # .6 collides with stack-simulator-1 (defined in the simulator compose
        # overlay) → "Address already in use" on create. Moved to a free .32.
        ipv4_address: 172.18.0.32
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
    mem_limit: 128m

  # blackbox-exporter: synthetic uptime probes. Prometheus asks it to GET the
  # public endpoints; it reports probe_success/duration/status — does the site
  # answer from OUTSIDE, the complement to white-box service metrics.
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox-exporter
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      packiot-net:
        ipv4_address: 172.18.0.11
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
    mem_limit: 64m

  # cadvisor: per-CONTAINER resource metrics (CPU/mem/net/fs). node-exporter is
  # host-only; cadvisor tells you WHICH container is the memory hog.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks:
      packiot-net:
        ipv4_address: 172.18.0.18
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
    mem_limit: 256m

  # ── Simulator ──────────────────────────────────────────────────────────────────
  # PLC + Operator simulator for staging. Reads packml_register from DB, posts
  # machine metrics to edge-nodered /plc-data, and simulates operator actions
  # against edge-api. Requires the Simulator Corp enterprise + packml_register
  # entries to be seeded (see edge-node-red/db/03-operator-simulator.sql).
  simulator:
    # RETIRED (2026-08-16): posts to edge-nodered's legacy /plc-data HTTP ingest,
    # which pack-queue double-encodes → oeecloud-worker's poison-storm guard drops
    # 100% of it (Simulator Corp ent 1/2 data never landed; ~576 dropped/5min of
    # log noise). The new-stack test tenant is the sandbox (ent 2000003), which
    # flows the real path: sparkplug-agent-sbx → edge-transformer → oeecloud-worker.
    # Gated behind `legacy-sim` (together with its only dependency, edge-nodered).
    profiles: ["legacy-sim"]
    build:
      context: ./simulator
    restart: unless-stopped
    environment:
      EDGE_NODERED_URL: http://edge-nodered:1880
      EDGE_API_URL: http://edge-api:8080
      DB_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}"
      SIM_INTERVAL: "5"
      OP_INTERVAL: "15"
      # Skip PLC simulation for enterprise 3 (CPACK, owned by mirror-worker-go)
      # AND 4 (Incoplast) — Incoplast's PLC data now comes from the REAL factory
      # tee (shim → sparkplug.data.incoplast), so the emulator must stay out of
      # it. Otherwise the simulator floods F1 with untagged (source_type-absent)
      # Incoplast data ~20x the real tee's rate, breaking F1↔F3 parity (#39,
      # 2026-07-09). Only the PLC leg is gated; the operator sim is unaffected.
      SIM_SKIP_ENTERPRISE_IDS: "3,4"
    depends_on:
      edge-nodered:
        condition: service_healthy
      edge-api:
        condition: service_started
    # Static IP. THIS is the 2026-07-17 staging-deploy blocker: simulator was
    # the ONLY default-deploy service without a static ipv4_address, so Docker
    # IPAM handed it a DYNAMIC address from the shared 172.18.0.0/24 pool. When
    # hasura (static 172.18.0.2) was briefly down during a recreate, IPAM saw .2
    # as free and gave it to simulator; simulator (restart: unless-stopped) then
    # HELD .2, so every subsequent `up -d` that tried to start hasura failed with
    # "Error response from daemon: Address already in use" and aborted the whole
    # convergence mid-flight — stranding whichever other service was being
    # recreated (operator, then mirror-worker-go) in state=created. Docker does
    # NOT globally reserve static IPs; an address is only "taken" while a
    # container actually holds it, so a dynamic service can transiently claim a
    # static peer's IP. Pinning every service to a static IP removes the dynamic
    # pool entirely and makes the collision class impossible.
    networks:
      packiot-net:
        ipv4_address: 172.18.0.6
    # Bypass docker-embedded DNS for the two hot endpoints — the simulator's
    # /plc-data poller was throwing intermittent NameResolutionError(
    # 'Failed to resolve edge-nodered') every 5-7s, which silenced the
    # equipment_values pipeline for ~2.5h on 2026-06-22. Other services
    # (edge-nodered, oeecloud) use the same extra_hosts pattern for
    # pgbouncer/rabbitmq — fixed IPs on packiot-net make this safe.
    extra_hosts:
      - "edge-nodered:172.18.0.4"
      - "edge-api:172.18.0.3"
      - "pgbouncer:172.18.0.10"
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── oauth2-proxy (ADR-0034 §C — Cognito forward-auth, replaces Authentik) ─────
  # Nginx `auth_request` gate for the internal admin UIs (grafana/hasura/adminer/
  # rabbitmq/edge-nodered/oeecloud-nodered) and operator. Runs the OIDC
  # authorization-code flow against the shared Cognito pool (hosted UI on
  # packiot-auth.auth.us-east-1.amazoncognito.com). It never sees a password —
  # Cognito's hosted login does. The session cookie is scoped to the parent
  # domain (.staging.packiot.app) so one login covers every admin subdomain (SSO).
  #
  # Per-vhost gating: the admin UIs pass `?allowed_groups=cs-admin` on the auth
  # subrequest (staff only); operator passes no group (any authenticated pool
  # user — client factory-floor logins created via CS Admin). set-xauthrequest
  # exposes X-Auth-Request-{User,Email} to the upstream for audit.
  #
  # Secrets from .env: OAUTH2_PROXY_CLIENT_SECRET (the oauth2-proxy-staging app
  # client) + OAUTH2_PROXY_COOKIE_SECRET (32-byte). Provider config is discovered
  # from the issuer URL. Bound to 127.0.0.1:4180 — only host nginx reaches it.
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: oauth2-proxy
    restart: unless-stopped
    # Configured entirely via OAUTH2_PROXY_* env vars (NOT CLI flags — the flag
    # names differ subtly from the env keys, e.g. the flag is --email-domain but
    # the env is EMAIL_DOMAINS). compose auto-reads .env for the ${} secrets.
    environment:
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}   # literal 16/24/32 bytes (openssl rand -hex 16)
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_0T9t1sTwt
      OAUTH2_PROXY_CLIENT_ID: 4g5j94vsodtt8g8ima2hnf8ke7
      OAUTH2_PROXY_REDIRECT_URL: https://auth.staging.packiot.app/oauth2/callback
      OAUTH2_PROXY_OIDC_GROUPS_CLAIM: "cognito:groups"
      OAUTH2_PROXY_SCOPE: openid email profile
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_COOKIE_DOMAINS: .staging.packiot.app
      OAUTH2_PROXY_WHITELIST_DOMAINS: .staging.packiot.app
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "false"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: static://202
    ports:
      - "127.0.0.1:4180:4180"
    networks:
      packiot-net:
        ipv4_address: 172.18.0.39
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # ── Adminer (PostgreSQL web UI) ───────────────────────────────────────────────
  # Lightweight single-PHP-file DB browser. Connects to the packiot DB via
  # TimescaleDB directly (bypasses pgbouncer — transaction pooling breaks Adminer's
  # SET search_path calls). Access at adminer.staging.packiot.app behind Authentik
  # SSO. Login: System=PostgreSQL, Server=<POSTGRES_HOST>, User=postgres,
  # Password=<POSTGRES_PASSWORD from .env>, Database=packiot.
  adminer:
    build: ./adminer
    container_name: adminer
    restart: unless-stopped
    env_file: [.env]
    environment:
      ADMINER_DEFAULT_SERVER: ${POSTGRES_HOST}
    ports:
      - "127.0.0.1:8082:8080"
    networks:
      packiot-net:
        ipv4_address: 172.18.0.17
    depends_on: [pgbouncer]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── CS Admin (staging) — same image/config as prod ────────────────────────────
  # Gives csadmin the staging tier every other service has, so csadmin changes are
  # tested on csadmin.staging.packiot.app BEFORE promote→prod (was prod-only). The
  # SPA is same-origin: its own nginx reverse-proxies /api → edge-api and /v1 →
  # refdata-api, so this image automatically talks to STAGING edge-api on this
  # network — no per-env API URL. Auth is app-level Cognito (shared pool, baked in
  # the build); staging edge-api verifies the token (EDGE_API_COGNITO_AUTH_ENABLED).
  csadmin:
    build:
      context: ./csadmin
      dockerfile: Dockerfile.staging
      args:
        VITE_API_BASE_URL: ""
    container_name: csadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:80"
    networks:
      packiot-net:
        ipv4_address: 172.18.0.40
    depends_on:
      edge-api:
        condition: service_started
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── Mirror Worker (TS) — DECOMMISSIONED 2026-06-24 ────────────────────────────
  # Replaced by `mirror-worker-go` (Go) below. Removal flow:
  #   1. MW-2 phase 2 shipped 18591d7 (2026-06-23) — all 10 operator eventTypes
  #      replayed by the Go worker (order-status-changed, order-created,
  #      order-created-started, order-started, order-changed, order-stopped,
  #      order-replaced, event-justified, event-edited, event-splitted).
  #   2. Parity verified: cursor advancing, 0 DLQ, both workers wrote identical
  #      staging POs + events for ~24h via parallel `source` ('cpack-prod' vs
  #      'cpack-prod-go') against the same mirror_id_map.
  #   3. Go worker promoted to `source='cpack-prod'`; TS worker stopped + image
  #      removed; `./services/mirror-worker` source tree deleted (this commit).
  # See [[project_mirror_gaps_and_plan]] for the MW-2 timeline.

  # ── Mirror Worker (Go — MW-2 port of services/mirror-worker TS) ───────────────
  # Parallel-run with the TS mirror-worker via independent cursor source
  # ('cpack-prod-go' vs 'cpack-prod'). Both fetch the same prod user_logs
  # rows and replay independently to staging edge-api — but each tracks
  # its own mirror_replay_cursor + mirror_id_map rows. Staging POs created
  # by either look up via the mapping (cache hit) on subsequent operator
  # actions; deduplication is via the lookupMapping check at the top of
  # each create handler.
  #
  # CO-5: fetches DB creds from AWS Secrets Manager at startup
  # (databaseCredentials + packiot/staging/db) — no plaintext passwords
  # in env vars.
  #
  # PHASE 1 of the port: ships with only order-status-changed handler
  # registered. Other categories advance the cursor without acting (the
  # TS worker handles them). PHASE 2 ports the remaining 9 handlers +
  # the interval-overlap event matcher. Cut over after parity: rename
  # source to 'cpack-prod' and stop the TS one.
  mirror-worker-go:
    build: ./services/mirror-worker-go
    container_name: mirror-worker-go
    # RETIRED (2026-08-13): legacy-prod(ent 1)→staging(ent 3) mirror + F1/F3
    # fidelity watchdog. It's a migration-era tool — obsolete once CPACK cuts
    # over to the new stack (its comparator has nothing to compare once legacy
    # prod is retired), and the ADR-0045 sandbox now supplies staging test data.
    # It was also the #1 log-noise source (~413 "already mapped" warns/3min).
    # Profile-gated OFF so the deploy no longer starts it; re-enable for the
    # comparator until cutover with `COMPOSE_PROFILES=legacy-comparator`.
    profiles: ["legacy-comparator"]
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      AWS_REGION: us-east-1
      PROD_DB_SECRET_ID: databaseCredentials
      STAGING_DB_SECRET_ID: packiot/staging/db
      SOURCE_NAME: cpack-prod-go
      PROD_ENTERPRISE_ID: "1"
      STAGING_ENTERPRISE_ID: "3"
      POLL_INTERVAL_SEC: "60"
      BATCH_SIZE: "50"
      PER_POST_DELAY_MS: "50"
      STAGING_API_URL: http://edge-api:8080
      HEALTH_PORT: "9102"
      # ADR-0012 3-flow parity: fan every equipment_values delta out to
      # shadow_go_port (Flow 2, same DB) + packiot_shadow.public (Flow 3)
      # so the shadow flows receive the same prod-anchored CPACK counters
      # as Flow 1. One Go-side timestamp keeps (ts_value, id_equipment)
      # — the parity join key — identical across flows. Loss-with-alert:
      # shadow write failures never fail the Flow 1 write; watch
      # mirror_worker_value_fanout_total{outcome!="ok"}.
      SHADOW_VALUE_FANOUT: "true"
      # ADR-0032 Step 5 (F3 collapse): stop fanning the F2 (shadow_go_port)
      # leg. The flip (#652) is live — reads are on F3 (REFDATA_FLOW=f3),
      # SHADOW_EMIT_PRODUCTION=false, the comparator is off (parity was drift=0),
      # so shadow_go_port is dead scaffolding. false ⇒ the mirror fans ONLY F3
      # (packiot_shadow), so shadow_go_port stops receiving writes and can be
      # frozen + dropped. Reversible: unset (default true) + redeploy → F2
      # fan-out resumes. Pairs with the complete-gate code fix (FanoutEventRow +
      # comparator legs now also honor this).
      SHADOW_FANOUT_F2: "false"
      POSTGRES_SHADOW_DB_NAME: packiot_shadow
      # Direct to postgres — pgbouncer's static database list doesn't
      # include packiot_shadow (same bypass shadow-mirror uses).
      SHADOW_DB_HOST: 10.10.10.89
      # ADR-0025 / #48: prod-authoritative reconcile FINISHER. Closes mirror-
      # managed CPACK (ent 1) status=2 POs that dropped off prod-active — the
      # zombie class from prod SparkPlug-stops that bypass user_logs (~95%).
      # Orphans = staging-active MINUS prod-active; closed at prod last-activity
      # ts (not now()); 4 safety layers + grace window. v1 = F1 only (#480);
      # F2/F3 fan-out lands with #51. Watch mirror_worker_reconciler_finisher_
      # total{outcome} — should close exactly the ~10 known F1 zombies.
      # Rollback: set "false" + redeploy.
      RECONCILE_FINISHER_ENABLED: "true"
      RECONCILE_FINISHER_GRACE_MINUTES: "30"
      # Prod-terminal orphan closer — the LAST G0b finisher blemish. Closes
      # mirror-CREATED CPACK POs (nm LIKE 'CPACK-reconcile-%') stuck at
      # status IN (1,2) whose prod twin has already FINISHED (status=3). The #48
      # finisher can't reach these: its candidate set is status=2 ONLY (misses a
      # never-started status=1 orphan like the wedge PO 894561), and
      # FinishOrphanPO trips the production_orders_ts_start_ts_end check (23514)
      # when ts_start is NULL (also wedges 894720). This closer widens the set to
      # status IN (1,2) and closes at prod's finish ts with a NULL-ts_start-safe
      # seal (ts_end=finish ts, ts_start=1s-earlier floor for the STRICT
      # ts_start<ts_end check constraint). ONLY prod-terminal (status=3) twins close — a
      # status=2 (running) twin is SKIPPED (894330/894668/894749 stay untouched;
      # their revive is a SEPARATE, already-mapped-shadow gap). SELECT-only on
      # prod. Watch mirror_worker_reconciler_prod_terminal_closer_total{outcome}
      # — expect ~2 finished (894561, 894720) then flat. Rollback: set "false" +
      # redeploy → finisher path byte-identical to before. STAGING ONLY.
      RECONCILE_CLOSE_PROD_TERMINAL_ORPHANS: "true"
      # Event-driven reconciler split. tail mode runs the two reconciler halves
      # on independent tickers: the cheap create-diff (a 0.33ms cached status=2
      # index scan) polls every RECONCILE_CREATE_INTERVAL_SEC for sub-3s
      # PO-start detection, while the heavier finisher stays at
      # RECONCILE_FINISHER_INTERVAL_SEC (stop latency is grace-bound anyway).
      # Cuts PO-start invisibility from up to ~5min to ~3s (~100x) at ~0.01%
      # extra prod load — all SELECT-only, no new prod object/grant/schema.
      # Rollback: RECONCILE_MODE=poll (or remove these 3) + redeploy →
      # byte-identical to the pre-split single-interval scheduler. STAGING ONLY.
      RECONCILE_MODE: tail
      RECONCILE_CREATE_INTERVAL_SEC: "3"
      RECONCILE_FINISHER_INTERVAL_SEC: "300"
      # task #63/#86 — shadow-driven event close-sweep. Fixes >48h-late-close
      # open-row strands + ts_end/duration drift that count-parity hides.
      # RE-ENABLED after the #86 convergence fix: the candidate query now
      # returns each shadow row's CURRENT ts_end/status/duration and
      # planCloseCorrections emits a correction ONLY when shadow != prod, so a
      # converged shadow re-upserts ~0 rows/pass instead of the ~4230 no-op
      # write storm that forced this OFF. Expected bake signature on
      # mirror_worker_reconciler_events_total{outcome="reclosed"}: the FIRST
      # post-enable pass corrects the genuine backlog (open strands prod has
      # since CLOSED + drifted closes — tens, not thousands), then every
      # subsequent pass flattens to ~0. mirror_worker_comparator_event_open_
      # strands_skew stays low; a residual skew where prod is ALSO open (e.g.
      # eq 82/87 = prod 98/99, absent on F3) is a #55-class row-existence gap
      # the sweep correctly CANNOT force-close (never fabricate) — it self-heals
      # once prod closes those events. Rollback: set "false" + redeploy.
      # STAGING ONLY.
      RECONCILE_EVENTS_CLOSE_SWEEP_ENABLED: "true"
    networks:
      packiot-net:
        ipv4_address: 172.18.0.21
    depends_on:
      pgbouncer:
        condition: service_started
      edge-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "/usr/local/bin/mirror-worker-go", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # ── oeecloud Worker (Go — replaces oeecloud-node-red over time) ───────────────
  # AMQP consumer with manual ack + DLX + retry topology. Runs in PARALLEL with
  # the existing stack-oeecloud-1 (Node-RED) by binding a SEPARATE queue
  # (`oeecloud-worker-q`) to the same `oee` topic exchange. Both consumers see
  # every published message — neither competes with the other.
  #
  # Scaffold-only phase: placeholder LogOnly handler that just logs+acks every
  # message. No DB writes yet. Future sessions add per-routing-key handlers
  # one at a time; once at parity, decommission Node-RED's queue + container.
  #
  # See services/oeecloud-worker/internal/amqp/topology.go for the
  # exchange/queue/binding graph (with ASCII diagram).
  oeecloud-worker:
    build: ./services/oeecloud-worker
    container_name: oeecloud-worker
    restart: unless-stopped
    env_file: [.env]
    environment:
      LOG_LEVEL: info
      # F2 comparator retired: the shadow_go_port schema was DROPPED when F3
      # became the single flow, so leaving the background rollup/backfill/uns
      # jobs pointed at it made every tick error 42P01 (~180×/5min). false =
      # target `public` instead (flows.StandardFiltered, ADR-0045 G3). The F1
      # pg_cron rollup (oee-refresh-runtime) is inactive, so no double-write.
      SHADOW_GO_PORT_ENABLED: "false"
      # Distributed tracing → Tempo (OTLP/gRPC). Present = tracing on. The
      # consumer extracts the traceparent the publisher injected into the AMQP
      # headers, so a message is one trace: publish → consume → DB (otelpgx).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      # CO-5 phase 2: DB + AMQP both via Secrets Manager. AMQP user
      # `oeecloud-worker` was provisioned on staging broker with
      # least-privilege perms (own topology only, no admin reach, no
      # access to oeecloud-q). EC2 IAM role grants packiot/staging/*.
      AWS_REGION: us-east-1
      PG_SECRET_ID: packiot/staging/db
      RABBITMQ_SECRET_ID: packiot/staging/rabbitmq-oeecloud-creds
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      SOURCE_EXCHANGE: oee
      WORKER_QUEUE: oeecloud-worker-q
      RETRY_EXCHANGE: oee-retry
      RETRY_QUEUE: oeecloud-worker-q-retry-30s
      FAILED_EXCHANGE: oee-failed
      FAILED_QUEUE: oeecloud-worker-q-failed
      RETRY_TTL_MS: "30000"
      MAX_RETRIES: "5"
      PREFETCH: "50"
      # Concurrent keyed consume lanes (PR #451). Deliveries route to
      # lane = hash(source_type) % N: same source_type stays strictly ordered
      # (po-control is read-modify-write); the 3 flows (F1/F2/F3 → disjoint
      # pool+schema) process concurrently. Unblocks the serial oeecloud-worker-q
      # drain (~2 msg/s → ~57k backlog). 1 = original serial behavior. Watch the
      # 5-conn main pool (POSTGRES_MAX_CONNS) under this — F1+F2 lanes share it.
      CONSUME_LANES: "4"
      # Lever 1 (PR #453, merged flag-OFF): fold the shift-fill UPDATE into the
      # equipment_values UPSERT so each message issues ~40 statements instead of
      # ~60. Attacks the actual ceiling on the latency-bound oeecloud-worker-q
      # drain (~0.95 msg/s, ~57k backlog). Recon 2026-07-13 proved the backlog is
      # an even F1/F2/F3 triple-emit already spread across 3 lanes, so CONSUME_LANES
      # is maxed out — the wall is per-message DB round-trips against the
      # memory-starved DB EC2, not consumer count. Cutting stmts/msg is the lever.
      # DBA GO: byte-identical output. Reversible: unset this line + redeploy.
      SHIFT_FILL_FOLDED: "true"
      HEALTH_PORT: "9101"
      # ADR-0012 Phase 3: route source_type="refactored" envelopes to the
      # packiot_shadow DB (same host/user/password, different database).
      # Empty = disabled (production default). packiot_shadow was
      # provisioned via scripts/reprovision-refactor-sandbox.sh --db-name
      # packiot_shadow and holds the refactored end-state schema
      # (customer_dashboards pool, canonical CAggs, renames applied).
      POSTGRES_SHADOW_DB_NAME: "packiot_shadow"
      # ADR-0014 Phase 2: Go port of piot_set_shift_on_equipment_values().
      # Fills id_shift/id_shift_hour/ts_value_production on SHADOW-path
      # writes (source_type go/refactored) as a companion UPDATE in the
      # same batch. Flow 1 keeps the PL/pgSQL trigger during the
      # comparator bake — retire it only after 168h zero divergence on
      # the /d/3-flow-parity shift panel.
      SHIFT_RESOLVER_ENABLED: "true"
      # ADR-0012 Wave 2 port #1: Go-scheduled writer for
      # customer_reports.speed (customer 33). Sole writer on staging —
      # the legacy procedure was never scheduled here. Bake method:
      # one-shot CALL of the legacy procedure vs this job, diffed on
      # id_order (see 0012-phase4-execution-plan.md Wave 2).
      SPEED33_REPORT_ENABLED: "true"
      SPEED33_INTERVAL_MINUTES: "10"
      # Wave 2 port #2: shift_06 delete-and-reload → customer_reports.shift
      SHIFT06_REPORT_ENABLED: "true"
      SHIFT06_INTERVAL_MINUTES: "15"
      # Wave 2 port #3: sap_13 upsert → customer_reports.sap_data_sync.
      # ENABLED 2026-07-06 — #223 finding: back4-api is READ-ONLY on this
      # dataset (both neopac controllers SELECT views; git history shows
      # no write ever). The sole writer was the PL/pgSQL upsert we ported,
      # so there is NO cross-service cutover. Bake: watch rows +
      # jobs_ticks_total{job="sap13"}; prod-fidelity evidence extends the
      # prod-read harness before the flip gate.
      SAP13_REPORT_ENABLED: "true"
      SAP13_INTERVAL_MINUTES: "15"
      # ADR-0039 R5 CONTRACT Step 1 (task #12) — source the downtime-reason
      # vocabulary from the R5 dimension (downtime_reason + equipment_downtime_reason)
      # instead of the equipments.downtime_reasons jsonb. DEFAULT OFF: keep OFF until
      # row-for-row parity is verified on staging (the report joins on the category
      # label; confirm the dimension label matches the jsonb key it replaces — see
      # the Step-1 parity gate in docs/adr/0039-reasons-dimension-contract-plan.md).
      SAP13_REASONS_FROM_DIM: "false"
      # ADR-0014 P3a events deriver — ENABLED 2026-07-03. Runs its own
      # bake on equipment_events (separate table from the shift bake's
      # id_shift surface — no panel contamination). The shift TRIGGER
      # DROP still waits for its 168h (0014-p2-bake-closeout-ready.sql).
      EVENTS_DERIVER_ENABLED: "true"
      # ADR-0031 — Incoplast (ent4) writes `state` as a wide-row with NO
      # StateCurrent/Count LEAF topic in packml_register, so both BuildEventMint
      # and the native status_type=4 deriver scope skip it → 0 equipment_events
      # (no downtimes/availability/OEE). Its `state` IS in ca_discrete_changes_1s
      # keyed by id_equipment, so opting ent4's tp=1 machines into the deriver
      # mints their interval events directly (minter+cleaner share the widened
      # scope → no orphan-open events). CSV of enterprise ids; empty = off.
      EVENTS_WIDEROW_STATE_ENTERPRISES: "4"
      # ADR-0010 10.3 slice 1 — enabled 2026-07-03 for synthetic-inject
      # verification. SourceType-gated to shadow paths (PR #235), so the
      # only 30800s it can ever see on staging are our injects.
      PO_CONTROL_ENABLED: "true"
      # ADR-0014 P4 — Neopac beep-chain aggregator (both shadow flows).
      BOXES13_REPORT_ENABLED: "true"
      # ADR-0014 P4 — enterprise-6 sync state machine (verbatim embed).
      SYNC06_REPORT_ENABLED: "true"
      BOXES_BRIDGE_ENABLED: "true"
      # ADR-0014 P3c — UNS provisioner + CAgg-sourced equipment grains.
      UNS_REFRESH_ENABLED: "true"
      # uns_equipment_current_metrics deriver — the table froze at the
      # 10.9 cutover (its ingest writer's `sparkplug.uns_metrics` routing
      # key lost its only producer). In-engine derivation replaces it
      # (owner decision 2026-07-07) as THE mechanism: one idempotent
      # set-based UPSERT per flow, reconstructing every column from DB
      # state, keyed by id_equipment, at UNS_CURRENT_METRICS_INTERVAL_MINUTES
      # (default 1). ENABLED 2026-07-15 (architecture review — Squad 8):
      # last_updated on F1 was ~33d stale; this is the only path that
      # refreshes it pre-flip. Low-risk: one UPSERT, one table, no
      # cross-service cutover (the legacy producer is already retired).
      # Ledgered divergence: freshness ingest-time → job cadence (1 min).
      # Reversible: set back to "false" + redeploy.
      UNS_CURRENT_METRICS_ENABLED: "true"
      # ADR-0014 P3b — po-runtime-recalc (shadow flows).
      PO_RECALC_ENABLED: "true"
      RUNTIME_PROVISION_ENABLED: "true"
      RUNTIME_ROLLUP_ENABLED: "true"
      # 10.9: nodered legacy leg retired (plc-sim triple-emit feeds F1)
      # Re-enabled for the Incoplast mirrored-tenant validation (ADR-0022 V1):
      # the ingest-shim publishes Incoplast's real SparkPlug to oee/sparkplug.data,
      # and the worker must consume it → F1/F3 for the enterprise-4 bake. CPACK is
      # unaffected (it flows via mirror-worker-go, not oee; nothing else publishes to
      # oee). This is the transitional leg — the forward unified path (all tenants via
      # transformer + S7 → oee) is post-flip onboarding (S1). Reversible.
      LEGACY_INGEST_ENABLED: "true"
      # ADR-0032 Step 2 (F3 collapse): comparator has served its purpose (48h
      # bake, drift 0) — silence it. Reversible: "true" + redeploy.
      BAKE_COMPARATOR_ENABLED: "false"
      # Per-tenant surface bake (ADR-0022). First id = the frozen CPACK gate
      # (verbatim SQL, byte-identical flip signal); additional ids run scoped.
      # Incoplast (enterprise 4) validated F1<->F3 on its own series without
      # diluting CPACK's (enterprise 3) readiness signal.
      BAKE_ENTERPRISE_IDS: "3,4"
      # PR #600 — counters-only AVAILABILITY fallback (idle-timeout sessionization).
      # L6's counters cut over (gross production flows) but its state events did
      # not, so the events phase never touches its equipment_runtime_* rows →
      # running_time stays ~0 → oee_a floors near 0 (~0.008) while it is producing.
      # Enabled ONLY for L6 (ent-3): line id 50 + member machines 68-72. A bucket
      # is auto-engaged only when it has NO state events, so a machine that emits
      # state is left entirely on the state path (per-bucket auto-deselect). The
      # fallback runs as a separate appended pass, never in the parity accessors,
      # so flags-off output is byte-identical. Reversible: set ENABLED=false +
      # redeploy. Idle timeout 300s = grace after last count before "stopped".
      COUNTERS_ONLY_AVAILABILITY_ENABLED: "true"
      COUNTERS_ONLY_AVAILABILITY_EQUIPMENTS: "50,68,69,70,71,72"
      COUNTERS_ONLY_IDLE_TIMEOUT_SECONDS: "300"
      # ADR-0037 Silver invariant — per-equipment production-increment SANITY
      # CLAMP. Rejects any Processed/Consumed/Defective delta exceeding
      # K · equipments.production_speed · Δt (a physically-impossible count at
      # the machine's rated speed since its last reading) BEFORE it reaches the
      # equipment_values UPSERT / cagg SUM, and records a data_quality_event
      # (INVARIANT_CLAMPED_INCREMENT). Stops the ACTIVE corruption of eq 57
      # (L5/TEXA): its shared per-topic baseline is fed by BOTH plc-sim
      # (totalizer ≈1.9k) and the real agent (≈830k), minting a ≈828k phantom
      # increment on every publisher switch. Defends ALL equipment against
      # future double-source / reordered-sample phantoms. K=4, Δt floored 60s.
      # Reversible: set ENABLED=false + redeploy → byte-identical prior writes.
      INCREMENT_SANITY_CLAMP_ENABLED: "true"
    networks:
      packiot-net:
        ipv4_address: 172.18.0.20
    depends_on:
      rabbitmq:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      db-migrate:
        # Wait for migrations before consuming — otherwise the first
        # ~10s of resolver queries fail (packml_register may not exist),
        # producing spurious nacks until db-migrate catches up.
        condition: service_completed_successfully
    # Worker self-probes via `--healthcheck` subcommand (distroless image
    # has no shell/wget/curl, so the binary handles HTTP probe of its own
    # in-process /health server). Exit 0 = healthy, non-zero = not.
    healthcheck:
      test: ["CMD", "/usr/local/bin/oeecloud-worker", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # ── ingest-shim (HTTPS→RabbitMQ ingress for Incoplast SparkPlug) ───────────────
  # A node in Incoplast's REAL Node-RED POSTs its SparkPlug-JSON payload to
  # this shim over HTTPS (public surface, Nginx/SG-gated on :8444). The shim
  # authenticates (X-Ingest-Key), scope-guards the payload to INCOPLAST data,
  # then republishes it VERBATIM onto the EXISTING `oee` topic exchange with
  # routing key `sparkplug.data` — the exact pair oeecloud-worker consumes.
  # From there it flows oeecloud-worker → F1/F3, tenant-routed to enterprise 4
  # via the seeded packml_register rows. RabbitMQ itself stays internal: only
  # the shim is exposed, and it never hands broker creds to the third party.
  #
  # Reuses oeecloud-worker's Secrets Manager pattern — same least-privilege
  # `oeecloud-worker` broker user (packiot/staging/rabbitmq-oeecloud-creds),
  # which already has write on the `oee` exchange.
  ingest-shim:
    build: ./services/ingest-shim
    container_name: ingest-shim
    restart: unless-stopped
    env_file: [.env]
    environment:
      LOG_LEVEL: info
      # Distributed tracing → Tempo (OTLP/gRPC). Present = tracing on; the inbound
      # POST becomes a trace root. Phase 2 carries traceparent onto the AMQP
      # publish so oeecloud-worker's consume continues the same trace.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      # CO-5: RabbitMQ username/password via Secrets Manager, NOT env.
      AWS_REGION: us-east-1
      # Publisher creds — the edge-transformer user has publish perms on
      # `oee` (oeecloud-worker's user is a consumer, no publish). A dedicated
      # publish-only ingest-shim RabbitMQ user is the production hardening.
      RABBITMQ_SECRET_ID: packiot/staging/rabbitmq-edge-transformer-creds
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      # Publish target — the existing exchange + routing key oeecloud-worker
      # consumes. Per-tenant key so Incoplast lands in the DEDICATED queue
      # oeecloud-worker-q-incoplast (its own consumer), NOT the shared generic
      # oeecloud-worker-q. With the 3-flow fan-out tripling message volume, the
      # single generic-queue consumer backed up to 2495 msgs (2026-07-09) and
      # F3 never caught up. This mirrors how edge-transformer routes CPACK to
      # sparkplug.data.cpack_staging. The worker binds this key → per-tenant
      # queue via packml_register tenant discovery (lower(split_part(topic,'/',1))).
      EXCHANGE: oee
      ROUTING_KEY: sparkplug.data.incoplast
      # ADR-0032 Step 4 (F3 collapse): fan Incoplast to the refactored (F3) flow
      # ONLY. The stale default is "legacy"/F1 — without this, Incoplast collapses
      # to F1, not F3. Reversible: remove/redeploy restores the default.
      FANOUT_SOURCE_TYPES: refactored
      # Scope guard: only payloads whose topic/group first segment is
      # INCOPLAST (case-insensitive) are admitted; everything else → 403.
      SCOPE_GROUP: INCOPLAST
      # Public TLS API on 8444; Prometheus metrics on 9105 (internal).
      HTTP_ADDR: ":8444"
      METRICS_ADDR: ":9105"
      # Ingest API key — REQUIRED, no default (shim refuses to start unset).
      # Value lives in /opt/packiot/.env; hand it to the Incoplast Node-RED
      # node as the X-Ingest-Key header. # FILL AT DEPLOY
      INGEST_API_KEY: ${INGEST_API_KEY:-}
      # TLS is mandatory — the shim refuses to open a plaintext public
      # listener. Mount the cert/key pair below. # FILL AT DEPLOY
      TLS_CERT_FILE: /certs/server.crt
      TLS_KEY_FILE: /certs/server.key
    volumes:
      # Host path holds the TLS server cert + key for :8444. # FILL AT DEPLOY
      - /opt/packiot/ingest-shim/certs:/certs:ro
    ports:
      # Public HTTPS ingress. Nginx/SG terminates external access on 8444.
      - "8444:8444"
    networks:
      packiot-net:
        ipv4_address: 172.18.0.29
    depends_on:
      rabbitmq:
        condition: service_healthy
    # Distroless image → binary self-probes its own TLS /healthz via the
    # `--healthcheck` subcommand (no shell/curl/wget in the runtime image).
    healthcheck:
      test: ["CMD", "/usr/local/bin/ingest-shim", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # ── edge-transformer (ADR-0009 Phase 2 — SHADOW MODE) ──────────────────────────
  # Per-factory Go service that consumes from the local RabbitMQ exchange
  # `edge.plc-normalized` and will replace the deterministic transform layer
  # currently inside edge-node-red's Sparkplug subflow + Calc_Counters.
  #
  # SHADOW MODE — logs+acks every delivery, writes nothing. Phase 3 (Go ports
  # of Calc_Counters family) is what flips this from shadow to authoritative.
  #
  # Prerequisites (ALL MET as of 2026-06-30):
  #   ✓ Secret packiot/staging/rabbitmq-edge-transformer-creds exists
  #   ✓ RabbitMQ user `edge-transformer` provisioned via app_init.sh
  #     (configure/write/read scoped per ADR-0009 runbook §2.B)
  #   ✓ Topology declared: edge.plc-normalized + dlx.edge.plc-normalized
  #   ✗ Node-RED publisher flow (Phase 2.5 follow-up — until then, the
  #     consumer sits idle waiting for messages; harmless)
  #
  # Reuse rule (ADR-0009 Errata Correction 2): everything below mirrors
  # oeecloud-worker's service entry — same Secrets Manager pattern, same env
  # var shape, same depends_on RabbitMQ healthcheck. Only port + queue names
  # differ.
  edge-transformer:
    build: ./services/edge-transformer
    container_name: edge-transformer
    restart: unless-stopped
    env_file: [.env]
    environment:
      LOG_LEVEL: info
      EDGE_TRANSFORMER_MODE: factory
      # Distributed tracing → Tempo (OTLP/gRPC). Present = tracing on. The
      # MQTT-receive span is the data-plane trace root; its context rides the
      # outbox (envelope traceparent) and the AMQP publish so PLC→worker→DB is
      # one trace. The receive→publish gap shows as outbox dwell time in Tempo.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      # HEAD sampling: this is the highest-volume trace ROOT (one per MQTT
      # message). ParentBased means this 10% decision propagates to the whole
      # downstream chain (worker consume + DB spans drop/keep WITH it), so Tempo
      # sees ~10% of complete data-plane traces, not 100%. Other services leave
      # this unset (1.0) — their roots (operator actions, ingest POSTs) are
      # low-volume and worth keeping whole.
      OTEL_TRACES_SAMPLER_ARG: "0.1"
      AWS_REGION: us-east-1
      RABBITMQ_SECRET_ID: packiot/staging/rabbitmq-edge-transformer-creds
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      SOURCE_EXCHANGE: edge.plc-normalized
      WORKER_QUEUE: edge-transformer-q
      RETRY_EXCHANGE: edge.plc-normalized-retry
      RETRY_QUEUE: edge-transformer-q-retry-30s
      FAILED_EXCHANGE: dlx.edge.plc-normalized
      FAILED_QUEUE: edge-transformer-q-failed
      RETRY_TTL_MS: "30000"
      MAX_RETRIES: "5"
      PREFETCH: "50"
      HEALTH_PORT: "9102"   # deliberately NOT 9101 — oeecloud-worker owns that
      CLIENT_YAML_PATH: /etc/packiot/client.yaml
      # ── ADR-0046 birth-bound routing wiring (resolver ON, routing OFF) ────────
      # The refdata resolver is wired but INERT until BIRTH_BOUND_ROUTING flips on
      # — the resolver is only consulted on the birth-bound path. Safe no-op today.
      # resolve-by-device_key (globally unique) → no BIRTH_BOUND_ENTERPRISE_ID.
      BIRTH_BOUND_RESOLVER: refdata
      REFDATA_URL: http://refdata-api:9104
      REFDATA_INTERNAL_KEY: ${INTERNAL_API_KEY:-}
      # THE FLIP (per-tenant, after INTERNAL_API_KEY is set + resolver smoke-tested):
      #   plc-sim EMIT_DEFINITIVE_BIRTH=true  +  edge-transformer BIRTH_BOUND_ROUTING=true
      # → observe CPACK counters keep flowing on F3 (equivalence proven, #672).
      # Default OFF today: BIRTH_BOUND_ROUTING unset ⇒ legacy name-parse path, no change.
      # ADR-0010 Phase 2 MQTT subscriber — turned ON in staging for the
      # end-to-end shadow-mode test. Default remains false in code (P0-safe).
      # ADR-0011 rule 4: /healthz will surface degraded state when the
      # subscriber can't reach mosquitto or hasn't received data in 60s.
      MQTT_ENABLED: "true"
      # ── 10.9-STAGING CUTOVER ──────────────────────────────────────
      # plc-sim (MQTT) is THE ingest; the nodered AMQP wrap retires.
      AMQP_SOURCE_ENABLED: "false"
      # Triple-emit: "" (F1 production route) + go + refactored — one
      # source feeds all flows; the bake stays same-reality.
      # ADR-0032 Step 4 (F3 collapse): stop the F1 production leg. Reads are
      # already on F3 (REFDATA_FLOW=f3), so F3 becomes sole telemetry-compute.
      # Reversible: set back to "true" + redeploy → F1 resumes.
      SHADOW_EMIT_PRODUCTION: "false"
      MQTT_BROKER_URL: "tcp://mosquitto:1883"
      MQTT_CLIENT_ID: "edge-transformer-staging"
      MQTT_USERNAME: ""
      MQTT_PASSWORD: ""
      # Staging has no live Sparkplug B source — MQTT silence is the
      # steady state, not a failure. <= 0 disables the idle-degradation
      # check so /healthz + the container healthcheck track broker
      # connectivity only; a permanently-red healthcheck trains ops to
      # ignore red. Real factories keep the 60s default.
      MQTT_STALE_THRESHOLD_SECONDS: "-1"
      # ADR-0010 Phase 3 shadow-mode port — ON in staging for the 30-day
      # comparator soak. Shadow mode: Calc runs alongside Node-RED path but
      # does NOT change shadowpub output. Prom counters expose divergence.
      # calc_evaluations_total / calc_state_mutations_total / calc_errors_total
      # scraped via /metrics. Default remains false in code (P0-safe).
      USE_GO_PORT: "true"
      # ADR-0045 P2b: register-driven Parameter30700 seed + Phase-9 line
      # aggregation un-suppress. ON here because mirror-worker-go (the old
      # synthetic line-count writer) is RETIRED on staging — Phase-9 is now
      # the sole line-count source, no double-count. Keep OFF where a
      # competing line writer may still run.
      PHASE9_LINE_AGG_ENABLED: "true"
      # Onboard-generate server (POST /v1/onboard/generate :9105) — turns a stored
      # descriptor into the reader/agent bundle. Fails closed without the key.
      ONBOARD_API_ENABLED: "true"
      ONBOARD_API_PORT: "9105"
      ONBOARD_API_KEY: ${ONBOARD_API_KEY}
      # ADR-0011 P2 outbox — store-and-forward between MQTT decode + RMQ
      # publish. When ON, every decoded envelope is persisted to SQLite
      # BEFORE the RMQ publish; a drain goroutine handles the publish +
      # retry-on-nack. Crash-consistent: in-flight state survives an
      # edge-transformer restart. Persistent volume mounted below.
      OUTBOX_ENABLED: "true"
      OUTBOX_PATH: "/var/lib/edge-transformer/outbox.db"
      OUTBOX_CAP: "100000"
      # ADR-0012 Phase 3 dual-emit: for each inbound MQTT event, publish
      # BOTH source_type="go" (routes to shadow_go_port on packiot,
      # existing ADR-0010 validation) AND source_type="refactored"
      # (routes to packiot_shadow public via oeecloud-worker's shadow
      # pool). Requires POSTGRES_SHADOW_DB_NAME set on oeecloud-worker.
      SHADOW_EMIT_REFACTORED: "true"
      # ADR-0032 F3-collapse Step 3 knob: the F2 source_type="go" leg
      # (shadow_go_port comparison shadow) was hardcoded-always-on. Now gated —
      # default "true" (no change). Set "false" to STOP emitting the F2 leg when
      # collapsing to single-flow F3 (reversible: set back to "true" + redeploy).
      # ADR-0032 Step 3 (F3 collapse): stop the F2 "go" comparison leg
      # (shadow_go_port — pure validation shadow, zero product consumer).
      # Reversible: "true" + redeploy.
      SHADOW_EMIT_GO: "false"
      # #276 Phase-4 Calc CUTOVER (PR #450, merged flag-OFF): flip the F3
      # (source_type="refactored") emit from raw cumulative counters to the
      # Calc port's delta+cumulative shape (Value=delta, Counter=cumulative —
      # prod tsp12's gross_production_incr/val shape). Fixes the cagg SUMming
      # cumulative counters into billions (oee 8142) on direct-line-emit lines
      # (L8/SLEEVE/FLEXO). Scoped to F3 ONLY: the emit branch gates on
      # `st == "refactored"`, so F2 (source_type="go") and F1 (source_type="")
      # keep the raw resolved metrics untouched — F2 stays raw-and-blown-up on
      # PURPOSE as the tsp12 divergence control. Requires USE_GO_PORT=true (set)
      # + SHADOW_EMIT_REFACTORED=true (set). Reversible: unset this line +
      # redeploy — the else-branch legacy BuildEnvelope path is retained, no DB
      # change needed to roll back.
      CALC_CUTOVER_REFACTORED: "true"
      # ── Counters-only OEE mode (PR #591) — CPACK L6 go-live (ADR-0042 P1) ──
      # L6 is a Modbus counters-only line: the live tee confirmed SPEED:NO, so
      # NO MachSpeed metric ever seeds Calc State. Calc's Phase-8 glitch guard
      # `prodSpeed < 3*machSpeed` then collapses to `prodSpeed < 0` and rejects
      # EVERY counter → zero OEE. This flag swaps that guard for a CONFIGURED
      # rated-speed bound (3 × ideal) for the opted-in equipment below so counts
      # flow and the member machines produce F3 OEE. SURGICAL: scoped to ent-3
      # L6 only via the explicit opt-in map; no other tenant/line is touched,
      # and machines that DO report speed auto-deselect inside Calc.
      COUNTERS_ONLY_OEE_ENABLED: "true"
      # Opt-in map: Sparkplug UNIT topic → configured rated speed (parts/min).
      # This map is BOTH the opt-in allowlist AND the guard bound. Keys are the
      # 5-seg unit topics ParseTopic yields from the agent-published names
      # (parts[:5]); the LINE key is .../L6/Admin (line counts have no member
      # segment). Rate 147 = equipments.production_speed for L6 (uniform, line +
      # members), the SAME value the oeecloud-worker rollup uses as the Perf
      # denominator, so no separate ideal override is needed. Staging equipment
      # ids: line 50, BREYER 68, TEXA 69, POLYTYPE 70, RMH 71, PTH 72.
      #
      # L5/TEXA (eq 57) added (ADR-0037 / #13): it is the target of the
      # agent-only cutover. Opting it in swaps Calc's Phase-8 guard from the
      # absent-MachSpeed `3·machSpeed` bound to `3·IdealRate`, fixing the
      # post-SparkPlug-Rebirth stall (Bug 2) that rejected every count once the
      # agent became sole publisher. Rate 147 = equipments.production_speed for
      # eq 57 (same as L6). This PREPARES the agent-only cutover; it does NOT
      # perform the plc-sim L5/TEXA drop (a separate coordinated step).
      COUNTERS_ONLY_IDEAL_RATES: '{"CPACK/SC/LINHAS/L6/Admin":147,"CPACK/SC/LINHAS/L6/BREYER":147,"CPACK/SC/LINHAS/L6/TEXA":147,"CPACK/SC/LINHAS/L6/POLYTYPE":147,"CPACK/SC/LINHAS/L6/RMH":147,"CPACK/SC/LINHAS/L6/PTH":147,"CPACK/SC/LINHAS/L5/TEXA":147}'
      # ── ADR-0019 C1 edge command channel (machine-write path) ─────────
      # The RETURN path: an operator action writes a value DOWN to the PLC
      # (SparkPlug DCMD). This is the ONLY machine-write path in the stack,
      # so it ships INERT: EDGE_COMMANDS_ENABLED=false means the consumer
      # self-gates (no dial, no DCMD publisher) and behavior is unchanged.
      # Flip to "true" only after the edge-api producer endpoint lands and
      # the path is reviewed against the live tenant. Default false in code
      # too (config.go), so this is belt-and-suspenders.
      EDGE_COMMANDS_ENABLED: "false"
      # Allow-list of verbs the executor will translate to a PLC write. A
      # verb NOT in this set is REJECTED (ack rejected + dead-lettered),
      # never guessed — the fail-safe rule (contrast ingest's zero-fill).
      EDGE_COMMANDS_ALLOWED: "po_setup,param_write"
    volumes:
      # ADR-0004 — per-customer client.yaml lives in git under
      # docs/clients/<tenant>.yaml; mount it read-only into the container.
      - ./docs/clients/cpack.yaml:/etc/packiot/client.yaml:ro
      # ADR-0011 P2 outbox — named volume for SQLite DB. Survives container
      # recreate so in-flight messages replay on restart. Backup handled
      # via the same AWS Backup selection as other named volumes (root EBS).
      - edge_transformer_outbox:/var/lib/edge-transformer
    networks:
      packiot-net:
        ipv4_address: 172.18.0.23
    depends_on:
      rabbitmq:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/edge-transformer", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # ── shadow-mirror (ADR-0013 — control-plane parity for 3-flow POC) ────────────
  # Polls staging.public.user_logs and replays operator actions onto
  # the two shadow paths (shadow_go_port schema on packiot + public
  # schema on packiot_shadow), closing the gap left by the data-plane
  # source_type routing (which only covers equipment_values, not PO
  # lifecycle / downtimes / operator-edited events).
  #
  # DEFAULT OFF (SHADOW_MIRROR_ENABLED=false). Skeleton PR ships the
  # service compiled but idle — /metrics + /healthz serve, no writes.
  # Flip the env to true once Phase 2 handlers land.
  # ── refdata-api ─────────────────────────────────────────────────────
  # Task #86 Hasura retirement (Option C): the reference-read API that
  # replaces Hasura for the REFACTORED stack (flows 2/3). Serves the
  # exact 10-root contract enumerated from the query-log
  # (docs/audits/hasura-review-2026.md §Update) as plain JSON over HTTP.
  # Flow 1 (edge-node-red) keeps the minimal Hasura as the stable
  # alpha; new/refactored consumers point here instead. Internal-only —
  # no public route. v1 reads the main DB via pgbouncer; flow-routing
  # to packiot_shadow arrives with ADR-0012 Phase 4 reference data.
  # ── app-redis (ADR-0035) ─────────────────────────────────────────────────
  # Dedicated APPLICATION cache / shared-state Redis — SEPARATE from
  # authentik-redis (.14), which is authentik's private session/task store and
  # must NEVER be reused for app data. Backs refdata-api's cache-aside layer:
  # front4 dashboards poll the same tenant's /v1/query datasets on a refresh
  # tick, so a short-TTL cache collapses that fan-in to ONE DB hit per
  # (tenant, dataset, params) per TTL window. It is also the seam that later
  # fixes the count engine's in-process per-tenant memState (single-writer gap)
  # by moving that shared state here — see the ADR.
  #
  # It is a CACHE, not a store:
  #   --maxmemory 256mb + allkeys-lru  → bounded footprint; evict the coldest
  #                                       keys under pressure instead of OOMing.
  #   --appendonly no + --save ""      → no persistence; a restart is a cold
  #                                       cache (refdata fails open → re-fills
  #                                       from the DB, no correctness impact).
  # Non-secret today (internal packiot-net only, no published port). If a
  # password is ever required, inject it via a secret (--requirepass ${...} from
  # .env / Secrets Manager) — never hardcode, same rule as every other credential.
  #
  # PROD NOTE — do NOT ship this container to production. Prod uses managed
  # ElastiCache (Redis), provisioned in api-terraform; the app just points
  # REDIS_URL at the ElastiCache endpoint. See docs/adr/0035-redis-cache-layer.md.
  app-redis:
    image: redis:7-alpine
    container_name: app-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly no
      --save ""
    networks:
      packiot-net:
        ipv4_address: 172.18.0.35
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    mem_limit: 320m   # > maxmemory: Redis needs headroom above maxmemory for overhead
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  refdata-api:
    build: ./services/refdata-api
    container_name: refdata-api
    restart: unless-stopped
    env_file: [.env]
    environment:
      DB_HOST: pgbouncer
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: packiot
      # ── ADR-0032 Step 1: F3 read-plane plumbing (ADDITIVE, DEFAULT F1) ────────
      # REFDATA_FLOW selects which flow's DB refdata reads through pgbouncer:
      #   f1 → DB_NAME (packiot / F1, packiot.public)  ← DEFAULT, unchanged today
      #   f3 → DB_NAME_F3 (packiot_shadow / F3)         ← via the new pgbouncer
      #                                                    packiot_shadow pool
      # Kept f1 so this PR is a zero-behavior-change enablement: the F3 target is
      # plumbed-but-inactive. The sibling refdata-api code change consumes
      # REFDATA_FLOW to pick DB_NAME vs DB_NAME_F3 and to re-map each Surface-1
      # dataset's SQL to packiot_shadow objects. Flip to f3 only after that lands
      # and the per-dataset F3 parity gate (ADR-0032 §6 Step 1) is green.
      REFDATA_FLOW: f3
      # ADR-0046 #19a: the internal device_key→id_equipment resolver endpoint
      # (GET /internal/resolve-device). Shared secret with edge-transformer's
      # REFDATA_INTERNAL_KEY. Empty ⇒ endpoint fail-closed/inert (401) — set
      # INTERNAL_API_KEY in /opt/packiot/.env before the birth-bound flip.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      DB_NAME_F3: packiot_shadow
      HEALTH_PORT: "9104"
      # Distributed tracing → Tempo (OTLP/gRPC). Present = tracing on; a /v1 read
      # becomes one trace with its DB query time as a child span (otelpgx).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      # ADR-0015 P3 tenancy: key → customer(enterprise) id. Staging demo
      # keys only; production keys move to Secrets Manager at P3
      # hardening. customer_id is NEVER client-supplied.
      QUERY_API_KEYS: "stg-cpack-key:3,stg-sim-key:2,stg-incoplast-key:4"
      # ── ADR-0034: dual-accept IdP cutover (Firebase OR Cognito) ───────────────
      # refdata is now a relying party for the staging Cognito user pool
      # ALONGSIDE Firebase — a front4 session carrying EITHER token resolves its
      # tenant server-side (usersEnterpriseSQL matches id_user_firebase OR
      # id_user_cognito). These are PUBLIC identifiers (pool id / app-client id /
      # issuer) — NOT secrets (no signing key, no client secret). All are also
      # the in-binary defaults; set here so the config is explicit + auditable.
      # Reversible kill switch: COGNITO_AUTH_ENABLED=false → Firebase-only, no
      # other change. Firebase is NEVER disabled by this — the cutover is additive.
      COGNITO_AUTH_ENABLED: "true"
      COGNITO_ISSUER: "https://cognito-idp.us-east-1.amazonaws.com/us-east-1_0T9t1sTwt"
      COGNITO_CLIENT_ID: "2ckuoa0ov598rdpdn3uv039h6e"
      # COGNITO_JWKS_URL defaults to <issuer>/.well-known/jwks.json; override only
      # for a non-standard endpoint.
      # ── ADR-0035: cache-aside over app-redis (ADDITIVE · FLAG-GATED · FAIL-OPEN) ──
      # REDIS_CACHE_ENABLED=true turns on the /v1/query dataset cache-aside; set
      # "false" to disable at runtime (a container env flip + restart) with zero
      # code change — reads fall straight through to the DB. Per-dataset TTLs live
      # in the code (datasets.go groupCacheTTL): reference/config 180-300s, live
      # OEE 15-30s. If app-redis is down, refdata FAILS OPEN (serves from the DB),
      # so this dependency is soft — refdata boots and serves without it.
      REDIS_CACHE_ENABLED: "true"
      REDIS_URL: redis://app-redis:6379/0
    networks:
      packiot-net:
        ipv4_address: 172.18.0.26
    depends_on:
      # Soft dependency: refdata fails open, so we only wait for the container to
      # start (not a healthcheck) — a slow/unhealthy cache must never block the
      # read plane from booting.
      app-redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "/usr/local/bin/refdata-api", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── barcode-service ──────────────────────────────────────────────────
  # Phase-0 durable box-scan ingest with a server-authoritative, GAPLESS
  # per-production-order label sequence (North-star serialization/pharma
  # pillar, Bronze tier). POST /v1/scans decides label_seq = last+1 inside
  # ONE Postgres transaction under pg_advisory_xact_lock(id_po) so the count
  # can never gap or double under concurrent scanners / client replays
  # (idempotent by the client-generated scan_uuid UNIQUE). GET
  # /v1/scans/stream is an in-memory SSE fan-out of accepted scans, scoped
  # per PO AND per tenant. Writes F3 (packiot_shadow) via pgbouncer's
  # packiot_shadow pool — the go-forward plane. The Bronze schema is
  # edge-node-red/db/36-box-scans.sql (box_scans append-only + po_box_counter
  # + v_po_box_totals), applied to packiot_shadow. Internal-only for Phase 0;
  # a Node-RED tee posts scans here in a later phase. See
  # services/barcode-service/README.md.
  barcode-service:
    build: ./services/barcode-service
    container_name: barcode-service
    restart: unless-stopped
    env_file: [.env]
    environment:
      DB_HOST: pgbouncer
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Writes the go-forward plane (F3) via pgbouncer's packiot_shadow pool —
      # the same pool refdata-api reads through under REFDATA_FLOW=f3.
      DB_NAME: packiot_shadow
      HTTP_PORT: "8446"
      # ── Issuer-agnostic dual JWT verifier (tenant from JWT only) ──────────────
      # id_enterprise is derived SERVER-SIDE from a verified token and fails
      # closed; the client never names a tenant. These are PUBLIC identifiers
      # (Firebase project / Cognito pool + app-client id / issuer) — NOT secrets.
      # Same values refdata-api uses so "authenticated as enterprise N" agrees
      # across services. Leave COGNITO_ISSUER empty to run Firebase-only.
      FIREBASE_PROJECT_ID: fbpackiot
      COGNITO_ISSUER: "https://cognito-idp.us-east-1.amazonaws.com/us-east-1_0T9t1sTwt"
      COGNITO_CLIENT_ID: "2ckuoa0ov598rdpdn3uv039h6e"
      LOG_LEVEL: info
    networks:
      packiot-net:
        ipv4_address: 172.18.0.36
    depends_on:
      # Writes require the DB; wait for pgbouncer's container to start (the pool
      # itself fails the /healthz probe until reachable — ADR-0011 rule 4).
      pgbouncer:
        condition: service_started
    healthcheck:
      test: ["CMD", "/usr/local/bin/barcode-service", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  # ── operator-adapter ─────────────────────────────────────────────────
  # Operator twin of the ingest-shim. Incoplast's bespoke operator UI
  # (mui_* + Hasura) justifies downtimes and starts POs WITHOUT calling
  # edge-api, so those actions never reach staging user_logs and the
  # shadow-mirror can't replay them to F3. A tee node in Incoplast's
  # Node-RED posts each operator action here over HTTPS; the adapter maps
  # it to the matching edge-api call (which writes user_logs in F1), so
  # shadow-mirror replays it to packiot_shadow (F3) — making both flows
  # comparable for enterprise 4. Internal + Incoplast-Node-RED only; not a
  # public route. See services/operator-adapter/README.md.
  operator-adapter:
    build: ./services/operator-adapter
    container_name: operator-adapter
    restart: unless-stopped
    env_file: [.env]
    environment:
      PORT: "8443"
      EDGE_API_URL: http://edge-api:8080
      # Distributed tracing → Tempo (OTLP/gRPC). Present = tracing on. This is the
      # exemplar service for the tracing rollout (internal/tracing pattern): a
      # trace spans receive → resolve (DB) → edge-api call, and propagates the
      # traceparent so it continues into edge-api once that's instrumented.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      # Tenant scope — no hardcoded enterprise ids in code; set here.
      INCOPLAST_ENTERPRISE_ID: "4"
      INCOPLAST_TOPIC_PREFIX: INCOPLAST
      # Read-only Postgres resolver: packml_topic → staging ids. Creds come
      # from AWS Secrets Manager (CO-5: no plaintext password in compose env).
      # Connects to F1 `packiot` (packiot/staging/db) so the ids the adapter
      # resolves are the same ones edge-api accepts. Reaches the DB over
      # packiot-net (via pgbouncer, per the secret's host).
      AWS_REGION: us-east-1
      PG_SECRET_ID: packiot/staging/db
      # FILL AT DEPLOY (secrets — keep out of git):
      #   OPERATOR_API_KEY : shared secret the Incoplast tee node presents
      #                      as X-Ingest-Key.
      #   EDGE_API_KEY     : the enterprise-4 api_key edge-api authenticates
      #                      (SELECT api_key FROM enterprises WHERE
      #                       id_enterprise = 4).
      OPERATOR_API_KEY: ${OPERATOR_API_KEY}
      EDGE_API_KEY: ${OPERATOR_EDGE_API_KEY}
      # TLS — refuses to serve plaintext. Cert+key mounted below.
      TLS_CERT_FILE: /opt/packiot/operator-adapter/certs/tls.crt
      TLS_KEY_FILE: /opt/packiot/operator-adapter/certs/tls.key
    volumes:
      # FILL AT DEPLOY: place tls.crt + tls.key on the host here.
      - /opt/packiot/operator-adapter/certs:/opt/packiot/operator-adapter/certs:ro
    ports:
      - "8445:8443"
    networks:
      packiot-net:
        ipv4_address: 172.18.0.30
    depends_on:
      edge-api:
        condition: service_started
      # Resolver reads packml_register → equipments via pgbouncer at boot.
      pgbouncer:
        condition: service_started
    healthcheck:
      # Now also verifies the read-only DB pool is up (topic resolution needs it).
      test: ["CMD", "/usr/local/bin/operator-adapter", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  shadow-mirror:
    build: ./services/shadow-mirror
    container_name: shadow-mirror
    restart: unless-stopped
    env_file: [.env]
    environment:
      LOG_LEVEL: info
      # DEFAULT OFF — service starts but no polling happens.
      # ADR-0013 shadow-mirror now ACTIVE:
      # - shadow_go_port.equipment_events_man + production_orders exist
      #   (migration 20260702000001_shadow_go_port_operator_tables.ts)
      # - packiot_shadow.public.* exists (Phase 3 writer-tables SQL)
      # - 10 handlers registered covering ~90% of daily operator volume
      SHADOW_MIRROR_ENABLED: "true"
      AWS_REGION: us-east-1
      PG_SECRET_ID: packiot/staging/db
      # DB creds come from the .env for skeleton; migrate to AWS
      # Secrets Manager in Phase 2 (matches mirror-worker-go and
      # oeecloud-worker patterns). Connects DIRECTLY to postgres
      # (not pgbouncer) because pgbouncer's static database list
      # doesn't include packiot_shadow — bypassing keeps the skeleton
      # PR from having to touch pgbouncer config too.
      DB_HOST: 10.10.10.89   # staging DB EC2 direct
      DB_PORT: "5432"
      # Explicit env mapping — .env has POSTGRES_USER/POSTGRES_PASSWORD
      # (as used by pgbouncer + edge-api), NOT DB_USER/DB_PASSWORD.
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      PG_DB_NAME: packiot
      PG_SHADOW_DB_NAME: packiot_shadow
      POLL_INTERVAL_MS: "2000"
      BATCH_SIZE: "100"
      MAX_RETRIES: "5"
      HEALTH_PORT: "9103"
    networks:
      packiot-net:
        ipv4_address: 172.18.0.25
    # No depends_on — service is idle by default (SHADOW_MIRROR_ENABLED=false)
    # so it can start regardless of other services.
    healthcheck:
      test: ["CMD", "/usr/local/bin/shadow-mirror", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # ── Operator (dev-facing staging SPA) ─────────────────────────────────────────
  # Vite-built React SPA + nginx that reverse-proxies edge-nodered's HTTP API
  # over the docker network so the browser sees a single origin (no CORS).
  # Devs land at operator.staging.packiot.app behind Authentik SSO and log in
  # with `packiot` / `packiot` (configured in edge-node-red/flows/Configuration.json
  # with endpoints scoped to CPACK staging machines).
  operator:
    build:
      context: ./operator
      dockerfile: Dockerfile.staging
      args:
        # task #31 — enable the offline durable PO write-queue (#94/#95).
        # VITE_* is baked by Vite at `yarn build` (compile-time), so the ONLY
        # way to turn it on is to pass it as a build-arg here and REBUILD the
        # image (deploy-staging.yml runs `docker compose build` every deploy).
        # A container env flip + restart does NOT work. Rollback = set "false".
        # Client-side only, CPACK-keyed staging SPA (Incoplast bypasses via
        # operator-adapter). See operator/Dockerfile.staging + durableWrite.js.
        VITE_PO_WRITE_QUEUE_ENABLED: "true"
    container_name: operator
    restart: unless-stopped
    # ADR-0018 wave 4: nginx injects the enterprise api key on proxied
    # /api/* writes (envsubst template) — the browser NEVER holds it.
    # Value lives in /opt/packiot/.env (OPERATOR_EDGE_API_KEY =
    # CPACK-Staging enterprises.api_key). edge-api gets JWT_SECRET via
    # its env_file for the /session usecase (both appended 2026-07-07).
    #
    # ADR-0027 Surface-1 (task #57): nginx also injects the tenant read key
    # on proxied /v1/* reads (refdata-api). refdata derives customer_id from
    # this key server-side — the operator never names a tenant. This staging
    # SPA is single-tenant CPACK, so the value is the CPACK entry from
    # refdata's QUERY_API_KEYS above (stg-cpack-key). It is an opaque read
    # key, NOT an enterprise id and NOT the enterprises.api_key secret —
    # refdata maps it to the tenant. Overridable via /opt/packiot/.env;
    # defaults to the committed staging key so the box works out of the box.
    # ORDERED PAIR: deploy this BEFORE refdata's auth middleware (PR2) so the
    # operator sends the key before refdata requires it.
    environment:
      EDGE_API_KEY: ${OPERATOR_EDGE_API_KEY:-}
      REFDATA_API_KEY: ${OPERATOR_REFDATA_API_KEY:-stg-cpack-key}
    ports:
      - "127.0.0.1:8083:80"
    networks:
      packiot-net:
        ipv4_address: 172.18.0.19
    depends_on:
      # Repointed off the retired edge-nodered (2026-08-16). The deployed operator
      # SPA calls ONLY edge-api (/session, /api/*) and refdata-api (/v1/*) — verified
      # from the built bundle; it makes zero calls to edge-nodered. Wait on its real
      # backends instead so early SPA requests don't 5xx.
      edge-api:
        condition: service_started
      refdata-api:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
