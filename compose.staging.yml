# compose.staging.yml — App EC2 service stack (staging, us-east-1)
#
# Service map:
#   rabbitmq          :5672/:15672 — AMQP message bus; management UI at rabbitmq.staging.packiot.com
#   hasura            :8081        — Hasura GraphQL → hasura.staging.packiot.com
#   edge-api          :8080        — NestJS REST/admin API → api.staging.packiot.com
#   edge-nodered      :1880        — Edge Node-RED → nodered.staging.packiot.com
#   oeecloud          (internal)  — Cloud OEE Node-RED (no public vhost needed)
#   grafana           :3000        — Grafana dashboards → grafana.staging.packiot.com
#   loki              (internal)  — Log aggregation (Grafana datasource)
#   promtail          (internal)  — Docker log collector → Loki
#
# Differences from compose.development.yml:
#   - No postgres: DB runs on a separate private-subnet EC2
#   - No tests (dev-only)
#   - All ports bound to 127.0.0.1 — Nginx terminates TLS externally
#   - DISABLE_EDITOR=true on Node-RED instances (production mode)
#   - Secrets loaded from /opt/packiot/.env (symlinked to .env by app_init.sh)
#
# Deploy: docker compose -f compose.staging.yml up -d --build

networks:
  packiot-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/24

volumes:
  nr-edge-data:
  grafana-data:
  loki-data:
  prom-data:
  rabbitmq-data:
  authentik-media:
  authentik-certs:
  mosquitto-data:   # ADR-0011 P0-2: retained NBIRTHs survive broker restart

# ── IP allocation ──────────────────────────────────────────────────────────────
# .2  hasura       .3  edge-api      .4  edge-nodered   .5  rabbitmq
# .7  grafana      .8  loki          .9  promtail
# .10 pgbouncer    .11 simulator     .12 authentik-server  .13 authentik-worker  .14 authentik-redis
# .15 hasura-init  .16 db-migrate    .17 adminer
# .20 oeecloud-worker  .21 mirror-worker-go  .22 prometheus
# .23 edge-transformer (ADR-0009 Phase 2; reserved, NOT yet wired — see commented service block below)
# .24 mosquitto (ADR-0010 Phase 2 MQTT broker; ADR-0011 P0-2 durability config)
# .6 (oeecloud Node-RED, decommissioned 2026-06-23) and .18 (mirror-worker TS, decommissioned 2026-06-24) reserved — do not reuse without confirming consumers are gone
# (one-shot; static IP prevents IPAM race with .3)

services:
  # ── PgBouncer (PostgreSQL connection pooler) ───────────────────────────────────
  # Sits between app services and the external TimescaleDB EC2.
  # Pool mode: transaction — each query borrows a server connection and releases it
  # immediately. Multiplexes up to MAX_CLIENT_CONN=100 app connections onto
  # DEFAULT_POOL_SIZE=5 real PostgreSQL connections.
  #
  # ⚠ Hasura does NOT use PgBouncer: it relies on prepared statements that are
  # incompatible with transaction-mode pooling. Cap its pool directly instead
  # via HASURA_GRAPHQL_PG_CONNECTIONS.
  #
  # Services routed here: edge-api, oeecloud, simulator.
  # Services kept direct: hasura (prepared stmts), db-migrate (DDL/advisory locks).
  pgbouncer:
    image: edoburu/pgbouncer:1.22.1-p0
    restart: unless-stopped
    environment:
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: "20"
      MAX_CLIENT_CONN: "200"
      AUTH_TYPE: scram-sha-256
      # Clean up open transactions when server connections are returned.
      # Prevents idle-in-transaction buildup that exhausts the server pool.
      SERVER_RESET_QUERY: "ROLLBACK"
      SERVER_RESET_QUERY_ALWAYS: "1"
      # Cancel queries waiting >60s in PgBouncer (prevents oeecloud pool exhaustion).
      QUERY_TIMEOUT: "60"
      # Reclaim idle server connections after 120s (default 600s).
      SERVER_IDLE_TIMEOUT: "120"
    networks:
      packiot-net:
        ipv4_address: 172.18.0.10
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── RabbitMQ (message bus) ─────────────────────────────────────────────────────
  # AMQP 0.9.1 broker: edge-nodered publishes to the `oee` exchange,
  # oeecloud subscribes via the `oeecloud-q` durable queue.
  # Management UI at rabbitmq.staging.packiot.com (port 15672 via Nginx).
  # Internal AMQP port 5672 is available to services on packiot-net.
  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      packiot-net:
        ipv4_address: 172.18.0.5
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}

  # ── Mosquitto (MQTT broker for Sparkplug B, ADR-0010) ──────────────────────────
  # Factory-side MQTT broker. PLCs publish Sparkplug B here; edge-transformer
  # subscribes to `spBv1.0/+/+/+/+` and bridges the decoded data into RabbitMQ.
  #
  # ADR-0011 rule 1 + P0-2: persistence is enabled in the config file so
  # retained NBIRTHs survive broker restart. Without this, every subscriber
  # that reconnects after Mosquitto restarts silently under-reports metrics
  # until the next NBIRTH — up to several minutes of blind spot per publisher.
  #
  # Anonymous auth for MVP staging; ADR-0011 P0-2b follow-up moves to
  # password-file + ACL keyed to AWS Secrets Manager.
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      # AMQP-adjacent: bind only to loopback on the host. Intra-stack traffic
      # goes via packiot-net; external factory PLCs reach us via nginx/ALB.
      - "127.0.0.1:1883:1883"
    volumes:
      - ./configs/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data       # persistence — ADR-0011 P0-2
    networks:
      packiot-net:
        ipv4_address: 172.18.0.24
    healthcheck:
      # Publish a heartbeat via mosquitto_pub — the exit code tells us the
      # broker is accepting client connections. `-W` was mosquitto 1.x-only
      # and got removed in 2.x. Timeout is enforced via the CMD-SHELL wrapper.
      test: ["CMD-SHELL", "timeout 5 mosquitto_pub -h 127.0.0.1 -t 'healthcheck/ping' -m 'ok' -q 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}

  # ── Hasura GraphQL ─────────────────────────────────────────────────────────────
  hasura:
    image: hasura/graphql-engine:v2.44.0
    restart: unless-stopped
    env_file: [.env]
    environment:
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "false"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup,http-log,webhook-log,websocket-log
      # Cap pool: Hasura defaults to 50 connections which alone saturates
      # TimescaleDB's max_connections=50. Keep Hasura direct (no PgBouncer)
      # because it uses prepared statements incompatible with transaction pooling.
      HASURA_GRAPHQL_PG_CONNECTIONS: "5"
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      packiot-net:
        ipv4_address: 172.18.0.2
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  hasura-init:
    image: curlimages/curl:latest
    networks:
      packiot-net:
        ipv4_address: 172.18.0.15
    env_file: [.env]
    depends_on:
      hasura:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    volumes:
      - ./edge-node-red/hasura/metadata.json:/metadata.json:ro
    entrypoint:
      - sh
      - -c
      - |
        METADATA=$$(sed '1s/{/{\"allow_inconsistent_metadata\":true,/' /metadata.json)
        printf '%s' "{\"type\":\"replace_metadata\",\"version\":2,\"args\":$${METADATA}}" > /tmp/payload.json
        for i in 1 2 3 4 5; do
          curl -sf -X POST http://hasura:8080/v1/metadata \
            -H 'Content-Type: application/json' \
            -H "X-Hasura-Admin-Secret: $${HASURA_GRAPHQL_ADMIN_SECRET}" \
            -d @/tmp/payload.json && echo "Hasura metadata applied" && \
          curl -sf -X POST http://hasura:8080/v1/metadata \
            -H 'Content-Type: application/json' \
            -H "X-Hasura-Admin-Secret: $${HASURA_GRAPHQL_ADMIN_SECRET}" \
            -d '{"type":"reload_metadata","args":{}}' && echo "Hasura metadata reloaded" && exit 0
          echo "Attempt $$i failed — retrying in 3s..."
          sleep 3
        done
        echo "Hasura metadata apply FAILED after 5 attempts" && exit 1
    restart: "no"

  # ── DB Migrations (one-shot) ──────────────────────────────────────────────────
  # Applies all pending Knex migrations against the external Postgres DB.
  # Uses the development Docker target so knex + ts-node (devDeps) are available.
  # edge-api and hasura-init both wait for this to succeed before starting.
  db-migrate:
    build:
      context: ./edge-api
      target: migrate
    env_file: [.env]
    environment:
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      packiot-net:
        ipv4_address: 172.18.0.16
    restart: "no"
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── Edge API (NestJS) ──────────────────────────────────────────────────────────
  edge-api:
    build:
      context: ./edge-api
      target: production
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      NEW_RELIC_ENABLED: "false"
      NEW_RELIC_NO_CONFIG_FILE: "true"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: pgbouncer
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      packiot-net:
        ipv4_address: 172.18.0.3
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  # ── Edge Node-RED ──────────────────────────────────────────────────────────────
  edge-nodered:
    build:
      context: ./edge-node-red
    restart: unless-stopped
    env_file: [.env]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      ID_PUBSUB_NODE: staging-app-ec2
      LOG_LEVEL: info
      # GraphQL polling flows query production views that don't exist in staging
      # (v_operator_po_list_setup_4 etc.) — each failed call takes 2-5s.
      # Now that the editor is enabled, disable those flows directly in Node-RED
      # UI to stop the CPU burn without hiding HASURA_URL from the container.
      HASURA_URL: http://hasura:8080/v1/graphql
      HASURA_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET}
      API_KEY: ${EDGE_API_KEY}
      FIREBASE_API_KEY: bypassed-by-hasura-admin-secret
      EDGE_API_BASE_URL: http://edge-api:8080
      # Scope edge-nodered's GraphQL entities query (GraphQL.json:240) to
      # CPACK-Staging (id_enterprise=3). Otherwise the unscoped query
      # `v_operator_entities_2[0]` lands on whichever enterprise is first
      # in the view's natural ordering — on staging that's SimCorp,
      # making /machines/:lineId etc. return SimCorp data even for the
      # CPACK-permission user. Hardcoded because edge-nodered's design is
      # one-enterprise-per-edge; this overrides for the multi-tenant
      # staging shape.
      ID_ENTERPRISE: "3"
    # Bypass Docker's embedded DNS (intermittent EAI_AGAIN under load) by
    # resolving all intra-stack hostnames via /etc/hosts instead.
    extra_hosts:
      - "hasura:172.18.0.2"
      - "rabbitmq:172.18.0.5"
      - "edge-api:172.18.0.3"
      - "pgbouncer:172.18.0.10"
    ports:
      - "127.0.0.1:1880:1880"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:1880/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      rabbitmq:
        condition: service_healthy
      hasura-init:
        condition: service_completed_successfully
    networks:
      packiot-net:
        ipv4_address: 172.18.0.4
    volumes:
      - nr-edge-data:/data
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  # ── OEECloud Node-RED — DECOMMISSIONED 2026-06-23 ─────────────────────────────
  # Replaced by `oeecloud-worker` (Go) below. Removal flow:
  #   1. 24h parity-check passed (parity-check.sql sections A-E all green)
  #   2. 5-min isolation test: stopped this service, worker carried 100% of
  #      delivered messages (6074 acked, 0 nacks/failures) with no drop in
  #      equipment_values throughput (~570 rows/min, freshness <1.9s)
  #   3. AMQP queue oeecloud-q deleted (rabbitmqctl delete_queue)
  #   4. Docker volume stack_nr-oeecloud-data removed (~9 GB SQLite buffer reclaim)
  # See [[project_oeecloud_worker_migration]] for the full timeline.

  # ── Grafana ────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.5.0
    restart: unless-stopped
    env_file: [.env]
    # Bump `provisioning_rev` whenever grafana/provisioning/ files change.
    # Compose only recreates a service when its spec changes — provisioning
    # files are read at container boot, so without this marker Grafana would
    # silently ignore new datasources/dashboards on `docker compose up -d`.
    labels:
      - "provisioning_rev=2026-06-24-mirror-worker-observability"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/01-oee-pipeline.json
      GF_USERS_DEFAULT_THEME: dark
      GF_FEATURE_TOGGLES_ENABLE: publicDashboards
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      packiot-net:
        ipv4_address: 172.18.0.7
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}

  # ── Loki ───────────────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki/loki-local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      packiot-net:
        ipv4_address: 172.18.0.8
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── Promtail ───────────────────────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:3.4.2
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - ./monitoring/promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      packiot-net:
        ipv4_address: 172.18.0.9
    depends_on:
      loki:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── Prometheus ────────────────────────────────────────────────────────────────
  # Pull-based metrics collector for in-cluster services. Scrapes /metrics
  # endpoints listed in monitoring/prometheus/prometheus.yml. Retention is
  # capped both by time (15d) and size (2GB) — staging disk is finite; size
  # cap wins if cardinality ever spikes. Grafana datasource UID is
  # `packiot-prometheus` (see grafana/provisioning/datasources/prometheus.yml).
  #
  # Why pull over push: if a target dies, Prometheus notices the absent
  # scrape — no need to wait for a push to never arrive. Same observability
  # primitive as systemd-journald: the collector drives cadence and treats
  # silence as a signal.
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    restart: unless-stopped
    # Bump `config_rev` whenever monitoring/prometheus/prometheus.yml
    # changes. Bind mounts to a single FILE bind to the source's INODE;
    # git rewrites the file with a new inode on checkout, so the running
    # container reads stale content until recreated. Same trap as the
    # grafana `provisioning_rev` pattern.
    labels:
      - "config_rev=2026-06-24-mirror-worker-scrape"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      packiot-net:
        ipv4_address: 172.18.0.22
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── Simulator ──────────────────────────────────────────────────────────────────
  # PLC + Operator simulator for staging. Reads packml_register from DB, posts
  # machine metrics to edge-nodered /plc-data, and simulates operator actions
  # against edge-api. Requires the Simulator Corp enterprise + packml_register
  # entries to be seeded (see edge-node-red/db/03-operator-simulator.sql).
  simulator:
    build:
      context: ./simulator
    restart: unless-stopped
    environment:
      EDGE_NODERED_URL: http://edge-nodered:1880
      EDGE_API_URL: http://edge-api:8080
      DB_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}"
      SIM_INTERVAL: "5"
      OP_INTERVAL: "15"
    depends_on:
      edge-nodered:
        condition: service_healthy
      edge-api:
        condition: service_started
    networks: [packiot-net]
    # Bypass docker-embedded DNS for the two hot endpoints — the simulator's
    # /plc-data poller was throwing intermittent NameResolutionError(
    # 'Failed to resolve edge-nodered') every 5-7s, which silenced the
    # equipment_values pipeline for ~2.5h on 2026-06-22. Other services
    # (edge-nodered, oeecloud) use the same extra_hosts pattern for
    # pgbouncer/rabbitmq — fixed IPs on packiot-net make this safe.
    extra_hosts:
      - "edge-nodered:172.18.0.4"
      - "edge-api:172.18.0.3"
      - "pgbouncer:172.18.0.10"
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── Authentik SSO ──────────────────────────────────────────────────────────────
  # Self-hosted IdP providing browser SSO for all staging service vhosts via Nginx
  # forward auth. The embedded outpost inside authentik-server handles
  # /outpost.goauthentik.io/auth/nginx subrequests from Nginx.
  #
  # DB: dedicated 'authentik' database on the existing TimescaleDB EC2 (not a
  # separate postgres container — avoids ~100 MB overhead on the t4g.small).
  # Credentials: AUTHENTIK_DB_PASSWORD + AUTHENTIK_SECRET_KEY from .env.
  #
  # First-run setup (one-time, after stack starts):
  #   https://auth.staging.packiot.app/if/flow/initial-setup/
  authentik-redis:
    image: redis:7-alpine
    container_name: authentik-redis
    restart: unless-stopped
    networks:
      packiot-net:
        ipv4_address: 172.18.0.14
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  authentik-server:
    image: ghcr.io/goauthentik/server:2024.12.3
    container_name: authentik-server
    command: server
    restart: unless-stopped
    env_file: [.env]
    environment:
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: ${POSTGRES_HOST}
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_LOG_LEVEL: info
    volumes:
      - authentik-media:/media
      - authentik-certs:/certs
    ports:
      - "127.0.0.1:9000:9000"
    networks:
      packiot-net:
        ipv4_address: 172.18.0.12
    depends_on: [authentik-redis]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  authentik-worker:
    image: ghcr.io/goauthentik/server:2024.12.3
    container_name: authentik-worker
    command: worker
    restart: unless-stopped
    env_file: [.env]
    environment:
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: ${POSTGRES_HOST}
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    networks:
      packiot-net:
        ipv4_address: 172.18.0.13
    depends_on: [authentik-redis, authentik-server]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # ── Adminer (PostgreSQL web UI) ───────────────────────────────────────────────
  # Lightweight single-PHP-file DB browser. Connects to the packiot DB via
  # TimescaleDB directly (bypasses pgbouncer — transaction pooling breaks Adminer's
  # SET search_path calls). Access at adminer.staging.packiot.app behind Authentik
  # SSO. Login: System=PostgreSQL, Server=<POSTGRES_HOST>, User=postgres,
  # Password=<POSTGRES_PASSWORD from .env>, Database=packiot.
  adminer:
    build: ./adminer
    container_name: adminer
    restart: unless-stopped
    env_file: [.env]
    environment:
      ADMINER_DEFAULT_SERVER: ${POSTGRES_HOST}
    ports:
      - "127.0.0.1:8082:8080"
    networks:
      packiot-net:
        ipv4_address: 172.18.0.17
    depends_on: [pgbouncer]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── Mirror Worker (TS) — DECOMMISSIONED 2026-06-24 ────────────────────────────
  # Replaced by `mirror-worker-go` (Go) below. Removal flow:
  #   1. MW-2 phase 2 shipped 18591d7 (2026-06-23) — all 10 operator eventTypes
  #      replayed by the Go worker (order-status-changed, order-created,
  #      order-created-started, order-started, order-changed, order-stopped,
  #      order-replaced, event-justified, event-edited, event-splitted).
  #   2. Parity verified: cursor advancing, 0 DLQ, both workers wrote identical
  #      staging POs + events for ~24h via parallel `source` ('cpack-prod' vs
  #      'cpack-prod-go') against the same mirror_id_map.
  #   3. Go worker promoted to `source='cpack-prod'`; TS worker stopped + image
  #      removed; `./services/mirror-worker` source tree deleted (this commit).
  # See [[project_mirror_gaps_and_plan]] for the MW-2 timeline.

  # ── Mirror Worker (Go — MW-2 port of services/mirror-worker TS) ───────────────
  # Parallel-run with the TS mirror-worker via independent cursor source
  # ('cpack-prod-go' vs 'cpack-prod'). Both fetch the same prod user_logs
  # rows and replay independently to staging edge-api — but each tracks
  # its own mirror_replay_cursor + mirror_id_map rows. Staging POs created
  # by either look up via the mapping (cache hit) on subsequent operator
  # actions; deduplication is via the lookupMapping check at the top of
  # each create handler.
  #
  # CO-5: fetches DB creds from AWS Secrets Manager at startup
  # (databaseCredentials + packiot/staging/db) — no plaintext passwords
  # in env vars.
  #
  # PHASE 1 of the port: ships with only order-status-changed handler
  # registered. Other categories advance the cursor without acting (the
  # TS worker handles them). PHASE 2 ports the remaining 9 handlers +
  # the interval-overlap event matcher. Cut over after parity: rename
  # source to 'cpack-prod' and stop the TS one.
  mirror-worker-go:
    build: ./services/mirror-worker-go
    container_name: mirror-worker-go
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      AWS_REGION: us-east-1
      PROD_DB_SECRET_ID: databaseCredentials
      STAGING_DB_SECRET_ID: packiot/staging/db
      SOURCE_NAME: cpack-prod-go
      PROD_ENTERPRISE_ID: "1"
      STAGING_ENTERPRISE_ID: "3"
      POLL_INTERVAL_SEC: "60"
      BATCH_SIZE: "50"
      PER_POST_DELAY_MS: "50"
      STAGING_API_URL: http://edge-api:8080
      HEALTH_PORT: "9102"
    networks:
      packiot-net:
        ipv4_address: 172.18.0.21
    depends_on:
      pgbouncer:
        condition: service_started
      edge-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "/usr/local/bin/mirror-worker-go", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # ── oeecloud Worker (Go — replaces oeecloud-node-red over time) ───────────────
  # AMQP consumer with manual ack + DLX + retry topology. Runs in PARALLEL with
  # the existing stack-oeecloud-1 (Node-RED) by binding a SEPARATE queue
  # (`oeecloud-worker-q`) to the same `oee` topic exchange. Both consumers see
  # every published message — neither competes with the other.
  #
  # Scaffold-only phase: placeholder LogOnly handler that just logs+acks every
  # message. No DB writes yet. Future sessions add per-routing-key handlers
  # one at a time; once at parity, decommission Node-RED's queue + container.
  #
  # See services/oeecloud-worker/internal/amqp/topology.go for the
  # exchange/queue/binding graph (with ASCII diagram).
  oeecloud-worker:
    build: ./services/oeecloud-worker
    container_name: oeecloud-worker
    restart: unless-stopped
    env_file: [.env]
    environment:
      LOG_LEVEL: info
      # CO-5 phase 2: DB + AMQP both via Secrets Manager. AMQP user
      # `oeecloud-worker` was provisioned on staging broker with
      # least-privilege perms (own topology only, no admin reach, no
      # access to oeecloud-q). EC2 IAM role grants packiot/staging/*.
      AWS_REGION: us-east-1
      PG_SECRET_ID: packiot/staging/db
      RABBITMQ_SECRET_ID: packiot/staging/rabbitmq-oeecloud-creds
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      SOURCE_EXCHANGE: oee
      WORKER_QUEUE: oeecloud-worker-q
      RETRY_EXCHANGE: oee-retry
      RETRY_QUEUE: oeecloud-worker-q-retry-30s
      FAILED_EXCHANGE: oee-failed
      FAILED_QUEUE: oeecloud-worker-q-failed
      RETRY_TTL_MS: "30000"
      MAX_RETRIES: "5"
      PREFETCH: "50"
      HEALTH_PORT: "9101"
    networks:
      packiot-net:
        ipv4_address: 172.18.0.20
    depends_on:
      rabbitmq:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      db-migrate:
        # Wait for migrations before consuming — otherwise the first
        # ~10s of resolver queries fail (packml_register may not exist),
        # producing spurious nacks until db-migrate catches up.
        condition: service_completed_successfully
    # Worker self-probes via `--healthcheck` subcommand (distroless image
    # has no shell/wget/curl, so the binary handles HTTP probe of its own
    # in-process /health server). Exit 0 = healthy, non-zero = not.
    healthcheck:
      test: ["CMD", "/usr/local/bin/oeecloud-worker", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # ── edge-transformer (ADR-0009 Phase 2 — SHADOW MODE) ──────────────────────────
  # Per-factory Go service that consumes from the local RabbitMQ exchange
  # `edge.plc-normalized` and will replace the deterministic transform layer
  # currently inside edge-node-red's Sparkplug subflow + Calc_Counters.
  #
  # SHADOW MODE — logs+acks every delivery, writes nothing. Phase 3 (Go ports
  # of Calc_Counters family) is what flips this from shadow to authoritative.
  #
  # Prerequisites (ALL MET as of 2026-06-30):
  #   ✓ Secret packiot/staging/rabbitmq-edge-transformer-creds exists
  #   ✓ RabbitMQ user `edge-transformer` provisioned via app_init.sh
  #     (configure/write/read scoped per ADR-0009 runbook §2.B)
  #   ✓ Topology declared: edge.plc-normalized + dlx.edge.plc-normalized
  #   ✗ Node-RED publisher flow (Phase 2.5 follow-up — until then, the
  #     consumer sits idle waiting for messages; harmless)
  #
  # Reuse rule (ADR-0009 Errata Correction 2): everything below mirrors
  # oeecloud-worker's service entry — same Secrets Manager pattern, same env
  # var shape, same depends_on RabbitMQ healthcheck. Only port + queue names
  # differ.
  edge-transformer:
    build: ./services/edge-transformer
    container_name: edge-transformer
    restart: unless-stopped
    env_file: [.env]
    environment:
      LOG_LEVEL: info
      EDGE_TRANSFORMER_MODE: factory
      AWS_REGION: us-east-1
      RABBITMQ_SECRET_ID: packiot/staging/rabbitmq-edge-transformer-creds
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      SOURCE_EXCHANGE: edge.plc-normalized
      WORKER_QUEUE: edge-transformer-q
      RETRY_EXCHANGE: edge.plc-normalized-retry
      RETRY_QUEUE: edge-transformer-q-retry-30s
      FAILED_EXCHANGE: dlx.edge.plc-normalized
      FAILED_QUEUE: edge-transformer-q-failed
      RETRY_TTL_MS: "30000"
      MAX_RETRIES: "5"
      PREFETCH: "50"
      HEALTH_PORT: "9102"   # deliberately NOT 9101 — oeecloud-worker owns that
      CLIENT_YAML_PATH: /etc/packiot/client.yaml
      # ADR-0010 Phase 2 MQTT subscriber — turned ON in staging for the
      # end-to-end shadow-mode test. Default remains false in code (P0-safe).
      # ADR-0011 rule 4: /healthz will surface degraded state when the
      # subscriber can't reach mosquitto or hasn't received data in 60s.
      MQTT_ENABLED: "true"
      MQTT_BROKER_URL: "tcp://mosquitto:1883"
      MQTT_CLIENT_ID: "edge-transformer-staging"
      MQTT_USERNAME: ""
      MQTT_PASSWORD: ""
    volumes:
      # ADR-0004 — per-customer client.yaml lives in git under
      # docs/clients/<tenant>.yaml; mount it read-only into the container.
      - ./docs/clients/cpack.yaml:/etc/packiot/client.yaml:ro
    networks:
      packiot-net:
        ipv4_address: 172.18.0.23
    depends_on:
      rabbitmq:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/edge-transformer", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # ── Operator (dev-facing staging SPA) ─────────────────────────────────────────
  # Vite-built React SPA + nginx that reverse-proxies edge-nodered's HTTP API
  # over the docker network so the browser sees a single origin (no CORS).
  # Devs land at operator.staging.packiot.app behind Authentik SSO and log in
  # with `packiot` / `packiot` (configured in edge-node-red/flows/Configuration.json
  # with endpoints scoped to CPACK staging machines).
  operator:
    build:
      context: ./operator
      dockerfile: Dockerfile.staging
    container_name: operator
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:80"
    networks:
      packiot-net:
        ipv4_address: 172.18.0.19
    depends_on:
      edge-nodered:
        # Wait for edge-nodered's healthcheck — without it, the SPA's
        # initial API calls 5xx until the Node-RED flows are loaded.
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
