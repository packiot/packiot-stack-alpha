# compose.validation.yml — Pre-flip behavior-validation harness (ADR-0022 V1)
#
# Stands the REFACTORED services against an ISOLATED database (packiot_validation)
# so BOTH tenants can be exercised on the real staging EC2 architecture BEFORE
# the flip — WITHOUT touching the bake (packiot_shadow) or F1 (packiot).
#
# NO EMULATORS / NO SIMULATOR — both tenants use REAL data:
#   • CPACK (enterprise 3)     — real prod, mirrored in by mirror-worker-go-val
#                                 (reads real prod, writes packiot_validation).
#   • Incoplast (enterprise 4) — REAL live SparkPlug B, teed from the live
#                                 Incoplast Node-RED into mosquitto-val (8883
#                                 TLS) and driven through the standard pipeline.
#
# Data flow in this harness
# ─────────────────────────
#   Incoplast:  live Node-RED tee ──mqtts:8883──► mosquitto-val ──1883──►
#               edge-transformer-val ──oee──► rabbitmq-val ──►
#               oeecloud-worker-val ──► packiot_validation ──► OEE cascade
#                                                              (triggers + pg_cron
#                                                               from edge-node-red/db)
#   CPACK:      real prod DB ──► mirror-worker-go-val ──► edge-api-val + direct DB
#                                                          ──► packiot_validation
#   Both:       operator actions in packiot_validation ──► shadow-mirror-val
#
# ISOLATION GUARANTEES
# ────────────────────
#   1. Dedicated network `packiot-val-net` (172.19.0.0/24) — no shared subnet
#      with compose.staging.yml's packiot-net (172.18.0.0/24).
#   2. Every container name is suffixed `-val`; every named volume is `*-val`.
#   3. Every service writes to packiot_validation ONLY:
#        - Services that read DB creds from AWS Secrets Manager (mirror-worker-go)
#          point STAGING_DB_SECRET_ID at a NEW secret `packiot/validation/db`
#          whose `name` field IS `packiot_validation` (FILL AT DEPLOY).
#        - Services that support CREDS_SOURCE=env (edge-transformer, oeecloud-worker)
#          set DB_NAME/PG_DB_NAME=packiot_validation explicitly.
#      No service points at `packiot` or `packiot_shadow`. The deploy workflow
#      (.github/workflows/deploy-validation.yml) asserts the target DB name is
#      `packiot_validation` before it applies a single line of SQL.
#   4. mosquitto-val is a SEPARATE broker; no reuse of the staging `mosquitto`.
#   5. rabbitmq-val is a SEPARATE broker; no queue/exchange collision with the
#      staging `oee`/`edge.plc-normalized` topologies.
#   6. mirror-worker-go-val uses SOURCE_NAME=cpack-prod-val — an independent
#      cursor + mirror_id_map lineage, so it never touches staging's
#      `cpack-prod-go` replay state.
#
# NO host port collides with compose.staging.yml (staging uses 5672/15672/1883/
# 8080-8083/3000/9000/9090; here: 8883 public + 15673/8090 loopback only).
#
# Supporting infra (rabbitmq-val, pgbouncer-val, edge-api-val) is NOT a
# "service under test" — it exists because the named services provably need a
# bus (transformer→worker) and a PO-replay HTTP target (mirror→edge-api). Each
# is marked "SUPPORTING INFRA" below.
#
# Deploy: see docs/adr/reference/0022-validation-harness-runbook.md.
#   The DB is built by .github/workflows/deploy-validation.yml, NOT by this file.
#   docker compose -f compose.validation.yml -p stackval up -d

networks:
  packiot-val-net:
    name: packiot-val-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/24

volumes:
  mosquitto-val-data:
  rabbitmq-val-data:
  edge-transformer-val-outbox:

# ── IP allocation (172.19.0.0/24) ───────────────────────────────────────────
# .2 pgbouncer-val   .3 edge-api-val    .5 rabbitmq-val
# .20 oeecloud-worker-val  .21 mirror-worker-go-val  .23 edge-transformer-val
# .24 mosquitto-val  .25 shadow-mirror-val  .26 refdata-api-val

services:
  # ══ SUPPORTING INFRA ═══════════════════════════════════════════════════════
  # ── PgBouncer (val) — pooler in front of the DB EC2, DB packiot_validation ──
  # edge-api-val + refdata-api-val route through here (transaction pooling),
  # matching compose.staging.yml's pgbouncer. The Go workers connect DIRECT to
  # the DB EC2 (pgbouncer's static database list would not include a new DB).
  pgbouncer-val:
    image: edoburu/pgbouncer:1.22.1-p0
    container_name: pgbouncer-val
    restart: unless-stopped
    environment:
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: packiot_validation          # ← isolation: pooler only ever sees the val DB
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: "10"
      MAX_CLIENT_CONN: "100"
      AUTH_TYPE: scram-sha-256
      SERVER_RESET_QUERY: "ROLLBACK"
      SERVER_RESET_QUERY_ALWAYS: "1"
      QUERY_TIMEOUT: "60"
      SERVER_IDLE_TIMEOUT: "120"
    networks:
      packiot-val-net:
        ipv4_address: 172.19.0.2
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── RabbitMQ (val) — bus between edge-transformer-val and oeecloud-worker-val ─
  # SUPPORTING INFRA. Own broker so the validation `oee` exchange never mixes
  # with staging's. Management UI on 127.0.0.1:15673 (staging owns 15672).
  # AMQP 5672 is NOT host-published — reachable only on packiot-val-net.
  rabbitmq-val:
    image: rabbitmq:3.13-management
    container_name: rabbitmq-val
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:15673:15672"
    volumes:
      - rabbitmq-val-data:/var/lib/rabbitmq
    networks:
      packiot-val-net:
        ipv4_address: 172.19.0.5
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}

  # ── edge-api (val) — PO-replay HTTP target for mirror-worker-go-val ──────────
  # SUPPORTING INFRA. mirror-worker-go replays CPACK PO lifecycle by POSTing to
  # edge-api; it must land in packiot_validation, so we stand a dedicated
  # edge-api pointed there (POSTGRES_DB override + pgbouncer-val). Schema comes
  # from the workflow's edge-node-red/db/*.sql apply — no db-migrate here.
  edge-api-val:
    build:
      context: ./edge-api
      target: production
    container_name: edge-api-val
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      NEW_RELIC_ENABLED: "false"
      NEW_RELIC_NO_CONFIG_FILE: "true"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: packiot_validation      # ← isolation: overrides .env POSTGRES_DB
      POSTGRES_HOST: pgbouncer-val
    ports:
      - "127.0.0.1:8090:8080"              # staging edge-api owns 8080; val uses 8090
    networks:
      packiot-val-net:
        ipv4_address: 172.19.0.3
    depends_on:
      pgbouncer-val:
        condition: service_started
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  # ══ SERVICES UNDER TEST (the ADR-0022 V1 set) ═══════════════════════════════

  # ── mosquitto-val — Incoplast SparkPlug B ingress (real live data) ──────────
  # 8883 TLS + passwd published to the host (Incoplast factory reaches it over
  # the internet); 1883 plain, internal only. See configs/mosquitto/mosquitto-val.conf
  # and the runbook for the passwd/cert material the operator provisions.
  mosquitto-val:
    image: eclipse-mosquitto:2
    container_name: mosquitto-val
    restart: unless-stopped
    ports:
      # PUBLIC, authenticated + TLS. NEVER publish 1883.
      - "8883:8883"                        # FILL AT DEPLOY: confirm SG/nginx allows this ingress
    volumes:
      - ./configs/mosquitto/mosquitto-val.conf:/mosquitto/config/mosquitto.conf:ro
      # FILL AT DEPLOY — provision on the app EC2 host before `up -d`:
      - /opt/packiot/mosquitto-val/passwd:/mosquitto/config/passwd:ro
      - /opt/packiot/mosquitto-val/certs:/mosquitto/certs:ro
      - mosquitto-val-data:/mosquitto/data
    networks:
      packiot-val-net:
        ipv4_address: 172.19.0.24
    healthcheck:
      # Probe the internal plain listener — TLS-probing 8883 from inside would
      # need the CA baked in. 1883 accepting a publish proves the broker is up.
      test: ["CMD-SHELL", "timeout 5 mosquitto_pub -h 127.0.0.1 -p 1883 -t 'healthcheck/ping' -m 'ok' -q 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}

  # ── edge-transformer-val — Incoplast MQTT → RabbitMQ (standard pipeline) ────
  # Subscribes mosquitto-val:1883, decodes SparkPlug DBIRTH+DDATA, publishes the
  # F1 production envelope (source_type="") on rabbitmq-val's `oee` exchange.
  # Single-tenant (Incoplast) — CPACK does NOT flow through MQTT here; it is
  # mirrored in by mirror-worker-go-val. Client mapping = docs/clients/incoplast.yaml.
  edge-transformer-val:
    build: ./services/edge-transformer
    container_name: edge-transformer-val
    restart: unless-stopped
    env_file: [.env]
    environment:
      # Staging-tier creds from env (not prod) — safe to use CREDS_SOURCE=env.
      CREDS_SOURCE: env
      LOG_LEVEL: info
      EDGE_TRANSFORMER_MODE: factory
      AWS_REGION: us-east-1
      # AMQP → rabbitmq-val (creds from .env via CREDS_SOURCE=env)
      RABBITMQ_HOST: rabbitmq-val
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SOURCE_EXCHANGE: edge.plc-normalized
      WORKER_QUEUE: edge-transformer-val-q
      RETRY_EXCHANGE: edge.plc-normalized-retry
      RETRY_QUEUE: edge-transformer-val-q-retry-30s
      FAILED_EXCHANGE: dlx.edge.plc-normalized
      FAILED_QUEUE: edge-transformer-val-q-failed
      RETRY_TTL_MS: "30000"
      MAX_RETRIES: "5"
      PREFETCH: "50"
      HEALTH_PORT: "9102"
      CLIENT_YAML_PATH: /etc/packiot/client.yaml
      # MQTT ingest ON; AMQP source OFF (MQTT is THE ingest, same as 10.9 staging).
      MQTT_ENABLED: "true"
      AMQP_SOURCE_ENABLED: "false"
      MQTT_BROKER_URL: "tcp://mosquitto-val:1883"     # internal listener
      MQTT_CLIENT_ID: "edge-transformer-val"
      MQTT_USERNAME: ""
      MQTT_PASSWORD: ""
      # Real-but-operator-gated tee → silence is not a hard failure during
      # tee toggling. -1 disables the idle-degradation check (broker
      # connectivity still enforced), so /healthz doesn't train ops on red.
      MQTT_STALE_THRESHOLD_SECONDS: "-1"
      # Refactored Calc port — the thing being validated. Runs authoritatively
      # over the envelope counters resolved from DDATA.
      USE_GO_PORT: "true"
      # Emit ONLY the F1 production route (source_type="") into packiot_validation
      # via oeecloud-worker-val's MAIN pool. No shadow flows in this harness.
      SHADOW_EMIT_PRODUCTION: "true"
      SHADOW_EMIT_REFACTORED: "false"
      # Outbox durability (ADR-0011 P2).
      OUTBOX_ENABLED: "true"
      OUTBOX_PATH: "/var/lib/edge-transformer/outbox.db"
      OUTBOX_CAP: "100000"
      # Machine-write path stays inert (V2 scope).
      EDGE_COMMANDS_ENABLED: "false"
      EDGE_COMMANDS_ALLOWED: "po_setup,param_write"
    volumes:
      - ./docs/clients/incoplast.yaml:/etc/packiot/client.yaml:ro
      - edge-transformer-val-outbox:/var/lib/edge-transformer
    networks:
      packiot-val-net:
        ipv4_address: 172.19.0.23
    depends_on:
      rabbitmq-val:
        condition: service_healthy
      mosquitto-val:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/edge-transformer", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # ── oeecloud-worker-val — refactored OEE engine → packiot_validation ────────
  # Consumes rabbitmq-val's `oee` exchange, writes equipment_values to the MAIN
  # pool (packiot_validation) and runs the refactored Go OEE compute jobs. No
  # shadow pool (POSTGRES_SHADOW_DB_NAME empty). DB creds from env (staging-tier).
  oeecloud-worker-val:
    build: ./services/oeecloud-worker
    container_name: oeecloud-worker-val
    restart: unless-stopped
    env_file: [.env]
    environment:
      CREDS_SOURCE: env
      LOG_LEVEL: info
      AWS_REGION: us-east-1
      # DB — DIRECT to the DB EC2, database packiot_validation.
      DB_HOST: 10.10.10.89                 # FILL AT DEPLOY: staging DB EC2 private IP (matches compose.staging shadow-mirror)
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: packiot_validation          # ← isolation lever (MAIN pool target)
      # AMQP → rabbitmq-val.
      RABBITMQ_HOST: rabbitmq-val
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SOURCE_EXCHANGE: oee
      WORKER_QUEUE: oeecloud-worker-val-q
      RETRY_EXCHANGE: oee-retry
      RETRY_QUEUE: oeecloud-worker-val-q-retry-30s
      FAILED_EXCHANGE: oee-failed
      FAILED_QUEUE: oeecloud-worker-val-q-failed
      RETRY_TTL_MS: "30000"
      MAX_RETRIES: "5"
      PREFETCH: "50"
      HEALTH_PORT: "9101"
      # No shadow DB in this harness — everything is the one packiot_validation.
      POSTGRES_SHADOW_DB_NAME: ""
      # Refactored OEE engine knobs — mirror compose.staging.yml so the SAME
      # engine that the flip promotes is what gets validated. In this harness
      # there is no shadow pool, so these operate on packiot_validation.
      SHIFT_RESOLVER_ENABLED: "true"
      EVENTS_DERIVER_ENABLED: "true"
      PO_CONTROL_ENABLED: "true"
      UNS_REFRESH_ENABLED: "true"
      UNS_CURRENT_METRICS_ENABLED: "true"  # ON here (validating the post-flip end state)
      PO_RECALC_ENABLED: "true"
      RUNTIME_PROVISION_ENABLED: "true"
      RUNTIME_ROLLUP_ENABLED: "true"
      LEGACY_INGEST_ENABLED: "false"
      # Bake comparator is a staging-only F1↔F3 diff — no bake here.
      BAKE_COMPARATOR_ENABLED: "false"
      # Neopac/enterprise-specific report jobs (customers 33/6/13) are not part
      # of the CPACK+Incoplast V1 surface — leave them OFF.
      SPEED33_REPORT_ENABLED: "false"
      SHIFT06_REPORT_ENABLED: "false"
      SAP13_REPORT_ENABLED: "false"
      BOXES13_REPORT_ENABLED: "false"
      SYNC06_REPORT_ENABLED: "false"
      BOXES_BRIDGE_ENABLED: "false"
    networks:
      packiot-val-net:
        ipv4_address: 172.19.0.20
    depends_on:
      rabbitmq-val:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/oeecloud-worker", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # ── refdata-api-val — reference reads over packiot_validation ───────────────
  # The refactored-stack reference API (Hasura replacement). Reads via
  # pgbouncer-val. Per-tenant keys map to CPACK (3) + Incoplast (4).
  refdata-api-val:
    build: ./services/refdata-api
    container_name: refdata-api-val
    restart: unless-stopped
    env_file: [.env]
    environment:
      DB_HOST: pgbouncer-val
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: packiot_validation
      HEALTH_PORT: "9104"
      # Validation demo keys only. customer_id is server-assigned, never client-supplied.
      QUERY_API_KEYS: "val-cpack-key:3,val-incoplast-key:4"
    networks:
      packiot-val-net:
        ipv4_address: 172.19.0.26
    depends_on:
      pgbouncer-val:
        condition: service_started
    healthcheck:
      test: ["CMD", "/usr/local/bin/refdata-api", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── mirror-worker-go-val — CPACK (ent 3) real prod → packiot_validation ─────
  # Reads REAL prod (SELECT-only, SM secret `databaseCredentials`) and replays
  # CPACK into packiot_validation: PO lifecycle via edge-api-val (HTTP), and
  # value/event sync direct to the DB. STAGING target DB creds come from a NEW
  # SM secret `packiot/validation/db` (name=packiot_validation) — see runbook.
  #
  # PROD creds stay in Secrets Manager (never env) — this is the one service
  # that reads prod, so CREDS_SOURCE=env is deliberately NOT set here.
  mirror-worker-go-val:
    build: ./services/mirror-worker-go
    container_name: mirror-worker-go-val
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      AWS_REGION: us-east-1
      PROD_DB_SECRET_ID: databaseCredentials          # real prod, SELECT-only
      STAGING_DB_SECRET_ID: packiot/validation/db      # FILL AT DEPLOY: new secret, name=packiot_validation
      # Independent cursor + mirror_id_map lineage — never collides with the
      # staging worker's 'cpack-prod-go'.
      SOURCE_NAME: cpack-prod-val
      PROD_ENTERPRISE_ID: "1"
      STAGING_ENTERPRISE_ID: "3"
      POLL_INTERVAL_SEC: "60"
      BATCH_SIZE: "50"
      PER_POST_DELAY_MS: "50"
      STAGING_API_URL: http://edge-api-val:8080
      HEALTH_PORT: "9102"
      # No 3-flow fan-out in this harness — packiot_validation is the one DB.
      SHADOW_VALUE_FANOUT: "false"
      POSTGRES_SHADOW_DB_NAME: ""
      SHADOW_DB_HOST: ""
    networks:
      packiot-val-net:
        ipv4_address: 172.19.0.21
    depends_on:
      edge-api-val:
        condition: service_started
    healthcheck:
      test: ["CMD", "/usr/local/bin/mirror-worker-go", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # ── shadow-mirror-val — operator-action mirror over packiot_validation ──────
  # Polls packiot_validation.user_logs and replays operator actions onto the
  # shadow_go_port schema in the SAME DB. Shadow-DB writes disabled
  # (PG_SHADOW_DB_NAME empty) — there is no packiot_shadow in this harness.
  #
  # ADR-0022 names a per-tenant shadow-mirror; the service has no tenant-scope
  # knob, so a single instance covers both tenants' operator actions in
  # packiot_validation. Two instances against one un-scoped DB would double-write
  # — per-tenant scoping is a V2 refinement.
  shadow-mirror-val:
    build: ./services/shadow-mirror
    container_name: shadow-mirror-val
    restart: unless-stopped
    env_file: [.env]
    environment:
      LOG_LEVEL: info
      SHADOW_MIRROR_ENABLED: "true"
      AWS_REGION: us-east-1
      # shadow-mirror builds DB creds from these env vars directly (no SM).
      DB_HOST: 10.10.10.89                 # FILL AT DEPLOY: staging DB EC2 private IP
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      PG_DB_NAME: packiot_validation       # ← isolation lever (main pool)
      PG_SHADOW_DB_NAME: ""                # no packiot_shadow here
      POLL_INTERVAL_MS: "2000"
      BATCH_SIZE: "100"
      MAX_RETRIES: "5"
      HEALTH_PORT: "9103"
    networks:
      packiot-val-net:
        ipv4_address: 172.19.0.25
    healthcheck:
      test: ["CMD", "/usr/local/bin/shadow-mirror", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
