# Packiot stack wiki — static-site generator config.
#
# WHY mkdocs-material: it emits fully static, self-contained HTML with a
# client-side search index built AT BUILD TIME (no server, no runtime backend),
# bundles its own CSS/JS/icons into site_dir, and — with `theme.font: false` —
# pulls NO external CDN assets at serve time. That makes it safe to serve behind
# the oauth2 gate on wiki.packiot.app with a strict origin. One YAML file drives
# nav + search + theme, which keeps CI trivial.
#
# docs_dir points at a build-staging tree that scripts/build-wiki.sh assembles
# from the layered wiki tree docs/wiki/ (+ docs/adr/*.md under /adr).
# Writing rules and page templates: docs/WIKI-STYLE.md.

site_name: Packiot Stack Docs
site_description: >-
  Engineering + operations reference for the Packiot industrial-IoT / OEE platform —
  the commissioned Stack Wiki and the human-facing Guide, merged into one searchable site.
site_url: https://wiki.packiot.app/

docs_dir: build/staging/docs
site_dir: ../dist/wiki

# Fully relative asset URLs so the site works when served from /var/www/wiki
# behind any path prefix, and offline from file://.
use_directory_urls: true

theme:
  name: material
  # CRITICAL: disable the Google Fonts fetch — with `font: false` Material uses
  # the system font stack and bundles everything else locally. No CDN at runtime.
  font: false
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link

plugins:
  # Local lunr-style index built at build time and shipped as static JSON.
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Internal links must resolve (CI builds with --strict, so any warning fails).
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
  nav:
    omitted_files: warn
    not_found: warn

# ADRs are copied to /adr so reference/adr-index.md can link them; they are not
# primary nav content.
not_in_nav: |
  /adr/**

nav:
  - Home: index.md
  - Glossary: glossary.md
  - "1 · Architecture":
      - Overview: architecture/overview.md
      - A counter's journey: architecture/data-journey.md
      - Domain model: architecture/domain-model.md
      - Tenancy & security: architecture/tenancy-and-security.md
      - Environments: architecture/environments.md
  - "2 · Subsystems":
      - Edge: subsystems/edge.md
      - Ingestion: subsystems/ingestion.md
      - Compute: subsystems/compute.md
      - Analytics DB: subsystems/analytics-db.md
      - Historian: subsystems/historian.md
      - Legacy bridge: subsystems/legacy-bridge.md
      - Serving & APIs: subsystems/serving-apis.md
      - Frontends: subsystems/frontends.md
      - Identity: subsystems/identity.md
      - Platform & operations: subsystems/platform.md
  - "3 · Components":
      - Edge:
          - PLC readers: components/plc-readers.md
          - Sparkplug agent: components/sparkplug-agent.md
          - Edge box: components/edge-box.md
          - Edge Node-RED: components/edge-node-red.md
          - Edge session broker: components/edge-session-broker.md
          - Simulators & twins: components/simulators-and-twins.md
      - Ingestion & compute:
          - Brokers: components/brokers.md
          - sparkplug-decoder: components/sparkplug-decoder.md
          - ingest-shim & fanout: components/ingest-shim-and-fanout.md
          - stream-engine: components/stream-engine.md
          - stream-engine rollup internals: components/stream-engine-rollup-internals.md
      - Data:
          - Analytics DB schemas: components/analytics-db-schemas.md
          - Timescale jobs & retention: components/timescale-jobs-and-retention.md
          - Historian gateway: components/historian-gateway.md
          - Superset: components/superset.md
      - Legacy bridge & APIs:
          - analytics-sync: components/analytics-sync.md
          - mirror-worker: components/mirror-worker.md
          - read-api: components/read-api.md
          - edge-api: components/edge-api.md
          - operator-gateway: components/operator-gateway.md
          - barcode-service: components/barcode-service.md
      - Frontends & identity:
          - front4: components/front4.md
          - Operator app: components/operator-app.md
          - CS Admin: components/csadmin.md
          - Customization Hub: components/customize.md
          - Barcode app: components/barcode-app.md
          - oauth2-proxy & Cognito: components/oauth2-proxy-and-cognito.md
      - Platform:
          - Compose topology: components/compose-topology.md
          - CI/CD: components/ci-cd.md
          - Terraform: components/terraform.md
          - Observability: components/observability.md
          - Wiki pipeline: components/wiki-pipeline.md
  - "4 · Reference":
      - Database reference: reference/database-reference.md
      - API endpoints: reference/api-endpoints.md
      - Configuration: reference/configuration.md
      - ADR index: reference/adr-index.md
  - "4 · Operations":
      - Runbooks: operations/runbooks.md
      - Onboarding a client: operations/onboarding-a-client.md
      - First-time edge box setup: operations/first-time-box-setup.md
      - DBA guide: operations/dba-guide.md
