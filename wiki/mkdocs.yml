        architecture/tenancy-and-security.md: understand/architecture/tenancy-and-security.md
        components/analytics-db-schemas.md: understand/components/analytics-db-schemas.md
        components/analytics-sync.md: understand/components/analytics-sync.md
        components/barcode-app.md: understand/components/barcode-app.md
        components/barcode-service.md: understand/components/barcode-service.md
        components/brokers.md: understand/components/brokers.md
        components/ci-cd.md: understand/components/ci-cd.md
        components/compose-topology.md: understand/components/compose-topology.md
        components/csadmin.md: understand/components/csadmin.md
