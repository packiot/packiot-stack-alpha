        components/observability.md: understand/components/observability.md
        components/operator-app.md: understand/components/operator-app.md
        components/operator-gateway.md: understand/components/operator-gateway.md
        components/plc-readers.md: understand/components/plc-readers.md
        components/read-api.md: understand/components/read-api.md
        components/simulators-and-twins.md: understand/components/simulators-and-twins.md
        components/sparkplug-agent.md: understand/components/sparkplug-agent.md
        components/sparkplug-decoder.md: understand/components/sparkplug-decoder.md
