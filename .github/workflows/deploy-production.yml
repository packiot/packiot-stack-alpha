name: Deploy to Production

# Triggers:
#   - Push to `production` branch (auto-deploy on merge)
#   - Manual workflow_dispatch (for re-deploys without a code change)
#
# The production branch is the canonical deploy trigger for the new prod
# stack (parallel to staging branch → deploy-staging.yml). Per memory rule
# `leave-main-master-branches-alone`: do NOT add main/master to this trigger.
# edge-api/master is the LEGACY EB prod deploy and must stay separate.
on:
  push:
    branches: [production]
  workflow_dispatch:

# Serialize deploys. Same rationale as deploy-staging.yml: two near-
# simultaneous bump-PR auto-merges on the production branch would
# otherwise race on `docker compose build && up -d`. Queue instead of
# cancel — we want every production commit to actually deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# OIDC token permissions — needed for any step that uses
# aws-actions/configure-aws-credentials with role-to-assume.
# Today's steps don't need this (self-hosted runner has EC2's
# packiot-production-app IAM role). Foundational for future hosted-runner
# steps per ADR-0006 phase 1.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, production, linux, arm64]

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          submodules: false
          # persist-credentials: false so checkout@v4 removes its GITHUB_TOKEN
          # extraheader before we fetch submodules. Without this, the
          # submodule fetch tries to use GITHUB_TOKEN — which is scoped to
          # this repo only — and fails on the private submodule repos.
          # Splitting into two steps means git falls back to the PAT URL
          # rewrite in /root/.gitconfig (set by app_init.sh).
          persist-credentials: false

      - name: Fetch submodules
        # Production submodules: edge-api + operator only.
        # edge-node-red is per-factory (not in the cloud stack — see
        # docs/archive/production-out-of-scope.md + docs/adr/0005-*.md).
        # oeecloud-node-red was decommissioned 2026-06-24.
        run: |
          git submodule sync edge-api operator csadmin
          git submodule foreach --recursive 'git reset --hard || true' 2>/dev/null || true
          git submodule update --init --force edge-api operator csadmin

      - name: Link .env
        # Secrets live in /opt/packiot/.env (written by app_init.sh from
        # Secrets Manager — packiot/production/* namespace).
        # Symlinking makes them available as .env so Docker Compose
        # picks them up via variable substitution + env_file references.
        run: ln -sf /opt/packiot/.env "$GITHUB_WORKSPACE/.env"

      - name: Build images
        # No `-p`: the compose file pins a top-level `name: stack`, so the
        # project name is stable regardless of cwd (this workflow runs from the
        # repo root; app_init.sh runs from /opt/packiot/stack). A mismatched
        # project name created two container sets fighting for the same subnet.
        run: docker compose -f compose.production.yml build

      - name: Deploy
        # --remove-orphans so removing a service from compose actually
        # decommissions its container on the next deploy.
        #
        # NOTE: not using --wait. Compose's --wait treats any container in
        # "exited" state as failure regardless of exit code, which breaks for
        # one-shot services like hasura-init / db-init-bootstrap / db-migrate
        # (restart: "no", exit 0). The Post-deploy diagnostic below gives us the
        # visibility we'd want from --wait without the false-positive failure.
        run: docker compose -f compose.production.yml up -d --remove-orphans

      - name: Post-deploy diagnostic
        # Quick visibility on what landed. Non-blocking — if the diagnostic
        # itself fails (e.g. docker ps API hiccup), don't fail the deploy.
        if: always()
        run: |
          echo "=== Container status ==="
          docker compose -f compose.production.yml ps || true
          echo
          echo "=== Recent ERROR logs (last 60s, any service) ==="
          for svc in $(docker compose -f compose.production.yml ps --services 2>/dev/null); do
            count=$(docker compose -f compose.production.yml logs --since 60s "$svc" 2>&1 | grep -cE '"level":"ERROR"|^ERROR' || echo 0)
            [ "$count" -gt 0 ] && echo "  $svc: $count ERROR lines" || true
          done
          echo "(empty above = no ERROR-level logs in any service)"
