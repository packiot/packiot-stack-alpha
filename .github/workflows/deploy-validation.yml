name: Deploy Validation Harness (ADR-0022 V1)

# workflow_dispatch ONLY. This harness is a deliberate, human-initiated action —
# it is NEVER triggered by a push. It builds an ISOLATED database
# (packiot_validation) and stands the -val service stack against it. The bake
# (packiot_shadow) and F1 (packiot) are never touched.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "validation" to confirm you intend to build packiot_validation'
        required: true
        default: ''

concurrency:
  group: deploy-validation
  cancel-in-progress: false

env:
  # The ONE database this workflow is allowed to create + seed. The guardrail
  # step asserts this value is exactly this and nothing else before any SQL runs.
  VALIDATION_DB: packiot_validation

jobs:
  deploy:
    runs-on: [self-hosted, staging, linux, arm64]

    steps:
      - name: Guard — confirm input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "validation" ]; then
            echo "Refusing: confirm input must be exactly 'validation' (got '${{ github.event.inputs.confirm }}')."
            exit 1
          fi

      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          submodules: false
          # See deploy-staging.yml: persist-credentials:false so the submodule
          # fetch falls back to the PAT URL rewrite in /root/.gitconfig instead
          # of the repo-scoped GITHUB_TOKEN extraheader.
          persist-credentials: false

      - name: Fetch submodules (edge-node-red for db/, edge-api for the image)
        # edge-node-red is pinned at the commit carrying the full db/00..26 set
        # (00-schema … 26-incoplast-staging-fixtures.sql). Initing the submodule
        # checks out exactly that pin — no branch tracking, no surprise drift.
        run: |
          git submodule sync edge-node-red edge-api
          git submodule update --init edge-node-red edge-api

      - name: Link .env
        # Same secrets file the staging stack uses (written by app_init.sh from
        # Secrets Manager). Compose picks it up for ${POSTGRES_*}/${RABBITMQ_*}.
        run: ln -sf /opt/packiot/.env "$GITHUB_WORKSPACE/.env"

      - name: Guardrail — assert target DB is packiot_validation (never packiot/packiot_shadow)
        # Belt-and-suspenders isolation gate. The DB host/creds come from the
        # SAME .env as staging, so a fat-fingered override could in principle
        # point SQL at the wrong database. This step hard-fails if VALIDATION_DB
        # is anything other than packiot_validation, and refuses the two
        # protected names explicitly.
        run: |
          set -e
          DB="${VALIDATION_DB}"
          echo "Target validation DB = '$DB'"
          if [ "$DB" != "packiot_validation" ]; then
            echo "REFUSING: VALIDATION_DB must be exactly 'packiot_validation'."; exit 1
          fi
          case "$DB" in
            packiot|packiot_shadow)
              echo "REFUSING: '$DB' is a protected database (F1 / bake). Aborting."; exit 1;;
          esac
          echo "Guardrail passed."

      - name: Read DB connection from /opt/packiot/.env
        id: dbenv
        # Host/user/password only — the DATABASE NAME is forced to VALIDATION_DB,
        # never read from .env (which names the F1 `packiot`).
        run: |
          set -e
          PGHOST=$(grep -E '^POSTGRES_HOST=' /opt/packiot/.env | cut -d= -f2)
          PGUSER=$(grep -E '^POSTGRES_USER=' /opt/packiot/.env | cut -d= -f2)
          PGPASSWORD=$(grep -E '^POSTGRES_PASSWORD=' /opt/packiot/.env | cut -d= -f2)
          if [ -z "$PGHOST" ] || [ -z "$PGUSER" ] || [ -z "$PGPASSWORD" ]; then
            echo "Missing POSTGRES_HOST/USER/PASSWORD in /opt/packiot/.env"; exit 1
          fi
          echo "::add-mask::$PGPASSWORD"
          echo "pghost=$PGHOST"   >> "$GITHUB_OUTPUT"
          echo "pguser=$PGUSER"   >> "$GITHUB_OUTPUT"
          echo "pgpassword=$PGPASSWORD" >> "$GITHUB_OUTPUT"

      - name: Create packiot_validation if absent
        # CREATE DATABASE is not transactional and errors if the DB exists, so
        # we check-then-create idempotently against the `postgres` maintenance
        # DB. psql-in-docker over stack_packiot-net (the DB EC2 is reachable
        # from that network — same pattern the staging DB-audit steps use).
        env:
          PGPASSWORD: ${{ steps.dbenv.outputs.pgpassword }}
        run: |
          set -e
          PGHOST="${{ steps.dbenv.outputs.pghost }}"
          PGUSER="${{ steps.dbenv.outputs.pguser }}"
          PSQL="docker run --rm --network stack_packiot-net -e PGPASSWORD=$PGPASSWORD postgres:15-alpine psql -h $PGHOST -U $PGUSER -v ON_ERROR_STOP=1"
          EXISTS=$($PSQL -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='${VALIDATION_DB}'" | tr -d '[:space:]')
          if [ "$EXISTS" = "1" ]; then
            echo "${VALIDATION_DB} already exists — reusing (seeds are idempotent-safe)."
          else
            echo "Creating ${VALIDATION_DB}..."
            $PSQL -d postgres -c "CREATE DATABASE ${VALIDATION_DB};"
          fi

      - name: Apply edge-node-red/db/*.sql in order (00 … 26)
        # The canonical schema+seed set. 16-cpack-staging-fixtures seeds CPACK
        # (enterprise 3); 26-incoplast-staging-fixtures seeds Incoplast
        # (enterprise 4). Applied in sorted numeric order via a glob so the
        # exact tail (…24/25/26) needs no enumeration and stays future-proof.
        #
        # ON_ERROR_STOP=1 so a broken seed fails the deploy loudly. Re-running
        # is safe: the set uses CREATE ... IF NOT EXISTS / idempotent seeds
        # (same set compose.development.yml mounts into docker-entrypoint-initdb).
        env:
          PGPASSWORD: ${{ steps.dbenv.outputs.pgpassword }}
        run: |
          set -e
          PGHOST="${{ steps.dbenv.outputs.pghost }}"
          PGUSER="${{ steps.dbenv.outputs.pguser }}"
          DBDIR="edge-node-red/db"
          if [ ! -d "$DBDIR" ]; then
            echo "FATAL: $DBDIR missing — edge-node-red submodule not checked out."; exit 1
          fi
          # Assemble the ordered file list; abort if the CPACK/Incoplast fixtures
          # are absent (wrong submodule pin) rather than seeding a half-tenant DB.
          FILES=$(ls "$DBDIR"/*.sql | sort)
          echo "$FILES" | grep -q '16-cpack-staging-fixtures.sql' || { echo "FATAL: CPACK fixtures missing"; exit 1; }
          echo "$FILES" | grep -q '26-incoplast-staging-fixtures.sql' || { echo "FATAL: Incoplast fixtures (26) missing — check the edge-node-red pin (need 7f57c2c or later)"; exit 1; }
          for f in $FILES; do
            echo "=== applying $(basename "$f") → ${VALIDATION_DB} ==="
            docker run --rm --network stack_packiot-net \
              -e PGPASSWORD="$PGPASSWORD" \
              -v "$PWD/$DBDIR":/db:ro \
              postgres:15-alpine \
              psql -h "$PGHOST" -U "$PGUSER" -d "${VALIDATION_DB}" \
                   -v ON_ERROR_STOP=1 -f "/db/$(basename "$f")"
          done
          echo "All db/*.sql applied to ${VALIDATION_DB}."

      - name: Post-seed sanity — both tenants present
        env:
          PGPASSWORD: ${{ steps.dbenv.outputs.pgpassword }}
        run: |
          set -e
          PGHOST="${{ steps.dbenv.outputs.pghost }}"
          PGUSER="${{ steps.dbenv.outputs.pguser }}"
          docker run --rm --network stack_packiot-net -e PGPASSWORD="$PGPASSWORD" \
            postgres:15-alpine psql -h "$PGHOST" -U "$PGUSER" -d "${VALIDATION_DB}" -v ON_ERROR_STOP=1 \
            -c "SELECT id_enterprise, name FROM enterprises WHERE id_enterprise IN (3,4) ORDER BY id_enterprise;"

      - name: Build images (val stack)
        run: docker compose -f compose.validation.yml -p stackval build

      - name: Deploy val stack
        # --remove-orphans keeps the stackval project clean. Distinct project
        # name (stackval) + packiot-val-net keep this fully separate from `stack`.
        run: docker compose -f compose.validation.yml -p stackval up -d --remove-orphans

      - name: Smoke — wait for critical val services healthy
        timeout-minutes: 4
        run: |
          set -e
          deadline=$(($(date +%s) + 180))
          services="rabbitmq-val edge-transformer-val oeecloud-worker-val mirror-worker-go-val refdata-api-val shadow-mirror-val mosquitto-val edge-api-val"
          for svc in $services; do
            echo "Waiting for $svc..."
            while true; do
              status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$svc" 2>/dev/null || echo "missing")
              case "$status" in
                healthy) echo "  $svc: healthy"; break ;;
                no-healthcheck) echo "  $svc: no healthcheck — assuming OK"; break ;;
                missing) echo "  $svc: container not found!"; docker ps --format '{{.Names}}\t{{.Status}}'; exit 1 ;;
                *)
                  if [ "$(date +%s)" -ge "$deadline" ]; then
                    echo "  $svc: TIMEOUT — last status: $status"
                    docker logs --tail 50 "$svc" 2>&1 || true
                    exit 1
                  fi
                  sleep 3 ;;
              esac
            done
          done
          echo "All critical val services healthy."
