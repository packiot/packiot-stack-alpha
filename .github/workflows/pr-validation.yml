name: PR Validation

# Required status check for PRs into `staging` (and `development` once auto-bump
# is wired for that branch too). Acts as the gate that the parent-only branch
# protection model leans on: submodule bumps land in parent via a bot-opened PR
# (see each submodule's bump-stack-submodule.yml), and this workflow decides
# whether the PR is safe to auto-merge.
#
# v0 is intentionally cheap — no submodule checkout, no PAT required, no docker
# image builds. It validates that compose.staging.yml + dev/compose.yml
# are structurally well-formed via `docker compose config --no-interpolate`,
# which parses the YAML and resolves $-references *without* needing .env or
# the submodule build contexts to exist on disk. Catches:
#   - YAML syntax errors
#   - malformed service definitions (bad keys, wrong types)
#   - duplicate IP addresses on the same network
#   - missing required fields
#
# What it does NOT catch (yet — ratchet up in later iterations):
#   - broken Dockerfiles  → add `compose build` later (needs submodule PAT)
#   - runtime startup failures → add `compose up + health` later
#   - undefined env vars → drop --no-interpolate + provide a CI .env

on:
  pull_request:
    branches: [staging, development]
  # Allow manual re-runs on demand (e.g. flaky network during compose pull).
  workflow_dispatch:

jobs:
  validate-compose:
    name: Validate compose files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Validate compose.staging.yml
        # --no-interpolate skips ${VAR} expansion, so we don't need .env to
        # be present. -q exits non-zero on any structural error; output is
        # silent on success.
        run: docker compose -f compose.staging.yml config --no-interpolate -q

      - name: Validate compose.production.yml (+ the superset overlay it deploys with)
        run: docker compose -f compose.production.yml -f compose.superset.yml config --no-interpolate -q

      - name: Prometheus + Alertmanager configs (promtool / amtool, staging + production)
        # A broken rules/config file is only noticed when the deploy's /-/reload silently fails
        # (continue-on-error) and the running server keeps the old config. Catch it here instead.
        run: |
          set -euo pipefail
          for f in prometheus.yml prometheus.production.yml; do
            docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" --entrypoint promtool \
              prom/prometheus:v3.1.0 check config "/etc/prometheus/$f"
          done
          for f in alertmanager.yml alertmanager.production.yml; do
            docker run --rm -v "$PWD/monitoring/alertmanager:/etc/alertmanager:ro" --entrypoint amtool \
              prom/alertmanager:v0.27.0 check-config "/etc/alertmanager/$f"
          done

      - name: Validate dev/ (ADR-0060 local environment)
        run: docker compose -f dev/compose.yml --env-file dev/.env.dev config -q

      - name: AMQP least privilege (no broker admin creds; stream-engine perms cover its topology)
        run: scripts/ci/check-amqp-least-priv.py
      - name: DB least privilege (operator-gateway, barcode-service, stream-engine log in as their own roles; analytics-sync has no DB login)
        run: scripts/ci/check-db-least-priv.py
      - name: No literal read-api keys (QUERY_API_KEYS / REFDATA_API_KEY from env only)
        # refdata is public: a committed key == tenant data. In this required job on
        # purpose (gitleaks scans full history, which still holds the burned values).
        run: scripts/ci/no-literal-readapi-keys.sh

  packml-ratchet:
    # ADR-0061 D8: PackML / topic-derived identity is being removed from the cloud. Until P5 deletes the rest,
    # existing references are frozen per file and may only shrink (scripts/ci/packml-ratchet.sh).
    name: packml ratchet (ADR-0061)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: No new packml references; shrinkage locked in
        run: scripts/ci/packml-ratchet.sh
