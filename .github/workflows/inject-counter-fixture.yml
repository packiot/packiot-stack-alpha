name: Inject counter fixture (staging)

# One-shot workflow: build cmd/inject-counter-fixture, run it against
# staging mosquitto (inside the compose network), then scrape /metrics
# from sparkplug-decoder to verify calc_evaluations_total incremented.
#
# End-to-end validation for ADR-0010 Phase 3 shadow-mode wiring.

on:
  workflow_dispatch:
    inputs:
      value:
        description: 'Counter payload value for NDATA (increments from 0)'
        default: '100'
        type: string

concurrency:
  group: inject-counter-fixture
  cancel-in-progress: false

jobs:
  inject:
    runs-on: [self-hosted, staging, linux, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Snapshot /metrics BEFORE inject
        run: |
          echo "=== calc_ metrics BEFORE inject ==="
          docker run --rm --network container:sparkplug-decoder curlimages/curl:latest \
            -s http://localhost:9102/metrics 2>/dev/null \
            | grep -E '^(calc_|# .*calc_)' \
            | head -40 || echo "(no calc_ metrics present)"

      - name: Build inject binary inside a Go container
        # Distroless runners don't ship Go. Build inside a golang container
        # that mounts the module workspace. Static binary, ARM64 (matches host).
        run: |
          docker run --rm \
            -v "$PWD/services/sparkplug-decoder:/src" \
            -w /src \
            -e CGO_ENABLED=0 \
            -e GOOS=linux \
            golang:1.25-alpine \
            go build -trimpath -o /src/inject-counter-fixture ./cmd/inject-counter-fixture
          ls -la services/sparkplug-decoder/inject-counter-fixture

      - name: Run inject against mosquitto on compose network
        run: |
          docker run --rm \
            --network stack_packiot-net \
            -v "$PWD/services/sparkplug-decoder/inject-counter-fixture:/app/inject" \
            alpine:3.20 \
            /app/inject --broker tcp://mosquitto:1883 --value ${{ inputs.value }}

      - name: Wait for sparkplug-decoder to process
        run: sleep 3

      - name: Snapshot /metrics AFTER inject
        run: |
          echo "=== calc_ metrics AFTER inject ==="
          docker run --rm --network container:sparkplug-decoder curlimages/curl:latest \
            -s http://localhost:9102/metrics 2>/dev/null \
            | grep -E '^(calc_|# .*calc_)' \
            | head -40 || echo "(no calc_ metrics)"

          echo ""
          echo "=== last 40 log lines from sparkplug-decoder ==="
          docker logs --tail 40 sparkplug-decoder 2>&1 | grep -iE 'calc_|sparkplug|shadow|error|warn' | tail -40

      - name: Cleanup inject binary
        if: always()
        run: rm -f services/sparkplug-decoder/inject-counter-fixture
