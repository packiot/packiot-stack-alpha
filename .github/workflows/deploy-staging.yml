name: Deploy to Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, staging, linux, arm64]

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Don't inject a GITHUB_TOKEN credential helper — submodule auth comes
          # from the PAT URL rewrite in /root/.gitconfig (set by app_init.sh).
          # GITHUB_TOKEN only covers the calling repo; it can't fetch submodules
          # in separate private repos.
          persist-credentials: false

      - name: Link .env
        # Secrets live in /opt/packiot/.env (written by app_init.sh from Secrets Manager).
        # Symlinking makes it available as .env so Docker Compose picks it up.
        run: ln -sf /opt/packiot/.env "$GITHUB_WORKSPACE/.env"

      - name: Build images
        run: docker compose -f compose.staging.yml -p stack build

      - name: Deploy
        run: docker compose -f compose.staging.yml -p stack up -d

      - name: Prune old images
        run: docker image prune -f
