name: Deploy to Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

# Serialize deploys. Two near-simultaneous bump-PR auto-merges (e.g. edge-api
# and edge-node-red bots merging within seconds of each other) would otherwise
# race on `docker compose build && up -d` — the second invocation can clobber
# half-built layers or leave the project in an inconsistent state. Queue them
# instead of canceling; we want every staging commit to actually deploy.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, staging, linux, arm64]

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          submodules: false
          # persist-credentials: false so checkout@v4 removes its GITHUB_TOKEN
          # extraheader before we fetch submodules. If submodules: recursive is
          # used here, checkout@v4 sets http.extraheader=GITHUB_TOKEN during the
          # submodule fetch — that token only covers this repo, not private
          # submodule repos, causing "Repository not found". Splitting into two
          # steps means git falls back to the PAT URL rewrite in
          # /root/.gitconfig (set by app_init.sh) for the submodule fetch.
          persist-credentials: false

      - name: Fetch submodules
        # No GITHUB_TOKEN extraheader active here — git uses the PAT rewrite
        # in /root/.gitconfig (set by app_init.sh):
        #   url."https://PAT@github.com/packiot/".insteadOf = https://github.com/packiot/
        #   url."https://PAT@github.com/packiot/".insteadOf = git@github.com:packiot/
        # Both HTTPS and SSH-format submodule URLs are covered.
        # Init every submodule staging compose.staging.yml builds:
        #   edge-api, edge-nodered, operator (frontend, built since the
        #   operator.staging.packiot.app SPA went live). oeecloud-node-red
        #   was removed in the 2026-06-24 decommission (replaced by the Go
        #   worker baked into services/oeecloud-worker).
        run: |
          git submodule sync edge-api edge-node-red operator
          git submodule update --init edge-api edge-node-red operator

      - name: Link .env
        # Secrets live in /opt/packiot/.env (written by app_init.sh from Secrets Manager).
        # Symlinking makes it available as .env so Docker Compose picks it up.
        run: ln -sf /opt/packiot/.env "$GITHUB_WORKSPACE/.env"

      - name: Build images
        run: docker compose -f compose.staging.yml -p stack build

      - name: Deploy
        # --remove-orphans so removing a service from compose actually
        # decommissions it. Without this, `up -d` only warns "Found orphan
        # containers" and leaves them running, silently leaving zombie
        # services behind. Safe here because this compose file owns the
        # whole project — no other stack co-tenants on the host.
        run: docker compose -f compose.staging.yml -p stack up -d --remove-orphans

      - name: Prune old images
        run: docker image prune -f
