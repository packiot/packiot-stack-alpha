name: Deploy to Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

# Serialize deploys. Two near-simultaneous bump-PR auto-merges (e.g. edge-api
# and edge-node-red bots merging within seconds of each other) would otherwise
# race on `docker compose build && up -d` — the second invocation can clobber
# half-built layers or leave the project in an inconsistent state. Queue them
# instead of canceling; we want every staging commit to actually deploy.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, staging, linux, arm64]

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          submodules: false
          # persist-credentials: false so checkout@v4 removes its GITHUB_TOKEN
          # extraheader before we fetch submodules. If submodules: recursive is
          # used here, checkout@v4 sets http.extraheader=GITHUB_TOKEN during the
          # submodule fetch — that token only covers this repo, not private
          # submodule repos, causing "Repository not found". Splitting into two
          # steps means git falls back to the PAT URL rewrite in
          # /root/.gitconfig (set by app_init.sh) for the submodule fetch.
          persist-credentials: false

      - name: Fetch submodules
        # No GITHUB_TOKEN extraheader active here — git uses the PAT rewrite
        # in /root/.gitconfig (set by app_init.sh):
        #   url."https://PAT@github.com/packiot/".insteadOf = https://github.com/packiot/
        #   url."https://PAT@github.com/packiot/".insteadOf = git@github.com:packiot/
        # Both HTTPS and SSH-format submodule URLs are covered.
        # Init every submodule staging compose.staging.yml builds:
        #   edge-api, edge-nodered, operator (frontend, built since the
        #   operator.staging.packiot.app SPA went live). oeecloud-node-red
        #   was removed in the 2026-06-24 decommission (replaced by the Go
        #   worker baked into services/oeecloud-worker).
        run: |
          git submodule sync edge-api edge-node-red operator
          git submodule update --init edge-api edge-node-red operator

      - name: Link .env
        # Secrets live in /opt/packiot/.env (written by app_init.sh from Secrets Manager).
        # Symlinking makes it available as .env so Docker Compose picks it up.
        run: ln -sf /opt/packiot/.env "$GITHUB_WORKSPACE/.env"

      - name: Build images
        run: docker compose -f compose.staging.yml -p stack build

      - name: Deploy
        # --remove-orphans so removing a service from compose actually
        # decommissions it. Without this, `up -d` only warns "Found orphan
        # containers" and leaves them running, silently leaving zombie
        # services behind. Safe here because this compose file owns the
        # whole project — no other stack co-tenants on the host.
        run: docker compose -f compose.staging.yml -p stack up -d --remove-orphans

      - name: Prune old images
        run: docker image prune -f

      - name: Smoke test — wait for critical services to report healthy
        # Without this, the previous step (compose up -d) returns the
        # moment the containers are CREATED, not when they're actually
        # serving traffic. A bad commit that builds clean but crashes at
        # startup would otherwise look like a successful deploy until
        # someone notices Grafana 15 min later.
        #
        # Each critical service has a healthcheck declared in
        # compose.staging.yml — we just wait for `healthy` status with a
        # bounded timeout. Service list = the ones whose unavailability
        # would be a real-world incident (edge-api serving operator +
        # mirror writes, rabbitmq carrying the SparkPlug stream, hasura
        # serving the operator UI, the two Go workers).
        #
        # If any service doesn't reach healthy within 120s, dumps the
        # last 50 log lines for that container so the actions-summary
        # email tells the operator exactly what's wrong.
        timeout-minutes: 3
        run: |
          set -e
          deadline=$(($(date +%s) + 120))
          services="stack-edge-api-1 mirror-worker-go oeecloud-worker stack-rabbitmq-1 stack-hasura-1 stack-edge-nodered-1"
          for svc in $services; do
            echo "Waiting for $svc..."
            while true; do
              status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$svc" 2>/dev/null || echo "missing")
              case "$status" in
                healthy)
                  echo "  $svc: healthy"
                  break
                  ;;
                no-healthcheck)
                  echo "  $svc: no healthcheck defined — assuming OK"
                  break
                  ;;
                missing)
                  echo "  $svc: container not found!"
                  docker ps --format '{{.Names}}\t{{.Status}}'
                  exit 1
                  ;;
                *)
                  if [ "$(date +%s)" -ge "$deadline" ]; then
                    echo "  $svc: TIMEOUT after 120s — last status: $status"
                    echo "  --- last 50 log lines ---"
                    docker logs --tail 50 "$svc" 2>&1 || true
                    exit 1
                  fi
                  sleep 3
                  ;;
              esac
            done
          done
          echo "All critical services healthy."

      - name: Inject synthetic Sparkplug counter (ADR-0010 Phase 3 E2E)
        # Publishes NBIRTH + NDATA against mosquitto, then scrapes /metrics
        # so we can prove the Calc port ran. Runs BEFORE inspect so the
        # inspect step's /metrics output reflects the inject.
        # continue-on-error so an inject hiccup doesn't fail the deploy.
        continue-on-error: true
        run: |
          set -x
          docker run --rm \
            -v "$PWD/services/edge-transformer:/src" \
            -w /src \
            -e CGO_ENABLED=0 -e GOOS=linux \
            golang:1.25-alpine \
            go build -trimpath -o /src/inject-counter-fixture ./cmd/inject-counter-fixture

          docker run --rm \
            --network stack_packiot-net \
            -v "$PWD/services/edge-transformer/inject-counter-fixture:/app/inject:ro" \
            alpine:3.20 \
            /app/inject --broker tcp://mosquitto:1883 --value 100

          rm -f services/edge-transformer/inject-counter-fixture
          echo "Waiting 3s for edge-transformer to process..."
          sleep 3

      - name: Inspect edge-transformer post-deploy
        # Diagnostic step — verifies env vars, log tail, healthcheck exit,
        # and Prometheus metrics scoped to Calc port + MQTT subscriber. Runs
        # after smoke test so we know edge-transformer is up before probing.
        # Failures here don't fail the deploy (the container may be healthy
        # even if the diagnostic tooling itself has a hiccup).
        continue-on-error: true
        run: |
          echo "=== env (USE_GO_PORT / MQTT_ / LOG_LEVEL) ==="
          docker inspect edge-transformer \
            --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep -iE 'USE_GO_PORT|MQTT_|LOG_LEVEL' || echo "(no matching env vars)"

          echo ""
          echo "=== last 60 log lines ==="
          docker logs --tail 60 edge-transformer 2>&1 || true

          echo ""
          echo "=== healthcheck exit code ==="
          docker exec edge-transformer /usr/local/bin/edge-transformer --healthcheck && echo "healthy" || echo "unhealthy exit=$?"

          echo ""
          echo "=== /metrics (calc_ + mqtt_ + shadowpub_ scoped) ==="
          docker run --rm --network container:edge-transformer curlimages/curl:latest \
            -s http://localhost:9102/metrics 2>/dev/null \
            | grep -E '^(calc_|mqtt_|shadowpub_)' \
            | head -60 || echo "(no matching metrics)"
