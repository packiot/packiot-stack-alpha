name: Deploy to Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

# Serialize deploys. Two near-simultaneous bump-PR auto-merges (e.g. edge-api
# and edge-node-red bots merging within seconds of each other) would otherwise
# race on `docker compose build && up -d` — the second invocation can clobber
# half-built layers or leave the project in an inconsistent state. Queue them
# instead of canceling; we want every staging commit to actually deploy.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, staging, linux, arm64]

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          submodules: false
          # persist-credentials: false so checkout@v4 removes its GITHUB_TOKEN
          # extraheader before we fetch submodules. If submodules: recursive is
          # used here, checkout@v4 sets http.extraheader=GITHUB_TOKEN during the
          # submodule fetch — that token only covers this repo, not private
          # submodule repos, causing "Repository not found". Splitting into two
          # steps means git falls back to the PAT URL rewrite in
          # /root/.gitconfig (set by app_init.sh) for the submodule fetch.
          persist-credentials: false

      - name: Fetch submodules
        # No GITHUB_TOKEN extraheader active here — git uses the PAT rewrite
        # in /root/.gitconfig (set by app_init.sh):
        #   url."https://PAT@github.com/packiot/".insteadOf = https://github.com/packiot/
        #   url."https://PAT@github.com/packiot/".insteadOf = git@github.com:packiot/
        # Both HTTPS and SSH-format submodule URLs are covered.
        # Init every submodule staging compose.staging.yml builds:
        #   edge-api, edge-nodered, operator (frontend, built since the
        #   operator.staging.packiot.app SPA went live). oeecloud-node-red
        #   was removed in the 2026-06-24 decommission (replaced by the Go
        #   worker baked into services/stream-engine).
        run: |
          git submodule sync edge-api edge-node-red operator csadmin
          git submodule update --init edge-api edge-node-red operator csadmin

      - name: Link .env
        # Secrets live in /opt/packiot/.env (written by app_init.sh from Secrets Manager).
        # Symlinking makes it available as .env so Docker Compose picks it up.
        run: ln -sf /opt/packiot/.env "$GITHUB_WORKSPACE/.env"

      - name: Generate RabbitMQ definitions (durable least-priv users)
        # rabbitmq.conf sets load_definitions, which re-imports users/perms on
        # every broker boot so a container recreate can't lose the least-priv
        # users again (the 2026-07-10 boot-only-provisioning trap). Build the
        # real definitions.json from the committed template + the passwords in
        # Secrets Manager (admin from .env); it's gitignored (contains secrets)
        # and mounted read-only. MUST run before compose up — a missing file
        # would stop rabbitmq booting since load_definitions references it.
        run: |
          set -euo pipefail
          AU=$(grep -E '^RABBITMQ_USER=' /opt/packiot/.env | cut -d= -f2)
          AP=$(grep -E '^RABBITMQ_PASSWORD=' /opt/packiot/.env | cut -d= -f2)
          # rename S1+S2 (oeecloud-worker -> stream-engine): MANUAL PRE-REQ —
          # packiot/staging/rabbitmq-stream-engine-creds must exist (username
          # "stream-engine", same password as the old rabbitmq-oeecloud-creds)
          # before this step can succeed.
          OP=$(aws secretsmanager get-secret-value --secret-id packiot/staging/rabbitmq-stream-engine-creds --region us-east-1 --query SecretString --output text | jq -r '.password')
          EP=$(aws secretsmanager get-secret-value --secret-id packiot/staging/rabbitmq-edge-transformer-creds --region us-east-1 --query SecretString --output text | jq -r '.password')
          test -n "$AU" && test -n "$AP" && test -n "$OP" && test -n "$EP"
          jq --arg au "$AU" --arg ap "$AP" --arg op "$OP" --arg ep "$EP" '
            .users |= map(
              if .name=="__ADMIN__" then .name=$au | .password=$ap
              elif .name=="stream-engine" then .password=$op
              elif .name=="edge-transformer" then .password=$ep
              else . end) |
            .permissions |= map(if .user=="__ADMIN__" then .user=$au else . end)
          ' monitoring/rabbitmq/definitions.template.json > monitoring/rabbitmq/definitions.json
          echo "Generated definitions.json: $(jq '.users|length' monitoring/rabbitmq/definitions.json) users, $(jq '.permissions|length' monitoring/rabbitmq/definitions.json) permission sets"

      - name: Build images
        # compose.superset.yml (W2 embedded BI) is a profile-gated overlay: every
        # service carries `profiles: ["superset"]`, so it is INERT unless
        # COMPOSE_PROFILES (in /opt/packiot/.env) includes `superset`. Including
        # the -f here keeps the superset services KNOWN to the `stack` project so
        # the Deploy step's --remove-orphans never reaps a running Superset — the
        # whole overlay stays dark until the profile is deliberately enabled per
        # docs/superset-golive-runbook.md.
        run: docker compose -f compose.staging.yml -f compose.superset.yml -p stack build

      - name: Deploy
        # --remove-orphans so removing a service from compose actually
        # decommissions it. Without this, `up -d` only warns "Found orphan
        # containers" and leaves them running, silently leaving zombie
        # services behind. Safe here because this compose file owns the
        # whole project — no other stack co-tenants on the host. The superset
        # overlay is profile-gated (see Build step) so this starts nothing extra
        # until COMPOSE_PROFILES=superset.
        run: docker compose -f compose.staging.yml -f compose.superset.yml -p stack up -d --remove-orphans

      - name: Prune old images
        run: docker image prune -f

      - name: Reload Prometheus config (dir-mount makes new file content visible; reload re-reads it)
        # Task #39. prometheus.yml/rules.yml are now a DIRECTORY bind mount, so a
        # git checkout that replaces them with new inodes is VISIBLE inside the
        # running container without a recreate — but Prometheus only re-reads its
        # config on SIGHUP or POST /-/reload (--web.enable-lifecycle is set in
        # compose). Without this step, rule/scrape edits would sit on disk unread
        # until the next full recreate, which is exactly the trap this task closes
        # (the POStalenessGateRejectingWrites alert needed a manual force-recreate
        # to load).
        #
        # `up -d` above does NOT recreate prometheus on a content-only change (its
        # service spec is unchanged), so the container is the SAME one already
        # running — we just tell it to re-read. Reaches prometheus over its own
        # netns (--network container:prometheus), the same pattern the inspect/
        # chaos steps use, so it needs no host curl and no published-port hop.
        #
        # Guarded: retry while prometheus finishes any (re)start, and
        # continue-on-error so a reload miss never fails the deploy — the config
        # is on disk regardless and loads on the next restart.
        continue-on-error: true
        run: |
          set +e
          echo "Reloading Prometheus config via POST /-/reload ..."
          for i in $(seq 1 10); do
            if docker run --rm --network container:prometheus curlimages/curl:latest \
                 -sf -X POST http://localhost:9090/-/reload >/dev/null 2>&1; then
              echo "  prometheus config reloaded (attempt $i)"
              exit 0
            fi
            echo "  attempt $i: prometheus not ready for reload yet — sleeping 3s"
            sleep 3
          done
          echo "  reload not confirmed after 10 attempts — config will load on next restart"

      - name: Reload Alertmanager config (dir-mount makes new file content visible; reload re-reads it)
        # Task #41 — same inode trap as #39/#40, now on the NOTIFICATION path.
        # monitoring/alertmanager is now a DIRECTORY bind mount, so a git checkout
        # that replaces alertmanager.yml with a new inode is VISIBLE inside the
        # running container without a recreate — but alertmanager only re-reads its
        # config on SIGHUP or POST /-/reload. Unlike Prometheus, alertmanager's
        # /-/reload is enabled by DEFAULT (no --web.enable-lifecycle flag). Without
        # this step a route/receiver edit would sit on disk unread until the next
        # full recreate — i.e. silently-broken alerting, the worst failure mode.
        #
        # Alertmanager is PARKED behind `profiles: ["alerting"]` (Slack webhook
        # secret deferred), so on a plain `up -d` the container is NOT running. In
        # that case the reachability check simply never confirms and we log-and-
        # move-on; continue-on-error guarantees a parked (or restarting) manager
        # never reddens the deploy. When the profile is enabled, the reload lands.
        # Reaches alertmanager (default port 9093) over its own netns
        # (--network container:alertmanager), same pattern as the prometheus step.
        continue-on-error: true
        run: |
          set +e
          if ! docker ps --format '{{.Names}}' | grep -qx alertmanager; then
            echo "alertmanager not running (parked behind --profile alerting) — skipping reload"
            exit 0
          fi
          echo "Reloading Alertmanager config via POST /-/reload ..."
          for i in $(seq 1 10); do
            if docker run --rm --network container:alertmanager curlimages/curl:latest \
                 -sf -X POST http://localhost:9093/-/reload >/dev/null 2>&1; then
              echo "  alertmanager config reloaded (attempt $i)"
              exit 0
            fi
            echo "  attempt $i: alertmanager not ready for reload yet — sleeping 3s"
            sleep 3
          done
          echo "  reload not confirmed after 10 attempts — config will load on next restart"

      - name: Post-deploy service-state gate — EVERY expected service running/healthy (task #67)
        # ROOT CAUSE this closes (task #67): during the #57 PR1 deploy (#494) the
        # `operator` container was RECREATED (submodule image bump + new
        # REFDATA_API_KEY env) but Docker Compose left it in state=`created` and
        # never started it (ExitCode=0, no logs) — an intermittent defect in
        # compose's create→start handoff when a recreated service's depends_on
        # target (edge-nodered, service_healthy) is ALREADY running and is NOT
        # itself recreated this deploy, so the dependency-ready signal the new
        # container blocks on is never re-broadcast. `up -d` still exited 0, so
        # the deploy went GREEN with the one service that actually changed left
        # down. Reproduced locally: the modern-compose happy path starts cleanly,
        # confirming this is a race, not a misconfig — which is exactly why the
        # backstop must re-derive ground truth from `ps` instead of trusting
        # compose's own convergence accounting.
        #
        # The PREVIOUS smoke test could not have caught it for TWO reasons:
        #   1. Its service list was HARDCODED and did not include `operator`
        #      (same class of gap as the hardcoded-enterprise-id anti-pattern —
        #      a new service silently escapes the gate).
        #   2. It only asserted `.State.Health.Status`; `operator` has NO
        #      healthcheck, so even if listed it would have been waved through as
        #      "no healthcheck — assuming OK" while sitting in `created`.
        #
        # This gate fixes both. It ENUMERATES the expected services from the
        # rendered compose config (so a newly-added service can never be omitted;
        # `config --services` already excludes profile-gated services like
        # alertmanager/s7-*), CLASSIFIES one-shots STRUCTURALLY (targets of a
        # `service_completed_successfully` dependency — db-migrate, hasura-init —
        # no hardcoded names), then asserts per service:
        #   - long-running service  → State MUST be `running`; and if it declares
        #     a healthcheck, Health MUST reach `healthy` (Health=`starting` keeps
        #     polling within the timeout).
        #   - one-shot service      → MUST be `exited` with ExitCode 0.
        # Any `created` / non-zero `exited` / `dead` / `missing` / unhealthy at
        # the deadline FAILS the workflow (non-zero) and dumps that container's
        # last log lines. A green deploy can no longer mask a down service
        # (same hardening theme as #39/#40). `.env` is symlinked by the earlier
        # "Link .env" step so `config`/`ps` resolve cleanly here.
        #
        # SECOND-MISS FIX (this PR): the create→start strand has a SECOND
        # trigger the original gate could not see. In #494 `up -d` exited 0 and
        # the gate ran. But `up -d` can ALSO abort NON-zero mid-convergence —
        # recreate service A, then hit a host-port clash bringing up service B —
        # and leave A in state=`created`, never started (run 29609399636:
        # `Error response from daemon: Address already in use` stranded
        # mirror-worker-go in `created`). In that mode the FAILED Deploy step
        # skipped this gate entirely (no `if:` → default `success()`), so the
        # deploy went red with only the opaque daemon error and ZERO per-service
        # diagnosis of WHICH container was left down. `if: ${{ !cancelled() }}`
        # makes the gate run after Deploy whether it passed OR failed (only a
        # cancellation skips it), so a partial/aborted `up -d` still gets the
        # precise `mirror-worker-go: state=created + last 40 log lines` verdict
        # instead of a mystery red. Running is the PRIMARY assertion; a container
        # that never started can't be "healthy" or "starting" — it's just down.
        # `current_states()` also lower-cases State/Health so a compose build
        # that emits `Created`/`Exited` still hits the fail branch immediately
        # instead of polling to the deadline.
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json, subprocess, sys, time

          # Include the profile-gated superset overlay so `config`/`ps` render the
          # same composition as Build/Deploy. With COMPOSE_PROFILES unset the
          # superset services are omitted from `config`, so this health probe only
          # asserts them once the profile is deliberately enabled (runbook).
          COMPOSE = ["docker", "compose", "-f", "compose.staging.yml",
                     "-f", "compose.superset.yml", "-p", "stack"]

          def sh(args):
              return subprocess.run(COMPOSE + args, capture_output=True, text=True)

          # 1) Expected services + structural classification from the rendered config.
          cfg_run = sh(["config", "--format", "json"])
          if cfg_run.returncode != 0:
              print("::error title=gate could not render compose config::" + cfg_run.stderr[-500:])
              sys.exit(1)
          svcs = json.loads(cfg_run.stdout).get("services", {})

          oneshot = set()
          for _, s in svcs.items():
              dep = s.get("depends_on") or {}
              # `config --format json` normalizes depends_on to the long-form dict;
              # guard against the short-form list just in case a compose version differs.
              if not isinstance(dep, dict):
                  continue
              for dep_name, dep_cond in dep.items():
                  if isinstance(dep_cond, dict) and dep_cond.get("condition") == "service_completed_successfully":
                      oneshot.add(dep_name)
          has_hc = {
              n for n, s in svcs.items()
              if s.get("healthcheck") and not s["healthcheck"].get("disable")
          }
          # Also classify run-once init jobs that NOTHING waits on via
          # service_completed_successfully — the edge-based heuristic above only
          # catches one-shots something DEPENDS on (db-migrate). A terminal init
          # like hasura-init (applies metadata, exits 0) has no such in-edge, so
          # without this it is treated as long-running and fails on its correct
          # exited(0). A `restart: "no"` policy is the canonical compose signal for
          # "run once"; requiring "no healthcheck" too means a long-running service
          # (which always carries one) can never be wrongly excused if mis-set.
          for n, s in svcs.items():
              if n not in has_hc and str(s.get("restart") or "").lower() in ("no", "none"):
                  oneshot.add(n)
          expected = set(svcs.keys())
          print("Gate expects %d services (%d one-shot, %d healthchecked):"
                % (len(expected), len(oneshot), len(has_hc)))
          print("  one-shots: %s" % (", ".join(sorted(oneshot)) or "(none)"))

          def current_states():
              out = sh(["ps", "-a", "--format", "json"]).stdout
              d = {}
              for line in out.splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  r = json.loads(line)
                  # Normalize State/Health to lowercase: some compose builds
                  # emit `Created`/`Exited`/`Healthy` (capitalized). Without this
                  # a `created` service would miss the fail branch and poll to the
                  # deadline instead of failing fast. `running` is the primary
                  # verdict; health is a secondary assertion layered on top.
                  d[r["Service"]] = ((r.get("State") or "").lower(),
                                     (r.get("Health") or "").lower(),
                                     r.get("ExitCode"))
              return d

          # 2) Poll every expected service to a terminal verdict (or deadline).
          deadline = time.time() + 300
          pending = set(expected)
          failed = {}
          while pending and time.time() < deadline:
              st = current_states()
              for svc in sorted(pending):
                  state, health, code = st.get(svc, ("missing", "", None))
                  if svc in oneshot:
                      if state == "exited" and code == 0:
                          print("OK   %s: exited(0) [one-shot]" % svc); pending.discard(svc)
                      elif state == "created" or state == "dead" or (state == "exited" and code not in (0, None)):
                          failed[svc] = (state, health, code); pending.discard(svc)
                      # running / restarting / exited(None) → still settling, keep polling
                  else:
                      if state == "running" and (svc not in has_hc or health == "healthy"):
                          print("OK   %s: running%s" % (svc, " (%s)" % health if health else "")); pending.discard(svc)
                      elif state in ("created", "exited", "dead"):
                          failed[svc] = (state, health, code); pending.discard(svc)
                      # running+starting / restarting / transient-missing → keep polling
              if pending:
                  time.sleep(3)

          # 3) Anything still pending at the deadline is a timeout failure.
          st = current_states()
          for svc in pending:
              failed[svc] = st.get(svc, ("missing", "", None))

          if failed:
              print("\n=== SERVICE-STATE GATE: %d FAILURE(S) ===" % len(failed))
              for svc, (state, health, code) in sorted(failed.items()):
                  print("::error title=service %s not up::state=%s health=%s exit=%s"
                        % (svc, state, health or "none", code))
                  print("--- %s: last 40 log lines ---" % svc)
                  logs = sh(["logs", "--tail", "40", svc])
                  sys.stdout.write((logs.stdout or logs.stderr)[-4000:])
                  print()
              sys.exit(1)

          print("\nAll %d expected services are running/healthy (one-shots exited 0). Gate PASS." % len(expected))
          PYEOF

      - name: Inject synthetic Sparkplug counter (ADR-0010 Phase 3 E2E)
        # Publishes NBIRTH + NDATA against mosquitto, then scrapes /metrics
        # so we can prove the Calc port ran. Runs BEFORE inspect so the
        # inspect step's /metrics output reflects the inject.
        # continue-on-error so an inject hiccup doesn't fail the deploy.
        continue-on-error: true
        run: |
          set -x
          docker run --rm \
            -v "$PWD/services/sparkplug-decoder:/src" \
            -w /src \
            -e CGO_ENABLED=0 -e GOOS=linux \
            golang:1.25-alpine \
            go build -trimpath -o /src/inject-counter-fixture ./cmd/inject-counter-fixture

          docker run --rm \
            --network stack_packiot-net \
            -v "$PWD/services/sparkplug-decoder/inject-counter-fixture:/app/inject:ro" \
            alpine:3.20 \
            /app/inject --broker tcp://mosquitto:1883 --value 100

          rm -f services/sparkplug-decoder/inject-counter-fixture
          echo "Waiting 3s for sparkplug-decoder to process..."
          sleep 3

      - name: Inspect sparkplug-decoder post-deploy
        # Diagnostic step — verifies env vars, log tail, healthcheck exit,
        # and Prometheus metrics scoped to Calc port + MQTT subscriber. Runs
        # after smoke test so we know sparkplug-decoder is up before probing.
        # Failures here don't fail the deploy (the container may be healthy
        # even if the diagnostic tooling itself has a hiccup).
        continue-on-error: true
        run: |
          echo "=== env (USE_GO_PORT / MQTT_ / LOG_LEVEL) ==="
          docker inspect sparkplug-decoder \
            --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep -iE 'USE_GO_PORT|MQTT_|LOG_LEVEL' || echo "(no matching env vars)"

          echo ""
          echo "=== last 60 log lines ==="
          docker logs --tail 60 sparkplug-decoder 2>&1 || true

          echo ""
          echo "=== healthcheck exit code ==="
          docker exec sparkplug-decoder /usr/local/bin/sparkplug-decoder --healthcheck && echo "healthy" || echo "unhealthy exit=$?"

          echo ""
          echo "=== /metrics (calc_ + mqtt_ + shadowpub_ + outbox_ scoped) ==="
          docker run --rm --network container:sparkplug-decoder curlimages/curl:latest \
            -s http://localhost:9102/metrics 2>/dev/null \
            | grep -E '^(calc_|mqtt_|shadowpub_|outbox_)' \
            | head -80 || echo "(no matching metrics)"

      - name: Extend RMQ perms for edge-transformer to include `oee` exchange (ADR-0010 Phase 3)
        # Idempotent PUT to the RabbitMQ management API — extends the
        # edge-transformer user's write+read regex to include the `oee`
        # exchange used for shadow-mode DB comparison. Without this, every
        # shadow publish returns 403 access-refused and the AMQP channel
        # closes with 'shadowpub: confirms channel closed'.
        #
        # Idempotent: reapplying with same body is a no-op.
        # The terraform user_data script (app_init.sh) already carries the
        # matching pattern for fresh EC2 instances; this step handles the
        # already-running instance (would need a full re-init otherwise).
        continue-on-error: true
        run: |
          set +e
          MQ_USER=$(grep -E '^RABBITMQ_USER=' /opt/packiot/.env | cut -d= -f2)
          MQ_PASS=$(grep -E '^RABBITMQ_PASSWORD=' /opt/packiot/.env | cut -d= -f2)
          ET_USER="edge-transformer"
          if [ -z "$MQ_PASS" ]; then
            echo "(missing RABBITMQ_PASSWORD in /opt/packiot/.env — skipping perm update)"
            exit 0
          fi
          echo "Updating RabbitMQ permissions for $ET_USER to include 'oee' exchange..."
          docker run --rm --network container:stack-rabbitmq-1 curlimages/curl:latest \
            -sf -u "$MQ_USER:$MQ_PASS" -X PUT \
            "http://127.0.0.1:15672/api/permissions/%2F/$ET_USER" \
            -H "Content-Type: application/json" \
            -d '{"configure":"^(edge-transformer.*|outbox.*|edge\\.plc-normalized.*|dlx\\.edge\\.plc-normalized.*)$","write":"^(edge-transformer.*|outbox.*|edge\\.plc-normalized.*|oee)$","read":"^(edge\\.plc-normalized.*|dlx\\.edge\\.plc-normalized.*|edge-transformer.*|outbox.*|oee)$"}' \
            && echo "  perms updated" \
            || echo "  perm update FAILED — investigate"

      - name: DB schema audit — dump table sizes + views + PowerBI-referenced objects
        # SELECT-only audit query. Produces a compact schema report so we
        # can plan the "schema complexity" refactor without guessing. Runs
        # on every deploy — the report is idempotent and cheap (~1s), and
        # having it in the deploy log means we always have a fresh baseline
        # to compare after a refactor commit.
        #
        # Includes: top 30 tables by size, view count, PowerBI's likely
        # attack surface (any view/table with "powerbi", "report", "export"
        # in the name), and role usage (which roles have SELECT grants on
        # what).
        #
        # PowerBI queries via ODBC/DirectQuery through the postgres user
        # (or a dedicated `powerbi_readonly` role if one exists) — we
        # identify its objects here so the refactor knows what NOT to
        # touch.
        continue-on-error: true
        run: |
          set +e
          MQ_USER=$(grep -E '^RABBITMQ_USER=' /opt/packiot/.env | cut -d= -f2)
          POSTGRES_HOST=$(grep -E '^POSTGRES_HOST=' /opt/packiot/.env | cut -d= -f2)
          POSTGRES_USER=$(grep -E '^POSTGRES_USER=' /opt/packiot/.env | cut -d= -f2)
          POSTGRES_PASSWORD=$(grep -E '^POSTGRES_PASSWORD=' /opt/packiot/.env | cut -d= -f2)
          POSTGRES_DB=$(grep -E '^POSTGRES_DB=' /opt/packiot/.env | cut -d= -f2)
          if [ -z "$POSTGRES_PASSWORD" ]; then exit 0; fi
          PSQL="docker run --rm --network stack_packiot-net -e PGPASSWORD=$POSTGRES_PASSWORD postgres:15-alpine psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB"

          echo "=== Top 30 tables by total size (public schema) ==="
          $PSQL -c "SELECT relname AS table, pg_size_pretty(pg_total_relation_size('public.'||relname)) AS total_size, pg_size_pretty(pg_relation_size('public.'||relname)) AS table_size, n_live_tup AS row_estimate FROM pg_stat_user_tables WHERE schemaname='public' ORDER BY pg_total_relation_size('public.'||relname) DESC LIMIT 30;"

          echo ""
          echo "=== Total tables + views + matviews per schema ==="
          $PSQL -c "SELECT schemaname, COUNT(*) FILTER (WHERE relkind='r') AS tables, COUNT(*) FILTER (WHERE relkind='v') AS views, COUNT(*) FILTER (WHERE relkind='m') AS matviews FROM pg_class JOIN pg_namespace ON pg_namespace.oid=pg_class.relnamespace JOIN (SELECT schemaname FROM pg_stat_user_tables UNION SELECT schemaname FROM pg_stat_user_indexes UNION SELECT nspname AS schemaname FROM pg_namespace WHERE nspname NOT LIKE 'pg_%' AND nspname != 'information_schema') sn ON sn.schemaname=nspname WHERE relkind IN ('r','v','m') GROUP BY schemaname ORDER BY schemaname;"

          echo ""
          echo "=== Tables with likely PowerBI-facing names ==="
          $PSQL -c "SELECT n.nspname||'.'||c.relname AS name, CASE c.relkind WHEN 'r' THEN 'table' WHEN 'v' THEN 'view' WHEN 'm' THEN 'matview' END AS kind FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE c.relkind IN ('r','v','m') AND (c.relname ILIKE '%powerbi%' OR c.relname ILIKE '%report%' OR c.relname ILIKE '%export%' OR c.relname ILIKE '%bi_%' OR c.relname ILIKE '%dashboard%') ORDER BY n.nspname, c.relname;"

          echo ""
          echo "=== TimescaleDB hypertables (via hypertable_size()) ==="
          $PSQL -c "SELECT h.hypertable_schema||'.'||h.hypertable_name AS name, h.num_chunks, pg_size_pretty(hypertable_size(format('%I.%I', h.hypertable_schema, h.hypertable_name)::regclass)) AS size FROM timescaledb_information.hypertables h ORDER BY hypertable_size(format('%I.%I', h.hypertable_schema, h.hypertable_name)::regclass) DESC NULLS LAST LIMIT 20;" 2>&1 | head -25

          echo ""
          echo "=== Continuous aggregates (materialized views on hypertables) ==="
          $PSQL -c "SELECT view_name, materialization_hypertable_name FROM timescaledb_information.continuous_aggregates ORDER BY view_name;" 2>&1 | head -20

          echo ""
          echo "=== Tables with 0 recent activity (candidates for archival) ==="
          $PSQL -c "SELECT schemaname||'.'||relname AS name, n_live_tup AS rows, last_autovacuum, last_analyze FROM pg_stat_user_tables WHERE n_live_tup > 0 AND (last_autoanalyze IS NULL OR last_autoanalyze < now() - INTERVAL '30 days') AND schemaname='public' ORDER BY n_live_tup DESC LIMIT 20;"

          echo ""
          echo "=== Roles + likely PowerBI-facing role grants ==="
          $PSQL -c "SELECT rolname, rolcanlogin FROM pg_roles WHERE rolname ILIKE '%bi%' OR rolname ILIKE '%report%' OR rolname ILIKE '%export%' OR rolname ILIKE '%readonly%' OR rolname ILIKE '%readwrite%' ORDER BY rolname;"

          echo ""
          echo "=== Hasura-tracked tables (via HTTP metadata API, v2+ schema) ==="
          # Hasura v2 stores tracked-table metadata as JSON blob in
          # hdb_catalog.hdb_metadata — but the reliable way to introspect
          # is the metadata HTTP API. This queries the running hasura
          # container inside the compose network for its export_metadata
          # response, then extracts source.tables[].table.name from the JSON.
          # /opt/packiot/.env uses Hasura's canonical env var name
          # HASURA_GRAPHQL_ADMIN_SECRET (see terraform/staging/user_data/app_init.sh
          # line "HASURA_GRAPHQL_ADMIN_SECRET=$HASURA_ADMIN"). Earlier version
          # of this step grepped for the shorter HASURA_ADMIN_SECRET alias
          # (which the compose file exposes to the container but is NOT
          # what lives in the host .env file) and always missed → fell
          # through to a broken blob-fallback path.
          HASURA_ADMIN_SECRET=$(grep -E '^HASURA_GRAPHQL_ADMIN_SECRET=' /opt/packiot/.env | cut -d= -f2)
          if [ -z "$HASURA_ADMIN_SECRET" ]; then
            echo "(missing HASURA_GRAPHQL_ADMIN_SECRET — falling back to metadata blob)"
            # metadata column is json (not jsonb), so cast on both extractions.
            $PSQL -c "SELECT jsonb_array_elements(sources->'tables')->'table'->>'name' AS name FROM hdb_catalog.hdb_metadata, jsonb_array_elements(metadata::jsonb->'sources') AS sources ORDER BY name;" 2>&1 | head -50
          else
            # Fetch the full tracked-tables list into a temp file so we
            # can both (a) print it for the audit log AND (b) intersect
            # against pg_stat_user_tables for orphan detection below.
            docker run --rm --network container:stack-hasura-1 curlimages/curl:latest \
              -sf -H "X-Hasura-Admin-Secret: $HASURA_ADMIN_SECRET" -X POST http://127.0.0.1:8080/v1/metadata \
              -H "Content-Type: application/json" \
              -d '{"type":"export_metadata","args":{}}' \
              | python3 -c "import json,sys; d=json.load(sys.stdin); [print('public.'+t['table']['name']) for s in d.get('sources',[]) for t in s.get('tables',[]) if t.get('table',{}).get('schema')=='public']" \
              | sort > /tmp/hasura_tracked.txt || echo "(hasura API call failed)"
            wc -l /tmp/hasura_tracked.txt
            echo "  (first 30 shown; full list used for orphan detection below)"
            head -30 /tmp/hasura_tracked.txt
            echo "  ..."
            tail -30 /tmp/hasura_tracked.txt
          fi

          echo ""
          echo "=== ORPHAN candidates: pg tables NOT tracked by Hasura AND not a view base AND >7d since analyze ==="
          # Set-difference done in shell rather than SQL to avoid
          # smuggling the tracked list into psql via COPY FROM STDIN
          # inside a YAML run: block (that's the multi-line-heredoc
          # trap that broke PRs #161-165).
          #
          # Three lists sorted → comm --23 → orphan names → re-query
          # psql for size + row estimate on just those names.
          if [ -s /tmp/hasura_tracked.txt ]; then
            $PSQL -tAc "SELECT 'public.'||relname FROM pg_stat_user_tables WHERE schemaname='public' AND (last_autoanalyze IS NULL OR last_autoanalyze < now() - INTERVAL '7 days');" 2>/dev/null | sort > /tmp/stale_tables.txt
            $PSQL -tAc "SELECT DISTINCT dep_ns.nspname||'.'||dep_class.relname FROM pg_depend d JOIN pg_rewrite r ON d.objid=r.oid JOIN pg_class view_class ON r.ev_class=view_class.oid JOIN pg_class dep_class ON d.refobjid=dep_class.oid JOIN pg_namespace dep_ns ON dep_class.relnamespace=dep_ns.oid WHERE d.deptype='n' AND view_class.relkind IN ('v','m') AND dep_class.relkind='r' AND dep_ns.nspname='public';" 2>/dev/null | sort -u > /tmp/view_bases.txt
            # Orphans = stale-tables MINUS (hasura-tracked UNION view-bases)
            comm -23 /tmp/stale_tables.txt <(sort -u /tmp/hasura_tracked.txt /tmp/view_bases.txt) > /tmp/orphans.txt
            n=$(wc -l < /tmp/orphans.txt)
            echo "Found $n orphan-candidate table(s)."
            if [ "$n" -gt 0 ]; then
              # Build a comma-list for a size-decorating IN clause.
              IN_LIST=$(awk 'NF{print "\047"$0"\047"}' /tmp/orphans.txt | paste -sd,)
              $PSQL -c "SELECT schemaname||'.'||relname AS name, n_live_tup AS rows, pg_size_pretty(pg_total_relation_size(('public.'||relname)::regclass)) AS size, last_autoanalyze::date FROM pg_stat_user_tables WHERE schemaname='public' AND schemaname||'.'||relname IN ($IN_LIST) ORDER BY pg_total_relation_size(('public.'||relname)::regclass) DESC NULLS LAST LIMIT 30;"
            fi
          else
            echo "(no /tmp/hasura_tracked.txt — orphan query skipped)"
          fi

          echo ""
          echo "=== Spot-check A: monitoramento_execucao_functions (67MB, pt-BR, no views depend on it) ==="
          $PSQL -c "SELECT relname, n_tup_ins AS inserts, n_tup_upd AS updates, n_tup_del AS deletes, seq_scan, idx_scan, last_analyze::date, last_autovacuum::date FROM pg_stat_user_tables WHERE relname='monitoramento_execucao_functions';"
          $PSQL -c "SELECT column_name, data_type FROM information_schema.columns WHERE table_schema='public' AND table_name='monitoramento_execucao_functions' ORDER BY ordinal_position LIMIT 15;"

          echo ""
          echo "=== Spot-check B: shift_agg_from_events versions — which is current? ==="
          $PSQL -c "SELECT table_name, LENGTH(view_definition) AS def_size FROM information_schema.views WHERE table_schema='public' AND table_name LIKE 'shift_agg_from_events%' ORDER BY table_name;"
          $PSQL -c "SELECT view_class.relname AS view_name, COUNT(*) AS deps_from_this_view FROM pg_depend d JOIN pg_rewrite r ON d.objid=r.oid JOIN pg_class view_class ON r.ev_class=view_class.oid JOIN pg_class dep_class ON d.refobjid=dep_class.oid WHERE d.deptype='n' AND view_class.relkind IN ('v','m') AND dep_class.relkind='r' AND view_class.relname LIKE 'shift_agg_from_events%' GROUP BY view_class.relname ORDER BY view_class.relname;"
          $PSQL -c "SELECT dep_view.relname AS depends_on_this_shift_agg, source_view.relname AS shift_agg_version FROM pg_depend d JOIN pg_rewrite r ON d.objid=r.oid JOIN pg_class dep_view ON r.ev_class=dep_view.oid JOIN pg_class source_view ON d.refobjid=source_view.oid WHERE d.deptype='n' AND source_view.relkind IN ('v','m') AND source_view.relname LIKE 'shift_agg_from_events%' AND dep_view.relname != source_view.relname ORDER BY source_view.relname, dep_view.relname LIMIT 20;"

          echo ""
          echo "=== Spot-check C: c35_* tables — populated by cron? ==="
          $PSQL -c "SELECT jobname, schedule, command FROM cron.job WHERE command ILIKE '%c35%' OR command ILIKE '%dashboard_producao%' OR command ILIKE '%dashboard_paradas%' ORDER BY jobname;" 2>&1 | head -10
          $PSQL -c "SELECT r.jobid, j.jobname, r.status, r.return_message, r.start_time::timestamptz(0) FROM cron.job_run_details r JOIN cron.job j ON r.jobid=j.jobid WHERE j.command ILIKE '%c35%' OR j.command ILIKE '%dashboard%' ORDER BY r.start_time DESC LIMIT 5;" 2>&1 | head -12

          echo ""
          echo "=== Spot-check D: v_operator_po_details versions — which is current? ==="
          $PSQL -c "SELECT table_name, LENGTH(view_definition) AS def_size FROM information_schema.views WHERE table_schema='public' AND table_name LIKE 'v_operator_po_details%' ORDER BY table_name;"
          $PSQL -c "SELECT dep_view.relname AS depends_on, source_view.relname AS version FROM pg_depend d JOIN pg_rewrite r ON d.objid=r.oid JOIN pg_class dep_view ON r.ev_class=dep_view.oid JOIN pg_class source_view ON d.refobjid=source_view.oid WHERE d.deptype='n' AND source_view.relkind IN ('v','m') AND source_view.relname LIKE 'v_operator_po_details%' AND dep_view.relname != source_view.relname ORDER BY source_view.relname;"

          echo ""
          echo "=== Spot-check E: equipment_events_man — still populated? ==="
          $PSQL -c "SELECT relname, n_live_tup AS rows, n_tup_ins AS inserts_ever, n_tup_upd AS updates_ever, last_analyze::date, last_autovacuum::date FROM pg_stat_user_tables WHERE relname='equipment_events_man';"

      - name: F3 int-overflow sentinel (ADR-0032 Step 5 — re-homed GATE 2)
        # ── HISTORY ────────────────────────────────────────────────────────
        # This was the "F2/F3 identity + int-overflow sentinel". The single-flow
        # collapse dropped the F2 (shadow_go_port) plane, so the two F2==F3
        # EQUALITY gates (GATE 1 core byte-exact, GATE 3 raw count) were retired.
        # GATE 2 (int-overflow) was never a comparison — it's a per-plane invariant
        # (no row's running_time may exceed its bucket wall-clock span × 1.05 — the
        # guard that caught the L8 P0 overflow, ~112,000,000 vs ~11,195) — so it
        # SURVIVES, now run on F3 (public in packiot_shadow) ONLY. Same binary
        # subcommand + soft-launch/enforce mechanics as before; internal/bake/
        # sentinel.go is now overflow-only. Backstop: the #663 *_oee_bounds CHECK
        # constraints reject an overflow-driven oee blow-up at the DB write.
        #
        # ENFORCE MODE (IDENTITY_SENTINEL_ENFORCE): "false" = warn-only bake-in
        # (run + ::warning:: on a non-zero exit, do NOT fail the deploy); "true" =
        # a non-zero exit FAILS the deploy. The binary always exits non-zero on a
        # violation OR if the check could not run (fail-closed).
        env:
          IDENTITY_SENTINEL_ENFORCE: "false"
        run: |
          set +e
          echo "=== waiting for stream-engine to report healthy before sentinel ==="
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' stream-engine 2>/dev/null || echo missing)
            if [ "$status" = "healthy" ]; then echo "  stream-engine healthy after ${i}s"; break; fi
            sleep 2
          done
          if ! docker ps --format '{{.Names}}' | grep -qx stream-engine; then
            echo "::warning title=f3-overflow-sentinel skipped::stream-engine container not running — cannot run F3 overflow gate"
            exit 0
          fi

          echo "=== running F3 int-overflow sentinel (SELECT-only, F3 plane) ==="
          docker exec stream-engine /usr/local/bin/stream-engine --identity-sentinel
          RC=$?
          echo "sentinel exit code: $RC"

          if [ "$RC" -eq 0 ]; then
            echo "F3 int-overflow gate: PASS (or SKIP on empty window / no F3 db)"
            exit 0
          fi
          if [ "${IDENTITY_SENTINEL_ENFORCE}" = "true" ]; then
            echo "::error title=F3 overflow gate FAILED::sentinel exit $RC — running_time int-overflow on F3 (see report above). Failing the deploy (ENFORCE=true)."
            exit 1
          else
            echo "::warning title=F3 overflow gate (warn-only)::sentinel exit $RC — running_time int-overflow on F3 detected (see report above). NOT failing the deploy while IDENTITY_SENTINEL_ENFORCE=false. Triage then flip ENFORCE=true."
            exit 0
          fi

      - name: Chaos test — kill RMQ, prove outbox durability (ADR-0011 P3)
        # Proves the store-and-forward payoff: with outbox enabled, an RMQ
        # outage doesn't drop messages. Sequence:
        #   1. Take a baseline outbox_depth (should be 0 after inject drained)
        #   2. Stop RabbitMQ container — subsequent publishes will fail
        #   3. Inject 5 more messages — outbox_depth grows, none published
        #   4. Restart RabbitMQ — drain catches up
        #   5. Verify outbox_depth returns to 0 within 30s
        # If outbox is disabled, messages during the RMQ outage would just
        # be lost silently. This test codifies the durability contract.
        # continue-on-error so a chaos hiccup doesn't fail the deploy.
        continue-on-error: true
        run: |
          set +e
          echo "=== Chaos test: outbox durability under RMQ outage ==="

          get_outbox_depth() {
            docker run --rm --network container:sparkplug-decoder curlimages/curl:latest \
              -s http://localhost:9102/metrics 2>/dev/null \
              | awk '/^outbox_depth /{print $2}' \
              | head -1
          }

          get_shadowpub_confirmed() {
            docker run --rm --network container:sparkplug-decoder curlimages/curl:latest \
              -s http://localhost:9102/metrics 2>/dev/null \
              | awk '/^shadowpub_confirmed_total /{print $2}' \
              | head -1
          }

          baseline_depth=$(get_outbox_depth)
          baseline_confirmed=$(get_shadowpub_confirmed)
          echo "baseline: outbox_depth=$baseline_depth, shadowpub_confirmed_total=$baseline_confirmed"

          # Skip the chaos test if outbox isn't reporting metrics (feature disabled or not wired)
          if [ -z "$baseline_depth" ]; then
            echo "outbox_depth not present — skipping chaos test (outbox disabled)"
            exit 0
          fi

          # Build the inject binary once so we can run it multiple times.
          docker run --rm \
            -v "$PWD/services/sparkplug-decoder:/src" -w /src \
            -e CGO_ENABLED=0 -e GOOS=linux \
            golang:1.25-alpine \
            go build -trimpath -o /src/inject-counter-fixture ./cmd/inject-counter-fixture

          inject() {
            docker run --rm \
              --network stack_packiot-net \
              -v "$PWD/services/sparkplug-decoder/inject-counter-fixture:/app/inject:ro" \
              alpine:3.20 /app/inject --broker tcp://mosquitto:1883 --value "$1" 2>&1 | tail -3
          }

          echo ""
          echo "=== Step 1: Stop RabbitMQ ==="
          docker stop stack-rabbitmq-1

          echo ""
          echo "=== Step 2: Inject 5 messages while RMQ is down ==="
          for v in 200 300 400 500 600; do
            inject "$v"
            sleep 1
          done

          echo ""
          echo "=== Step 3: Outbox should have grown ==="
          sleep 3
          during_depth=$(get_outbox_depth)
          echo "during outage: outbox_depth=$during_depth (should be > baseline)"

          echo ""
          echo "=== Step 4: Restart RabbitMQ ==="
          docker start stack-rabbitmq-1
          # Wait for RMQ to be healthy again
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' stack-rabbitmq-1 2>/dev/null)
            if [ "$status" = "healthy" ]; then
              echo "  rabbitmq healthy after ${i}s"
              break
            fi
            sleep 1
          done

          echo ""
          echo "=== Step 5: Wait for drain to catch up (up to 60s) ==="
          for i in $(seq 1 60); do
            d=$(get_outbox_depth)
            if [ "$d" = "0" ] || [ "$d" = "0.0" ]; then
              echo "  drain caught up after ${i}s: outbox_depth=0"
              break
            fi
            [ $((i % 5)) -eq 0 ] && echo "  ${i}s: outbox_depth=$d"
            sleep 1
          done

          final_depth=$(get_outbox_depth)
          final_confirmed=$(get_shadowpub_confirmed)
          echo ""
          echo "=== Chaos test summary ==="
          echo "  baseline_depth      = $baseline_depth"
          echo "  peak_depth          = $during_depth"
          echo "  final_depth         = $final_depth"
          echo "  baseline_confirmed  = $baseline_confirmed"
          echo "  final_confirmed     = $final_confirmed"
          echo "  Messages recovered  = $(awk "BEGIN{print $final_confirmed - $baseline_confirmed}")"
          echo "  Expected recovered  = ~5 (from the inject burst)"
          if [ "$final_depth" = "0" ] || [ "$final_depth" = "0.0" ]; then
            echo "  RESULT: outbox drained cleanly — durability contract HOLDS"
          else
            echo "  RESULT: outbox did NOT drain — final_depth=$final_depth (investigate)"
          fi

          echo ""
          echo "=== Reconnect activity (proves NotifyClose monitor fired) ==="
          docker logs --since 3m sparkplug-decoder 2>&1 \
            | grep -iE 'shadowpub: connection|shadowpub: reconnect|outbox: publish' \
            | tail -30 || echo "  (no reconnect activity in logs — investigate)"

          echo ""
          echo "=== Final /metrics for outbox + shadowpub counters ==="
          docker run --rm --network container:sparkplug-decoder curlimages/curl:latest \
            -s http://localhost:9102/metrics 2>/dev/null \
            | grep -E '^(outbox_|shadowpub_reconnects|shadowpub_confirmed|shadowpub_published)' \
            | head -20 || true
