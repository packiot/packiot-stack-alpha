name: Inspect sparkplug-decoder (staging)

# One-shot debug workflow — runs on the staging self-hosted runner (which
# has docker compose access) and prints sparkplug-decoder's current state.
# Useful for verifying that env vars, config, and metrics match expectations
# after a deploy.
#
# Triggered manually. Zero side effects: read-only queries + log tails.
#
# NOTE (rename S1+S2, edge-transformer -> sparkplug-decoder): filename kept
# as inspect-edge-transformer.yml (matches the read-api rename precedent of
# not rippling workflow filenames); only the container/binary references and
# workflow display name were updated. The `edge_transformer_` Prometheus
# metric-name prefix below is intentionally UNCHANGED — metric names are a
# separate, harder cutover (breaks Grafana/alert continuity) out of scope
# for this reversible compose/module rename.

on:
  workflow_dispatch:

concurrency:
  group: inspect-sparkplug-decoder
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted, staging, linux, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: sparkplug-decoder container inspect
        run: |
          echo "=== docker ps ==="
          docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' | grep -E 'sparkplug-decoder|NAME'

          echo ""
          echo "=== env (USE_GO_PORT + MQTT flags) ==="
          docker inspect sparkplug-decoder \
            --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep -iE 'USE_GO_PORT|MQTT_|LOG_LEVEL' || echo "(no matching env vars)"

          echo ""
          echo "=== last 60 log lines ==="
          docker logs --tail 60 sparkplug-decoder 2>&1 || true

          echo ""
          echo "=== /healthz ==="
          docker exec sparkplug-decoder /usr/local/bin/sparkplug-decoder --healthcheck; echo "exit=$?"

      - name: Fetch /metrics filtered for calc_*
        run: |
          echo "=== /metrics (calc_ + mqtt_ scoped) ==="
          # Use temporary sidecar with curl since sparkplug-decoder is distroless.
          docker run --rm --network container:sparkplug-decoder curlimages/curl:latest \
            -s http://localhost:9102/metrics \
            | grep -E '^(calc_|mqtt_|shadowpub_|edge_transformer_)' \
            | head -80 || echo "(no matching metrics)"
