# compose.development.yml — Full local development stack, all Packiot services sharing one network.
#
# Service map:
#   rabbitmq         :5672   — AMQP message bus (edge-nodered → oeecloud-worker)
#   postgres         :5433   — TimescaleDB (single DB for edge-api + downstream consumers)
#   grafana          :3000   — Grafana dashboards (OEE pipeline, routing, health)
#   adminer          :8082   — Adminer DB GUI (postgres browser)
#   hasura           :8081   — Hasura GraphQL (proxies postgres for edge-nodered)
#   edge-api         :8080   — NestJS REST/admin API
#   edge-nodered     :1880   — Edge Node-RED (reads PLCs, publishes to RabbitMQ; serves operator API)
#   operator         :3002   — React SPA operator UI (factory floor interface)
#   oeecloud-worker          — Go AMQP consumer (replaces oeecloud-node-red)
#   mirror-worker-go         — Go user_logs replay worker (degenerate locally; no prod creds)
#   simulator        (opt)   — Operator activity simulator (Simulator Corp enterprise; profile=simulator)
#
# Both Go workers fetch creds via AWS Secrets Manager in staging/prod; locally
# they take the CREDS_SOURCE=env fallback in services/<name>/internal/secrets
# and read DB_*/RABBITMQ_* straight from the env vars below. See issue #52.
#
# Usage:
#   make up              — start everything
#   make up-edge         — infra + edge-nodered only
#   make up-api          — postgres + edge-api only
#
# Secrets: copy .env.example → .env.local and fill in before running.

networks:
  packiot-net:
    driver: bridge

volumes:
  pg-data:
  nr-edge-data:
  grafana-data:
  loki-data:
  rabbitmq-data:
  mosquitto-data:  # ADR-0011 P0-2: retained NBIRTHs survive broker restart

services:
  # ── RabbitMQ (message bus) ───────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: packiot
      RABBITMQ_DEFAULT_PASS: packiot
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [packiot-net]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}

  # ── Mosquitto (MQTT broker for Sparkplug B, ADR-0010) ───────────────────────
  # Local dev instance. Anonymous auth OK — no factory PLC ever reaches this
  # instance. edge-transformer's MQTT_ENABLED path (PR #124) subscribes here
  # when running against compose.development.yml.
  #
  # ADR-0011 P0-2: persistence enabled via configs/mosquitto/mosquitto.conf
  # so retained NBIRTHs survive `docker compose restart mosquitto`.
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./configs/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data       # persistence — ADR-0011 P0-2
    networks: [packiot-net]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -t 'healthcheck/ping' -m 'ok' -q 0 -W 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}

  # ── Database (TimescaleDB) ───────────────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:2.25.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: packiot
      POSTGRES_DB: packiot
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Core OEE schema + seed — lifted from oeecloud-node-red/db/ into the parent
      # repo when that submodule was decommissioned 2026-06-24. See db/init/README.md.
      - ./db/init/00-schema.sql:/docker-entrypoint-initdb.d/10-base-schema.sql:ro
      - ./db/init/01-seed.sql:/docker-entrypoint-initdb.d/11-seed.sql:ro
      - ./edge-node-red/db/02-production-objects.sql:/docker-entrypoint-initdb.d/12-production-objects.sql:ro
      - ./edge-node-red/db/03-operator-simulator.sql:/docker-entrypoint-initdb.d/13-operator-simulator.sql:ro
      - ./edge-node-red/db/04-operator-views.sql:/docker-entrypoint-initdb.d/14-operator-views.sql:ro
      - ./edge-node-red/db/05-staging-functions.sql:/docker-entrypoint-initdb.d/15-staging-functions.sql:ro
      - ./edge-node-red/db/06-staging-shifts.sql:/docker-entrypoint-initdb.d/16-staging-shifts.sql:ro
      - ./edge-node-red/db/07-staging-companion-tables.sql:/docker-entrypoint-initdb.d/17-staging-companion-tables.sql:ro
      - ./edge-node-red/db/08-triggers.sql:/docker-entrypoint-initdb.d/18-triggers.sql:ro
      - ./edge-node-red/db/09-column-parity.sql:/docker-entrypoint-initdb.d/19-column-parity.sql:ro
      - ./edge-node-red/db/10-missing-tables.sql:/docker-entrypoint-initdb.d/20-missing-tables.sql:ro
      - ./edge-node-red/db/11-uns-tables.sql:/docker-entrypoint-initdb.d/21-uns-tables.sql:ro
      - ./edge-node-red/db/12-production-triggers.sql:/docker-entrypoint-initdb.d/22-production-triggers.sql:ro
      - ./edge-node-red/db/13-downtime-reasons-seed.sql:/docker-entrypoint-initdb.d/23-downtime-reasons-seed.sql:ro
      - ./edge-node-red/db/14-oee-uns-compute.sql:/docker-entrypoint-initdb.d/24-oee-uns-compute.sql:ro
      - ./edge-node-red/db/15-equipment-events-state-triggers.sql:/docker-entrypoint-initdb.d/25-equipment-events-state-triggers.sql:ro
      - ./edge-node-red/db/16-cpack-staging-fixtures.sql:/docker-entrypoint-initdb.d/26-cpack-staging-fixtures.sql:ro
      - ./edge-node-red/db/24-enterprise-anchor-topics.sql:/docker-entrypoint-initdb.d/27-enterprise-anchor-topics.sql:ro
    networks: [packiot-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d packiot"]
      interval: 5s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}

  # ── Grafana (dashboards) ──────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.5.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [packiot-net]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: packiot
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/01-oee-pipeline.json
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_USERS_DEFAULT_THEME: dark
      GF_FEATURE_TOGGLES_ENABLE: publicDashboards
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}

  # ── Adminer (DB GUI) ─────────────────────────────────────────────────────────
  adminer:
    image: adminer:4.8.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [packiot-net]
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    logging:
      driver: json-file
      options: {max-size: "2m", max-file: "2"}

  # ── Hasura GraphQL ───────────────────────────────────────────────────────────
  hasura:
    image: hasura/graphql-engine:v2.44.0
    restart: unless-stopped
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:packiot@postgres:5432/packiot
      HASURA_GRAPHQL_ADMIN_SECRET: dev-admin-secret
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "true"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup,http-log,webhook-log,websocket-log,query-log
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [packiot-net]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  hasura-init:
    image: curlimages/curl:latest
    networks: [packiot-net]
    depends_on:
      hasura:
        condition: service_healthy
    volumes:
      - ./edge-node-red/hasura/metadata.json:/metadata.json:ro
    entrypoint:
      - sh
      - -c
      - |
        METADATA=$$(sed '1s/{/{\"allow_inconsistent_metadata\":true,/' /metadata.json)
        printf '%s' "{\"type\":\"replace_metadata\",\"version\":2,\"args\":$${METADATA}}" > /tmp/payload.json
        for i in 1 2 3 4 5; do
          curl -sf -X POST http://hasura:8080/v1/metadata \
            -H 'Content-Type: application/json' \
            -H 'X-Hasura-Admin-Secret: dev-admin-secret' \
            -d @/tmp/payload.json && echo "Hasura metadata applied" && \
          curl -sf -X POST http://hasura:8080/v1/metadata \
            -H 'Content-Type: application/json' \
            -H 'X-Hasura-Admin-Secret: dev-admin-secret' \
            -d '{"type":"reload_metadata","args":{}}' && echo "Hasura metadata reloaded" && exit 0
          echo "Attempt $$i failed — retrying in 3s..."
          sleep 3
        done
        echo "Hasura metadata apply FAILED after 5 attempts" && exit 1
    restart: "no"

  # ── Edge API (NestJS) ────────────────────────────────────────────────────────
  edge-api:
    build:
      context: ./edge-api
      target: production
      network: host
    restart: unless-stopped
    env_file:
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
      NEW_RELIC_ENABLED: "false"
      NEW_RELIC_NO_CONFIG_FILE: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: packiot
      POSTGRES_DB: packiot
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [packiot-net]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  # ── Edge Node-RED ────────────────────────────────────────────────────────────
  edge-nodered:
    build:
      context: ./edge-node-red
      network: host
    restart: unless-stopped
    env_file:
      - path: .env.local
        required: false
    environment:
      NODE_RED_CREDENTIAL_SECRET: dev-credential-secret-32chars-long!
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: packiot
      RABBITMQ_PASSWORD: packiot
      ID_PUBSUB_NODE: machine-01
      API_KEY: sim-api-key-dev-0000  # matches Simulator Corp (enterprise 5) in 01-seed.sql
      ID_ENTERPRISE: "5"
      LOG_LEVEL: info
      HASURA_URL: http://hasura:8080/v1/graphql
      HASURA_ADMIN_SECRET: dev-admin-secret
      FIREBASE_API_KEY: dev-placeholder-bypassed-by-admin-secret
      DISABLE_EDITOR: "false"
      EDGE_API_BASE_URL: http://edge-api:8080
    ports:
      - "127.0.0.1:1880:1880"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:1880/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      rabbitmq:
        condition: service_healthy
      hasura-init:
        condition: service_completed_successfully
    networks: [packiot-net]
    volumes:
      - nr-edge-data:/data
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  # ── Operator UI (React SPA factory floor operator interface) ─────────────────
  operator:
    build:
      context: ./operator
      network: host
    restart: unless-stopped
    environment:
      # Browser SPA: this URL is resolved by the user's browser, so it must be
      # a host-accessible address. edge-nodered is exposed on localhost:1880.
      VITE_API_URL: http://localhost:1880
    ports:
      - "127.0.0.1:3002:3000"   # 3000 is taken by Grafana
    depends_on:
      edge-nodered:
        condition: service_healthy
    networks: [packiot-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}

  # ── Go workers (replace decommissioned oeecloud-node-red + mirror-worker TS) ─
  # Both use CREDS_SOURCE=env to skip AWS Secrets Manager and read DB +
  # AMQP creds straight from the env vars below. See issue #52 for the
  # design rationale and services/<name>/internal/secrets/secrets.go for
  # the fallback dispatch.

  # oeecloud-worker: AMQP consumer on the `oee` topic exchange. Resolves
  # SparkPlug topics → equipment via packml_register, writes raw data
  # to equipment_values/equipment_events/uns_metrics. Locally this lets
  # `make up` close the PLC → DB loop end-to-end without Node-RED.
  oeecloud-worker:
    build: ./services/oeecloud-worker
    container_name: oeecloud-worker
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      CREDS_SOURCE: env
      # DB — direct postgres (no pgbouncer in dev). Matches the `postgres`
      # service env vars above.
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: packiot
      DB_NAME: packiot
      # AMQP — uses the dev rabbitmq user (packiot/packiot) since the
      # least-priv `oeecloud-worker` user isn't provisioned locally.
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: packiot
      RABBITMQ_PASSWORD: packiot
      # Exchange / queue names — suffixed `-dev` so this never collides
      # with the staging broker if you ever cross-wire (defensive; the
      # `oee` exchange is shared across envs in name but lives on a
      # different broker).
      SOURCE_EXCHANGE: oee
      WORKER_QUEUE: oeecloud-worker-q-dev
      RETRY_EXCHANGE: oee-retry-dev
      RETRY_QUEUE: oeecloud-worker-q-dev-retry-30s
      FAILED_EXCHANGE: oee-failed-dev
      FAILED_QUEUE: oeecloud-worker-q-dev-failed
      RETRY_TTL_MS: "30000"
      MAX_RETRIES: "5"
      PREFETCH: "50"
      HEALTH_PORT: "9101"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_started
    networks: [packiot-net]
    healthcheck:
      test: ["CMD", "/usr/local/bin/oeecloud-worker", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}

  # mirror-worker-go: polls prod user_logs and replays operator actions
  # against staging edge-api. Locally there's no prod DB to point at, so
  # PROD_DB_* points at the same postgres as STAGING_DB_* — the worker
  # boots cleanly, polls, sees no new rows, and goes idle. Useful for
  # exercising its /health endpoint + container lifecycle without
  # needing real prod creds.
  mirror-worker-go:
    build: ./services/mirror-worker-go
    container_name: mirror-worker-go
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      CREDS_SOURCE: env
      # Prod-side DB (degenerate: same as staging in dev — no real prod
      # accessible from a laptop).
      PROD_DB_HOST: postgres
      PROD_DB_PORT: "5432"
      PROD_DB_USER: postgres
      PROD_DB_PASSWORD: packiot
      PROD_DB_NAME: packiot
      # Staging-side DB.
      STAGING_DB_HOST: postgres
      STAGING_DB_PORT: "5432"
      STAGING_DB_USER: postgres
      STAGING_DB_PASSWORD: packiot
      STAGING_DB_NAME: packiot
      SOURCE_NAME: cpack-dev-go
      PROD_ENTERPRISE_ID: "5"  # Simulator Corp — closest dev analogue to CPACK
      STAGING_ENTERPRISE_ID: "5"
      POLL_INTERVAL_SEC: "60"
      BATCH_SIZE: "50"
      PER_POST_DELAY_MS: "50"
      STAGING_API_URL: http://edge-api:8080
      HEALTH_PORT: "9102"
    depends_on:
      postgres:
        condition: service_started
      edge-api:
        condition: service_started
    networks: [packiot-net]
    healthcheck:
      test: ["CMD", "/usr/local/bin/mirror-worker-go", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}

  # ── OEE cron (dev-only pg_cron substitute) ────────────────────────────────
  # Calls oee_compute_uns_metrics() every 30s — the SQL equivalent of the
  # "Trigger: OEE Metrics (30s)" chain that used to live in oeecloud flows/.
  # In production/staging this is handled by pg_cron inside PostgreSQL itself.
  # Uses the same postgres image already pulled for the postgres service.
  oee-cron:
    image: timescale/timescaledb:2.25.2-pg16
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - |
        until pg_isready -h postgres -U postgres -d packiot; do sleep 2; done
        echo "[oee-cron] DB ready — starting 30s OEE refresh loop"
        while true; do
          psql -h postgres -U postgres -d packiot \
            -c "SELECT oee_compute_uns_metrics();" \
            && echo "[oee-cron] $(date -u +%H:%M:%SZ) refreshed" \
            || echo "[oee-cron] $(date -u +%H:%M:%SZ) WARN: compute failed"
          sleep 30
        done
    environment:
      PGPASSWORD: packiot
    depends_on:
      postgres:
        condition: service_healthy
    networks: [packiot-net]
    logging:
      driver: json-file
      options: {max-size: "2m", max-file: "2"}

  # ── Loki (log aggregation) ─────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki/loki-local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks: [packiot-net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── Promtail (Docker log collector → Loki) ─────────────────────────────────
  promtail:
    image: grafana/promtail:3.4.2
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - ./monitoring/promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [packiot-net]
    depends_on:
      loki:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── PLC + Operator Simulator ──────────────────────────────────────────────────
  # PLC layer: sends SparkPlug-style metric bursts to edge-nodered /plc-data.
  # Operator layer: rotates through ana.operator / joao.supervisor / maria.operator
  #   and drives realistic actions (justify, manual event, start/stop PO) against
  #   edge-api so the "Actions per User" Grafana panel stays balanced.
  # Start with: make up-simulator   Stop with: docker compose stop simulator
  simulator:
    build:
      context: ./simulator
    restart: unless-stopped
    environment:
      EDGE_NODERED_URL: http://edge-nodered:1880
      EDGE_API_URL: http://edge-api:8080
      DB_URL: postgresql://postgres:packiot@postgres:5432/packiot
      SIM_INTERVAL: "5"
      OP_INTERVAL: "15"
    depends_on:
      edge-nodered:
        condition: service_healthy
      postgres:
        condition: service_healthy
      edge-api:
        condition: service_started
    networks: [packiot-net]
    # No profile — simulator is the canonical PLC source for dev.
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}

  # ── Integration test runner ──────────────────────────────────────────────────
  # Layer-2 end-to-end tests: publish → DB lands, edge-api → user_logs lands.
  # Profile-gated so it only runs on `make test-integration`. Resolves service
  # names directly via the docker network (no host port mappings needed).
  tests:
    build:
      context: ./tests/integration
    environment:
      DB_URL: postgresql://postgres:packiot@postgres:5432/packiot
      EDGE_NODERED_URL: http://edge-nodered:1880
      EDGE_API_URL: http://edge-api:8080
      HASURA_URL: http://hasura:8080
      HASURA_ADMIN_SECRET: dev-admin-secret
      INT_POLL_TIMEOUT: "30"
      INT_POLL_INTERVAL: "1"
    depends_on:
      postgres:
        condition: service_healthy
      edge-nodered:
        condition: service_healthy
      edge-api:
        condition: service_started
      hasura:
        condition: service_healthy
    networks: [packiot-net]
    profiles: [tests]
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "1"}
