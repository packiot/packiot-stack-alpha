# Custom postgres-exporter queries — deep DB monitoring beyond the built-in
# pg_up / pg_stat_database defaults. Loaded via PG_EXPORTER_EXTEND_QUERY_PATH.
#
# Every query is read-only and uses standard catalog/stat views the exporter's
# login role can read. Metric names are prefixed `pg_` so they group with the
# built-ins in Grafana. Labels are kept low-cardinality (datname, state, mode) —
# NEVER per-query-text or per-pid (that would explode the series count).
#
# Consumed by the "Database" v2 Grafana board.

# ── Connections by database × state (idle-in-transaction is the leak signal) ──
pg_activity_by_state:
  master: true
  query: |
    SELECT datname,
           state,
           count(*) AS connections,
           coalesce(extract(epoch FROM max(now() - state_change)), 0) AS max_state_age_seconds
    FROM pg_stat_activity
    WHERE datname IS NOT NULL AND state IS NOT NULL
    GROUP BY datname, state
  metrics:
    - datname: { usage: LABEL, description: "Database" }
    - state: { usage: LABEL, description: "Backend state (active/idle/idle in transaction/...)" }
    - connections: { usage: GAUGE, description: "Backends in this state" }
    - max_state_age_seconds: { usage: GAUGE, description: "Age of the oldest backend in this state" }

# ── Cache hit ratio per database (should sit high, ~0.99+) ──
pg_cache_hit:
  master: true
  query: |
    SELECT datname,
           sum(blks_hit)  AS blks_hit,
           sum(blks_read) AS blks_read,
           CASE WHEN sum(blks_hit) + sum(blks_read) = 0 THEN 1
                ELSE sum(blks_hit)::float / (sum(blks_hit) + sum(blks_read)) END AS hit_ratio
    FROM pg_stat_database
    WHERE datname IS NOT NULL
    GROUP BY datname
  metrics:
    - datname: { usage: LABEL, description: "Database" }
    - blks_hit: { usage: COUNTER, description: "Buffer-cache hits (cumulative)" }
    - blks_read: { usage: COUNTER, description: "Disk block reads (cumulative)" }
    - hit_ratio: { usage: GAUGE, description: "Cache hit ratio (0..1)" }

# ── Lock waits by mode (contention) ──
pg_locks_by_mode:
  master: true
  query: |
    SELECT coalesce(mode, 'unknown') AS mode,
           count(*) FILTER (WHERE granted)     AS granted,
           count(*) FILTER (WHERE NOT granted) AS waiting
    FROM pg_locks
    GROUP BY mode
  metrics:
    - mode: { usage: LABEL, description: "Lock mode" }
    - granted: { usage: GAUGE, description: "Locks currently held" }
    - waiting: { usage: GAUGE, description: "Backends waiting on this lock mode (contention)" }

# ── Longest-running statement + longest idle-in-transaction (per database) ──
pg_longest_query:
  master: true
  query: |
    SELECT datname,
           coalesce(max(extract(epoch FROM now() - query_start))
                    FILTER (WHERE state = 'active'), 0) AS longest_active_seconds,
           coalesce(max(extract(epoch FROM now() - xact_start))
                    FILTER (WHERE state = 'idle in transaction'), 0) AS longest_idle_in_txn_seconds
    FROM pg_stat_activity
    WHERE datname IS NOT NULL
    GROUP BY datname
  metrics:
    - datname: { usage: LABEL, description: "Database" }
    - longest_active_seconds: { usage: GAUGE, description: "Age of the longest currently-running query" }
    - longest_idle_in_txn_seconds: { usage: GAUGE, description: "Age of the longest idle-in-transaction (lock/bloat risk)" }

# ── Transaction + tuple + conflict rates per database (rate() these in Grafana) ──
pg_db_activity:
  master: true
  query: |
    SELECT datname,
           xact_commit, xact_rollback,
           tup_inserted, tup_updated, tup_deleted, tup_fetched, tup_returned,
           deadlocks, temp_files, temp_bytes,
           conflicts
    FROM pg_stat_database
    WHERE datname IS NOT NULL
  metrics:
    - datname: { usage: LABEL, description: "Database" }
    - xact_commit: { usage: COUNTER, description: "Committed transactions" }
    - xact_rollback: { usage: COUNTER, description: "Rolled-back transactions" }
    - tup_inserted: { usage: COUNTER, description: "Tuples inserted" }
    - tup_updated: { usage: COUNTER, description: "Tuples updated" }
    - tup_deleted: { usage: COUNTER, description: "Tuples deleted" }
    - tup_fetched: { usage: COUNTER, description: "Tuples fetched (index/heap read)" }
    - tup_returned: { usage: COUNTER, description: "Tuples returned to client (seq-scan pressure)" }
    - deadlocks: { usage: COUNTER, description: "Deadlocks detected" }
    - temp_files: { usage: COUNTER, description: "Temp files created (work_mem spills)" }
    - temp_bytes: { usage: COUNTER, description: "Temp bytes written (work_mem spills)" }
    - conflicts: { usage: COUNTER, description: "Queries cancelled by recovery conflicts" }

# ── Database size on disk ──
pg_database_size:
  master: true
  query: |
    SELECT datname, pg_database_size(datname) AS size_bytes
    FROM pg_database
    WHERE datistemplate = false AND datname NOT IN ('postgres')
  metrics:
    - datname: { usage: LABEL, description: "Database" }
    - size_bytes: { usage: GAUGE, description: "Total on-disk size" }

# ── Top tables by total size in the CURRENT database (the exporter runs this
# per auto-discovered DB; label master_only false so it runs everywhere). ──
pg_table_size_top:
  query: |
    SELECT current_database()          AS datname,
           n.nspname AS schema,
           c.relname AS table,
           pg_total_relation_size(c.oid) AS total_bytes,
           pg_relation_size(c.oid)       AS heap_bytes,
           coalesce(s.n_live_tup, 0)     AS live_tuples,
           coalesce(s.n_dead_tup, 0)     AS dead_tuples
    FROM pg_class c
    JOIN pg_namespace n ON n.oid = c.relnamespace
    LEFT JOIN pg_stat_user_tables s ON s.relid = c.oid
    WHERE c.relkind = 'r'
      AND n.nspname NOT IN ('pg_catalog', 'information_schema', '_timescaledb_internal', '_timescaledb_catalog')
    ORDER BY pg_total_relation_size(c.oid) DESC
    LIMIT 25
  metrics:
    # datname disambiguates otherwise-identical (schema, table) label sets across
    # auto-discovered DBs (public.equipment_values exists in packiot, packiot_analytics,
    # shadow_go_port, ...). Without it Prometheus rejects the scrape with
    # "collected before with the same name and label values" → HTTP 500 → up=0.
    - datname: { usage: LABEL, description: "Database" }
    - schema: { usage: LABEL, description: "Schema" }
    - table: { usage: LABEL, description: "Table" }
    - total_bytes: { usage: GAUGE, description: "Total relation size incl. indexes + TOAST" }
    - heap_bytes: { usage: GAUGE, description: "Heap size" }
    - live_tuples: { usage: GAUGE, description: "Estimated live rows" }
    - dead_tuples: { usage: GAUGE, description: "Estimated dead rows (bloat / vacuum lag)" }

# ── TimescaleDB hypertable sizes (guarded: view only exists when the extension
# is installed; the LEFT JOIN + coalesce keep it inert on plain Postgres). ──
pg_timescaledb_hypertables:
  query: |
    SELECT current_database()      AS datname,
           hypertable_schema AS schema,
           hypertable_name   AS hypertable,
           coalesce(total_bytes, 0)      AS total_bytes,
           coalesce(sz.num_chunks, 0)    AS num_chunks,
           coalesce(compression_enabled::int, 0) AS compression_enabled
    FROM timescaledb_information.hypertables h
    LEFT JOIN LATERAL (
      SELECT sum(total_bytes) AS total_bytes, count(*) AS num_chunks
      FROM chunks_detailed_size(format('%I.%I', h.hypertable_schema, h.hypertable_name))
    ) sz ON true
  metrics:
    # datname disambiguates otherwise-identical (schema, hypertable) label sets
    # across auto-discovered DBs (public.equipment_values is a hypertable in
    # packiot, packiot_analytics, shadow_go_port). Without it the scrape 500s → up=0.
    - datname: { usage: LABEL, description: "Database" }
    - schema: { usage: LABEL, description: "Hypertable schema" }
    - hypertable: { usage: LABEL, description: "Hypertable name" }
    - total_bytes: { usage: GAUGE, description: "Hypertable total size (all chunks)" }
    - num_chunks: { usage: GAUGE, description: "Chunk count" }
    - compression_enabled: { usage: GAUGE, description: "1 if compression policy enabled" }

# ─────────────────────────────────────────────────────────────────────────────
# DBM ("Datadog-style") extension — catalog/TimescaleDB views for the deep
# Database board (16-database-dbm). Every query below was verified read-only
# (BEGIN READ ONLY; ...; ROLLBACK) against packiot_analytics on staging before
# commit. Per-DB queries carry a `datname = current_database()` disambiguator so
# auto-discovery (PG_EXPORTER_AUTO_DISCOVER_DATABASES=true) never emits the same
# metric name+labels from two DBs (that path 500s the scrape → up=0). Internal
# TimescaleDB chunk schemas are excluded from the table/index scans: per-chunk
# relnames rotate as chunks age, so including them would churn stale series
# forever — the parent hypertable + user tables carry the signal we want.
#
# NOTE: the per-table/per-index bloat + usage view (originally custom-query keys
# `pg_stat_user_tables` / `pg_stat_user_indexes` here) was REMOVED 2026-08-20.
# Naming a custom query after the exact catalog view postgres_exporter already
# ships a built-in collector for makes the client_golang registry see two
# collectors emitting the SAME metric name (`pg_stat_user_tables_seq_scan`, …)
# with DIFFERENT HELP text. The Prometheus client aborts the ENTIRE /metrics
# response on that HELP-text mismatch (HTTP 500) — which reads to Prometheus
# as the whole exporter being down (`up{job="postgres-exporter"}=0`), silently
# killing every OTHER metric in this file too (pg_cache_hit, pg_db_activity,
# pg_table_size_top, pg_timescaledb_*, pg_activity_by_state, pg_longest_query,
# plus the exporter's own built-in pg_stat_database_numbackends used by the
# Infra board). Confirmed live on staging 2026-08-20: postgres-exporter was
# crash-scraping (target down) since this block was added, dark-ing the entire
# 11-database board + the Prometheus half of 16-database-dbm + the DB panel on
# 10-infra. The equivalent per-table/per-index data is ALREADY served without
# this collision by 16-database-dbm.json's native-SQL panels (queries directly
# against packiot-postgres-shadow), so this was pure duplication — never worth
# re-adding under the same key name. If it's ever wanted as a Prometheus metric
# again, give it a non-colliding key, e.g. `pg_custom_table_stats`.

# ── TimescaleDB background jobs — health of the automation plane (cagg refresh,
# retention, compression, telemetry). last_run_success flags a failed last run;
# total_failures is cumulative; seconds_to_next_start shows scheduling. job_id is
# unique in job_stats (verified). isfinite() guards paused jobs whose next_start
# is 'infinity' (subtracting an infinite timestamp errors). Runs per DB. ──
pg_timescaledb_jobs:
  query: |
    SELECT current_database() AS datname,
           j.job_id::text                  AS job_id,
           coalesce(j.proc_name, 'unknown') AS proc_name,
           coalesce(j.hypertable_name, '')  AS hypertable,
           CASE WHEN s.last_run_status = 'Success' THEN 1 ELSE 0 END AS last_run_success,
           CASE WHEN s.next_start IS NOT NULL AND isfinite(s.next_start)
                THEN extract(epoch FROM s.next_start - now())
                ELSE 0 END AS seconds_to_next_start,
           coalesce(s.total_failures, 0) AS total_failures,
           coalesce(s.total_runs, 0)     AS total_runs
    FROM timescaledb_information.jobs j
    LEFT JOIN timescaledb_information.job_stats s ON s.job_id = j.job_id
  metrics:
    - datname: { usage: LABEL, description: "Database" }
    - job_id: { usage: LABEL, description: "TimescaleDB background job id" }
    - proc_name: { usage: LABEL, description: "Job procedure (policy_refresh_continuous_aggregate, ...)" }
    - hypertable: { usage: LABEL, description: "Target hypertable / cagg view (blank for global jobs)" }
    - last_run_success: { usage: GAUGE, description: "1 if the last run succeeded, else 0" }
    - seconds_to_next_start: { usage: GAUGE, description: "Seconds until the next scheduled start" }
    - total_failures: { usage: GAUGE, description: "Cumulative failed runs" }
    - total_runs: { usage: GAUGE, description: "Cumulative runs" }

# ── Continuous-aggregate refresh lag — the freshness of the OEE rollup plane.
# The refresh job's hypertable_name is the cagg VIEW name (NOT the materialization
# hypertable), so the join is on view_schema/view_name. -1 = no successful refresh
# on record. Runs per DB. ──
pg_timescaledb_cagg:
  query: |
    SELECT current_database() AS datname,
           ca.view_schema AS schema,
           ca.view_name   AS cagg,
           CASE WHEN s.last_successful_finish IS NOT NULL AND isfinite(s.last_successful_finish)
                THEN extract(epoch FROM now() - s.last_successful_finish)
                ELSE -1 END AS seconds_since_last_success
    FROM timescaledb_information.continuous_aggregates ca
    LEFT JOIN timescaledb_information.jobs j
      ON j.hypertable_schema = ca.view_schema
     AND j.hypertable_name   = ca.view_name
     AND j.proc_name = 'policy_refresh_continuous_aggregate'
    LEFT JOIN timescaledb_information.job_stats s ON s.job_id = j.job_id
  metrics:
    - datname: { usage: LABEL, description: "Database" }
    - schema: { usage: LABEL, description: "Continuous-aggregate view schema" }
    - cagg: { usage: LABEL, description: "Continuous-aggregate view name" }
    - seconds_since_last_success: { usage: GAUGE, description: "Age of the last successful refresh (-1 = none on record)" }

# ── Compression effectiveness per hypertable. Only compressed hypertables report
# a row from hypertable_compression_stats(); uncompressed ones coalesce to 0.
# ratio = before/after (higher = better). Runs per DB. ──
pg_timescaledb_compression:
  query: |
    SELECT current_database() AS datname,
           h.hypertable_schema AS schema,
           h.hypertable_name   AS hypertable,
           coalesce(cs.before_compression_total_bytes, 0) AS before_bytes,
           coalesce(cs.after_compression_total_bytes, 0)  AS after_bytes,
           coalesce(cs.before_compression_total_bytes, 0)
             - coalesce(cs.after_compression_total_bytes, 0) AS saved_bytes,
           CASE WHEN coalesce(cs.after_compression_total_bytes, 0) > 0
                THEN cs.before_compression_total_bytes::float / cs.after_compression_total_bytes
                ELSE 0 END AS ratio
    FROM timescaledb_information.hypertables h
    LEFT JOIN LATERAL (
      SELECT * FROM hypertable_compression_stats(format('%I.%I', h.hypertable_schema, h.hypertable_name))
    ) cs ON true
  metrics:
    - datname: { usage: LABEL, description: "Database" }
    - schema: { usage: LABEL, description: "Hypertable schema" }
    - hypertable: { usage: LABEL, description: "Hypertable name" }
    - before_bytes: { usage: GAUGE, description: "Uncompressed total bytes across compressed chunks" }
    - after_bytes: { usage: GAUGE, description: "Compressed total bytes" }
    - saved_bytes: { usage: GAUGE, description: "Bytes saved by compression (before - after)" }
    - ratio: { usage: GAUGE, description: "Compression ratio (before/after; 0 = not compressed)" }

# ── Cluster-wide connection + worker ceilings. master:true → single emission on
# the primary connection (these GUCs are cluster-global, identical on every DB),
# so it never collides under auto-discovery. Drives the connection-saturation
# panel: sum(connections) / scalar(pg_settings_max_connections) — never hardcode 50. ──
pg_settings:
  master: true
  query: |
    SELECT current_setting('max_connections')::float                  AS max_connections,
           current_setting('timescaledb.max_background_workers')::float AS max_background_workers
  metrics:
    - max_connections: { usage: GAUGE, description: "Cluster max_connections ceiling" }
    - max_background_workers: { usage: GAUGE, description: "TimescaleDB max_background_workers ceiling" }
