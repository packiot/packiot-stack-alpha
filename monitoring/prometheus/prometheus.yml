global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    env: staging
    cluster: packiot-staging

rule_files:
  - /etc/prometheus/rules.yml

# Route fired alerts to Alertmanager (→ Slack). Before this, rules.yml alerts
# were evaluated but notified nobody.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: oeecloud-worker
    static_configs:
      - targets: ['oeecloud-worker:9101']
    # Strategy C tenant extraction — derive a `tenant` label from the
    # AMQP routing_key. Two rules, mutually exclusive by anchored regex:
    #   sparkplug.data.<X>  → tenant=<X>          (Phase 2+ traffic)
    #   sparkplug.data      → tenant=legacy       (Phase 1 traffic today)
    # Metrics without a routing_key label (go_goroutines, process_*)
    # are unaffected — relabel rules silently skip when source is empty.
    metric_relabel_configs:
      - source_labels: [routing_key]
        regex: 'sparkplug\.data\.(.+)'
        target_label: tenant
        replacement: '${1}'
      - source_labels: [routing_key]
        regex: 'sparkplug\.data'
        target_label: tenant
        replacement: 'legacy'

  - job_name: mirror-worker-go
    # Single-instance Go worker — no tenant concept (replays a single
    # source: cpack-prod-go). Metrics carry an `event_type` label
    # (user_logs.category) which is naturally bounded by the 10
    # handled categories + "unknown" for unmapped rows — no relabel
    # rules needed.
    static_configs:
      - targets: ['mirror-worker-go:9102']

  - job_name: edge-transformer
    # ADR-0010 Phase 3 shadow-mode port + ADR-0011 P2 outbox.
    # Exposes calc_*, outbox_*, shadowpub_*, mqtt_subscriber_* series.
    # Consumed by grafana/dashboards/10-edge-transformer.json (the
    # renumbered board; old 09-edge-transformer-shadow-mode is gone).
    #
    # NOT renamed (rename S1+S2, edge-transformer -> sparkplug-decoder):
    # job_name becomes the `job` label on every scraped series. Flipping it
    # would break `job="edge-transformer"` PromQL selectors in 5 live
    # dashboards (10-edge-transformer.json, 08-logs.json, 04-engine.json,
    # 00-overview.json, 05-ingest.json) the instant this deploys. Target
    # hostname also left as `edge-transformer:9102` — the S0/S2 compose
    # alias keeps that name resolving to the renamed container either way,
    # so there is no functional reason to touch it. Relabeling the job (and
    # the matching dashboard queries) is a separate, deliberate monitoring
    # PR, not part of this reversible service rename.
    static_configs:
      - targets: ['edge-transformer:9102']

  # analytics-sync (was shadow-mirror) — operator-action replay (ADR-0013).
  # Exposes shadow_mirror_{dispatched,failed,skipped,update_noop}_total +
  # shadow_mirror_cursor on :9103 — metric NAMES kept as-is (app-defined,
  # out of scope for this rename; see the operator-gateway PR for the same
  # call). NEVER SCRAPED until 2026-07-06 — the 12-replay-and-fanout
  # board's shadow-mirror tiles were empty since birth (found by the
  # executed-query audit; the board predates the audit discipline).
  # Retires at flip R1.
  - job_name: analytics-sync
    static_configs:
      - targets: ['analytics-sync:9103']

  # read-api (formerly refdata-api) / query-api — the read side (ADR-0015). Full RED on :9104:
  # http_request_duration_seconds{method,route,status} (rate=_count, errors=by
  # status, duration=histogram) plus Go runtime + process metrics.
  - job_name: read-api
    static_configs:
      - targets: ['read-api:9104']

  # ── Exporters (2026-07-07 audit: bus+DB+host had ZERO white-box
  # telemetry). Unblocks the disk/CAgg-invalidation alert backlog. ──
  # White-box DB metrics for BOTH packiot + packiot_shadow
  # (auto-discover — flip needs no scrape change).
  - job_name: postgres-exporter
    static_configs:
      - targets: ['postgres-exporter:9187']

  # App-EC2 host metrics (CPU/mem/disk — the 2026-06-22 incident class).
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  # White-box Redis metrics — Redis was a total blind spot. The exporter
  # (oliver006/redis_exporter) sits beside authentik-redis and turns its INFO
  # into redis_* series (memory, keyspace hit/miss, evictions, clients, ops).
  # Readies ADR-0035's refdata-api cache: point the exporter at app-redis too
  # (multi-target) and the alerting/dashboards inherit it.
  - job_name: redis-exporter
    static_configs:
      - targets: ['redis-exporter:9121']

  # ── Live Incoplast path (was invisible: no scrape job existed, so the
  # metrics existed but reached no board — found in the v2 dashboard audit). ──
  # ingest-shim: HTTPS→RabbitMQ ingress for Incoplast SparkPlug. Metrics on a
  # plain-HTTP internal port (:9105, METRICS_ADDR). Exposes
  # ingest_shim_requests_total{outcome}.
  - job_name: ingest-shim
    static_configs:
      - targets: ['ingest-shim:9105']

  # operator-gateway (was operator-adapter): Incoplast operator-action bridge →
  # edge-api. It serves /metrics on its TLS API mux (:8443, self-signed internal
  # cert), so scrape over HTTPS with verification skipped (internal-only, same
  # trust boundary as the other packiot-net services). Exposes
  # operator_adapter_requests_total{action,outcome} — metric name kept as-is
  # (out of scope for this rename; would require a Grafana dashboard update).
  - job_name: operator-gateway
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ['operator-gateway:8443']
  # edge-api (NestJS control-plane): /metrics on the main app port :8080 (not
  # under /api, so AuthMiddleware doesn't gate it). RED http_request_duration_
  # seconds + Node runtime. Added with the edge-api Prometheus instrumentation.
  - job_name: edge-api
    static_configs:
      - targets: ['edge-api:8080']

  # rabbitmq: the message bus — previously ZERO telemetry (obs-doc gap). The
  # built-in rabbitmq_prometheus plugin (enabled via monitoring/rabbitmq/
  # enabled_plugins) exposes aggregated metrics on :15692 — queue depth, ready/
  # unacked, publish/deliver rates, connections, memory, the DLQ backlog.
  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq:15692']

  # cadvisor: per-container CPU/mem/net/fs (container_* metrics).
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  # blackbox: synthetic uptime. Prometheus passes each target to the exporter as
  # ?target=; probe_success/duration/http_status_code come back labelled by
  # `instance` (the probed URL). Add endpoints to the targets list.
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://operator.staging.packiot.app
          - https://grafana.staging.packiot.app
          - http://edge-api:8080/health
          - http://read-api:9104/healthz
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
