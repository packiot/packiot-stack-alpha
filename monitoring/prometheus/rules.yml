# Alerting rules — closes the documented "no alert rules" gap (B1 on
# the endgame roadmap). Philosophy: few rules, each actionable, each
# covering a failure mode we have actually seen. Alerts surface in the
# Prometheus UI (/alerts) and the Grafana alert-list panel; ROUTING to
# a push channel (ntfy/email) is a deliberate open human choice —
# wire Alertmanager only when someone commits to reading it.
groups:
  - name: packiot-staging
    rules:
      - alert: ScrapeTargetDown
        expr: up == 0
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.job }} not scrapeable for 5m (crashed or wedged)"

      - alert: EngineJobErrorStreak
        expr: sum by (job) (increase(oeecloud_worker_job_ticks_total{outcome="error"}[15m])) > 2
        labels: {severity: page}
        annotations:
          summary: "engine job {{ $labels.job }} failed >2 ticks in 15m — check oeecloud-worker logs"

      - alert: EngineStalled
        expr: sum(increase(oeecloud_worker_job_ticks_total[15m])) < 1
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "NO engine job ticked in 15m — scheduler wedged (jobs.Loop) or worker half-dead"

      - alert: IngestSilent
        expr: sum(increase(oeecloud_worker_amqp_deliveries_total[10m])) < 1
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "no AMQP deliveries in 10m — upstream chain dark (plc-sim → mosquitto → edge-transformer → rabbitmq)"

      - alert: WritePathDry
        expr: sum(increase(oeecloud_worker_batch_writes_total[15m])) < 1
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "deliveries arriving but nothing written in 15m — resolver/DB path broken; see 13-database-reach board"

  - name: packiot-flow-and-parity
    rules:
      # Today's bug class (2026-07-06): one flow starving while others
      # write. Fires when the busiest and quietest destination diverge
      # by more than 60% for 30m. Structural F1-vs-shadow statement
      # differences (pocontrol/mint are shadow-only) stay under this.
      - alert: FlowWriteImbalance
        # RETIRE-WHEN: ADR-0032 F2/shadow-mirror decommission
        expr: >
          (max(sum by (dest) (rate(oeecloud_worker_batch_writes_total{result="ok"}[15m])))
           - min(sum by (dest) (rate(oeecloud_worker_batch_writes_total{result="ok"}[15m]))))
          / max(sum by (dest) (rate(oeecloud_worker_batch_writes_total{result="ok"}[15m]))) > 0.6
        for: 30m
        labels: {severity: critical}
        annotations:
          summary: "Destination flows writing at diverged rates — a leg may be starving (see 08/13 boards)"
      - alert: BatchWriteErrors
        expr: sum(increase(oeecloud_worker_batch_writes_total{result="error"}[15m])) > 0
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Worker batch statements erroring"
      - alert: BakeSurfacePersisting
        # RETIRE-WHEN: ADR-0032 F2/shadow-mirror decommission
        expr: bake_surface_mismatches > 0
        for: 24h
        labels: {severity: warning}
        annotations:
          summary: "Bake surface {{ $labels.surface }} (enterprise {{ $labels.enterprise }}) mismatched for 24h — past every documented expiry class"
      - alert: IdentityBrokenPersisting
        # RETIRE-WHEN: ADR-0032 F2/shadow-mirror decommission
        expr: bake_identity_mismatch > 0
        for: 12h
        labels: {severity: critical}
        annotations:
          summary: "F2/F3 identity fingerprint {{ $labels.surface }} diverged for 12h — same-engine flows MUST be equal"
      - alert: MirrorDLQNotEmpty
        expr: mirror_worker_dlq_depth > 0
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Mirror DLQ has rows for 30m — replay failures need eyes"
      - alert: MQTTDisconnected
        expr: edge_transformer_mqtt_connected == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "edge-transformer lost Mosquitto — ingestion is down"

  # 2026-07-07 full-stack audit: durability signals that were graphed
  # (boards 07/10/12) but never alerted, + first host/DB rules enabled
  # by the new exporters. Same philosophy: each rule = a failure mode
  # we can name.
  - name: packiot-durability-and-mirror
    rules:
      # Outbox exists to survive broker outages; a growing backlog with
      # a live broker means the DRAIN is wedged (ADR-0011 P2).
      - alert: TransformerOutboxBacklog
        expr: outbox_depth > 1000
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "edge-transformer outbox holds {{ $value }} rows for 10m — drain slow or broker refusing (board 10)"
      - alert: TransformerOutboxStale
        expr: outbox_oldest_age_seconds > 900
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "oldest outbox row >15min old — drain wedged; data is durable but NOT flowing (board 10)"
      # Publisher confirms: a nack means the broker REFUSED a publish —
      # retry machinery exists, but nacks should be zero in steady state.
      - alert: TransformerPublishNacked
        expr: increase(edge_transformer_shadowpub_nacked_total[15m]) > 0
        labels: {severity: warning}
        annotations:
          summary: "RabbitMQ nacked transformer publishes in the last 15m — broker pressure or topology drift"
      - alert: TransformerMqttDrops
        expr: increase(edge_transformer_mqtt_dropped_events_total[15m]) > 0
        labels: {severity: warning}
        annotations:
          summary: "edge-transformer dropped MQTT events — decode failures or backpressure (board 10/11)"
      # Per-tenant routing on the `oee` exchange binds a queue only for
      # allowlisted tenants (sparkplug.data.<tenant> exact keys). Before this
      # alert, a message for a NON-allowlisted tenant matched no binding and was
      # dropped silently as UNROUTABLE — no queue, no metric, no trace. The `oee`
      # exchange now has an alternate-exchange (oee-unroutable, set via the
      # oee-ae policy in definitions.template.json) that catches those messages
      # into oee-unroutable-q instead of dropping them. Any depth here means a
      # producer is emitting an unrecognised routing key (new tenant not yet
      # provisioned, or a routing-key typo/drift) — messages are RETAINED for
      # inspection/replay, not lost. Requires the rabbitmq-detailed scrape job.
      - alert: OeeUnroutableMessages
        expr: rabbitmq_detailed_queue_messages{queue="oee-unroutable-q"} > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "oee-unroutable-q holds {{ $value }} msgs — a tenant's SparkPlug data is hitting no `oee` binding (unprovisioned tenant or routing-key drift); caught by the alternate-exchange, not dropped"
      # Some seq gaps are normal on reconnect; a stream of them means
      # the PLC/broker is losing messages (SparkPlug seq is per-session).
      - alert: SparkplugSeqGapStream
        expr: increase(edge_transformer_sparkplug_seq_gaps_total[30m]) > 5
        labels: {severity: warning}
        annotations:
          summary: "SparkPlug sequence gaps streaming ({{ $value }} in 30m) — message loss upstream of the transformer"
      # Mirror replay falling behind prod: staging stops being a
      # faithful test bed silently.
      - alert: MirrorCursorLag
        expr: mirror_worker_cursor_lag_seconds > 900
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "mirror-worker replay cursor >15min behind prod user_logs (board 07)"
      - alert: MirrorOeeDivergence
        expr: mirror_worker_comparator_oee_divergence_pct > 5
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "mirror comparator: staging OEE diverges >5% from prod for 30m (board 07)"
      # shadow-mirror retires at flip (R1); until then its failures are
      # control-plane parity holes in the bake evidence.
      - alert: ShadowMirrorFailures
        # RETIRE-WHEN: ADR-0032 F2/shadow-mirror decommission
        expr: increase(shadow_mirror_failed_total[15m]) > 0
        labels: {severity: warning}
        annotations:
          summary: "shadow-mirror replay failures — operator-action parity hole on the shadow flows (board 12)"
      # legacy-replicator is the AUTHORITATIVE CPACK operator-action source
      # (F1 retired). A zero-row UPDATE = a "silent skip": a legacy action that
      # resolved to nothing in staging — a replay gap (bugs 247/248 class:
      # topology drift / id-map miss / unresolved equipment). The loop fail-opens
      # past these so they never wedge it, which is exactly why they need an
      # alert to be legible. `for: 30m` rides out incidental single noops.
      - alert: ReplicatorReplayGaps
        expr: sum by (table) (increase(shadow_mirror_update_noop_total{job="legacy-replicator"}[30m])) > 0
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "legacy-replicator: zero-row UPDATEs on {{ $labels.table }} for 30m — CPACK operator-action replay gap (topology drift / unresolved id-map; see 2026-08-23 twin-drop finding)"

  # Host + DB rules (need the 2026-07-07 exporters; extend as the
  # CAgg-invalidation/queue-depth backlog items land).
  - name: packiot-host-and-db
    rules:
      - alert: HostDiskFilling
        expr: (node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"}) < 0.15
        for: 15m
        labels: {severity: critical}
        annotations:
          summary: "app EC2 root filesystem <15% free — the 2026-06-22 incident class; prune + snapshot check"
      - alert: PostgresDown
        expr: pg_up == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "postgres-exporter cannot reach the DB — everything downstream is about to page"
      - alert: PostgresConnectionsHigh
        # DB max_connections=50, so the old >150 threshold could NEVER fire.
        # >40 = 80% of the pool — a real "approaching exhaustion" warning.
        expr: sum(pg_stat_database_numbackends) > 40
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} DB backends (>80% of max_connections=50) — connection leak or pgbouncer bypass growing"

  # ADR-0022 V3 — the per-tenant flip-readiness VERDICT. Layered ON TOP
  # of the bake gauges (bake_surface_mismatches / bake_surface_compared);
  # it does NOT touch the bake metric or the CPACK 24h-mismatch alert
  # (BakeSurfacePersisting, above) — CPACK's flip signal is untouched.
  #
  # These derive by the `enterprise` LABEL — no tenant list is hardcoded
  # in PromQL, so a third mirrored tenant lights up automatically.
  #
  # NOTE on enterprise="6": the bake emits ONE pool-liveness surface
  # (customer_reports_shift_06) under enterprise="6" — the sync06 pool
  # tenant, NOT a flip tenant. It will therefore also get a
  # bake_tenant_converged series (converged whenever the pool report is
  # live). That is incidental and harmless; the flip tenants are 3 (CPACK)
  # and 4 (Incoplast).
  - name: packiot-flip-readiness
    rules:
      # bake_tenant_converged{enterprise} = 1 IFF, for that enterprise,
      # EVERY compared surface has zero mismatches AND every surface has
      # actually compared rows this tick (compared > 0 — so "no data" is
      # NOT mistaken for "converged").
      #
      #   max by(enterprise)(mismatches) == bool 0  → 1 when no surface mismatches
      #   min by(enterprise)(compared)   >  bool 0  → 1 when no surface is starved
      #   product                                   → 1 only when BOTH hold
      #
      # If a tenant emits no bake series at all, it has no
      # bake_tenant_converged series → absent → treated as NOT converged.
      - record: bake_tenant_converged
        expr: >
          (max by (enterprise) (bake_surface_mismatches) == bool 0)
          *
          (min by (enterprise) (bake_surface_compared) > bool 0)

      # FLIP-READINESS signal: fires WHILE a tenant is not converged, so
      # "ready to flip" is the explicit event of this alert RESOLVING for
      # that enterprise. Not a failure — an informational gate. The
      # flip-critical failure alert stays BakeSurfacePersisting (24h).
      - alert: TenantNotFlipReady
        # RETIRE-WHEN: ADR-0032 F2/shadow-mirror decommission
        expr: bake_tenant_converged == 0
        for: 10m
        labels: {severity: info}
        annotations:
          summary: "Tenant enterprise {{ $labels.enterprise }} NOT converged — not flip-ready (a bake surface mismatches or has no compared rows). Ready-to-flip = this alert resolved for the tenant."

  # Task #32 Phase-3 — the PO-staleness-gate bake watch. The gate rejects a
  # PO write ONLY on STALE_HEAD / RANGE_CONFLICT / BEYOND_HORIZON, and a
  # rejection surfaces as an HTTP 409 on /api/production-orders/*. During the
  # bake that count MUST stay ~0: a sustained non-zero means the gate is
  # rejecting LEGITIMATE writes (wrong-rejection), which is the exact danger
  # we flip the flag to avoid. This is the ONLY gate signal that is an alarm.
  #
  # NOT alerted (deliberately): po_gate_degraded_total — a degrade is a
  # fail-safe ALLOW on open-segment drift, not a rejection. It's graphed on
  # board v2-po-staleness-gate as informational and expected to trend to 0 as
  # the #34 zombie-backfill cleanup lands; alerting on an ALLOW would be noise.
  #
  # `by (route)` (an enhancement over the task's plain sum) so the annotation
  # names the offending PO route — more actionable in the page.
  - name: packiot-po-staleness-gate
    rules:
      - alert: POStalenessGateRejectingWrites
        expr: sum by (route) (rate(http_request_duration_seconds_count{job="edge-api", route=~"/api/production-orders/.*", status="409"}[5m])) > 0
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "PO staleness gate returning 409 on {{ $labels.route }} for 10m — it may be rejecting LEGITIMATE writes (STALE_HEAD/RANGE_CONFLICT/BEYOND_HORIZON). Check board v2-po-staleness-gate; if the bake, consider backing the flag off."
