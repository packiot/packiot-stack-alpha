server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Compose project name on staging EC2 is "stack" (set by docker-compose CLI
       # from the directory name /opt/.../stack — not the repo name). Earlier this
       # regex was hardcoded to "packiot-stack-alpha" which never matched, so every
       # container was dropped at relabel-keep → 108k+ entries lost between deploy
       # and 2026-06-18. Allow either name to survive a future rename.
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        action: keep
        regex: stack|packiot-stack-alpha
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_log_stream]
        target_label: logstream
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
      - labels:
          level:
