# Alertmanager — routes the 23 Prometheus alert rules (monitoring/prometheus/
# rules.yml) to humans. Until now they fired into the void ("wire it only when
# someone commits to reading it" — someone did).
#
# Notifications go to SLACK. The webhook URL is a SECRET, never committed: it is
# read from a file the deploy mounts (same pattern as the TLS certs / DB creds).
# Provide /etc/alertmanager/slack_api_url with a Slack incoming-webhook URL; see
# slack_api_url.example.

global:
  resolve_timeout: 5m
  # The Slack incoming-webhook URL, read from a mounted secret file so it never
  # lands in git. Every slack_config below inherits it.
  slack_api_url_file: /etc/alertmanager/slack_api_url

route:
  # Group alerts so a burst (e.g. all bake surfaces) is one Slack message, not 20.
  group_by: ['alertname', 'severity']
  group_wait: 30s          # wait to batch the first alerts of a group
  group_interval: 5m       # then send new members of an existing group at most this often
  repeat_interval: 4h      # re-nag on a still-firing alert this often
  receiver: slack-default

  routes:
    # Critical → its own channel + faster repeat (page-worthy).
    - matchers: ['severity="critical"']
      receiver: slack-critical
      repeat_interval: 1h

receivers:
  - name: slack-default
    slack_configs:
      - channel: '#alerts'
        send_resolved: true
        title: '{{ if eq .Status "firing" }}:red_circle:{{ else }}:large_green_circle:{{ end }} [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}*{{ .Labels.severity }}* — {{ .Annotations.summary }}
          {{ if .Annotations.description }}
          {{ .Annotations.description }}{{ end }}
          {{ if .Labels.surface }}surface: `{{ .Labels.surface }}` {{ end }}{{ if .Labels.tenant }}tenant: `{{ .Labels.tenant }}` {{ end }}{{ if .Labels.job }}job: `{{ .Labels.job }}`{{ end }}
          {{ end }}

  - name: slack-critical
    slack_configs:
      - channel: '#alerts-critical'
        send_resolved: true
        title: ':rotating_light: [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}*CRITICAL* — {{ .Annotations.summary }}
          {{ if .Annotations.description }}{{ .Annotations.description }}{{ end }}
          {{ end }}

inhibit_rules:
  # A critical alert silences the warning-level version of the same alert — one
  # incident, one page, not two.
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: ['alertname']
