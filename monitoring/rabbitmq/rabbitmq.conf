# RabbitMQ node config.
#
# load_definitions re-imports users / vhosts / permissions on EVERY boot, so a
# container recreate can never again lose the runtime-provisioned least-priv
# users (oeecloud-worker, edge-transformer). This closes the boot-only-
# provisioning trap that caused the 2026-07-10 outage: enabling a plugin
# recreated the broker with a fresh Mnesia, the least-priv users vanished, and
# every AMQP client got 403 for ~1.5h.
#
# The referenced file is GENERATED at deploy time from definitions.template.json
# + the passwords in Secrets Manager (see the "Generate RabbitMQ definitions"
# step in deploy-staging.yml). It contains secrets, so it is gitignored and
# mounted read-only — only the template is committed.
#
# Note: when definitions are imported, RABBITMQ_DEFAULT_USER/PASS is ignored, so
# the admin user is included in the definitions (same password as the .env).
load_definitions = /etc/rabbitmq/definitions.json
