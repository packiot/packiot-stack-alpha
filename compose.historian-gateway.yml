# historian-gateway — transparent hot+cold query layer over the historian.
#
# Exposes `ev_all` (live timescaledb hypertable via postgres_fdw  UNION  S3
# Parquet historian via pg_duckdb). Consumers (Superset, read-api, tools) query
# it with plain Postgres SQL; old timestamps transparently resolve to S3 and
# prune to the relevant partition file.
#
# Proven on staging (CPACK): one query spans 2021→today; old-timestamp lookups
# scan 1/181 files. See services/historian-gateway/README.md.
services:
  historian-gateway:
    image: pgduckdb/pgduckdb:16-main
    container_name: hist-gateway
    restart: unless-stopped
    networks: [packiot-net]
    environment:
      POSTGRES_PASSWORD: ${HIST_GW_PASSWORD:?set in .env}
      # Honest DB name (#274): the gateway's own DB is packiot_historian (was the
      # default `postgres`). The init script targets $POSTGRES_DB, so a fresh boot
      # creates + provisions packiot_historian. All consumers use HIST_GW_DB /
      # /packiot_historian DSNs.
      POSTGRES_DB: packiot_historian
      # live timescaledb (HOT)
      FDW_HOST: ${DB_HOST:-10.10.10.89}
      FDW_PORT: ${DB_PORT:-5432}
      FDW_DB: ${DB_NAME:-packiot_analytics}
      FDW_USER: ${DB_USER:-postgres}
      FDW_PASS: ${DB_PASSWORD:?set in .env}
      # S3 historian (COLD) — scoped read-only key (svc-historian-gateway)
      HISTORIAN_BUCKET: ${HISTORIAN_BUCKET:?set in .env}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      HIST_AWS_KEY: ${HIST_AWS_KEY:?set in .env}
      HIST_AWS_SECRET: ${HIST_AWS_SECRET:?set in .env}
      # Read-only CloudBeaver browser role (cloudbeaver_histro). OPTIONAL: if unset,
      # the init skips role creation (the gateway is unchanged). When set, first-boot
      # init creates a NOSUPERUSER SELECT-only role + a live_pg FDW user mapping so the
      # CloudBeaver "historian gateway (read-only)" connection can browse the hot FDW
      # tables + schema. Cold pg_duckdb (read_parquet) stays superuser-only by design.
      CLOUDBEAVER_HISTRO_PASSWORD: ${CLOUDBEAVER_HISTRO_PASSWORD:-}
      # t282/R9 — least-privilege REMOTE FDW identity for cloudbeaver_histro. When set
      # (alongside CLOUDBEAVER_HISTRO_PASSWORD, which gates the browser-role block), the
      # first-boot init points the cloudbeaver_histro → live_pg user mapping at the
      # NOSUPERUSER/NOBYPASSRLS `histgw_ro` role on packiot_analytics (SELECT on the two
      # silver facts only) instead of the remote postgres superuser. Mint the role with
      # db/migrations/t282-historian-gateway-glue/02-analytics-histgw-ro.sql; same secret
      # here. Unset ⇒ init falls back to the FDW superuser (logs a warning).
      HISTGW_RO_PASS: ${HISTGW_RO_PASS:-}
      # T3 — historian_svc service login (read-api + Superset). Fresh-volume init creates
      # it; a RUNNING gateway is brought to the same state by apply-hardening.sh.
      HIST_GW_SVC_PASSWORD: ${HIST_GW_SVC_PASSWORD:-}
    volumes:
      - ./services/historian-gateway/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
      - hist_gateway_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 15s
      timeout: 5s
      retries: 10
      # First boot runs the inline cutover seed (a full one-pass scan of the legacy
      # parquet — minutes on the 336M-row CPACK partition) inside initdb, before
      # Postgres accepts TCP. start_period suppresses "unhealthy" during that window
      # so dependents don't flap. Only the first boot on a fresh volume pays this.
      start_period: 20m

volumes:
  hist_gateway_data:

networks:
  packiot-net:
    external: true
    name: stack_packiot-net
